Küçük porsiyon semizotu salatasını ara öğün olarak tüketin.'},\n  s15:{n:'Kuşkonmaz Çubukları ve Yoğurt Sos',it:[['kuskonmaz',1],['yogurt',0.5]],prep:'Haşlanmış kuşkonmazı sade yoğurt sosla birlikte tüketin.'},\n  s16:{n:'Yoğurt ve Kivi',it:[['yogurt',1],['kivi',1]],prep:'Yoğurdu kâseye alın, soyup dilimlenmiş kiviyi ekleyin.'},\n  s17:{n:'Fındık ve Kuru Kayısı',it:[['findik',1],['kkayisi',1]],prep:'Fındık içi ve kuru kayısıyı birlikte tüketin.'},\n  s18:{n:'Elma ve Fıstık Ezmesi',it:[['elma',1],['fistikezme',0.5]],prep:'Elmayı dilimleyip fıstık ezmesine batırarak tüketin.'},\n  s19:{n:'Nar ve Ceviz',it:[['nar',0.5],['ceviz',1]],prep:'Nar tanelerini ceviz içiyle birlikte tüketin.'},\n  s20:{n:'Haşlanmış Pancar Dilimleri',it:[['pancar',0.5]],prep:'Haşlanmış pancarı dilimleyip ara öğün olarak tüketin.'},\n  s21:{n:'Bezelye ve Peynir Küpleri',it:[['bezelyeyemek',0.5],['beyazpeynir',1]],prep:'Haşlanmış bezelyeyi küçük peynir küpleriyle birlikte tüketin.'},\n  s22:{n:'Karides Kokteyl (Küçük Porsiyon)',it:[['karides',0.5],['salata',0.5]],prep:'Haşlanmış karidesleri yeşillikle birlikte küçük porsiyon hâlinde tüketin.'},\n  s23:{n:'Nar Taneleri ve Yoğurt',it:[['yogurt',1],['nar',0.5]],prep:'Yoğurdu kâseye alın, üzerine nar taneleri ekleyin.'},\n  s24:{n:'Yaban Mersini ve Badem',it:[['yabanmersini',1],['badem',1]],prep:'Yaban mersinini badem içiyle birlikte tüketin.'},\n  s25:{n:'Ayva Dilimleri ve Ceviz',it:[['ayva',0.5],['ceviz',1]],prep:'Haşlanmış ayvayı dilimleyip ceviz içiyle birlikte tüketin.'},\n  s26:{n:'Chia Puddingi',it:[['chiatohumu',1],['sut',1],['muz',0.5]],prep:'Chia tohumunu sütle karıştırıp buzdolabında en az 2 saat bekletin, muzla servis edin.'},\n  s27:{n:'Tahinli Elma Dilimleri',it:[['elma',1],['tahin',0.5]],prep:'Elmayı dilimleyip tahine batırarak tüketin.'},\n  s28:{n:'Keten Tohumlu Yoğurt',it:[['yogurt',1],['ketentohumu',1]],prep:'Yoğurda öğütülmüş keten tohumu ekleyip karıştırın.'},\n  s29:{n:'⏱ Hızlı Meyve Tabağı (2 dk)',it:[['elma',0.5],['muz',0.5]],prep:'Elma ve muzu dilimleyip birlikte tüketin.'},\n  s30:{n:'⏱ Hızlı Peynir-Zeytin (2 dk)',it:[['beyazpeynir',1],['zeytin',1]],prep:'Peynir ve zeytini bir tabağa koyup hemen tüketin.'},\n  s31:{n:'⏱ Hızlı Kuruyemiş Karışımı (1 dk)',it:[['findik',1],['kkayisi',1]],prep:'Fındık içi ve kuru kayısıyı bir kâseye koyup tüketin.'},\n  s32:{n:'⏱ Hızlı Yoğurt-Bal (2 dk)',it:[['yogurt',1],['bal',1]],prep:'Yoğurdu kâseye alıp üzerine bal gezdirin.'},\n  s33:{n:'⏱ Hızlı Salatalık-Peynir Çubukları (3 dk)',it:[['salatalik',1],['beyazpeynir',1]],prep:'Salatalığı çubuk şeklinde kesip peynirle birlikte tüketin.'},\n  s34:{n:'⏱ Hızlı Domates-Peynir (3 dk)',it:[['domates',1],['lor',1]],prep:'Domatesi dilimleyip lor peyniriyle birlikte tüketin.'},\n  s35:{n:'🔥 Fırında Elma Dilimleri (Tarçınlı)',it:[['elma',1]],prep:'Elma dilimlerini fırın tepsisine dizip az tarçın serpin. 180°C fırında 15 dk pişirin.'},\n  s36:{n:'🔥 Fırında Meyveli Yulaf Çubuğu',it:[['yulaf',1],['muz',0.5],['badem',1]],prep:'Yulaf, ezilmiş muz ve dövülmüş bademi karıştırıp tepsiye yayın. 170°C fırında 15-18 dk pişirip dilimleyin.'},\n\n  sp1:{n:'Antrenman Öncesi: Muz ve Hurma',it:[['muz',1],['hurma',1]],prep:'Antrenmandan 45-60 dk önce tüketin; hızlı sindirilen karbonhidrat sağlar.'},\n  sp2:{n:'Antrenman Sonrası: Whey ve Muz',it:[['whey',1],['muz',1]],prep:'Protein tozunu 250-300 ml su veya sütle çalkalayın, muzla birlikte antrenmandan sonraki 30-45 dk içinde tüketin.'},\n  sp3:{n:'Antrenman Öncesi: Tavuk ve Pirinç',it:[['tavuk',0.7],['pirinc',0.7]],prep:'Antrenmandan 2-3 saat önce tüketin; yavaş salınımlı enerji ve protein sağlar.'},\n  sp4:{n:'Antrenman Sonrası: Whey ve Yulaf',it:[['whey',1],['yulaf',0.7]],prep:'Yulafı sıcak suyla hazırlayıp protein tozunu ekleyin ve karıştırın.'},\n  sp5:{n:'Yatmadan Önce: Kazein',it:[['kazein',1],['sut',0.6]],prep:'Kazein tozunu 250 ml su veya sütle çalkalayarak yatmadan 30-60 dk önce için; gece boyu yavaş protein salınımı sağlar.'},\n  sp6:{n:'Antrenman Sonrası: Ballı Sütlü Shake',it:[['sut',1],['bal',1],['whey',0.5]],prep:'Süt, bal ve protein tozunu blenderdan geçirip antrenman sonrası tüketin.'}\n};\nconst DP_PLAN  = {\n  growth:[['Kahvaltı',['b1','b4','b3','b10','b7']],['Öğle Yemeği',['m1','m3','m7','m8','m2']],['Ara Öğün',['s3','s1','s4','s9']],['Akşam Yemeği',['m4','m3','m9','m2','m8']]],\n  obesity:[['Kahvaltı',['b8','b6','b1','b5','b2']],['Öğle Yemeği',['m1','m2','m11','m12','m14']],['Ara Öğün',['s6','s10','s2','s1']],['Akşam Yemeği',['m10','m9','m15','m14','m2']]],\n  t1d:[['Kahvaltı',['b1','b6','b8','b2','b9']],['Öğle Yemeği',['m1','m2','m11','m7','m4']],['Ara Öğün',['s4','s6','s10','s1']],['Akşam Yemeği',['m9','m2','m4','m10','m14']]],\n  allergy:[['Kahvaltı',['b1','b6','b9','b3','b8']],['Öğle Yemeği',['m1','m2','m11','m7','m16']],['Ara Öğün',['s1','s3','s6','s2']],['Akşam Yemeği',['m2','m9','m14','m10','m16']]],\n  celiac:[['Kahvaltı',['b9','b15','b5','b6','b13']],['Öğle Yemeği',['m16','m6','m17','m7','m18']],['Ara Öğün',['s2','s3','s6','s1']],['Akşam Yemeği',['m18','m6','m17','m14','m16']]],\n  anemia:[['Kahvaltı',['b1','b2','b6','b4','b7']],['Öğle Yemeği',['m3','m7','m6','m1','m5']],['Ara Öğün',['s1','s5','s9','s6']],['Akşam Yemeği',['m9','m4','m3','m15','m2']]],\n  constipation:[['Kahvaltı',['b3','b5','b10','b8','b1']],['Öğle Yemeği',['m4','m5','m13','m1','m15']],['Ara Öğün',['s5','s8','s1','s2']],['Akşam Yemeği',['m15','m9','m4','m13','m10']]],\n  adhd:[['Kahvaltı',['b1','b3','b7','b6','b5']],['Öğle Yemeği',['m6','m2','m1','m11','m8']],['Ara Öğün',['s1','s3','s2','s9']],['Akşam Yemeği',['m6','m2','m9','m10','m4']]]\n};\nconst DP_REF    = 1600;\nconst DP_FACTOR = 1;\nconst DP_FATPCT = 0.3;\nconst DP_DAYS = ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];\n\nfunction dpTarget(){\n  return (typeof cTarget!=='undefined'&&cTarget)?cTarget:1500;\n}\nfunction dpCondition(){\n  const el=document.getElementById('cCondition');\n  return el?el.value:Object.keys(DP_PLAN)[0];\n}\nfunction dpProteinTarget(){\n  var w=parseFloat((document.getElementById('cWeight')||{}).value); if(w>0) return w*1.2; return dpTarget()*0.16/4;\n}\nfunction dpScale(){\n  return DP_FACTOR;\n}\nfunction dpMealRaw(meal){\n  let k=0;\n  meal.it.forEach(function(pair){ k += DP_FOODS[pair[0]].k * pair[1]; });\n  return k;\n}\nfunction dpAmount(food, servings){\n  if(food.unit==='g'||food.unit==='ml'){\n    const v = Math.max(5, Math.round(food.g*servings/5)*5);\n    return v+' '+food.unit;\n  }\n  let n = Math.round(food.per*servings*2)/2;\n  if(n<0.5) n=0.5;\n  const gr = food.g? ' ('+Math.max(5,Math.round(food.g*servings/5)*5)+' g)' : '';\n  return n+' '+food.unit+gr;\n}\n// Öğün etiketine göre günün hedefinden ne kadar pay alacağını belirler.\n// Bilinmeyen bir etiket gelirse (ör. yeni bir yaşam tarzı öğünü) eşit pay verilir;\n// ağırlıklar her zaman normalize edilip toplamı 1'e getirilir.\nconst DP_MEAL_PCT = {\n  'Kahvaltı':0.25, 'Öğle Yemeği':0.30, 'Ara Öğün':0.15, 'Akşam Yemeği':0.30,\n  'Antrenman Öncesi':0.15, 'Antrenman Sonrası':0.15,\n  'Antrenman / Maç Öncesi':0.15, 'Antrenman / Maç Sonrası':0.15,\n  'Yatmadan Önce':0.08\n};\nfunction dpMealWeights(slots){\n  var raw = slots.map(function(slot){\n    var w = DP_MEAL_PCT[slot[0]];\n    return (w!==undefined) ? w : (1/slots.length);\n  });\n  var sum = raw.reduce(function(a,b){ return a+b; }, 0) || 1;\n  return raw.map(function(w){ return w/sum; });\n}\n\n// Tek bir öğün için protein/yağ/kalori hedeflerini birlikte karşılayan\n// ölçek katsayılarını çözer (protein-yoğun / yağ-yoğun / diğer besinler).\nfunction dpSolveMeal(pRaw, yRaw, dRaw, target, ptar, fatpct){\n  var ftar = target*fatpct/9;\n  var sp=1, sy=1, sd=1;\n  for(var it=0; it<12; it++){\n    var totP = pRaw.p*sp + yRaw.p*sy + dRaw.p*sd;\n    if(totP>0) sp = Math.max(0.4, Math.min(2.5, sp*(ptar/totP)));\n    var totF = pRaw.f*sp + yRaw.f*sy + dRaw.f*sd;\n    if(totF>0) sy = Math.max(0.25, Math.min(4.0, sy*(ftar/totF)));\n    var kWithoutD = pRaw.k*sp + yRaw.k*sy;\n    sd = dRaw.k>0 ? (target - kWithoutD)/dRaw.k : 1;\n    sd = Math.max(0.3, Math.min(4.0, sd||1));\n  }\n  return {sp:sp, sy:sy, sd:sd};\n}\n\nconst DP_DISLIKE_FOOD_IDS = {\n  yumurta:['yumurta'],\n  sut:['sut','lsut','yogurt','lyogurt','lakyogurt','kefir','ayran'],\n  peynir:['beyazpeynir','kasar','lor','keciPeyniri'],\n  tavuk:['tavuk','hindi','tavukbut'],\n  kirmizi_et:['et','kofte','danaeti','kuzu'],\n  balik:['balik','somon','ton','uskumru','karides','sardalya','levrek'],\n  baklagil:['mercimek','nohut','fasulye'],\n  elma:['elma'],\n  muz:['muz'],\n  kuruyemis:['ceviz','badem','findik','fistikezme'],\n  zeytin:['zeytin'],\n  bulgur:['bulgur'],\n  pirinc:['pirinc'],\n  domates:['domates'],\n  salatalik:['salatalik'],\n  ispanak:['ispanak'],\n  '__boğulma_riski__':['ceviz','badem','findik','kaju']\n};\nfunction dpIsYoungChild(){\n  var cAgeEl = (typeof document !== 'undefined') ? document.getElementById('cAge') : null;\n  if(!cAgeEl) return false;\n  var age = parseFloat(cAgeEl.value);\n  return !isNaN(age) && age <= 3;\n}\nfunction dpAllDislikeSets(){\n  var sets = [];\n  if(typeof disliked !== 'undefined' && disliked) sets.push(disliked);\n  if(typeof cDisliked !== 'undefined' && cDisliked) sets.push(cDisliked);\n  if(typeof bDisliked !== 'undefined' && bDisliked) sets.push(bDisliked);\n  if(dpIsYoungChild()) sets.push(['__boğulma_riski__']);\n  return sets;\n}\nfunction dpMealHasDislikedFood(meal){\n  var sets = dpAllDislikeSets();\n  for(var s=0; s<sets.length; s++){\n    for(const tag of sets[s]){\n      const ids = DP_DISLIKE_FOOD_IDS[tag] || [];\n      if(meal.it.some(function(pair){ return ids.indexOf(pair[0]) > -1; })) return true;\n    }\n  }\n  return false;\n}\nfunction dpPickMealId(pool, startIdx){\n  for(var i=0;i<pool.length;i++){\n    var id = pool[(startIdx+i)%pool.length];\n    var meal = DP_MEALS[id];\n    if(meal && !dpMealHasDislikedFood(meal)) return {id:id, swapped:i>0};\n  }\n  return {id: pool[startIdx%pool.length], swapped:false};\n}\nfunction dpMealCategory(meal){\n  if(!meal) return 'diger';\n  var ids = (meal.it||[]).map(function(p){ return String(p[0]).toLowerCase(); });\n  function has(list){ return ids.some(function(id){ return list.some(function(k){ return id.indexOf(k)>-1; }); }); }\n  if(has(['balik','somon','uskumru','sardalya','levrek','ton','karides','cipura','hamsi'])) return 'deniz';\n  if(has(['tavuk','hindi'])) return 'kumes';\n  if(has(['kuzu','dana','kiyma','kofte']) || ids.indexOf('et')>-1) return 'kirmizi';\n  if(has(['mercimek','nohut','fasulye','bezelye','tofu','humus'])) return 'baklagil';\n  if(has(['yumurta'])) return 'yumurta';\n  if(has(['yogurt','sut','peynir','lor','kefir','ayran'])) return 'sut';\n  return 'diger';\n}\n// Haftanın tamamını birden seçer: aynı tarif tekrar etmesin VE aynı protein\n// kategorisi (balık/tavuk/kırmızı et/baklagil...) haftaya yayılsın.\nfunction dpAssignWeekIds(pool, nDays, startIdx){\n  var picks=[], usedIds={}, catCount={};\n  for(var d=0; d<nDays; d++){\n    var natural = pool[(startIdx+d)%pool.length];\n    var naturalMeal = DP_MEALS[natural];\n    var naturalDisliked = naturalMeal ? dpMealHasDislikedFood(naturalMeal) : false;\n    var best=null, bestScore=Infinity;\n    for(var i=0;i<pool.length;i++){\n      var id = pool[(startIdx+d+i)%pool.length];\n      var meal = DP_MEALS[id];\n      if(!meal || dpMealHasDislikedFood(meal)) continue;\n      var cat = dpMealCategory(meal);\n      var score = (usedIds[id]?100000:0) + (catCount[cat]||0)*100 + i;\n      if(score < bestScore){ bestScore=score; best=id; }\n    }\n    if(best===null) best = natural;\n    usedIds[best]=1;\n    var bc = dpMealCategory(DP_MEALS[best]);\n    catCount[bc] = (catCount[bc]||0)+1;\n    picks.push({id:best, swapped: (best!==natural) && naturalDisliked});\n  }\n  return picks;\n}\nvar DP_WEEK_PICKS = null;\nfunction dpClassifyMealType(label){\n  var l = label.toLowerCase();\n  if(l.indexOf('kahvalt')>-1) return 'breakfast';\n  if(l.indexOf('ara öğün')>-1 || l.indexOf('ara sıcak')>-1 || l.indexOf('atıştırma')>-1) return 'snack';\n  if(l.indexOf('antrenman')>-1 || l.indexOf('maç')>-1) return 'workout';\n  if(l.indexOf('yatmadan')>-1) return 'bedtime';\n  if(l.indexOf('öğle')>-1 || l.indexOf('akşam')>-1 || l.indexOf('ana öğün')>-1) return 'main';\n  return 'other';\n}\nfunction dpMacroBarHtml(mp, mc, mf){\n  var pKcal = mp*4, cKcal = mc*4, fKcal = mf*9;\n  var total = Math.max(1, pKcal+cKcal+fKcal);\n  var pPct = (pKcal/total*100).toFixed(1), cPct = (cKcal/total*100).toFixed(1), fPct = (fKcal/total*100).toFixed(1);\n  return '<div class=\"macro-bar\" title=\"Protein '+pPct+'% · Karbonhidrat '+cPct+'% · Yağ '+fPct+'%\">'\n    + '<div class=\"macro-seg macro-p\" style=\"width:'+pPct+'%\"></div>'\n    + '<div class=\"macro-seg macro-c\" style=\"width:'+cPct+'%\"></div>'\n    + '<div class=\"macro-seg macro-f\" style=\"width:'+fPct+'%\"></div>'\n    + '</div>';\n}\nvar DP_FOOD_EMOJI = [\n  ['zeytinyağı','🫒'],['zeytin','🫒'],['yumurta','🥚'],['peynir','🧀'],\n  ['ekmek','🍞'],['lavaş','🫓'],['yufka','🫓'],['yulaf','🥣'],['granola','🥣'],\n  ['süt','🥛'],['yoğurt','🥣'],['kefir','🥛'],['ayran','🥛'],\n  ['tavuk','🍗'],['hindi','🍗'],['kuzu','🍖'],['kırmızı et','🥩'],['dana','🥩'],['köfte','🍖'],\n  ['karides','🦐'],['somon','🐟'],['ton balığı','🐟'],['uskumru','🐟'],['sardalya','🐟'],\n  ['levrek','🐟'],['çipura','🐟'],['balık','🐟'],['tofu','🌱'],\n  ['mercimek','🫘'],['nohut','🫘'],['fasulye','🫘'],['bezelye','🫘'],\n  ['bulgur','🌾'],['pirinç','🍚'],['makarna','🍝'],['erişte','🍝'],['kinoa','🌾'],\n  ['tatlı patates','🍠'],['patates','🥔'],['balkabağı','🎃'],\n  ['ıspanak','🥬'],['pazı','🥬'],['semizotu','🥬'],['brokoli','🥦'],['karnabahar','🥦'],\n  ['kabak','🥒'],['salatalık','🥒'],['biber','🫑'],['domates','🍅'],['havuç','🥕'],['mısır','🌽'],\n  ['salata','🥗'],['sebze','🥗'],['enginar','🌿'],['kuşkonmaz','🌿'],['pancar','🌿'],\n  ['elma','🍎'],['muz','🍌'],['portakal','🍊'],['mandalina','🍊'],['greyfurt','🍊'],\n  ['çilek','🍓'],['armut','🍐'],['ayva','🍐'],['kayısı','🍑'],['şeftali','🍑'],['erik','🍑'],\n  ['hurma','🌴'],['üzüm','🍇'],['kiraz','🍒'],['vişne','🍒'],['nar','🔴'],['kivi','🥝'],\n  ['yaban mersini','🫐'],['böğürtlen','🫐'],['ahududu','🫐'],['incir','🟣'],\n  ['karpuz','🍉'],['kavun','🍈'],['tereyağı','🧈'],\n  ['ceviz','🌰'],['badem','🌰'],['fındık','🌰'],['kaju','🌰'],['fıstık','🥜'],['tahin','🥜'],\n  ['avokado','🥑'],['keten tohumu','🌾'],['chia','🌾'],['bal','🍯'],['reçel','🍯']\n];\nfunction dpFoodEmoji(name){\n  if(!DP_FOOD_EMOJI || !name) return '🍽️';\n  var lower = name.toLowerCase();\n  for(var i=0;i<DP_FOOD_EMOJI.length;i++){\n    if(lower.indexOf(DP_FOOD_EMOJI[i][0]) > -1) return DP_FOOD_EMOJI[i][1];\n  }\n  return '🍽️';\n}\n\nfunction dpBuildDaySlots(slots, offset, target, ptar, fatpct, scale){\n  var weights = dpMealWeights(slots);\n  let dk=0,dp=0,dc=0,df=0, meals='';\n\n  slots.forEach(function(slot,si){\n    const label=slot[0], pool=slot[1];\n    const picked = (typeof DP_WEEK_PICKS!=='undefined' && DP_WEEK_PICKS && DP_WEEK_PICKS[si] && DP_WEEK_PICKS[si][offset])\n      ? DP_WEEK_PICKS[si][offset] : dpPickMealId(pool, offset+si);\n    const meal=DP_MEALS[picked.id];\n\n    // Bu öğünün ham (ölçeklenmemiş) protein / yağ / diğer besin toplamları\n    var pRaw={k:0,p:0,c:0,f:0}, yRaw={k:0,p:0,c:0,f:0}, dRaw={k:0,p:0,c:0,f:0};\n    meal.it.forEach(function(pair){\n      const F=DP_FOODS[pair[0]], q=pair[1];\n      const g = F.pr ? pRaw : (F.ft ? yRaw : dRaw);\n      g.k+=F.k*q; g.p+=F.p*q; g.c+=F.c*q; g.f+=F.f*q;\n    });\n\n    // Bu öğüne ayrılan hedef kalori/protein — günün hedefinden öğün ağırlığı kadar pay\n    var mealTarget = target*weights[si];\n    var mealPtar = ptar*weights[si];\n    var sol = dpSolveMeal(pRaw, yRaw, dRaw, mealTarget, mealPtar, fatpct);\n    var sp=sol.sp*scale, sy=sol.sy*scale, sd=sol.sd*scale;\n    function svOf(F){ return F.pr?sp:(F.ft?sy:sd); }\n\n    let mk=0,mp=0,mc=0,mf=0, rows='';\n    meal.it.forEach(function(pair){\n      const food=DP_FOODS[pair[0]];\n      const sv=pair[1]*svOf(food);\n      const k=food.k*sv, p=food.p*sv, c=food.c*sv, f=food.f*sv;\n      mk+=k; mp+=p; mc+=c; mf+=f;\n      rows+='<tr><td>'+dpFoodEmoji(food.n)+' '+food.n+'</td><td>'+dpAmount(food,sv)+'</td>'\n           +'<td class=\"num\">'+c.toFixed(1)+'</td><td class=\"num\">'+p.toFixed(1)+'</td>'\n           +'<td class=\"num\">'+f.toFixed(1)+'</td><td class=\"num\">'+Math.round(k)+'</td></tr>';\n    });\n    dk+=mk; dp+=mp; dc+=mc; df+=mf;\n    var mealType = dpClassifyMealType(label);\n    meals+='<div class=\"dp-meal\" data-meal-type=\"'+mealType+'\"><div class=\"meal-head-row\"><h5>'+label+'</h5><span class=\"kcal-target\">Hedef: ~'+Math.round(mealTarget)+' kcal</span></div><div class=\"mname\">'+dpFoodEmoji(meal.n)+' '+meal.n+(picked.swapped?' <span class=\"swap-tag\" style=\"font-size:10.5px;background:var(--dp-soft,#EFE8D8);color:#5B4A25;padding:1px 6px;border-radius:8px;\">değişim</span>':'')+'</div>'\n      +dpMacroBarHtml(mp,mc,mf)\n      +'<table class=\"dp-tbl\"><tr><th>Besin</th><th>Miktar</th><th class=\"num\">KH (g)</th><th class=\"num\">Prot (g)</th><th class=\"num\">Yağ (g)</th><th class=\"num\">kcal</th></tr>'\n      +rows\n      +'<tr class=\"tot\"><td colspan=\"2\">Öğün Toplamı</td><td class=\"num\">'+mc.toFixed(1)+'</td><td class=\"num\">'+mp.toFixed(1)+'</td><td class=\"num\">'+mf.toFixed(1)+'</td><td class=\"num\">'+Math.round(mk)+'</td></tr>'\n      +'</table><div class=\"dp-prep\"><b>Hazırlanışı:</b> '+meal.prep+'</div></div>';\n  });\n\n  return {html:meals, k:dk, p:dp, c:dc, f:df};\n}\n\nfunction dpRenderPlan(){\n  const host=document.getElementById('detailPlan');\n  if(!host) return;\n  const cond=dpCondition();\n  const slots=DP_PLAN[cond];\n  if(!slots){\n    host.innerHTML='<div class=\"dp-prep\">Bu durum için ayrıntılı porsiyon/makro programı oluşturulmaz. Miktarlar yalnızca ilgili uzman hekim ve diyetisyen tarafından, düzenli tetkiklerle bireysel olarak belirlenir.</div>';\n    return;\n  }\n  const scale=dpScale();\n  const target=dpTarget();\n  const ptar = dpProteinTarget();\n  let html='<p class=\"macro-legend\">'\n    + '<span><i style=\"background:#A9713F;\"></i>Protein</span>'\n    + '<span><i style=\"background:#C08A2E;\"></i>Karbonhidrat</span>'\n    + '<span><i style=\"background:#2D6E8F;\"></i>Yağ</span>'\n    + '</p>';\n  DP_WEEK_PICKS = slots.map(function(slot,si){ return dpAssignWeekIds(slot[1], DP_DAYS.length, si); });\n  DP_DAYS.forEach(function(day,d){\n    const r = dpBuildDaySlots(slots, d, target, ptar, DP_FATPCT, scale);\n    html+='<div class=\"day-block\"><h3>'+(d+1)+'. Gün — '+day+'</h3>'\n      +'<p class=\"day-sum\">Günlük toplam: <b>'+Math.round(r.k)+' kcal</b> &nbsp;·&nbsp; Karbonhidrat <b>'+r.c.toFixed(1)+' g</b> &nbsp;·&nbsp; Protein <b>'+r.p.toFixed(1)+' g</b> &nbsp;·&nbsp; Yağ <b>'+r.f.toFixed(1)+' g</b></p>'\n      +dpMacroBarHtml(r.p,r.c,r.f)\n      +r.html+'</div>';\n  });\n  html += '<div class=\"dp-tips-strip\">'\n    + '<div class=\"dp-tip\"><span class=\"dp-tip-icon\">💧</span><span>Günde 8-10 bardak su (~2-2.5 L)</span></div>'\n    + '<div class=\"dp-tip\"><span class=\"dp-tip-icon\">🫒</span><span>Sızma zeytinyağını tercih edin</span></div>'\n    + '<div class=\"dp-tip\"><span class=\"dp-tip-icon\">🐟</span><span>Haftada 2 gün balık</span></div>'\n    + '<div class=\"dp-tip\"><span class=\"dp-tip-icon\">🥩</span><span>Kırmızı et: haftada 1-2 kez</span></div>'\n    + '<div class=\"dp-tip\"><span class=\"dp-tip-icon\">🧂</span><span>Tuzu günde 5 g altında tutun</span></div>'\n    + '</div>';\n  host.innerHTML=html;\n  DP_WEEK_PICKS = null;\n}\n\n// ================= SÜSLÜ HAFTALIK MENÜ ÇIKTISI (tüm modüllerde ortak) =================\nfunction dpBuildStyledWeekHtml(days, opts){\n  opts = opts || {};\n  var title = opts.title || 'Haftalık Beslenme Programı';\n  var name = opts.patientName || '—';\n  var patientLabel = opts.patientLabel || 'Danışan';\n  var date = opts.dateValue || new Date().toLocaleDateString('tr-TR');\n  var tips = opts.tips || [\n    {icon:'💧', text:'Günde 8-10 bardak su'},\n    {icon:'🫒', text:'Sızma zeytinyağını tercih edin'},\n    {icon:'🐟', text:'Haftada 2 gün balık'},\n    {icon:'🥩', text:'Kırmızı et: haftada 1-2 kez'}\n  ];\n  var dayColors = ['#EAF6F0','#FDF1E1','#E9F2FB','#FBEAE7','#E7F5F3','#F8EEDA','#EFEAF7'];\n  var pillColors = ['#5F9A72','#D9922F','#4A7FB5','#C55C48','#2F8A7D','#A9752A','#7D6BA8'];\n\n  var cols = days.map(function(d, i){\n    var slotsHtml = d.slots.map(function(s){\n      var emoji = (typeof dpFoodEmoji==='function') ? dpFoodEmoji(s.text) : '🍽️';\n      var macro = s.macro ? '<div class=\"dp-sw-macro\">'+s.macro+'</div>' : '';\n      var prep  = s.prep  ? '<div class=\"dp-sw-prep\">'+s.prep+'</div>' : '';\n      return '<div class=\"dp-sw-slot\"><div class=\"dp-sw-slot-label\">'+s.label+'</div><div class=\"dp-sw-slot-text\">'+emoji+' '+s.text+'</div>'+macro+prep+'</div>';\n    }).join('');\n    var tot = d.total ? '<div class=\"dp-sw-daytot\">'+d.total+'</div>' : '';\n    return '<div class=\"dp-sw-day\" style=\"background:'+dayColors[i%dayColors.length]+'\">'\n      + '<div class=\"dp-sw-pill\" style=\"background:'+pillColors[i%pillColors.length]+'\">'+d.name+'</div>'\n      + slotsHtml + tot\n      + '</div>';\n  }).join('');\n\n  var tipsHtml = tips.map(function(t){\n    return '<div class=\"dp-sw-tip\"><span>'+t.icon+'</span><span>'+t.text+'</span></div>';\n  }).join('');\n\n  var css = '@import url(\\'https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap\\');'\n    + 'body{background:#FBF6E9;font-family:Inter,sans-serif;padding:32px;color:#2A2A22;}'\n    + '.dp-sw-head{text-align:center;margin-bottom:26px;position:relative;}'\n    + '.dp-sw-deco{font-size:22px;letter-spacing:10px;opacity:.7;margin-bottom:2px;}'\n    + '.dp-sw-title{font-family:\\'Caveat\\',cursive;font-size:52px;font-weight:700;color:#3F6B4A;margin:0;line-height:1;}'\n    + '.dp-sw-sub{font-family:Inter,sans-serif;font-size:13px;color:#6B6455;margin-top:8px;}'\n    + '.dp-sw-meta{display:flex;justify-content:center;gap:26px;margin-top:10px;font-size:13.5px;}'\n    + '.dp-sw-grid{display:grid;grid-template-columns:repeat('+days.length+',1fr);gap:14px;}'\n    + '.dp-sw-day{border-radius:14px;padding:14px 12px;min-height:220px;box-shadow:0 1px 3px rgba(0,0,0,.08);}'\n    + '.dp-sw-pill{color:#fff;font-family:Fraunces,serif;font-weight:600;font-size:15px;text-align:center;border-radius:20px;padding:6px 8px;margin-bottom:12px;}'\n    + '.dp-sw-slot{margin-bottom:11px;}'\n    + '.dp-sw-slot-label{font-family:\\'Source Code Pro\\',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#5B6B4F;font-weight:600;margin-bottom:2px;}'\n    + '.dp-sw-slot-text{font-size:12.5px;line-height:1.4;}'\n    + '.dp-sw-macro{font-family:\\'Source Code Pro\\',monospace;font-size:9.5px;letter-spacing:.02em;color:#7A6F52;margin-top:3px;}'\n    + '.dp-sw-prep{font-size:10px;line-height:1.35;color:#5B5A4E;margin-top:3px;font-style:italic;}'\n    + '.dp-sw-daytot{font-size:10px;text-align:center;margin-top:8px;padding-top:6px;border-top:1px dashed rgba(0,0,0,.18);color:#4F5F45;font-weight:600;}'\n    + '.dp-sw-logo{display:block;margin:0 auto 8px;}'\n    + '.dp-sw-brand{font-family:Fraunces,serif;font-size:19px;font-weight:600;color:#3F6B4A;margin-top:2px;}'\n    + '.dp-sw-tag{font-family:Fraunces,serif;font-size:11.5px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:#8A8062;margin-top:5px;margin-bottom:6px;}'\n    + '.dp-sw-tips{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;justify-content:center;}'\n    + '.dp-sw-tip{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #D8CFB6;border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:600;color:#1E3F3A;}'\n    + '@page{size:landscape;margin:14mm;}';\n\n  var bigLogo = (typeof dpSealSvg === 'function') ? dpSealSvg('#2F9E8F', 96) : '';\n  var head = '<div class=\"dp-sw-head\">'\n    + (bigLogo ? '<div class=\"dp-sw-logo\">'+bigLogo+'</div>' : '<div class=\"dp-sw-deco\">🍅 🥑 🥕 🌿</div>')\n    + '<div class=\"dp-sw-brand\">Diyetisyen İlker Yelkencioğlu</div>'\n    + '<div class=\"dp-sw-tag\">Beslenmenin Yeni Dili</div>'\n    + '<div class=\"dp-sw-title\">'+title+'</div>'\n    + '<div class=\"dp-sw-meta\"><span><b>'+patientLabel+':</b> '+name+'</span><span><b>Tarih:</b> '+date+'</span></div>'\n    + (opts.sub ? '<div class=\"dp-sw-sub\">'+opts.sub+'</div>' : '')\n    + '</div>';\n\n  var body = head + '<div class=\"dp-sw-grid\">'+cols+'</div>' + '<div class=\"dp-sw-tips\">'+tipsHtml+'</div>';\n\n  return {css: css, body: body};\n}\nfunction dpOpenStyledPrint(days, opts){\n  var built = dpBuildStyledWeekHtml(days, opts);\n  var fullHtml = '<!DOCTYPE html><html lang=\"tr\"><head><meta charset=\"UTF-8\"><title>'+(opts&&opts.title||'Haftalık Program')+'</title>'\n    + '<style>'+built.css+'<\/style></head><body>'+built.body+'</body></html>';\n  var w = window.open('', '_blank');\n  if(!w){\n    var blob = new Blob([fullHtml], {type:'text/html'});\n    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'haftalik-menu.html'; a.click();\n    return;\n  }\n  w.document.write(fullHtml);\n  w.document.close();\n  setTimeout(function(){ w.focus(); w.print(); }, 600);\n}\n\nfunction dpPrintStyledDetailPlan(){\n  var host = document.getElementById('detailPlan');\n  if(!host || !host.innerHTML.trim()){ if(typeof dpRenderPlan==='function') dpRenderPlan(); }\n  var dayBlocks = host.querySelectorAll('.day-block');\n  var slotLabels = ['Kahvaltı','Öğle Yemeği','Ara Öğün','Akşam Yemeği'];\n  var styledDays = Array.prototype.slice.call(dayBlocks).map(function(block){\n    var h3 = block.querySelector('h3');\n    var dayName = h3 ? h3.textContent.replace(/^[0-9]+.s*Güns*—s*/,'') : '';\n    var mealEls = block.querySelectorAll('.dp-meal');\n    var slots = Array.prototype.slice.call(mealEls).map(function(mealEl, i){\n      var m = mealEl.querySelector('.mname');\n      var text = m ? m.textContent.replace('değişim','').trim() : '';\n      var h5 = mealEl.querySelector('h5');\n      var label = h5 ? h5.textContent.trim() : (slotLabels[i] || ('Öğün '+(i+1)));\n      // Öğün toplamı satırından makrolar: KH / Protein / Yağ / kcal\n      var macro = '';\n      var tot = mealEl.querySelector('tr.tot');\n      if(tot){\n        var tds = tot.querySelectorAll('td');\n        if(tds.length >= 5){\n          var kh = tds[tds.length-4].textContent.trim();\n          var pr = tds[tds.length-3].textContent.trim();\n          var yg = tds[tds.length-2].textContent.trim();\n          var kc = tds[tds.length-1].textContent.trim();\n          macro = 'P ' + pr + ' g · KH ' + kh + ' g · Y ' + yg + ' g · ' + kc + ' kcal';\n        }\n      }\n      var prepEl = mealEl.querySelector('.dp-prep');\n      var prep = prepEl ? prepEl.textContent.replace(/^s*Hazırlanışı:s*/,'').trim() : '';\n      return {label: label, text: text, macro: macro, prep: prep};\n    });\n    var sum = block.querySelector('.day-sum');\n    var total = sum ? sum.textContent.replace(/s+/g,' ').trim() : '';\n    return {name: dayName, slots: slots, total: total};\n  });\n  if(!styledDays.length){ alert('Önce programı oluşturun (Programı Yenile).'); return; }\n  var condSel = document.getElementById('cCondition');\n  var condTxt = (condSel && condSel.selectedIndex>=0 && condSel.options[condSel.selectedIndex]) ? condSel.options[condSel.selectedIndex].textContent : '';\n  var nameEl = document.getElementById('patientName');\n  dpOpenStyledPrint(styledDays, {\n    title: 'Haftalık Beslenme Programı',\n    patientLabel: 'Danışan',\n    patientName: (nameEl && nameEl.value.trim()) || '—',\n    sub: condTxt\n  });\n}\nfunction dpPrint(mode){\n  const nameEl=document.getElementById('patientName');\n  const dateEl=document.getElementById('patientDate');\n  const name=(nameEl&&nameEl.value.trim())||'—';\n  const date=(dateEl&&dateEl.value.trim())||'—';\n  const condSel=document.getElementById('cCondition');\n  const condTxt=condSel&&condSel.selectedIndex>=0?condSel.options[condSel.selectedIndex].textContent:'';\n  const host=document.getElementById('detailPlan');\n  if(!host||!host.innerHTML.trim()){ dpRenderPlan(); }\n\n  const head='<div class=\"dp-report-head\">'\n    +'<div class=\"dp-rh-title\">Diyetisyen İlker — 7 Günlük Kişiye Özel Beslenme Programı</div>'\n    +'<div class=\"dp-rh-meta\"><b>Danışan:</b> '+name+' &nbsp;&nbsp;|&nbsp;&nbsp; <b>Tarih:</b> '+date\n    +' &nbsp;&nbsp;|&nbsp;&nbsp; <b>Program:</b> '+condTxt\n    +' &nbsp;&nbsp;|&nbsp;&nbsp; <b>Hedef:</b> '+Math.round(dpTarget()).toLocaleString('tr-TR')+' kcal/gün</div></div>';\n\n  const css=Array.from(document.querySelectorAll('style')).map(function(s){return s.textContent;}).join('\\n')\n   +'.dp-report-head{border-bottom:2px solid #1E3F3A;padding-bottom:10px;margin-bottom:22px;}'\n   +'.dp-rh-title{font-family:Fraunces,serif;font-size:24px;font-weight:600;margin-bottom:6px;}'\n   +'.dp-rh-meta{font-size:13px;}'\n   +'body{background:#fff;padding:24px;font-family:Inter,sans-serif;}'\n   +'.day-block{border:none;padding:0;margin-bottom:26px;}';\n\n  const p={type:'nutriPrint',css:css,html:head+host.innerHTML,\n    title:'Diyetisyen İlker — 7 Günlük Beslenme Programı',filename:'7-gunluk-beslenme-programi.html',action:mode};\n\n  if(window.parent&&window.parent!==window){ window.parent.postMessage(p,'*'); return; }\n  if(mode==='download'){ doDownload(p); return; }\n  const w=window.open('','_blank');\n  if(!w){ doDownload(p); return; }\n  w.document.write('<!DOCTYPE html><html lang=\"tr\"><head><meta charset=\"UTF-8\"><title>'+p.title+'</title>'\n   +'<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@500&display=swap\" rel=\"stylesheet\">'\n   +'<style>'+p.css+'<\/style></head><body>'+p.html+'</body></html>');\n  w.document.close();\n  setTimeout(function(){ w.focus(); w.print(); },600);\n}\ndpRenderPlan();\n\n// Durum değişince veya yeni hesaplama yapılınca programı tazele\n(function(){\n  var sel=document.getElementById('cCondition');\n  if(sel) sel.addEventListener('change', dpRenderPlan);\n  document.querySelectorAll('select').forEach(function(s){ s.addEventListener('change', function(){ setTimeout(dpRenderPlan,60); }); });\n  document.addEventListener('click', function(e){\n    var b=e.target.closest('button, .toggle, .dislike-chip');\n    if(!b) return;\n    var oc=b.getAttribute('onclick')||'';\n    if(oc.indexOf('dpPrint')>-1 || oc.indexOf('dpRenderPlan')>-1) return;\n    setTimeout(dpRenderPlan, 140);\n  });\n})();\n\n\nconst DP_COND_ID='cCondition';\nconst DP_WHO='Danışan';\n\n// ================= PDF OLARAK İNDİR =================\nfunction dpLoadScript(src){\n  return new Promise(function(res,rej){\n    var s=document.createElement('script');\n    s.src=src; s.onload=res; s.onerror=function(){rej(new Error(src));};\n    document.head.appendChild(s);\n  });\n}\nasync function dpEnsurePdfLibs(){\n  if(!window.html2canvas){\n    await dpLoadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');\n  }\n  if(!(window.jspdf&&window.jspdf.jsPDF)){\n    await dpLoadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');\n  }\n}\nfunction dpHeaderHtml(){\n  var nameEl=document.getElementById('patientName'), dateEl=document.getElementById('patientDate');\n  var name=(nameEl&&nameEl.value.trim())||'—';\n  var date=(dateEl&&dateEl.value.trim())||'—';\n  var condSel=document.getElementById(DP_COND_ID);\n  var condTxt=condSel&&condSel.selectedIndex>=0?condSel.options[condSel.selectedIndex].textContent:'';\n  return '<div style=\"border-bottom:2px solid #1E3F3A;padding-bottom:8px;margin-bottom:14px;font-family:Inter,Arial,sans-serif;\">'\n    +'<div style=\"font-family:Fraunces,Georgia,serif;font-size:19px;font-weight:600;\">Diyetisyen İlker — 7 Günlük Kişiye Özel Beslenme Programı</div>'\n    +'<div style=\"font-size:11.5px;margin-top:4px;\">'+DP_WHO+': <b>'+name+'</b> &nbsp;|&nbsp; Tarih: <b>'+date+'</b>'\n    +' &nbsp;|&nbsp; Program: <b>'+condTxt+'</b> &nbsp;|&nbsp; Hedef: <b>'\n    +Math.round(dpTarget()).toLocaleString('tr-TR')+' kcal/gün</b></div></div>';\n}\nfunction dpSetBusy(on,msg){\n  var b=document.getElementById('dpPdfBtn');\n  if(b){ b.disabled=!!on; b.textContent = on?(msg||'PDF hazırlanıyor…'):'📄 PDF olarak indir'; }\n}\nasync function dpPdf(){\n  var host=document.getElementById('detailPlan');\n  if(!host||!host.innerHTML.trim()) dpRenderPlan();\n  var days=host.querySelectorAll('.day-block');\n  if(!days.length){ alert('Önce programı oluşturun.'); return; }\n\n  dpSetBusy(true,'Kütüphaneler yükleniyor…');\n  try{ await dpEnsurePdfLibs(); }\n  catch(err){\n    dpSetBusy(false);\n    alert('PDF kütüphanesi yüklenemedi (internet bağlantısı gerekiyor). Bunun yerine \"İndir (HTML)\" seçeneğini kullanabilirsiniz.');\n    return;\n  }\n\n  var jsPDF=window.jspdf.jsPDF;\n  var pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});\n  var PW=210, PH=297, M=10, CW=PW-M*2;\n\n  // Ekran dışında, beyaz zeminli geçici kutu\n  var stage=document.createElement('div');\n  stage.style.cssText='position:fixed;left:-10000px;top:0;width:780px;background:#fff;padding:18px;font-family:Inter,Arial,sans-serif;';\n  document.body.appendChild(stage);\n\n  try{\n    for(var i=0;i<days.length;i++){\n      dpSetBusy(true,'Sayfa '+(i+1)+' / '+days.length+'…');\n      stage.innerHTML = dpHeaderHtml() + days[i].outerHTML;\n      // sayfa kırılımı stillerini geçici kutuda etkisiz kıl\n      var blk=stage.querySelector('.day-block');\n      if(blk){ blk.style.pageBreakBefore='auto'; blk.style.border='none'; blk.style.padding='0'; }\n\n      var canvas=await html2canvas(stage,{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true});\n      var img=canvas.toDataURL('image/jpeg',0.92);\n      var h=canvas.height*CW/canvas.width;\n\n      if(i>0) pdf.addPage();\n      if(h<=PH-M*2){\n        pdf.addImage(img,'JPEG',M,M,CW,h);\n      }else{\n        // gün tek sayfaya sığmazsa dilimleyerek devam ettir\n        var pageH=PH-M*2, sliceH=canvas.width*pageH/CW, y=0, first=true;\n        while(y<canvas.height-1){\n          var c2=document.createElement('canvas');\n          c2.width=canvas.width;\n          c2.height=Math.min(sliceH,canvas.height-y);\n          c2.getContext('2d').drawImage(canvas,0,y,canvas.width,c2.height,0,0,canvas.width,c2.height);\n          if(!first) pdf.addPage();\n          pdf.addImage(c2.toDataURL('image/jpeg',0.92),'JPEG',M,M,CW,c2.height*CW/canvas.width);\n          y+=c2.height; first=false;\n        }\n      }\n    }\n\n    var blob=pdf.output('blob');\n    var fname='7-gunluk-beslenme-programi.pdf';\n    if(window.parent&&window.parent!==window){\n      window.parent.postMessage({type:'nutriPdf',blob:blob,filename:fname},'*');\n    }else{\n      var url=URL.createObjectURL(blob);\n      var a=document.createElement('a'); a.href=url; a.download=fname;\n      document.body.appendChild(a); a.click();\n      setTimeout(function(){URL.revokeObjectURL(url); a.remove();},1500);\n    }\n  }catch(err){\n    alert('PDF oluşturulurken bir sorun oluştu: '+err.message);\n  }finally{\n    stage.remove();\n    dpSetBusy(false);\n  }\n}\n\n\n// ================= TARİFLER / YEMEK TARİFLERİ =================\nconst DP_MEAT_FISH_IDS = ['tavuk','hindi','et','kofte','balik','somon','ton','hindi','kuzu','dana','sucuk','sosis','pastirma','jambon','tavukbut','tavukkanat'];\nconst DP_DAIRY_IDS = ['sut','yogurt','lyogurt','kefir','ayran','beyazpeynir','kasar','lor','tereyagi','krema','sutlu'];\nconst DP_EGG_IDS = ['yumurta'];\nconst DP_GLUTEN_IDS = ['ekmek','bulgur','makarna','granola','yulaf','un','erişte','şehriye','sehriye'];\nconst DP_HONEY_IDS = ['bal'];\nfunction dpMealDietTags(meal){\n  var hasMeatFish=false, hasDairy=false, hasEgg=false, hasGluten=false, hasHoney=false;\n  meal.it.forEach(function(pair){\n    var id = pair[0];\n    if(DP_MEAT_FISH_IDS.indexOf(id)>-1) hasMeatFish=true;\n    if(DP_DAIRY_IDS.indexOf(id)>-1) hasDairy=true;\n    if(DP_EGG_IDS.indexOf(id)>-1) hasEgg=true;\n    if(DP_GLUTEN_IDS.indexOf(id)>-1) hasGluten=true;\n    if(DP_HONEY_IDS.indexOf(id)>-1) hasHoney=true;\n  });\n  return { vejetaryen: !hasMeatFish, vegan: !hasMeatFish && !hasDairy && !hasEgg && !hasHoney, glutensiz: !hasGluten };\n}\nfunction dpMealMacros(meal){\n  var k=0,p=0,c=0,f=0;\n  meal.it.forEach(function(pair){ var F=DP_FOODS[pair[0]], q=pair[1]; k+=F.k*q; p+=F.p*q; c+=F.c*q; f+=F.f*q; });\n  return {k:k,p:p,c:c,f:f};\n}\nfunction dpCollectMealIds(){\n  var set={};\n  Object.keys(DP_PLAN).forEach(function(cond){\n    DP_PLAN[cond].forEach(function(slot){ slot[1].forEach(function(id){ set[id]=true; }); });\n  });\n  if(typeof DP_LIFESTYLE!=='undefined'){\n    Object.keys(DP_LIFESTYLE).forEach(function(key){\n      DP_LIFESTYLE[key].slots.forEach(function(slot){ slot[1].forEach(function(id){ set[id]=true; }); });\n    });\n  }\n  return Object.keys(set);\n}\nfunction dpGroupLabel(id){\n  if(id.indexOf('sp')===0) return 'Sporcu Antrenman Tarifleri';\n  if(id.indexOf('l')===0) return 'Yaşam Tarzına Özel Tarifler';\n  if(id.indexOf('b')===0) return 'Kahvaltı Tarifleri';\n  if(id.indexOf('m')===0) return 'Ana Öğün Tarifleri';\n  if(id.indexOf('s')===0) return 'Ara Öğün Tarifleri';\n  return 'Diğer';\n}\nfunction dpRenderRecipes(){\n  var ids=Object.keys(DP_MEALS);\n  var groups={};\n  ids.forEach(function(id){\n    var meal=DP_MEALS[id]; if(!meal) return;\n    var g=dpGroupLabel(id);\n    if(!groups[g]) groups[g]=[];\n    groups[g].push(id);\n  });\n  var order=['Kahvaltı Tarifleri','Ana Öğün Tarifleri','Ara Öğün Tarifleri','Sporcu Antrenman Tarifleri','Yaşam Tarzına Özel Tarifler','Diğer'];\n  var html='';\n  order.forEach(function(g){\n    if(!groups[g]||!groups[g].length) return;\n    html+='<h4 class=\"recipe-group-title\">'+g+'</h4>';\n    groups[g].sort(function(a,b){ return DP_MEALS[a].n.localeCompare(DP_MEALS[b].n,'tr'); });\n    groups[g].forEach(function(id){\n      var meal=DP_MEALS[id];\n      var mm=dpMealMacros(meal);\n      var tags=dpMealDietTags(meal);\n      var ingredRows=meal.it.map(function(pair){\n        var F=DP_FOODS[pair[0]];\n        return '<li>'+F.n+' — '+dpAmount(F,pair[1])+'</li>';\n      }).join('');\n      var badgeHtml = (tags.vejetaryen?'<span class=\"diet-badge\">🌱 Vejetaryen'+(tags.vegan?' (Vegan)':'')+'</span>':'')\n        + (tags.glutensiz?'<span class=\"diet-badge\">🌾 Glutensiz</span>':'');\n      html+='<div class=\"recipe-card\" data-name=\"'+meal.n.toLowerCase()+'\" data-kcal=\"'+Math.round(mm.k)+'\" data-protein=\"'+mm.p.toFixed(1)+'\" data-veg=\"'+(tags.vejetaryen?1:0)+'\" data-gf=\"'+(tags.glutensiz?1:0)+'\">'\n        +'<div class=\"recipe-name\">'+meal.n+'</div>'\n        +(badgeHtml?'<div style=\"margin:4px 0 8px;\">'+badgeHtml+'</div>':'')\n        +'<div class=\"recipe-macro\">Yaklaşık (belirtilen ölçüyle): '+Math.round(mm.k)+' kcal · KH '+mm.c.toFixed(1)+' g · Protein '+mm.p.toFixed(1)+' g · Yağ '+mm.f.toFixed(1)+' g</div>'\n        +'<ul class=\"recipe-ingr\">'+ingredRows+'</ul>'\n        +'<div class=\"dp-prep\"><b>Hazırlanışı:</b> '+meal.prep+'</div>'\n        +'</div>';\n    });\n  });\n  var host=document.getElementById('recipeList');\n  if(host) host.innerHTML = html || '<p>Tarif bulunamadı.</p>';\n}\nfunction dpFilterRecipes(){\n  var q=(document.getElementById('recipeSearch').value||'').toLowerCase();\n  var maxKcalEl = document.getElementById('recipeMaxKcal');\n  var minProtEl = document.getElementById('recipeMinProtein');\n  var vegEl = document.getElementById('recipeVegOnly');\n  var gfEl = document.getElementById('recipeGfOnly');\n  var maxKcal = maxKcalEl && maxKcalEl.value !== '' ? parseFloat(maxKcalEl.value) : null;\n  var minProt = minProtEl && minProtEl.value !== '' ? parseFloat(minProtEl.value) : null;\n  var vegOnly = vegEl && vegEl.checked;\n  var gfOnly = gfEl && gfEl.checked  ctx.stroke();\n\n  if(!data.length){\n    ctx.fillStyle='#8A8371'; ctx.font='12px Inter, sans-serif';\n    ctx.fillText('Henüz kayıt yok', pad.l+10, pad.t+24);\n    return;\n  }\n\n  var weights=data.map(function(d){return d.weight;});\n  var minW=Math.min.apply(null,weights), maxW=Math.max.apply(null,weights);\n  if(minW===maxW){ minW-=1; maxW+=1; }\n  var margin=(maxW-minW)*0.15; minW-=margin; maxW+=margin;\n\n  function xAt(i){ return data.length>1 ? pad.l+plotW*(i/(data.length-1)) : pad.l+plotW/2; }\n  function yAt(val){ return pad.t+plotH*(1-(val-minW)/(maxW-minW)); }\n\n  ctx.strokeStyle='#EFE8D8'; ctx.fillStyle='#8A8371'; ctx.font='10.5px Inter, sans-serif';\n  for(var g=0; g<=3; g++){\n    var val=minW+(maxW-minW)*g/3, y=yAt(val);\n    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke();\n    ctx.fillText(val.toFixed(1), 4, y+4);\n  }\n\n  ctx.strokeStyle='#1E3F3A'; ctx.lineWidth=2; ctx.beginPath();\n  data.forEach(function(d,i){ var x=xAt(i), y=yAt(d.weight); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });\n  ctx.stroke();\n  ctx.fillStyle='#C08A2E';\n  data.forEach(function(d,i){ var x=xAt(i), y=yAt(d.weight); ctx.beginPath(); ctx.arc(x,y,3.5,0,Math.PI*2); ctx.fill(); });\n\n  ctx.fillStyle='#6B6455'; ctx.font='11px Inter, sans-serif';\n  ctx.textAlign='left'; ctx.fillText(data[0].date, pad.l, h-10);\n  ctx.textAlign='right'; ctx.fillText(data[data.length-1].date, w-pad.r, h-10);\n  ctx.textAlign='left';\n}\nfunction dpExportTrack(){\n  var blob=new Blob([JSON.stringify(dpTrackData,null,2)], {type:'application/json'});\n  var url=URL.createObjectURL(blob);\n  var a=document.createElement('a'); a.href=url; a.download='kilo-takibi.json';\n  document.body.appendChild(a); a.click();\n  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1000);\n}\nfunction dpImportTrack(file){\n  if(!file) return;\n  var reader=new FileReader();\n  reader.onload=function(e){\n    try{\n      var data=JSON.parse(e.target.result);\n      if(Array.isArray(data)){ dpTrackData=data; dpDrawTrackChart(); dpRenderTrackTable(); }\n      else alert('Geçersiz dosya formatı.');\n    }catch(err){ alert('Dosya okunamadı: '+err.message); }\n  };\n  reader.readAsText(file);\n}\nwindow.addEventListener('resize', function(){ if(typeof dpDrawTrackChart==='function') dpDrawTrackChart(); });\ndpDrawTrackChart(); dpRenderTrackTable();\n\n// ================= WHATSAPP'TA PAYLAŞ (ÖZET METİN) =================\n// Not: window.open() çerçeve (iframe) içinden çoğu tarayıcıda sessizce\n// engellenebiliyor. Bunun yerine gerçek bir <a target=\"_blank\"> bağlantısının\n// href'ini tıklama anında güncelleyip tarayıcının doğal bağlantı takibine\n// bırakıyoruz — bu yöntem açılır pencere engelleyicilere takılmaz.\nfunction dpBuildWhatsAppText(){\n  var nameEl=document.getElementById('patientName');\n  var name=(nameEl && nameEl.value.trim()) || 'Danışan';\n  var condTxt='';\n  var condSel=(typeof DP_COND_ID!=='undefined') ? document.getElementById(DP_COND_ID) : null;\n  if(condSel && condSel.selectedIndex>=0) condTxt=condSel.options[condSel.selectedIndex].textContent;\n  var target = (typeof dpTarget==='function') ? Math.round(dpTarget()) : null;\n  var ptar = (typeof dpProteinTarget==='function') ? Math.round(dpProteinTarget()) : null;\n  var title = (typeof REPORT_TITLE!=='undefined') ? REPORT_TITLE : 'Beslenme Programı';\n\n  return '*'+title+'*\\n'\n    + 'Danışan: '+name+'\\n'\n    + (condTxt ? ('Program: '+condTxt+'\\n') : '')\n    + (target ? ('Günlük hedef: ~'+target+' kcal'+(ptar?(' (protein ~'+ptar+' g)'):'')+'\\n') : '')\n    + '\\nTam 7 günlük menü ve tarifler için PDF/HTML dosyasını ayrıca ekleyip gönderiniz.';\n}\nfunction dpPrepWhatsApp(){\n  var text = dpBuildWhatsAppText();\n  var box = document.getElementById('waBox');\n  var ta = document.getElementById('waText');\n  var link = document.getElementById('waDirectLink');\n  var msg = document.getElementById('waCopyMsg');\n  if(!box || !ta || !link) return;\n  ta.value = text;\n  link.href = 'https://wa.me/?text=' + encodeURIComponent(text);\n  box.style.display = 'block';\n  if(msg){ msg.style.display='none'; msg.textContent=''; }\n  box.scrollIntoView({behavior:'smooth', block:'nearest'});\n}\nfunction dpCopyWhatsAppText(){\n  var ta = document.getElementById('waText');\n  var msg = document.getElementById('waCopyMsg');\n  if(!ta) return;\n  function showMsg(t){ if(msg){ msg.textContent=t; msg.style.display='block'; } }\n  ta.focus(); ta.select();\n  var done = false;\n  try{\n    if(navigator.clipboard && navigator.clipboard.writeText){\n      navigator.clipboard.writeText(ta.value).then(function(){\n        showMsg('✓ Metin kopyalandı. WhatsApp\\'ı açıp bir sohbete yapıştırabilirsiniz.');\n      }).catch(function(){\n        try{ document.execCommand('copy'); showMsg('✓ Metin kopyalandı.'); }\n        catch(e2){ showMsg('Otomatik kopyalama olmadı — metin kutusundan elle seçip kopyalayabilirsiniz.'); }\n      });\n      done = true;\n    }\n  }catch(e){}\n  if(!done){\n    try{ document.execCommand('copy'); showMsg('✓ Metin kopyalandı.'); }\n    catch(e2){ showMsg('Otomatik kopyalama olmadı — metin kutusundan elle seçip kopyalayabilirsiniz.'); }\n  }\n}\n\n\n// ================= 7 GÜNLÜK ALIŞVERİŞ LİSTESİ =================\nfunction dpWeeklyShoppingList(){\n  var cond = dpCondition();\n  var slots = DP_PLAN[cond];\n  var box = document.getElementById('weeklyShopBox');\n  var host = document.getElementById('weeklyShopList');\n  if(!slots){\n    host.innerHTML = '<p style=\"font-size:13px;color:#6B6455;\">Bu durum için hazır bir 7 günlük plan bulunmuyor.</p>';\n    box.style.display='block';\n    return;\n  }\n  var target = dpTarget(), ptar = dpProteinTarget(), scale = dpScale();\n  // dpBuildDaySlots zaten doğru ölçekleri hesaplıyor; malzeme miktarlarını\n  // oradan tekrar üretmek yerine, her gün için aynı hesaplamayı tekrarlayıp topluyoruz.\n  var agg = {};\n  for(var day=0; day<7; day++){\n    var pRaw={k:0,p:0,c:0,f:0}, yRaw={k:0,p:0,c:0,f:0}, dRaw={k:0,p:0,c:0,f:0};\n    var dayMeals = slots.map(function(slot,si){ return DP_MEALS[dpPickMealId(slot[1], day+si).id]; });\n    dayMeals.forEach(function(meal){\n      meal.it.forEach(function(pair){\n        var F=DP_FOODS[pair[0]], q=pair[1];\n        var g = F.pr? pRaw : (F.ft? yRaw : dRaw);\n        g.k+=F.k*q; g.p+=F.p*q; g.c+=F.c*q; g.f+=F.f*q;\n      });\n    });\n    var ftar = target*DP_FATPCT/9;\n    var sp=1, sy=1, sd=1;\n    for(var it=0; it<12; it++){\n      var totP = pRaw.p*sp + yRaw.p*sy + dRaw.p*sd;\n      if(totP>0) sp = Math.max(0.4, Math.min(2.5, sp*(ptar/totP)));\n      var totF = pRaw.f*sp + yRaw.f*sy + dRaw.f*sd;\n      if(totF>0) sy = Math.max(0.25, Math.min(4.0, sy*(ftar/totF)));\n      sd = dRaw.k>0 ? (target - pRaw.k*sp - yRaw.k*sy)/dRaw.k : 1;\n      sd = Math.max(0.3, Math.min(4.0, sd||1));\n    }\n    sp*=scale; sy*=scale; sd*=scale;\n    dayMeals.forEach(function(meal){\n      meal.it.forEach(function(pair){\n        var F=DP_FOODS[pair[0]];\n        var sv = pair[1]*(F.pr?sp:(F.ft?sy:sd));\n        if(!agg[pair[0]]) agg[pair[0]] = 0;\n        agg[pair[0]] += sv;\n      });\n    });\n  }\n\n  var rows = Object.keys(agg).map(function(fid){\n    var F = DP_FOODS[fid];\n    return {name:F.n, amount: dpAmount(F, agg[fid])};\n  }).sort(function(a,b){ return a.name.localeCompare(b.name,'tr'); });\n\n  host.innerHTML = '<ul style=\"margin:0;padding-left:20px;font-size:13.5px;\">'\n    + rows.map(function(r){ return '<li>'+r.name+' — <b>'+r.amount+'</b></li>'; }).join('')\n    + '</ul><p style=\"font-size:11.5px;color:#6B6455;margin-top:10px;\">Miktarlar 7 günlük toplam gösterir; mevcut porsiyon/paket büyüklüklerine göre yuvarlayarak alışveriş yapabilirsiniz.</p>';\n  box.style.display = 'block';\n  box.scrollIntoView({behavior:'smooth', block:'nearest'});\n}\n\n\n// ================= BARKOD İLE BESİN DEĞERİ SORGULAMA =================\nlet dpScannerActive = null;\n\nfunction dpLoadScannerLib(){\n  return new Promise(function(res, rej){\n    if(window.Html5Qrcode){ res(); return; }\n    var s = document.createElement('script');\n    s.src = 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';\n    s.onload = res; s.onerror = function(){ rej(new Error('script yüklenemedi')); };\n    document.head.appendChild(s);\n  });\n}\n\nasync function dpToggleScanner(){\n  var box = document.getElementById('scannerBox');\n  if(box.style.display === 'block'){ dpStopScanner(); return; }\n  var host = document.getElementById('barcodeResult');\n  if(window.location.protocol === 'file:'){\n    host.innerHTML = '<div class=\"dp-prep\">Bu dosyayı doğrudan (çift tıklayarak) açtığınız için tarayıcı kameraya erişime izin vermiyor — bu bir kod hatası değil, tarayıcıların \"file://\" ile açılan sayfalar için uyguladığı standart bir güvenlik kuralı (kamera yalnızca https:// veya yerel bir sunucu üzerinden çalışan sayfalarda etkinleşir). Barkod numarasını üründen okuyup \"Barkod Numarası\" kutusuna elle yazıp \"Sorgula\"yı kullanabilirsiniz — ama bu da (aşağıda açıklandığı gibi) file:// üzerinden çalışmayabilir.</div>';\n    return;\n  }\n  box.style.display = 'block';\n  try{\n    await dpLoadScannerLib();\n  }catch(e){\n    host.innerHTML = '<div class=\"dp-prep\">Kamera kütüphanesi yüklenemedi (internet bağlantısı gerekiyor). Barkod numarasını elle girip \"Sorgula\"yı kullanabilirsiniz.</div>';\n    box.style.display = 'none';\n    return;\n  }\n  try{\n    dpScannerActive = new window.Html5Qrcode('scannerReader');\n    await dpScannerActive.start(\n      { facingMode: 'environment' },\n      { fps: 10, qrbox: { width: 250, height: 150 } },\n      function(decodedText){\n        document.getElementById('barcodeInput').value = decodedText;\n        dpStopScanner();\n        dpLookupBarcode();\n      },\n      function(){ /* eşleşme yok, taramaya devam — hata değil */ }\n    );\n  }catch(e){\n    host.innerHTML = '<div class=\"dp-prep\">Kameraya erişilemedi (izin verilmedi, tarayıcı desteklemiyor veya güvenli olmayan bir bağlamdasınız — bu dosyayı doğrudan açtıysanız bu beklenen bir durumdur). Barkod numarasını elle girip \"Sorgula\"yı kullanabilirsiniz.</div>';\n    box.style.display = 'none';\n  }\n}\n\nfunction dpStopScanner(){\n  var box = document.getElementById('scannerBox');\n  if(dpScannerActive){\n    try{\n      dpScannerActive.stop().then(function(){\n        try{ dpScannerActive.clear(); }catch(e2){}\n      }).catch(function(){});\n    }catch(e){}\n    dpScannerActive = null;\n  }\n  if(box) box.style.display = 'none';\n}\n\nfunction dpManualEntryFormHtml(){\n  return '<div style=\"background:var(--dp-soft,#EFE8D8);border:1px solid var(--dp-line,#D8CFB6);border-radius:4px;padding:14px 16px;\">'\n    + '<p style=\"font-weight:600;margin:0 0 10px;\">Ürünü Paket Etiketinden Elle Girin</p>'\n    + '<div class=\"grid\" style=\"margin-bottom:10px;\">'\n    + '<div><label for=\"manualName\">Ürün Adı</label><input type=\"text\" id=\"manualName\" placeholder=\"örn. Tam Buğday Ekmeği\"></div>'\n    + '<div><label for=\"manualBrand\">Marka (opsiyonel)</label><input type=\"text\" id=\"manualBrand\"></div>'\n    + '</div>'\n    + '<div class=\"grid\" style=\"margin-bottom:10px;\">'\n    + '<div><label for=\"manualKcal\">Enerji (kcal /100g)</label><input type=\"number\" id=\"manualKcal\"></div>'\n    + '<div><label for=\"manualProtein\">Protein (g /100g)</label><input type=\"number\" id=\"manualProtein\"></div>'\n    + '<div><label for=\"manualCarb\">Karbonhidrat (g /100g)</label><input type=\"number\" id=\"manualCarb\"></div>'\n    + '<div><label for=\"manualSugar\">— Şeker (g /100g)</label><input type=\"number\" id=\"manualSugar\"></div>'\n    + '<div><label for=\"manualFat\">Yağ (g /100g)</label><input type=\"number\" id=\"manualFat\"></div>'\n    + '<div><label for=\"manualSatFat\">— Doymuş Yağ (g /100g)</label><input type=\"number\" id=\"manualSatFat\"></div>'\n    + '<div><label for=\"manualFiber\">Lif (g /100g)</label><input type=\"number\" id=\"manualFiber\"></div>'\n    + '<div><label for=\"manualSalt\">Tuz (g /100g)</label><input type=\"number\" id=\"manualSalt\"></div>'\n    + '</div>'\n    + '<button class=\"btn-primary\" style=\"margin-top:0;\" onclick=\"dpSaveManualEntry()\">Göster</button>'\n    + '</div>';\n}\nfunction dpSaveManualEntry(){\n  var host = document.getElementById('barcodeResult');\n  function v(id){ var el = document.getElementById(id); return el ? el.value : ''; }\n  function fmt(val, unit){ return (val===undefined||val===null||val==='') ? '—' : val+' '+unit; }\n  var name = v('manualName').trim() || 'İsimsiz ürün';\n  var brand = v('manualBrand').trim();\n  host.innerHTML =\n    '<div class=\"dp-prep\" style=\"margin-bottom:12px;\"><b>'+name+'</b>'+(brand?(' — '+brand):'')+'</div>'\n    + '<table class=\"exchange-table\">'\n    + '<tr><th>Besin Değeri (100 g/ml için)</th><th>Miktar</th></tr>'\n    + '<tr><td>Enerji</td><td>'+fmt(v('manualKcal'),'kcal')+'</td></tr>'\n    + '<tr><td>Protein</td><td>'+fmt(v('manualProtein'),'g')+'</td></tr>'\n    + '<tr><td>Karbonhidrat</td><td>'+fmt(v('manualCarb'),'g')+'</td></tr>'\n    + '<tr><td>— Şeker</td><td>'+fmt(v('manualSugar'),'g')+'</td></tr>'\n    + '<tr><td>Yağ</td><td>'+fmt(v('manualFat'),'g')+'</td></tr>'\n    + '<tr><td>— Doymuş Yağ</td><td>'+fmt(v('manualSatFat'),'g')+'</td></tr>'\n    + '<tr><td>Lif</td><td>'+fmt(v('manualFiber'),'g')+'</td></tr>'\n    + '<tr><td>Tuz</td><td>'+fmt(v('manualSalt'),'g')+'</td></tr>'\n    + '</table>'\n    + '<p style=\"font-size:11.5px;color:#6B6455;margin-top:10px;\">Kaynak: elle girildi (ürün etiketinden). Open Food Facts\\'te bulunmadığı için manuel olarak eklendi.</p>';\n}\nasync function dpLookupBarcode(){\n  var raw = document.getElementById('barcodeInput').value || '';\n  var code = raw.trim().replace(/\\s+/g,'');\n  var host = document.getElementById('barcodeResult');\n  if(!code){ alert('Lütfen bir barkod numarası girin.'); return; }\n  var isFile = window.location.protocol === 'file:';\n  host.innerHTML = '<p style=\"font-size:13px;color:#6B6455;\">Sorgulanıyor…</p>';\n  try{\n    var resp = await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json');\n    var data = await resp.json();\n    if(!data || data.status !== 1 || !data.product){\n      host.innerHTML = '<div class=\"dp-prep\" style=\"margin-bottom:14px;\">Bu barkod için ürün bulunamadı. Open Food Facts kullanıcı katkılı bir veritabanıdır; özellikle yerel/bölgesel ürünlerde kapsam sınırlı olabilir — bu, uygulamanın değil, veritabanının bir sınırlamasıdır.</div>'\n        + dpManualEntryFormHtml();\n      return;\n    }\n    var p = data.product;\n    var n = p.nutriments || {};\n    function fmt(v, unit){ return (v===undefined || v===null || v==='') ? '—' : (Math.round(v*10)/10)+' '+unit; }\n    host.innerHTML =\n      '<div class=\"dp-prep\" style=\"margin-bottom:12px;\">'\n      + '<b>'+(p.product_name || p.product_name_tr || 'İsimsiz ürün')+'</b>'\n      + (p.brands ? (' — '+p.brands) : '')\n      + '</div>'\n      + '<table class=\"exchange-table\">'\n      + '<tr><th>Besin Değeri (100 g/ml için)</th><th>Miktar</th></tr>'\n      + '<tr><td>Enerji</td><td>'+fmt(n['energy-kcal_100g'],'kcal')+'</td></tr>'\n      + '<tr><td>Protein</td><td>'+fmt(n.proteins_100g,'g')+'</td></tr>'\n      + '<tr><td>Karbonhidrat</td><td>'+fmt(n.carbohydrates_100g,'g')+'</td></tr>'\n      + '<tr><td>— Şeker</td><td>'+fmt(n.sugars_100g,'g')+'</td></tr>'\n      + '<tr><td>Yağ</td><td>'+fmt(n.fat_100g,'g')+'</td></tr>'\n      + '<tr><td>— Doymuş Yağ</td><td>'+fmt(n['saturated-fat_100g'],'g')+'</td></tr>'\n      + '<tr><td>Lif</td><td>'+fmt(n.fiber_100g,'g')+'</td></tr>'\n      + '<tr><td>Tuz</td><td>'+fmt(n.salt_100g,'g')+'</td></tr>'\n      + '</table>'\n      + '<p style=\"font-size:11.5px;color:#6B6455;margin-top:10px;\">Kaynak: Open Food Facts (kullanıcı katkılı açık veritabanı). Değerler üreticinin beyanına dayanır; her zaman ürün etiketiyle karşılaştırın.</p>';\n  }catch(e){\n    if(isFile){\n      host.innerHTML = '<div class=\"dp-prep\">Sorgu başarısız oldu. Bu dosyayı doğrudan (çift tıklayarak) açtığınız için tarayıcı, güvenlik nedeniyle dış sunuculara (Open Food Facts) yapılan bu tür sorguları engelliyor — bu bir kod hatası değil, \"file://\" ile açılan sayfalar için standart bir tarayıcı kısıtlaması. Çözüm için: barkodu <a href=\"https://world.openfoodfacts.org/\" target=\"_blank\" rel=\"noopener\">world.openfoodfacts.org</a> adresinde doğrudan arayabilir, ya da bu HTML dosyasını bir web sunucusu üzerinden (örn. basit bir yerel sunucu veya barındırma hizmeti ile) açtığınızda bu sorgu genellikle çalışır.</div>';\n    } else {\n      host.innerHTML = '<div class=\"dp-prep\">Sorgu sırasında bir hata oluştu. İnternet bağlantınızı kontrol edin; sorun sürerse tarayıcınızın bu siteye erişimi engellemediğinden (reklam engelleyici, güvenlik duvarı vb.) emin olun.</div>';\n    }\n  }\n}\n\n\n// ================= SU / ÖĞÜN HATIRLATICI =================\nlet dpWaterInterval = null;\nlet dpMealReminders = [];\nlet dpMealCheckInterval = null;\n\nfunction dpRequestNotifyPermission(){\n  if('Notification' in window && Notification.permission === 'default'){\n    Notification.requestPermission();\n  }\n}\nfunction dpNotify(title, body){\n  if('Notification' in window && Notification.permission === 'granted'){\n    try{ new Notification(title, {body: body}); return; }catch(e){}\n  }\n  var banner = document.getElementById('reminderBanner');\n  if(banner){\n    banner.textContent = '🔔 ' + title + ' — ' + body;\n    banner.style.display = 'block';\n    setTimeout(function(){ banner.style.display='none'; }, 8000);\n  }\n}\n\nfunction dpStartWaterReminder(){\n  dpRequestNotifyPermission();\n  dpStopWaterReminder();\n  var mins = parseInt(document.getElementById('waterIntervalSelect').value, 10);\n  dpWaterInterval = setInterval(function(){\n    dpNotify('💧 Su İçme Zamanı', 'Bir bardak su içmeyi unutmayın.');\n  }, mins*60*1000);\n  var status = document.getElementById('waterReminderStatus');\n  if(status) status.textContent = 'Aktif — her '+mins+' dakikada bir hatırlatılacak (bu sekme açık kaldığı sürece).';\n}\nfunction dpStopWaterReminder(){\n  if(dpWaterInterval){ clearInterval(dpWaterInterval); dpWaterInterval=null; }\n  var status = document.getElementById('waterReminderStatus');\n  if(status) status.textContent = 'Kapalı.';\n}\n\nfunction dpAddMealReminder(){\n  var timeEl = document.getElementById('mealTimeInput');\n  var labelEl = document.getElementById('mealLabelInput');\n  var time = timeEl.value;\n  var label = labelEl.value.trim() || 'Öğün';\n  if(!time){ alert('Lütfen bir saat seçin.'); return; }\n  dpMealReminders.push({time:time, label:label, firedNow:false});\n  labelEl.value = '';\n  dpRenderMealReminders();\n}\nfunction dpDeleteMealReminder(i){ dpMealReminders.splice(i,1); dpRenderMealReminders(); }\nfunction dpRenderMealReminders(){\n  var host = document.getElementById('mealReminderList');\n  if(!host) return;\n  if(!dpMealReminders.length){ host.innerHTML = '<p style=\"font-size:13px;color:#6B6455;\">Henüz öğün hatırlatıcısı eklenmedi.</p>'; return; }\n  host.innerHTML = '<ul style=\"margin:0;padding-left:20px;font-size:13.5px;\">' + dpMealReminders.map(function(r,i){\n    return '<li>'+r.time+' — '+r.label+' <span style=\"cursor:pointer;color:#A5452F;text-decoration:underline;margin-left:8px;\" onclick=\"dpDeleteMealReminder('+i+')\">Sil</span></li>';\n  }).join('') + '</ul>';\n}\nfunction dpStartMealReminders(){\n  dpRequestNotifyPermission();\n  if(dpMealCheckInterval) clearInterval(dpMealCheckInterval);\n  dpMealCheckInterval = setInterval(function(){\n    var now = new Date();\n    var hh = String(now.getHours()).padStart(2,'0');\n    var mm = String(now.getMinutes()).padStart(2,'0');\n    var current = hh+':'+mm;\n    dpMealReminders.forEach(function(r){\n      if(r.time === current && !r.firedNow){\n        dpNotify('🍽️ Öğün Zamanı', r.label+' saati geldi.');\n        r.firedNow = true;\n      } else if(r.time !== current){\n        r.firedNow = false;\n      }\n    });\n  }, 20000);\n  var status = document.getElementById('mealReminderStatus');\n  if(status) status.textContent = 'Aktif — eklenen saatlerde hatırlatılacak (bu sekme açık kaldığı sürece).';\n}\nfunction dpStopMealReminders(){\n  if(dpMealCheckInterval){ clearInterval(dpMealCheckInterval); dpMealCheckInterval=null; }\n  var status = document.getElementById('mealReminderStatus');\n  if(status) status.textContent = 'Kapalı.';\n}\ndpRenderMealReminders();\n\n\n// ================= GÜNLÜK HEDEF / MOTİVASYON TAKİBİ =================\nlet dpGoalHistory = [];\nfunction dpSaveDailyGoal(){\n  var ids = ['goal_water','goal_menu','goal_move','goal_sleep'];\n  var checked = ids.filter(function(id){ var el=document.getElementById(id); return el && el.checked; }).length;\n  var today = new Date().toLocaleDateString('tr-TR');\n  dpGoalHistory.push({date:today, score:checked, total:ids.length});\n  ids.forEach(function(id){ var el=document.getElementById(id); if(el) el.checked=false; });\n  dpRenderGoalHistory();\n}\nfunction dpRenderGoalHistory(){\n  var host = document.getElementById('goalHistory'); if(!host) return;\n  if(!dpGoalHistory.length){ host.innerHTML='<p style=\"font-size:13px;color:#6B6455;\">Henüz kayıt yok.</p>'; return; }\n  var totalScore = dpGoalHistory.reduce(function(s,r){return s+r.score;},0);\n  var totalMax = dpGoalHistory.reduce(function(s,r){return s+r.total;},0);\n  var pct = totalMax ? Math.round(totalScore/totalMax*100) : 0;\n  host.innerHTML = '<p style=\"font-size:13.5px;margin-bottom:10px;\"><b>Genel başarı oranı: '+pct+'%</b> ('+dpGoalHistory.length+' gün kaydedildi)</p>'\n    + '<table class=\"exchange-table\"><tr><th>Tarih</th><th>Puan</th></tr>'\n    + dpGoalHistory.slice().reverse().map(function(r){ return '<tr><td>'+r.date+'</td><td>'+r.score+' / '+r.total+'</td></tr>'; }).join('')\n    + '</table>';\n}\ndpRenderGoalHistory();\n\n\n// ================= SU ALIM GÜNLÜĞÜ =================\nlet dpWaterLogTotal = 0;\nfunction dpAddWater(ml){ dpWaterLogTotal += ml; dpRenderWaterLog(); }\nfunction dpAddWaterCustom(){\n  var el = document.getElementById('waterLogCustom');\n  var v = parseFloat(el.value);\n  if(!v || v<=0){ alert('Lütfen geçerli bir miktar girin.'); return; }\n  dpWaterLogTotal += v;\n  el.value = '';\n  dpRenderWaterLog();\n}\nfunction dpResetWaterLog(){ dpWaterLogTotal = 0; dpRenderWaterLog(); }\nfunction dpRenderWaterLog(){\n  var goalEl = document.getElementById('waterLogGoal');\n  var bar = document.getElementById('waterLogBar');\n  var txt = document.getElementById('waterLogText');\n  if(!goalEl || !bar || !txt) return;\n  var goal = parseFloat(goalEl.value) || 2000;\n  var pct = Math.min(100, Math.round(dpWaterLogTotal/goal*100));\n  bar.style.width = pct+'%';\n  txt.textContent = Math.round(dpWaterLogTotal).toLocaleString('tr-TR')+' ml / '+goal.toLocaleString('tr-TR')+' ml ('+pct+'%)';\n}\ndpRenderWaterLog();\n\n\n// ================= FİZİKSEL AKTİVİTE GÜNLÜĞÜ =================\nlet dpActivityLog = [];\nconst DP_ACT_LABELS = {'3.0':'Yavaş Yürüyüş','3.5':'Orta Tempo Yürüyüş','5.0':'Tempolu Yürüyüş','7.0':'Bisiklet','8.0':'Hafif Koşu','10.0':'Koşu','4.0':'Yüzme (hafif)','6.0':'Direnç Antrenmanı'};\nfunction dpAddActivity(){\n  var met = parseFloat(document.getElementById('actLogType').value);\n  var mins = parseFloat(document.getElementById('actLogMin').value);\n  var wt = parseFloat(document.getElementById('actLogWeight').value) || 70;\n  if(!mins || mins<=0){ alert('Lütfen geçerli bir süre girin.'); return; }\n  var kcal = (met * 3.5 * wt / 200) * mins;\n  dpActivityLog.push({label: DP_ACT_LABELS[String(met)]||'Aktivite', mins:mins, kcal:kcal});\n  dpRenderActivityLog();\n}\nfunction dpDeleteActivity(i){ dpActivityLog.splice(i,1); dpRenderActivityLog(); }\nfunction dpResetActivityLog(){ dpActivityLog=[]; dpRenderActivityLog(); }\nfunction dpRenderActivityLog(){\n  var host = document.getElementById('actLogList');\n  var totalEl = document.getElementById('actLogTotal');\n  if(!host || !totalEl) return;\n  if(!dpActivityLog.length){ host.innerHTML = '<p style=\"font-size:13px;color:#6B6455;\">Henüz aktivite eklenmedi.</p>'; totalEl.textContent=''; return; }\n  host.innerHTML = '<ul style=\"margin:0;padding-left:20px;font-size:13.5px;\">' + dpActivityLog.map(function(a,i){\n    return '<li>'+a.label+' — '+a.mins+' dk (~'+Math.round(a.kcal)+' kcal) <span style=\"cursor:pointer;color:#A5452F;text-decoration:underline;margin-left:8px;\" onclick=\"dpDeleteActivity('+i+')\">Sil</span></li>';\n  }).join('') + '</ul>';\n  var totalKcal = dpActivityLog.reduce(function(s,a){return s+a.kcal;},0);\n  var totalMin = dpActivityLog.reduce(function(s,a){return s+a.mins;},0);\n  totalEl.textContent = 'Toplam: '+totalMin+' dakika, ~'+Math.round(totalKcal)+' kcal';\n}\ndpRenderActivityLog();\n\n\n// ================= MUTFAK ÖLÇÜ BİRİMİ ÇEVİRİCİ =================\nconst DP_VOLUME_ML = {su_bardagi:200, cay_bardagi:100, yemek_kasigi:15, tatli_kasigi:8, cay_kasigi:5, ml:1};\nconst DP_KITCHEN_DENSITY = {un:0.65, seker:1.0, pirinc:0.95, sivi_yag:0.90, sut_su_yogurt:1.0, bulgur:0.85};\nconst DP_KITCHEN_LABELS = {un:'Un', seker:'Toz Şeker', pirinc:'Pirinç', sivi_yag:'Sıvı Yağ', sut_su_yogurt:'Süt/Su/Yoğurt', bulgur:'Bulgur',\n  su_bardagi:'su bardağı', cay_bardagi:'çay bardağı', yemek_kasigi:'yemek kaşığı', tatli_kasigi:'tatlı kaşığı', cay_kasigi:'çay kaşığı', gram:'gram', ml:'ml'};\nfunction dpConvertKitchen(){\n  var ing = document.getElementById('kitchenIngredient').value;\n  var amount = parseFloat(document.getElementById('kitchenAmount').value);\n  var fromUnit = document.getElementById('kitchenFromUnit').value;\n  var toUnit = document.getElementById('kitchenToUnit').value;\n  if(!amount || amount<=0){ alert('Lütfen geçerli bir miktar girin.'); return; }\n  var density = DP_KITCHEN_DENSITY[ing];\n\n  var ml;\n  if(fromUnit === 'gram'){ ml = amount / density; }\n  else { ml = amount * DP_VOLUME_ML[fromUnit]; }\n\n  var result;\n  if(toUnit === 'gram'){ result = ml * density; }\n  else { result = ml / DP_VOLUME_ML[toUnit]; }\n\n  document.getElementById('kitchenResult').innerHTML =\n    '<div class=\"dp-prep\"><b>'+amount+' '+DP_KITCHEN_LABELS[fromUnit]+' '+DP_KITCHEN_LABELS[ing]+'</b> ≈ <b>'+result.toFixed(1)+' '+DP_KITCHEN_LABELS[toUnit]+'</b>'\n    + '<br><br><i>Bu değerler yaygın kullanılan pratik mutfak ölçü tablosuna dayanır; marka ve nem oranına göre küçük farklılıklar olabilir.</i></div>';\n}\n\n\n// ================= AYLIK BEBEK BESLENME REHBERİ (1-12 AY) — ÖĞÜNE GÖRE =================\nconst DP_INFANT_MONTHS = {\n  1:{allowed:'Yalnızca anne sütü veya demirle güçlendirilmiş formül mama (talebe dayalı besleme).', meals:null,\n    forbidden:'Katı gıdaların tamamı, su (hekim önermedikçe), bal, tuz, şeker, inek sütü, meyve suyu.'},\n  2:{allowed:'Yalnızca anne sütü veya demirle güçlendirilmiş formül mama.', meals:null,\n    forbidden:'Katı gıdaların tamamı, su (hekim önermedikçe), bal, tuz, şeker, inek sütü, meyve suyu.'},\n  3:{allowed:'Yalnızca anne sütü veya demirle güçlendirilmiş formül mama.', meals:null,\n    forbidden:'Katı gıdaların tamamı, su (hekim önermedikçe), bal, tuz, şeker, inek sütü, meyve suyu.'},\n  4:{allowed:'Yalnızca anne sütü veya demirle güçlendirilmiş formül mama. (Ek gıdaya başlama için genel öneri ~6. aydır; bazı bebeklerde hekim değerlendirmesiyle 4. aydan sonra erken başlanabilir, ama rutin olarak önerilmez.)', meals:null,\n    forbidden:'Katı gıdaların tamamı (hekim önermedikçe), bal, tuz, şeker, inek sütü, meyve suyu.'},\n  5:{allowed:'Yalnızca anne sütü veya demirle güçlendirilmiş formül mama. Bebek baş kontrolü, desteksiz oturma ve gıdaya ilgi gibi hazır olma belirtileri gösteriyorsa, 6. aya yaklaşırken ek gıda hazırlığı hekimle konuşulabilir.', meals:null,\n    forbidden:'Katı gıdaların tamamı (hekim önermedikçe), bal, tuz, şeker, inek sütü, meyve suyu.'},\n\n  6:{allowed:'Ek gıdaya başlama dönemi. Demirden zengin tek gıdalı pürüzsüz püreler; her yeni gıda 3-5 gün ara ile, tek tek tanıtılır.',\n    meals:{\n      kahvalti:['<b>Elma Püresi:</b> 1 elma soyulup doğranır, yumuşayana kadar haşlanır, pürüzsüz ezilir (su/anne sütü ile kıvam ayarlanabilir).',\n        '<b>Armut Püresi:</b> 1 armut soyulup doğranır, yumuşayana kadar haşlanır, pürüzsüz ezilir.',\n        '<b>Muz Ezmesi:</b> Olgun muz çatalla pürüzsüz ezilir (pişirme gerektirmez).',\n        '<b>Şeftali Püresi:</b> Olgun şeftali soyulup pürüzsüz ezilir (gerekirse hafif haşlanabilir).',\n        '<b>Kayısı Püresi:</b> Olgun kayısı soyulup çekirdeği çıkarılarak pürüzsüz ezilir.',\n        '<b>Yulaf Ezmesi Püresi:</b> Yulaf, su veya anne sütü/mama ile yumuşayana kadar pişirilip pürüzsüz ezilir.',\n        '<b>Avokado Püresi:</b> Olgun avokado çatalla pürüzsüz ezilir (pişirme gerektirmez, sağlıklı yağ kaynağıdır).',\n        '<b>Erik Püresi:</b> Erik haşlanıp kabuğu ve çekirdeği çıkarılarak pürüzsüz ezilir.'],\n      ogle:['<b>Kırmızı Et Püresi:</b> Yağsız kırmızı et iyice pişirilir, sıvı eklenerek blenderdan pürüzsüz geçirilir (demir açısından zengindir).',\n        '<b>Tavuk Püresi:</b> Tavuk göğsü haşlanır, sıvısıyla birlikte pürüzsüz ezilir.',\n        '<b>Kırmızı Mercimek Püresi:</b> Kırmızı mercimek yumuşayana kadar haşlanır, pürüzsüz ezilir.',\n        '<b>Yeşil Mercimek Püresi:</b> Yeşil mercimek yumuşayana kadar haşlanır, pürüzsüz ezilir.',\n        '<b>Nohut Püresi:</b> İyice yumuşayana kadar haşlanmış nohut, kabukları süzülerek pürüzsüz ezilir.',\n        '<b>Balkabağı Püresi:</b> Balkabağı fırında/haşlanarak yumuşatılır, pürüzsüz ezilir.',\n        '<b>Somon Püresi:</b> Buharda pişmiş somon, sıvısıyla birlikte pürüzsüz ezilir (omega-3 kaynağıdır).'],\n      aksam:['<b>Kabak Püresi:</b> Kabak soyulup haşlanır, pürüzsüz ezilir.',\n        '<b>Havuç Püresi:</b> Havuç soyulup küçük parçalar hâlinde yumuşayana kadar haşlanır, pürüzsüz ezilir.',\n        '<b>Patates Püresi:</b> Patates soyulup haşlanır, pürüzsüz ezilir (su/anne sütü ile inceltilebilir).',\n        '<b>Brokoli Püresi:</b> Brokoli çiçekleri buharda yumuşayana kadar pişirilip pürüzsüz ezilir.',\n        '<b>Karnabahar Püresi:</b> Karnabahar yumuşayana kadar haşlanır, pürüzsüz ezilir.',\n        '<b>Pazı Püresi:</b> Pazı yaprakları buharda yumuşatılıp pürüzsüz ezilir.',\n        '<b>Ispanak Püresi:</b> Ispanak yaprakları buharda yumuşatılıp pürüzsüz ezilir (az miktarda başlanır).'],\n      ara_ogun:['<b>Bezelye Püresi:</b> Bezelye yumuşayana kadar haşlanır, kabukları süzülerek pürüzsüz ezilir.',\n        '<b>Kereviz Püresi:</b> Kereviz kökü soyulup haşlanır, pürüzsüz ezilir.',\n        '<b>Taze Fasulye Püresi:</b> Taze fasulye yumuşayana kadar haşlanır, pürüzsüz ezilir.',\n        '<b>Kinoa Püresi:</b> Kinoa iyice pişirilip pürüzsüz ezilir (iyi bir tam tahıl kaynağıdır).',\n        '<b>Enginar Püresi:</b> Enginar kalbi haşlanıp pürüzsüz ezilir.',\n        '<b>Kuşkonmaz Püresi:</b> Kuşkonmaz uçları haşlanıp pürüzsüz ezilir.',\n        '<b>Şalgam Püresi:</b> Şalgam soyulup haşlanır, pürüzsüz ezilir.']\n    },\n    forbidden:'Bal, inek sütü (ana içecek olarak), tuz, şeker, bütün/sert gıdalar (boğulma riski), pastörize edilmemiş süt ürünleri, aşırı meyve suyu.'},\n\n  7:{allowed:'2-3 gıda karışımı püreler; iyi pişmiş tam yumurta; baklagil püreleri; sade, şekersiz yoğurt tanıtılabilir; et/tavuk/balık püresi (düşük cıvalı balık).',\n    meals:{\n      kahvalti:['<b>Elma-Armut Karışık Püre:</b> Elma ve armut birlikte haşlanıp pürüzsüz ezilir.',\n        '<b>Yoğurtlu Muz Ezmesi:</b> Sade, şekersiz yoğurt ile ezilmiş muz karıştırılır.',\n        '<b>Muzlu Yulaf Püresi:</b> Pişmiş yulaf ezmesi, ezilmiş muzla karıştırılır.',\n        '<b>Şeftalili Yulaf Püresi:</b> Pişmiş yulaf ezmesi, haşlanmış şeftali püresiyle karıştırılır.',\n        '<b>Kayısılı Yoğurt Püresi:</b> Haşlanmış kayısı püresi sade yoğurtla karıştırılır.',\n        '<b>Avokado-Muz Ezmesi:</b> Avokado ve muz birlikte çatalla pürüzsüz ezilir.',\n        '<b>Avokado-Armut Ezmesi:</b> Avokado ve haşlanmış armut birlikte pürüzsüz ezilir.'],\n      ogle:['<b>Tavuk-Patates Püresi:</b> Haşlanmış tavuk ve patates birlikte pürüzsüz ezilir.',\n        '<b>Tavuklu Bezelye Püresi:</b> Haşlanmış tavuk ve bezelye birlikte pürüzsüz ezilir.',\n        '<b>Nohutlu Havuç Püresi:</b> Haşlanmış nohut ve havuç birlikte pürüzsüz ezilir.',\n        '<b>Balık Püresi:</b> Kılçıksız, düşük cıvalı balık (örn. levrek/çipura) buharda pişirilip pürüzsüz ezilir.',\n        '<b>Mercimek-Havuç Püresi:</b> Kırmızı mercimek ve havuç birlikte haşlanıp pürüzsüz ezilir.',\n        '<b>Somonlu Patates Püresi:</b> Buharda pişmiş somon ve patates birlikte pürüzsüz ezilir.',\n        '<b>Etli Balkabağı Püresi:</b> Haşlanmış kırmızı et ve balkabağı birlikte pürüzsüz ezilir.'],\n      aksam:['<b>Karnabahar-Patates Püresi:</b> Karnabahar ve patates birlikte haşlanıp pürüzsüz ezilir.',\n        '<b>Balkabağı-Havuç Püresi:</b> Balkabağı ve havuç birlikte haşlanıp pürüzsüz ezilir.',\n        '<b>Pazı-Patates Püresi:</b> Pazı ve patates birlikte haşlanıp pürüzsüz ezilir.',\n        '<b>Kinoalı Sebze Püresi:</b> İyi pişmiş kinoa, haşlanmış sebzelerle birlikte pürüzsüz ezilir.',\n        '<b>Balık-Havuç Püresi:</b> Buharda pişmiş balık ve havuç birlikte pürüzsüz ezilir.',\n        '<b>Ispanaklı Patates Püresi:</b> Ispanak ve patates birlikte haşlanıp pürüzsüz ezilir.',\n        '<b>Şalgamlı Havuç Püresi:</b> Şalgam ve havuç birlikte haşlanıp pürüzsüz ezilir.'],\n      ara_ogun:['<b>Haşlanmış Yumurta Ezmesi:</b> Tam yumurta iyice haşlanır, çatalla ezilir, gerekirse anne sütü/su ile inceltilir.',\n        '<b>Bezelye-Patates Püresi:</b> Bezelye ve patates birlikte haşlanıp pürüzsüz ezilir.',\n        '<b>Mercimek-Elma Püresi:</b> Kırmızı mercimek ve elma birlikte haşlanıp pürüzsüz ezilir (demir + C vitamini).',\n        '<b>Nohut-Elma Püresi:</b> Haşlanmış nohut ve elma birlikte pürüzsüz ezilir.',\n        '<b>Erikli Yulaf Püresi:</b> Pişmiş yulaf ezmesi, haşlanmış erik  '<b>Ballı Meyveli Yulaf:</b> Pişmiş yulaf ezmesi, doğranmış meyve ve az miktarda balla karıştırılır (12 aydan itibaren).'],\n      ara_ogun:['<b>Ev Yapımı Mini Köfte-Ekmek:</b> Tuzsuz mini köfte, yumuşak tam tahıllı ekmek parçasıyla birlikte sunulur.',\n        '<b>Ballı Meyve Dilimleri:</b> Yumuşak meyve dilimleri üzerine ince bir tabaka bal gezdirilir (12 aydan itibaren).',\n        '<b>Avokado Ezmeli Kraker:</b> Tuzsuz tam tahıllı kraker üzerine ezilmiş avokado sürülür.',\n        '<b>Meyveli Chia Puddingi:</b> Chia tohumu inek sütüyle karıştırılıp bekletilir, doğranmış meyveyle sunulur.',\n        '<b>Avokado-Domates Salatası:</b> Küçük doğranmış avokado ve domates hafifçe karıştırılır.',\n        '<b>Peynirli Şalgam Küpleri:</b> Haşlanmış şalgam ve az tuzlu peynir küçük küpler hâlinde kesilip birlikte sunulur.',\n        '<b>Ballı Fıstık Ezmesi ve Ekmek:</b> Tam tahıllı ekmek üzerine fıstık ezmesi ve az miktarda bal sürülür (12 aydan itibaren).']\n    },\n    forbidden:'Eklenmiş tuz/şeker hâlâ sınırlı tutulmalıdır; bütün fındık/kuruyemiş, bütün üzüm, patlamış mısır, sert şekerleme gibi boğulma riski taşıyan gıdalardan yaklaşık 3-4 yaşına kadar kaçınılması önerilir.'}\n};\n\nconst DP_MEAL_LABELS = {kahvalti:'Kahvaltı', ogle:'Öğle Yemeği', aksam:'Akşam Yemeği', ara_ogun:'Ara Öğün'};\nconst DP_INFANT_DAYS = ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];\n\nfunction dpCleanRecipeText(raw){\n  var start = raw.indexOf('<b>');\n  var end = raw.indexOf('</b>');\n  if(start === -1 || end === -1) return raw;\n  return raw.slice(start+3, end);\n}\nfunction dpRenderInfantWeek(){\n  var sel = document.getElementById('infantMonthSelect');\n  var month = sel ? sel.value : '1';\n  var data = DP_INFANT_MONTHS[month];\n  var host = document.getElementById('infantWeekBox');\n  if(!data || !host) return;\n\n  if(!data.meals){\n    host.innerHTML = '<p style=\"font-size:13px;color:#6B6455;\">Bu ay için haftalık menü oluşturulmaz — bebek henüz ek gıdaya başl
