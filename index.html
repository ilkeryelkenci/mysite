<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diyetisyen İlker Menü Programı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16233A; --lime:#9BC53D; --paper:#F3F5F7; --ink:#1B2430; --line:#D7DEE6;
  }
  *{box-sizing:border-box;}
  html, body{height:100%;margin:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    overscroll-behavior:none; -webkit-text-size-adjust:100%;}
  header.top{
    background:var(--navy); color:#F3F5F7; padding:20px 24px 0;
    flex:0 0 auto; position:relative; z-index:50;
  }
  .top-inner{max-width:1200px;margin:0 auto;}
  .brand-row{display:flex;align-items:center;gap:12px;}
  .brand-logo{flex-shrink:0;}
  .tagline{font-family:'Fraunces',serif;font-size:11.5px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--lime);margin:-8px 0 14px;opacity:.85;}
  .eyebrow{font-family:'Source Code Pro',monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);margin:0 0 6px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(20px,3vw,30px);margin:0 0 16px;letter-spacing:-.01em;}
  nav.tabs{display:flex;gap:6px;max-width:1200px;margin:0 auto;}
  nav.tabs button{
    flex:1; max-width:260px; padding:14px 12px; border:none; border-radius:6px 6px 0 0;
    background:rgba(255,255,255,.06); color:#C9D6E4; font-weight:700; font-size:14px;
    cursor:pointer; transition:.15s; min-height:44px;
  }
  nav.tabs button.active{background:var(--paper); color:var(--navy);}
  nav.tabs button:not(.active):hover{background:rgba(255,255,255,.12);}

  .frame-wrap{max-width:1200px;margin:0 auto; width:100%;
    flex:1 1 auto; min-height:0; display:flex;}
  iframe{width:100%; height:100%; border:none; display:none; background:var(--paper); flex:1 1 auto; min-height:0;}
  iframe.active{display:block;}

  /* Yazdırma alanı: çerçeve içeriği buraya kopyalanır ki tam sayfa yazdırılabilsin */
  #printArea{display:none;}
  body.printing{display:block !important; height:auto !important; overflow:visible !important;}
  body.printing header.top{display:none !important;}
  body.printing .frame-wrap{display:none !important;}
  body.printing #printArea{display:block !important;}
  @media print{
    html, body{height:auto !important; overflow:visible !important;}
    body{display:block !important;}
    header.top{display:none !important;}
    .frame-wrap{display:none !important;}
    #printArea{display:block !important;}
  }

  @media (max-width:700px){
    header.top{padding:16px 16px 0;}
    nav.tabs button{font-size:12.5px;padding:12px 8px;}
    h1{font-size:19px;margin-bottom:12px;}
  }

  /* iPhone çentik/kenar güvenli alanları */
  @supports (padding: max(0px)){
    header.top{padding-left:max(24px, env(safe-area-inset-left)); padding-right:max(24px, env(safe-area-inset-right));}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand-row">
      <svg viewBox="0 0 200 200" width="38" height="38" class="brand-logo">
        <circle cx="100" cy="100" r="96" fill="#F3EDE1"/>
        <circle cx="100" cy="100" r="90" fill="#FBF8F2" stroke="#6B7A4F" stroke-width="3"/>
        <line x1="100" y1="100" x2="100" y2="14" stroke="#D9CFB8" stroke-width="2"/>
        <line x1="100" y1="100" x2="174" y2="143" stroke="#D9CFB8" stroke-width="2"/>
        <line x1="100" y1="100" x2="26" y2="143" stroke="#D9CFB8" stroke-width="2"/>
        <g transform="translate(48,50) scale(0.85)" stroke="#6B7A4F" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M0,10 C-6,4 -6,-4 0,-8 C4,-12 12,-12 16,-8 C22,-12 30,-8 28,0 C34,2 34,10 28,12 C24,16 14,16 12,10 C8,14 2,14 0,10 Z"/>
          <line x1="14" y1="12" x2="14" y2="24"/>
        </g>
        <g transform="translate(40,80) scale(0.85)" stroke="#8A5A3C" stroke-width="2" fill="none" stroke-linecap="round">
          <circle cx="0" cy="0" r="9"/>
          <path d="M-3,-8 C-2,-13 3,-13 4,-9" stroke="#6B7A4F"/>
        </g>
        <g transform="translate(142,52) scale(0.92)" fill="#B8892F">
          <ellipse cx="0" cy="0" rx="4" ry="7"/>
          <ellipse cx="-8" cy="7" rx="4" ry="7" transform="rotate(-25 -8 7)"/>
          <ellipse cx="8" cy="7" rx="4" ry="7" transform="rotate(25 8 7)"/>
          <ellipse cx="-13" cy="18" rx="4" ry="7" transform="rotate(-30 -13 18)"/>
          <ellipse cx="13" cy="18" rx="4" ry="7" transform="rotate(30 13 18)"/>
          <line x1="0" y1="20" x2="4" y2="36" stroke="#B8892F" stroke-width="2.4"/>
        </g>
        <g transform="translate(154,84)" stroke="#6B7A4F" stroke-width="2" fill="none" stroke-linecap="round">
          <path d="M0,0 C4,-6 10,-6 12,0 C10,6 4,6 0,0 Z"/>
          <line x1="0" y1="0" x2="-10" y2="8"/>
        </g>
        <g transform="translate(100,164)" stroke="#6B7A4F" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M-19,0 C-12,-7 8,-7 14,0 C8,7 -12,7 -19,0 Z"/>
          <path d="M14,0 L23,-5.5 L23,5.5 Z"/>
          <circle cx="-12" cy="-2" r="1.1" fill="#6B7A4F"/>
        </g>
        <g transform="translate(64,166) scale(0.9)" stroke="#8A5A3C" stroke-width="2" fill="none" stroke-linecap="round">
          <path d="M-6,2 C-8,-4 -2,-7 2,-4 C6,-7 10,-2 6,3 Z"/>
          <line x1="0" y1="3" x2="0" y2="9"/>
        </g>
        <text x="100" y="112" text-anchor="middle" font-family="Georgia,serif" font-weight="700" fill="#3F4A2E" font-size="46">İK</text>
      </svg>
      <div>
        <p class="eyebrow">Diyetisyen İlker Yelkencioğlu</p>
        <h1>Menü Programı</h1>
        <p class="tagline">Beslenmenin Yeni Dili</p>
      </div>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="active" data-target="frameAdult">Yetişkin</button>
    <button data-target="frameKid">Bebek &amp; Çocuk</button>
    <button data-target="frameSport">Sporcu</button>
  </nav>
</header>

<div class="frame-wrap">
  <iframe id="frameAdult" class="active" allow="camera"></iframe>
  <iframe id="frameKid" allow="camera"></iframe>
  <iframe id="frameSport" allow="camera"></iframe>
</div>

<div id="printArea"></div>

<script>
  document.getElementById('frameAdult').srcdoc = "<!DOCTYPE html>\n<html lang=\"tr\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Diyetisyen İlker Menü Programı — Yetişkin</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@500&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --teal-deep:#1E3F3A;\n    --teal-mid:#2F6259;\n    --sage:#9DB8A9;\n    --paper:#F6F2E9;\n    --paper-2:#EFE8D8;\n    --ink:#22281F;\n    --amber:#C08A2E;\n    --amber-soft:#EADFC3;\n    --line:#D8CFB6;\n    --white:#FFFDF8;\n    --red:#A5452F;\n  }\n  *{box-sizing:border-box;}\n  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.5;}\n  .wrap{max-width:1080px;margin:0 auto;padding:0 24px 80px;}\n\n  header.hero{background:var(--teal-deep);color:var(--paper);padding:56px 24px 64px;position:relative;overflow:hidden;}\n  header.hero::after{content:\"\";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;border:1px solid rgba(246,242,233,.18);}\n  header.hero::before{content:\"\";position:absolute;right:20px;top:40px;width:140px;height:140px;border-radius:50%;border:1px solid rgba(246,242,233,.14);}\n  .hero-inner{max-width:1080px;margin:0 auto;position:relative;z-index:2;}\n  .eyebrow{font-family:'Source Code Pro',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);margin:0 0 14px;}\n  h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(30px,4.2vw,46px);margin:0 0 12px;letter-spacing:-.01em;}\n  .hero p{max-width:600px;color:#D9E4DC;font-size:16px;margin:0;}\n\n  .card{background:var(--white);border:1px solid var(--line);border-radius:4px;padding:32px;margin-top:-32px;position:relative;z-index:3;box-shadow:0 12px 30px -18px rgba(30,63,58,.35);}\n  .card + .card{margin-top:24px;}\n\n  .section-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--teal-deep);margin:0 0 4px;}\n  .section-sub{font-size:13px;color:#6B6455;margin:0 0 24px;}\n\n  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;}\n  label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--teal-mid);margin-bottom:6px;}\n  input[type=number], select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;font-size:16px;transition:border-color .15s;}\n  input[type=number]:focus, select:focus{outline:none;border-color:var(--teal-mid);background:var(--white);}\n\n  .toggle-row{display:flex;gap:8px;flex-wrap:wrap;}\n  .toggle{flex:1;min-width:80px;text-align:center;padding:10px 8px;border:1px solid var(--line);border-radius:3px;background:var(--paper);cursor:pointer;font-size:14px;font-weight:600;color:var(--teal-deep);user-select:none;}\n  .toggle.active{background:var(--teal-deep);border-color:var(--teal-deep);color:var(--white);}\n\n  .btn-primary{margin-top:28px;width:100%;background:var(--amber);color:var(--teal-deep);border:none;border-radius:3px;padding:15px;font-size:15px;font-weight:700;font-family:'Inter',sans-serif;letter-spacing:.02em;cursor:pointer;transition:filter .15s;}\n  .btn-primary:hover{filter:brightness(1.06);}\n\n  .results{margin-top:28px;display:none;border-top:1px dashed var(--line);padding-top:28px;}\n  .results.show{display:block;}\n  .result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px;}\n  .result-box{background:var(--paper-2);border-radius:3px;padding:16px 14px;border-left:3px solid var(--teal-mid);}\n  .result-box .num{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--teal-deep);}\n  .result-box .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#6B6455;margin-top:2px;}\n  .result-box.accent{border-left-color:var(--amber);background:var(--amber-soft);}\n\n  .bmi-scale{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:6px 0 6px;}\n  .bmi-scale span{flex:1;}\n  .bmi-scale .z1{background:#B7CDBD;} .bmi-scale .z2{background:var(--teal-mid);} .bmi-scale .z3{background:var(--amber);} .bmi-scale .z4{background:#B4472F;}\n  .bmi-marker-row{position:relative;height:16px;margin-bottom:18px;}\n  .bmi-marker{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);}\n\n  .dislike-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:26px;}\n  .dislike-chip{border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:13.5px;cursor:pointer;text-align:center;background:var(--paper);user-select:none;transition:.15s;}\n  .dislike-chip.active{background:var(--red);border-color:var(--red);color:var(--white);}\n\n  .menu-select-row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px;}\n  .menu-select-row .field{flex:1;min-width:220px;}\n\n  .meal-target-note{font-size:12.5px;color:#6B6455;margin:14px 0 18px;}\n\n  .day-menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;}\n  .meal{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:16px 16px 14px;}\n  .meal-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}\n  .meal h4{font-family:'Source Code Pro',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin:0;}\n  .meal .kcal-target{font-size:11px;color:#6B6455;font-weight:600;}\n  .meal ul{margin:0;padding-left:18px;font-size:14px;}\n  .meal li{margin-bottom:7px;}\n  .meal li .kc{color:#8A8371;font-size:12px;}\n  .meal li.swapped{color:var(--teal-deep);}\n  .meal li.swapped .swap-tag{font-size:10.5px;background:var(--amber-soft);color:#5B4A25;padding:1px 6px;border-radius:8px;margin-left:6px;}\n  .meal-sum{margin-top:10px;font-size:12px;color:#6B6455;border-top:1px dashed var(--line);padding-top:8px;}\n\n  .caution-box{margin-top:20px;padding:14px 16px;background:#FBF3E7;border:1px solid var(--amber-soft);border-left:3px solid var(--amber);border-radius:3px;font-size:13.5px;color:#5B4A25;}\n  .caution-box b{color:var(--teal-deep);}\n\n  .exchange-intro{font-size:13.5px;color:#4A4638;margin-bottom:18px;}\n  .exchange-group{margin-bottom:22px;}\n  .exchange-group h4{font-family:'Fraunces',serif;font-size:16px;color:var(--teal-deep);margin:0 0 10px;border-left:3px solid var(--amber);padding-left:10px;}\n  table.exchange-table{width:100%;border-collapse:collapse;font-size:13.5px;}\n  table.exchange-table th{text-align:left;background:var(--teal-deep);color:var(--white);padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;}\n  table.exchange-table td{padding:8px 10px;border-bottom:1px solid var(--line);}\n  table.exchange-table tr:nth-child(even) td{background:var(--paper-2);}\n\n  .disclaimer{margin-top:40px;font-size:12.5px;color:#7A7364;line-height:1.6;border-top:1px solid var(--line);padding-top:18px;}\n\n  @media (max-width:600px){header.hero{padding:40px 18px 56px;} .card{padding:22px;}}\n\n  /* Danışan bilgi çubuğu (yazdırma öncesi ad/tarih girişi) */\n  .patient-bar{display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap; margin-top:24px; padding-top:18px; border-top:1px solid rgba(246,242,233,.2);}\n  .patient-bar label{color:var(--sage); font-size:11px; margin-bottom:4px;}\n  .patient-bar input{background:rgba(255,255,255,.08); border:1px solid rgba(246,242,233,.3); color:var(--paper); border-radius:3px; padding:8px 10px; font-size:14px;}\n  .patient-bar input::placeholder{color:rgba(246,242,233,.5);}\n  .print-btn{background:var(--amber); color:var(--teal-deep); border:none; border-radius:3px; padding:10px 18px; font-weight:700; cursor:pointer; font-size:14px;}\n  .print-only-header{display:none;}\n\n  /* YAZDIRMA GÖRÜNÜMÜ */\n  @media print{\n    body{background:#fff;}\n    header.hero{background:#fff !important; box-shadow:none; padding:0 0 14px;}\n    header.hero::before, header.hero::after{display:none;}\n    header.hero, header.hero *{color:#000 !important;}\n    .eyebrow{color:#444 !important;}\n    .no-print{display:none !important;}\n    button{display:none !important;}\n    .print-only-header{display:block !important; margin-top:10px; font-size:13px; border-top:1px solid #999; padding-top:8px;}\n    .card{box-shadow:none; border:1px solid #bbb; margin-top:14px; page-break-inside:avoid;}\n    input[type=number], select{\n      border:none !important; background:transparent !important; padding:2px 0 !important;\n      -webkit-appearance:none; appearance:none; font-weight:600; color:#000 !important;\n    }\n    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }\n  }\n\n  :root{--dp-line:#D8CFB6;--dp-head:#1E3F3A;--dp-acc:#C08A2E;--dp-soft:#EFE8D8;}\n\n  /* --- Detaylı 7 günlük program --- */\n  .day-block{border:1px solid var(--dp-line,#D8CFB6);border-radius:4px;padding:20px;margin-bottom:22px;background:#fff;}\n  .day-block h3{font-family:'Fraunces',serif;font-size:20px;margin:0 0 4px;color:var(--dp-head,#1E3F3A);position:relative;padding-left:14px;}\n  .day-block h3::before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:5px;border-radius:3px;background:linear-gradient(180deg,#C08A2E,#1E3F3A);}\n  .day-sum{font-size:12.5px;color:#6B6455;margin:0 0 16px;padding-bottom:12px;border-bottom:1px dashed var(--dp-line,#D8CFB6);}\n  .day-sum b{color:var(--dp-head,#1E3F3A);}\n  .dp-meal{margin-bottom:18px;border-left:3px solid var(--meal-color,#C08A2E);padding-left:14px;border-radius:0 4px 4px 0;}\n  .dp-meal[data-meal-type=\"breakfast\"]{--meal-color:#C08A2E;}\n  .dp-meal[data-meal-type=\"main\"]{--meal-color:#1E3F3A;}\n  .dp-meal[data-meal-type=\"snack\"]{--meal-color:#A9713F;}\n  .dp-meal[data-meal-type=\"workout\"]{--meal-color:#2D6E8F;}\n  .dp-meal[data-meal-type=\"bedtime\"]{--meal-color:#6B5B95;}\n  .dp-meal[data-meal-type=\"other\"]{--meal-color:#6B6455;}\n  .dp-meal .meal-head-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px;}\n  .dp-meal .kcal-target{font-size:11px;color:#6B6455;font-weight:600;white-space:nowrap;}\n  .dp-meal h5{font-family:'Source Code Pro',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--meal-color,#C08A2E);margin:0;}\n  .dp-meal .mname{font-weight:700;font-size:15px;margin-bottom:8px;color:var(--dp-head,#1E3F3A);}\n  .macro-bar{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:2px 0 10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);}\n  .macro-seg{height:100%;}\n  .macro-seg.macro-p{background:#A9713F;}\n  .macro-seg.macro-c{background:#C08A2E;}\n  .macro-seg.macro-f{background:#2D6E8F;}\n  .macro-legend{font-size:10.5px;color:#6B6455;margin:0 0 14px;display:flex;gap:14px;flex-wrap:wrap;}\n  .dp-tips-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;padding:16px;background:var(--dp-soft,#EFE8D8);border-radius:6px;}\n  .dp-tip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--dp-line,#D8CFB6);border-radius:20px;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--dp-head,#1E3F3A);flex:1;min-width:150px;}\n  .dp-tip-icon{font-size:18px;}\n  .macro-legend span{display:inline-flex;align-items:center;gap:4px;}\n  .macro-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;}\n  table.dp-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px;}\n  table.dp-tbl th{text-align:left;background:var(--dp-head,#1E3F3A);color:#fff;padding:6px 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;}\n  table.dp-tbl td{padding:6px 8px;border-bottom:1px solid var(--dp-line,#D8CFB6);}\n  table.dp-tbl td.num,table.dp-tbl th.num{text-align:right;white-space:nowrap;}\n  table.dp-tbl tr.tot td{font-weight:700;background:var(--dp-soft,#EFE8D8);border-bottom:none;}\n  .dp-prep{font-size:12.5px;color:#4A4638;background:var(--dp-soft,#EFE8D8);border-left:3px solid var(--dp-acc,#C08A2E);padding:8px 12px;border-radius:0 3px 3px 0;}\n  .dp-prep b{color:var(--dp-head,#1E3F3A);}\n  @media print{\n    .day-block{page-break-before:always;page-break-inside:avoid;border:none;padding:0;}\n    .day-block:first-of-type{page-break-before:auto;}\n    .dp-meal{border-left-width:3px !important;}\n    .macro-bar{-webkit-print-color-adjust:exact;print-color-adjust:exact;}\n  }\n\n\n  /* --- Laboratuvar değerlendirme --- */\n  .lab-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11.5px;font-weight:700;}\n  .lab-ok{background:#DCEEE3;color:#1E3F3A;}\n  .lab-low{background:#FDE9D2;color:#7A4A12;}\n  .lab-high{background:#F8D7D2;color:#8C2E1F;}\n  .lab-critical{background:#F8D7D2;border:1px solid #E0796A;color:#7A2013;padding:14px 16px;border-radius:4px;margin-bottom:16px;font-size:13.5px;}\n  .lab-link{color:#C08A2E;cursor:pointer;text-decoration:underline;font-size:12px;white-space:nowrap;}\n\n  /* --- Tarifler --- */\n  .recipe-group-title{font-family:'Fraunces',serif;font-size:17px;margin:22px 0 12px;border-bottom:1px solid var(--dp-line,#D8CFB6);padding-bottom:6px;color:var(--dp-head,#1E3F3A);}\n  .recipe-group-title:first-child{margin-top:0;}\n  .recipe-card{border:1px solid var(--dp-line,#D8CFB6);border-radius:4px;padding:14px 16px;margin-bottom:12px;background:#fff;page-break-inside:avoid;break-inside:avoid;}\n  .recipe-name{font-weight:700;font-size:14.5px;margin-bottom:3px;}\n  .recipe-macro{font-size:11.5px;color:#6B6455;margin-bottom:8px;}\n  .recipe-ingr{margin:0 0 8px;padding-left:18px;font-size:13px;}\n  .recipe-ingr li{margin-bottom:3px;}\n  .diet-badge{display:inline-block;font-size:11px;font-weight:600;background:var(--dp-soft,#EFE8D8);color:var(--dp-head,#1E3F3A);border-radius:12px;padding:2px 10px;margin-right:6px;}\n\n\n  /* ===== Telefon/Bilgisayar Kullanılabilirlik İyileştirmeleri ===== */\n  @media (max-width: 720px){\n    /* Geniş tabloları sayfayı yatay kaydırmaya zorlamak yerine\n       kendi içinde yatay kaydırılabilir yap */\n    table.exchange-table, table.dp-tbl, table.supp-table{\n      display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; white-space:nowrap;\n      max-width:100%;\n    }\n    table.exchange-table th, table.exchange-table td,\n    table.dp-tbl th, table.dp-tbl td,\n    table.supp-table th, table.supp-table td{ white-space:nowrap; }\n\n    /* Dokunmatik hedefleri büyüt */\n    .toggle{ padding:12px 8px; }\n    .dislike-chip, .tag-btn{ padding:10px 15px; }\n    .btn-primary{ padding:16px; }\n  }\n\n  /* iOS Safari'de odaklanınca otomatik yakınlaştırmayı önlemek için\n     tüm form elemanları en az 16px olmalı */\n  input[type=number], input[type=text], select{ font-size:16px; }\n\n\n  /* --- Danışan Listesi / Takip Grafikleri --- */\n  .file-btn{display:inline-block;text-align:center;cursor:pointer;}\n  .file-btn input[type=file]{display:none;}\n  #trackCanvas{width:100%;height:260px;display:block;}\n\n\n  /* --- Hastane Tarama Araçları --- */\n  .screen-field{margin-bottom:16px;}\n  .screen-field > label.q{display:block;font-size:13.5px;font-weight:600;color:var(--dp-head,#1E3F3A);margin-bottom:6px;}\n  .screen-check{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;margin-bottom:8px;cursor:pointer;}\n  .screen-check input{margin-top:3px;}\n  .screen-result{margin-top:18px;}\n  .risk-flag{font-weight:700;}\n  .risk-flag.risk-yes{color:#A5452F;}\n  .risk-flag.risk-no{color:#1E3F3A;}\n\n\n  /* --- Barkod / Hatırlatıcı --- */\n  #scannerReader video{border-radius:4px;}\n  #reminderBanner{transition:opacity .3s;}\n\n\n  /* --- Diyetisyen İlker marka etiketi + renklendirme --- */\n  .dp-brand-tag{display:inline-flex;align-items:center;font-family:'Source Code Pro',monospace;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:6px 16px 6px 8px;border-radius:22px;margin-bottom:14px;box-shadow:0 2px 5px rgba(0,0,0,.12);}\n  .dp-masthead{display:flex;align-items:center;justify-content:center;gap:14px;padding:22px 0 26px;}\n  .dp-masthead-name{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:#1E3F3A;}\n  .dp-masthead-sub{font-family:'Source Code Pro',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8A8062;margin-top:2px;}\n  .dp-masthead-tag{font-family:'Fraunces',serif;font-size:12.5px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:#8A8062;margin-top:7px;}\n  @media print{\n    .dp-brand-tag{-webkit-print-color-adjust:exact;print-color-adjust:exact;}\n    .card{background:#fff !important;}\n  }\n\n<\/style>\n</head>\n<body>\n\n<header class=\"hero\">\n  <div class=\"hero-inner\">\n    <p class=\"eyebrow\">Diyetisyen İlker</p>\n    <h1>Kişiye Özel Beslenme<br>Hesaplama Programı</h1>\n    <p>Yaş, cinsiyet, boy ve kilo bilgilerine göre BKİ ve günlük kalori ihtiyacını hesaplayın; sevilmeyen besinleri hariç tutup hastalığa özel öğün öğün menüyü kalorileriyle görüntüleyin, gerektiğinde değişim listelerinden alternatif seçin.</p>\n    <div class=\"patient-bar no-print\">\n      <div><label>Danışan Adı Soyadı</label><input type=\"text\" id=\"patientName\" placeholder=\"Ad Soyad\"></div>\n      <div><label>Tarih</label><input type=\"text\" id=\"patientDate\" placeholder=\"gg.aa.yyyy\"></div>\n      <button class=\"print-btn\" onclick=\"printReport()\">🖨️ Yazdır</button>\n      <button class=\"print-btn\" style=\"background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;\" onclick=\"downloadReport()\">⬇️ Raporu İndir (HTML)</button>\n    </div>\n    <div class=\"print-only-header\" id=\"printHeader\"></div>\n  </div>\n</header>\n\n<div class=\"wrap\">\n\n  <!-- INPUT CARD -->\n  <div class=\"card\">\n    <p class=\"section-title\">1 · Danışan Bilgileri</p>\n    <p class=\"section-sub\">Tüm alanlar hesaplamayı kişiselleştirmek için kullanılır.</p>\n\n    <div class=\"grid\">\n      <div>\n        <label>Cinsiyet</label>\n        <div class=\"toggle-row\" id=\"genderToggle\">\n          <div class=\"toggle active\" data-val=\"female\">Kadın</div>\n          <div class=\"toggle\" data-val=\"male\">Erkek</div>\n        </div>\n      </div>\n      <div><label for=\"age\">Yaş</label><input type=\"number\" id=\"age\" value=\"45\" min=\"18\" max=\"100\"></div>\n      <div><label for=\"height\">Boy (cm)</label><input type=\"number\" id=\"height\" value=\"165\" min=\"120\" max=\"220\"></div>\n      <div><label for=\"weight\">Kilo (kg)</label><input type=\"number\" id=\"weight\" value=\"72\" min=\"30\" max=\"250\"></div>\n      <div>\n        <label for=\"activity\">Aktivite Düzeyi</label>\n        <select id=\"activity\">\n          <option value=\"1.2\">Sedanter (hareketsiz)</option>\n          <option value=\"1.375\" selected>Hafif aktif (haftada 1-3 gün)</option>\n          <option value=\"1.55\">Orta aktif (haftada 3-5 gün)</option>\n          <option value=\"1.725\">Çok aktif (haftada 6-7 gün)</option>\n          <option value=\"1.9\">Üst düzey aktif / fiziksel iş</option>\n        </select>\n      </div>\n      <div>\n        <label for=\"goal\">Hedef</label>\n        <select id=\"goal\">\n          <option value=\"-500\">Kilo Verme</option>\n          <option value=\"0\" selected>Kiloyu Koruma</option>\n          <option value=\"300\">Kilo Alma</option>\n        </select>\n      </div>\n    </div>\n\n    <button class=\"btn-primary\" onclick=\"calculate()\">BKİ ve Kalori İhtiyacını Hesapla</button>\n\n    <div class=\"results\" id=\"results\">\n      <div class=\"result-grid\">\n        <div class=\"result-box accent\"><div class=\"num\" id=\"bmiVal\">--</div><div class=\"lbl\">BKİ (kg/m²)</div></div>\n        <div class=\"result-box\"><div class=\"num\" id=\"bmrVal\">--</div><div class=\"lbl\">Bazal Metabolizma (kcal)</div></div>\n        <div class=\"result-box\"><div class=\"num\" id=\"tdeeVal\">--</div><div class=\"lbl\">Günlük Harcama - TDEE (kcal)</div></div>\n        <div class=\"result-box accent\"><div class=\"num\" id=\"targetVal\">--</div><div class=\"lbl\">Hedef Günlük Alım (kcal)</div></div>\n      </div>\n      <label style=\"margin-bottom:2px;\">BKİ Skalası</label>\n      <div class=\"bmi-scale\">\n        <span class=\"z1\" style=\"flex:1.85\"></span><span class=\"z2\" style=\"flex:2.5\"></span><span class=\"z3\" style=\"flex:1.5\"></span><span class=\"z4\" style=\"flex:1.5\"></span>\n      </div>\n      <div class=\"bmi-marker-row\" id=\"bmiMarkerRow\"></div>\n      <p id=\"bmiCategoryText\" style=\"font-size:14px;margin-top:-6px;\"></p>\n    </div>\n  </div>\n\n  <!-- MENU CARD -->\n  <div class=\"card\">\n    <p class=\"section-title\">2 · Hastalığa Özel, Kişiselleştirilmiş Gün Menüsü</p>\n    <p class=\"section-sub\">Sevilmeyen besinleri işaretleyin — menü aynı besin grubundan otomatik alternatifle güncellenir. Öğün başına hedef kalori, hesaplanan günlük alıma göre dağıtılır.</p>\n\n    <label>Sevilmeyen / Tüketilmek İstenmeyen Besinler</label>\n    <div class=\"dislike-grid\" id=\"dislikeGrid\"></div>\n    <div style=\"margin:-8px 0 20px;\">\n      <div class=\"dislike-chip\" id=\"vejeToggle\" style=\"display:inline-block;\" onclick=\"toggleVeje(this)\">🌱 Vejetaryen Modu (et/tavuk/balık hariç tut)</div>\n    </div>\n\n    <div class=\"menu-select-row\">\n      <div class=\"field\">\n        <label for=\"condition\">Hastalık / Durum</label>\n        <select id=\"condition\" onchange=\"renderMenu(); renderWeek(); if(typeof dpRenderPlan==='function') dpRenderPlan(); if(typeof dpWeeklyShoppingList==='function') dpWeeklyShoppingList();\">\n          <option value=\"diabetes2\">Tip 2 Diyabet</option>\n          <option value=\"hypertension\">Hipertansiyon</option>\n          <option value=\"obesity\">Obezite / Kilo Yönetimi</option>\n          <option value=\"dyslipidemia\">Dislipidemi (Yüksek Kolesterol)</option>\n          <option value=\"celiac\">Çölyak / Glutensiz</option>\n          <option value=\"lactose\">Laktoz İntoleransı</option>\n          <option value=\"ibs\">İrritabl Bağırsak Sendromu (Düşük FODMAP)</option>\n          <option value=\"ckd\">Kronik Böbrek Hastalığı (erken evre)</option>\n          <option value=\"gout\">Gut / Yüksek Ürik Asit</option>\n          <option value=\"pcos\">PCOS / İnsülin Direnci</option>\n          <option value=\"hypothyroid\">Hipotiroidi</option>\n          <option value=\"fattyliver\">Karaciğer Yağlanması (NAFLD)</option>\n          <option value=\"hyperthyroid\">Hipertiroidi</option>\n          <option value=\"gdm\">Gebelik Diyabeti (GDM)</option>\n          <option value=\"menopause\">Menopoz Beslenmesi</option>\n          <option value=\"migraine\">Migren (Tetikleyici Eliminasyon)</option>\n          <option value=\"anemia_b12\">Anemi (B12 / Folat Eksikliği)</option>\n        </select>\n      </div>\n      <div class=\"field\">\n        <label for=\"menuGender\">Menü Uyarlaması</label>\n        <select id=\"menuGender\" onchange=\"renderMenu()\">\n          <option value=\"all\">Herkes İçin Genel</option>\n          <option value=\"female\">Kadın Danışan Vurgusu</option>\n          <option value=\"male\">Erkek Danışan Vurgusu</option>\n        </select>\n      </div>\n    </div>\n    <p class=\"meal-target-note\" id=\"targetNote\"></p>\n\n    <div class=\"day-menu\" id=\"dayMenu\"></div>\n    <div class=\"caution-box\" id=\"cautionBox\"></div>\n    <button class=\"btn-primary\" style=\"margin-top:16px;\" onclick=\"generateShoppingList()\">Bu Menüden Alışveriş Listesi Oluştur</button>\n    <div id=\"shoppingListBox\" style=\"display:none; margin-top:16px; background:var(--paper-2); border:1px solid var(--line); border-radius:3px; padding:16px;\"></div>\n  </div>\n\n  <!-- WEEKLY MENU CARD -->\n  <div class=\"card\">\n    <p class=\"section-title\">3 · 1 Haftalık Menü Görünümü</p>\n    <p class=\"section-sub\">Seçili hastalık ve sevilmeyen besinlere göre Pazartesi-Pazar örnek menü. Gün içindeki seçenekler haftalık çeşitlilik için rotasyonla değişir; sevilmeyen besin içeren seçenekler otomatik atlanır.</p>\n    <button class=\"btn-primary no-print\" style=\"margin-bottom:14px;\" onclick=\"dpPrintStyledAdultWeek()\">🎨 Süslü Görünümde Yazdır</button>\n    <div style=\"overflow-x:auto;\">\n      <table class=\"exchange-table\" id=\"weekTable\" style=\"min-width:760px;\"></table>\n    </div>\n  </div>\n\n  <!-- EXCHANGE LIST CARD -->\n  <div class=\"card\">\n    <p class=\"section-title\">4 · Değişim (Denklik) Listeleri</p>\n    <p class=\"exchange-intro\">Aynı grup içindeki besinler birbirinin yerine kalori/porsiyon açısından yaklaşık olarak geçebilir. \"Ekmek yerine ne geçer\", \"protein olarak neler geçer\" sorularının cevabı için danışanla birlikte kullanın.</p>\n    <div id=\"exchangeLists\"></div>\n  </div>\n\n  <!-- WATER INTAKE CARD -->\n  <div class=\"card\">\n    <p class=\"section-title\">5 · Su Tüketimi Hesaplama</p>\n    <p class=\"section-sub\">Kiloya göre yaklaşık günlük sıvı ihtiyacı (genel sağlıklı yetişkin için).</p>\n    <div class=\"grid\">\n      <div><label for=\"waterWeight\">Kilo (kg)</label><input type=\"number\" id=\"waterWeight\" value=\"72\" min=\"30\" max=\"250\"></div>\n      <div><label for=\"waterActivity\">Ek Aktivite (dk/gün, terleme dahil)</label><input type=\"number\" id=\"waterActivity\" value=\"30\" min=\"0\" max=\"300\"></div>\n    </div>\n    <button class=\"btn-primary\" onclick=\"calcWater()\">Su İhtiyacını Hesapla</button>\n    <div class=\"results\" id=\"waterResults\">\n      <div class=\"result-grid\">\n        <div class=\"result-box accent\"><div class=\"num\" id=\"waterVal\">--</div><div class=\"lbl\">Yaklaşık Günlük Su (ml)</div></div>\n        <div class=\"result-box\"><div class=\"num\" id=\"waterGlassVal\">--</div><div class=\"lbl\">≈ Bardak (200 ml)</div></div>\n      </div>\n      <p style=\"font-size:12.5px;color:#6B6455;\">Kronik böbrek hastalığı, kalp yetmezliği veya sıvı kısıtlaması olan danışanlarda bu hesaplama geçerli değildir; sıvı miktarı hekim tarafından belirlenir.</p>\n    </div>\n  </div>\n\n  <!-- BODY COMPOSITION CARD -->\n  <div class=\"card\">\n    <p class=\"section-title\">6 · Vücut Yağ Oranı ve Bel-Kalça Oranı</p>\n    <p class=\"section-sub\">ABD Donanması (US Navy) formülüne dayalı yaklaşık vücut yağ oranı ve bel-kalça oranı.</p>\n    <div class=\"grid\">\n      <div><label for=\"bfHeight\">Boy (cm)</label><input type=\"number\" id=\"bfHeight\" value=\"165\" min=\"120\" max=\"220\"></div>\n      <div><label for=\"bfNeck\">Boyun Çevresi (cm)</label><input type=\"number\" id=\"bfNeck\" value=\"34\" min=\"20\" max=\"60\"></div>\n      <div><label for=\"bfWaist\">Bel Çevresi (cm)</label><input type=\"number\" id=\"bfWaist\" value=\"85\" min=\"40\" max=\"180\"></div>\n      <div id=\"bfHipWrap\"><label for=\"bfHip\">Kalça Çevresi (cm) — kadınlarda gerekli</label><input type=\"number\" id=\"bfHip\" value=\"100\" min=\"40\" max=\"200\"></div>\n    </div>\n    <button class=\"btn-primary\" onclick=\"calcBodyFat()\">Hesapla</button>\n    <div class=\"results\" id=\"bfResults\">\n      <div class=\"result-grid\">\n        <div class=\"result-box accent\"><div class=\"num\" id=\"bfVal\">--</div><div class=\"lbl\">Yaklaşık Vücut Yağ Oranı (%)</div></div>\n        <div class=\"result-box\"><div class=\"num\" id=\"whrVal\">--</div><div class=\"lbl\">Bel-Kalça Oranı</div></div>\n      </div>\n      <p id=\"whrNote\" style=\"font-size:13px;\"></p>\n    </div>\n  </div>\n\n  <!-- DRUG-FOOD INTERACTIONS CARD -->\n  <div class=\"card\">\n    <p class=\"section-title\">7 · İlaç - Besin Etkileşimleri (Genel Farkındalık)</p>\n    <p class=\"section-sub\">Sık karşılaşılan bazı etkileşimler; danışanın kullandığı ilaçlar mutlaka eczacı/hekimle teyit edilmelidir.</p>\n    <table class=\"exchange-table\">\n      <tr><th>İlaç Grubu</th><th>Dikkat Edilecek Besin</th><th>Not</th></tr>\n      <tr><td>Varfarin (antikoagülan)</td><td>K vitamini (yeşil yapraklı sebzeler)</td><td>Ani ve aşırı tüketim artışı/azalışı yerine tutarlı miktar önemlidir</td></tr>\n      <tr><td>MAO inhibitörleri</td><td>Tiramin içeren gıdalar (eskimiş peynir, şarküteri, fermente ürünler)</td><td>Hipertansif krize yol açabilir</td></tr>\n      <tr><td>Tetrasiklin grubu antibiyotikler</td><td>Süt ve süt ürünleri, kalsiyum takviyeleri</td><td>Emilimi azaltabilir; ilaçtan 1-2 saat uzak tüketilmesi önerilir</td></tr>\n      <tr><td>Levotiroksin</td><td>Kalsiyum, demir, soya ürünleri, yüksek lif</td><td>İlaçtan en az 30-60 dk sonra tüketim önerilir</td></tr>\n      <tr><td>Statinler</td><td>Greyfurt / greyfurt suyu</td><td>Bazı statinlerin kan düzeyini artırabilir</td></tr>\n      <tr><td>ACE inhibitörleri / ARB</td><td>Potasyumdan çok zengin gıdalar, tuz alternatifleri (KCl içerikli)</td><td>Hiperkalemi riski; potasyum düzeyi izlenmelidir</td></tr>\n      <tr><td>Metformin</td><td>—</td><td>Uzun süreli kullanımda B12 emilimini azaltabilir; B12 düzeyinin periyodik izlenmesi önerilir</td></tr>\n      <tr><td>Furosemid (loop diüretik)</td><td>Potasyum ve magnezyum kaynakları</td><td>ACE inhibitörünün aksine potasyum/magnezyum kaybına yol açar; düzeylerin izlenmesi ve gerekirse desteklenmesi gerekebilir</td></tr>\n    </table>\n  </div>\n\n  \n  <div class=\"card\">\n    <p class=\"section-title\">8 · Detaylı 7 Günlük Diyet Programı (Miktarlı)</p>\n    <p class=\"section-sub\">Seçili duruma ve hesaplanan hedef kaloriye göre gün gün ayrılmış, porsiyon miktarları, hazırlanış adımları ve her öğün için karbonhidrat / protein / yağ değerleri belirtilmiş ayrıntılı program.</p>\n    <div class=\"no-print\" style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:200px;\" onclick=\"dpRenderPlan()\">Programı Yenile</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:200px;\" onclick=\"dpPrint('print')\">🖨️ 7 Günlük Programı Yazdır</button>\n      <button type=\"button\" class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:200px;background:#25D366;color:#fff;\" onclick=\"dpPrepWhatsApp()\">📱 WhatsApp Mesajı Hazırla</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:220px;\" onclick=\"dpWeeklyShoppingList()\">🛒 7 Günlük Alışveriş Listesi Oluştur</button>\n      <button class=\"btn-primary\" id=\"dpPdfBtn\" style=\"margin-top:0;flex:1;min-width:200px;\" onclick=\"dpPdf()\">📄 PDF olarak indir</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:200px;background:transparent;border:1px solid currentColor;\" onclick=\"dpPrint('download')\">⬇️ İndir (HTML)</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:200px;\" onclick=\"dpPrintStyledDetailPlan()\">🎨 Süslü Görünümde Yazdır</button>\n    </div>\n        <div id=\"waBox\" style=\"display:none;margin-top:16px;background:var(--dp-soft,#EFE8D8);border:1px solid var(--dp-line,#D8CFB6);border-radius:4px;padding:16px;\">\n      <label style=\"display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--dp-head,#1E3F3A);margin-bottom:8px;\">WhatsApp Mesajı — metni kopyalayıp WhatsApp'a yapıştırabilirsiniz</label>\n      <textarea id=\"waText\" readonly rows=\"6\" style=\"width:100%;padding:10px;border:1px solid var(--dp-line,#D8CFB6);border-radius:3px;font-family:inherit;font-size:13px;background:#fff;box-sizing:border-box;\"></textarea>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;\">\n        <button type=\"button\" class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;\" onclick=\"dpCopyWhatsAppText()\">📋 Metni Kopyala</button>\n        <a id=\"waDirectLink\" href=\"https://wa.me/\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:#25D366;color:#fff;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box;\">WhatsApp'ta Doğrudan Aç (varsa)</a>\n      </div>\n      <p id=\"waCopyMsg\" style=\"font-size:12px;color:var(--dp-head,#1E3F3A);margin-top:8px;display:none;\"></p>\n    </div>\n        <div id=\"weeklyShopBox\" style=\"display:none;margin-top:16px;background:var(--dp-soft,#EFE8D8);border:1px solid var(--dp-line,#D8CFB6);border-radius:4px;padding:16px;\">\n      <b style=\"color:var(--dp-head,#1E3F3A);\">7 Günlük Alışveriş Listesi (toplam miktarlar)</b>\n      <div id=\"weeklyShopList\" style=\"margin-top:10px;\"></div>\n    </div>\n    <div id=\"detailPlan\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">9 · Yaşam Tarzına Göre Genel Beslenme Önerileri</p>\n    <p class=\"section-sub\">Bu bölüm hastalığa özel değil, günlük yaşam düzenine göre pratik öneriler ve örnek bir gün sunar; seçili hastalık menüsüyle birlikte değerlendirilebilir.</p>\n    <div class=\"menu-select-row\">\n      <div class=\"field\"><label for=\"lifestyleSelect\">Yaşam Tarzı</label>\n        <select id=\"lifestyleSelect\" onchange=\"dpRenderLifestyle()\">\n          <option value=\"office\">Masa Başı / Ofis Çalışanı</option>\n          <option value=\"shift\">Vardiyalı / Gece Çalışanı</option>\n          <option value=\"travel\">Sık Seyahat Eden</option>\n          <option value=\"active\">Aktif / Ayakta-Sahada Çalışan</option>\n          <option value=\"student\">Öğrenci / Bütçe Dostu</option>\n          <option value=\"pregnancy\">Gebelik / Emzirme Dönemi (Genel Örnek)</option>\n        </select>\n      </div>\n    </div>\n    <div id=\"lifestylePlan\"></div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">10 · Laboratuvar Sonuçları Değerlendirme</p>\n    <p class=\"section-sub\">Danışanın laboratuvar değerlerini girin; referans aralığına göre değerlendirme ve besin önerileri sunulur. Referans aralıkları üstteki cinsiyet seçimine göre otomatik ayarlanır. Bu bölüm yalnızca 18 yaş üstü yetişkinler içindir; çocuklarda referans aralıkları farklıdır.</p>\n    <div style=\"background:var(--dp-soft,#EFE8D8);border:1px solid var(--dp-line,#D8CFB6);border-radius:4px;padding:14px 16px;margin-bottom:18px;\">\n      <label for=\"labBulkInput\" style=\"font-weight:600;\">Toplu Giriş — Fotoğraftaki/Rapordaki Değerleri Buraya Yapıştırın</label>\n      <p style=\"font-size:12px;color:#6B6455;margin:4px 0 8px;\">Bu kutu bir görüntüyü otomatik okumaz — laboratuvar raporunu kendiniz okuyup her satıra bir değer olacak şekilde yapıştırın (örn. \"Hemoglobin: 10.2\", \"Ferritin 15\", \"LDL 145\"). Aşağıdaki ilgili alanlara otomatik dağıtılır; eşleşmeyenler elle girilebilir.</p>\n      <textarea id=\"labBulkInput\" rows=\"4\" style=\"width:100%;padding:10px;border:1px solid var(--dp-line,#D8CFB6);border-radius:3px;font-family:inherit;font-size:13.5px;box-sizing:border-box;\" placeholder=\"Hemoglobin: 10.2&#10;Ferritin: 15&#10;LDL: 145\"></textarea>\n      <button class=\"btn-primary\" style=\"margin-top:10px;\" onclick=\"dpParseLabBulkText()\">Değerleri Dağıt</button>\n      <div id=\"labBulkResult\" style=\"margin-top:10px;\"></div>\n    </div>\n    <div class=\"no-print\" style=\"margin-bottom:18px;\">\n      <label for=\"labPhotoInput\" style=\"font-weight:600;\">Laboratuvar Sonucu Fotoğrafı (Referans İçin Sakla)</label>\n      <p style=\"font-size:12px;color:#6B6455;margin:4px 0 8px;\">Bu fotoğraf otomatik okunmaz — yalnızca değerlere bakarken yanınızda referans olarak görüntülenir ve bu oturum boyunca danışan kaydıyla birlikte saklanır (sayfa kapanınca/yenilenince silinir).</p>\n      <input type=\"file\" id=\"labPhotoInput\" accept=\"image/*\" onchange=\"dpHandleLabPhoto(event)\">\n      <div id=\"labPhotoPreview\" style=\"margin-top:10px;\"></div>\n    </div>\n    <div class=\"grid\" style=\"margin-bottom:18px;\">\n      <div><label for=\"lab_hb\">Hemoglobin (g/dL)</label><input type=\"number\" id=\"lab_hb\" step=\"0.1\" placeholder=\"—\"></div>\n      <div><label for=\"lab_ferritin\">Ferritin (ng/mL)</label><input type=\"number\" id=\"lab_ferritin\" step=\"0.1\" placeholder=\"—\"></div>\n      <div><label for=\"lab_b12\">Vitamin B12 (pg/mL)</label><input type=\"number\" id=\"lab_b12\" step=\"0.1\" placeholder=\"—\"></div>\n      <div><label for=\"lab_folate\">Folat (ng/mL)</label><input type=\"number\" id=\"lab_folate\" step=\"0.1\" placeholder=\"—\"></div>\n      <div><label for=\"lab_vitd\">25-OH Vitamin D (ng/mL)</label><input type=\"number\" id=\"lab_vitd\" step=\"0.1\" placeholder=\"—\"></div>\n      <div><label for=\"lab_tsh\">TSH (mIU/L)</label><input type=\"number\" id=\"lab_tsh\" step=\"0.1\" placeholder=\"—\"></div>\n      <div><label for=\"lab_glucose\">Açlık Kan Şekeri (mg/dL)</label><input type=\"number\" id=\"lab_glucose\" step=\"0.1\" placeholder=\"—\"></div>\n      <div><label for=\"lab_hba1c\">HbA1c (%)</label><input type=\"number\" id=\"lab_hba1c\" step=\"0.1\" placeholder=\"—\"></div>\n      <div><label for=\"lab_tchol\">Total Kolesterol (mg/dL)</label><input type=\"number\" id=\"lab_tchol\" step=\"0.1\" placeholder=\"—\"></div>\n      <div><label for=\"lab_ldl\">LDL Kolesterol (mg/dL)</label><input type=\"number\" id=\"lab_ldl\" step=\"0.1\" placeholder=\"—\"></div>\n      <div><label for=\"lab_hdl\">HDL Kolesterol (mg/dL)</label><input type=\"number\" id=\"lab_hdl\" step=\"0.1\" placeholder=\"—\"></div>\n      <div><label for=\"lab_tg\">Trigliserit (mg/dL)</label><input type=\"number\" id=\"lab_tg\" step=\"0.1\" placeholder=\"—\"></div>\n      <div><label for=\"lab_k\">Potasyum (mmol/L)</label><input type=\"number\" id=\"lab_k\" step=\"0.1\" placeholder=\"—\"></div>\n      <div><label for=\"lab_na\">Sodyum (mmol/L)</label><input type=\"number\" id=\"lab_na\" step=\"0.1\" placeholder=\"—\"></div>\n      <div><label for=\"lab_ca\">Kalsiyum (mg/dL)</label><input type=\"number\" id=\"lab_ca\" step=\"0.1\" placeholder=\"—\"></div>\n      <div><label for=\"lab_albumin\">Albümin (g/dL)</label><input type=\"number\" id=\"lab_albumin\" step=\"0.1\" placeholder=\"—\"></div>\n      <div><label for=\"lab_creatinine\">Kreatinin (mg/dL)</label><input type=\"number\" id=\"lab_creatinine\" step=\"0.1\" placeholder=\"—\"></div>\n      <div><label for=\"lab_crp\">CRP (mg/L)</label><input type=\"number\" id=\"lab_crp\" step=\"0.1\" placeholder=\"—\"></div>\n      <div><label for=\"lab_uricacid\">Ürik Asit (mg/dL)</label><input type=\"number\" id=\"lab_uricacid\" step=\"0.1\" placeholder=\"—\"></div>\n    </div>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:200px;\" onclick=\"dpRenderLabs()\">Değerlendir</button>\n      <button class=\"btn-primary no-print\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\" onclick=\"dpClearLabs()\">Temizle</button>\n    </div>\n    <div id=\"labResults\" style=\"margin-top:20px;\"></div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">11 · Tarifler / Yemek Tarifleri</p>\n    <p class=\"section-sub\">Programdaki menülerde kullanılan yemeklerin malzeme miktarları ve hazırlanış adımları. Aşağıdaki liste, bu modüldeki tüm durumlarda kullanılan tarifleri kapsar; filtreler yeni tarif üretmez, mevcutlar arasından seçer. Vejetaryen/glutensiz etiketleri tarifin gerçek malzemelerinden otomatik hesaplanır.</p>\n    <div class=\"no-print\">\n    <input type=\"text\" id=\"recipeSearch\" placeholder=\"Tarif ara…\" oninput=\"dpFilterRecipes()\" style=\"width:100%;padding:11px 12px;border:1px solid var(--dp-line,#D8CFB6);border-radius:3px;margin-bottom:12px;font-size:15px;box-sizing:border-box;\">\n    <div class=\"grid\" style=\"margin-bottom:10px;\">\n      <div><label for=\"recipeMaxKcal\">Maks. Kalori (kcal)</label><input type=\"number\" id=\"recipeMaxKcal\" placeholder=\"örn. 400\" oninput=\"dpFilterRecipes()\"></div>\n      <div><label for=\"recipeMinProtein\">Min. Protein (g)</label><input type=\"number\" id=\"recipeMinProtein\" placeholder=\"örn. 20\" oninput=\"dpFilterRecipes()\"></div>\n    </div>\n    <div style=\"margin-bottom:12px;\">\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"recipeVegOnly\" onchange=\"dpFilterRecipes()\"> Sadece Vejetaryen</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"recipeGfOnly\" onchange=\"dpFilterRecipes()\"> Sadece Glutensiz</label>\n    </div>\n    <button class=\"btn-primary\" style=\"margin-top:0;margin-bottom:18px;\" onclick=\"dpPrintRecipes()\">🖨️ Görünen Tarifleri Yazdır</button>\n    </div>\n    <div id=\"recipeList\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">12 · Danışan Listesi (Oturum İçi)</p>\n    <p class=\"section-sub\">Bu liste yalnızca bu tarayıcı sekmesi açıkken tutulur, sayfa kapatılınca silinir — kalıcı bir hasta kayıt sistemi değildir. Kaydederken o an seçili olan program ve hedef kalori de bir \"arşiv\" notu olarak saklanır. Süreklilik için \"Dışa Aktar\" ile JSON dosyası indirip bir sonraki seansta \"İçe Aktar\" ile geri yükleyebilirsiniz. Bir danışana \"Yükle\" demek, yukarıdaki tüm alanları o danışanın bilgileriyle doldurur.</p>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:220px;\" onclick=\"dpSaveClient()\">+ Şu Anki Bilgileri Danışan Olarak Kaydet</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\" onclick=\"dpExportClients()\">⬇️ Dışa Aktar (JSON)</button>\n      <label class=\"btn-primary file-btn\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\">\n        ⬆️ İçe Aktar (JSON)\n        <input type=\"file\" accept=\"application/json\" onchange=\"dpImportClients(this.files[0])\">\n      </label>\n    </div>\n    <div id=\"clientList\"></div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">13 · Takip Grafikleri (Kilo Takibi)</p>\n    <p class=\"section-sub\">Danışanın kilo değişimini zaman içinde izleyin. Veriler yalnızca bu oturumda tutulur; süreklilik için dışa/içe aktarma seçeneklerini kullanın.</p>\n    <div class=\"grid\" style=\"margin-bottom:16px;\">\n      <div><label for=\"trackDate\">Tarih</label><input type=\"text\" id=\"trackDate\" placeholder=\"gg.aa.yyyy\"></div>\n      <div><label for=\"trackWeight\">Kilo (kg)</label><input type=\"number\" id=\"trackWeight\" step=\"0.1\"></div>\n      <div><label for=\"trackHeightCm\">Boy (cm) — BKİ için, opsiyonel</label><input type=\"number\" id=\"trackHeightCm\" step=\"0.1\"></div>\n    </div>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;\" onclick=\"dpAddTrackPoint()\">Kayıt Ekle</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\" onclick=\"dpExportTrack()\">⬇️ Dışa Aktar (JSON)</button>\n      <label class=\"btn-primary file-btn\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\">\n        ⬆️ İçe Aktar (JSON)\n        <input type=\"file\" accept=\"application/json\" onchange=\"dpImportTrack(this.files[0])\">\n      </label>\n    </div>\n    <canvas id=\"trackCanvas\"></canvas>\n    <div id=\"trackTable\" style=\"margin-top:16px;\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">14 · Hastane Diyetisyeni: Malnütrisyon Tarama Araçları</p>\n    <p class=\"section-sub\">NRS-2002, MUST, MNA-SF ve FINDRISC — yaygın kullanılan, standart yayınlanmış tarama araçlarıdır. Bunlar <b>tanı koymaz</b>, yalnızca risk açısından danışanı işaretler; sonuçlar mutlaka klinik değerlendirme ile birlikte yorumlanmalıdır.</p>\n    <div class=\"menu-select-row\">\n      <div class=\"field\"><label for=\"screenTool\">Tarama Aracı</label>\n        <select id=\"screenTool\" onchange=\"dpScreenSwitch()\">\n          <option value=\"nrs\">NRS-2002 (Hastane Yatışı)</option>\n          <option value=\"must\">MUST (Toplum / Genel Yetişkin)</option>\n          <option value=\"mna\">MNA-SF (65 Yaş ve Üstü)</option>\n          <option value=\"findrisc\">FINDRISC (Tip 2 Diyabet 10 Yıllık Risk)</option>\n        </select>\n      </div>\n    </div>\n\n    <div id=\"nrsForm\">\n      <p style=\"font-size:13px;color:#6B6455;margin-bottom:10px;\"><b>1. Adım — Ön Tarama:</b> aşağıdakilerden biri bile işaretlenirse 2. adıma geçilir.</p>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"nrs_q1\"> BKİ &lt; 20.5 kg/m²</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"nrs_q2\"> Son 3 ayda istemsiz kilo kaybı oldu</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"nrs_q3\"> Son 1 haftada besin alımında azalma oldu</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"nrs_q4\"> Ağır hasta (örn. yoğun bakım)</label>\n      <button class=\"btn-primary\" style=\"margin-top:10px;\" onclick=\"dpNrsStage1()\">Devam Et</button>\n      <div id=\"nrsStage2\" style=\"display:none;margin-top:20px;border-top:1px dashed var(--line);padding-top:16px;\">\n        <p style=\"font-size:13px;color:#6B6455;margin-bottom:10px;\"><b>2. Adım — Son Tarama</b></p>\n        <div class=\"screen-field\"><label class=\"q\">Beslenme Durumu Bozukluğu</label>\n          <select id=\"nrs_impair\">\n            <option value=\"0\">Yok (0)</option>\n            <option value=\"1\">Hafif (1) — 3 ayda %5&#39;ten fazla kilo kaybı VEYA geçen hafta normal alımın %50-75&#39;i</option>\n            <option value=\"2\">Orta (2) — 2 ayda %5&#39;ten fazla kilo kaybı VEYA BKİ 18.5-20.5 + genel durum bozukluğu VEYA geçen hafta %25-50 alım</option>\n            <option value=\"3\">Ağır (3) — 1 ayda %5&#39;ten fazla (3 ayda %15&#39;ten fazla) kilo kaybı VEYA BKİ&lt;18.5 + genel durum bozukluğu VEYA geçen hafta %0-25 alım</option>\n          </select>\n        </div>\n        <div class=\"screen-field\"><label class=\"q\">Hastalığın Şiddeti</label>\n          <select id=\"nrs_severity\">\n            <option value=\"0\">Yok (0) — Normal beslenme ihtiyacı</option>\n            <option value=\"1\">Hafif (1) — Kalça kırığı; siroz, KOAH, kronik hemodiyaliz, diyabet, onkoloji gibi kronik hastalık + akut komplikasyon</option>\n            <option value=\"2\">Orta (2) — Büyük abdominal cerrahi, inme, ağır pnömoni, hematolojik malignite</option>\n            <option value=\"3\">Ağır (3) — Kafa travması, kemik iliği nakli, yoğun bakım hastası (APACHE&gt;10)</option>\n          </select>\n        </div>\n        <div class=\"screen-field\"><label class=\"q\">Yaş</label><input type=\"number\" id=\"nrs_age\" style=\"max-width:160px;\"></div>\n        <button class=\"btn-primary\" onclick=\"dpCalcNrs()\">Skoru Hesapla</button>\n      </div>\n      <div id=\"nrsResult\" class=\"screen-result\"></div>\n    </div>\n\n    <div id=\"mustForm\" style=\"display:none;\">\n      <div class=\"screen-field\"><label class=\"q\">1 — BKİ</label>\n        <select id=\"must_bmi\">\n          <option value=\"0\">&gt; 20 kg/m² (0 puan)</option>\n          <option value=\"1\">18.5 – 20 kg/m² (1 puan)</option>\n          <option value=\"2\">&lt; 18.5 kg/m² (2 puan)</option>\n        </select>\n      </div>\n      <div class=\"screen-field\"><label class=\"q\">2 — Son 3-6 Ayda İstemsiz Kilo Kaybı</label>\n        <select id=\"must_wl\">\n          <option value=\"0\">%5&#39;ten az (0 puan)</option>\n          <option value=\"1\">%5 – %10 (1 puan)</option>\n          <option value=\"2\">%10&#39;dan fazla (2 puan)</option>\n        </select>\n      </div>\n      <div class=\"screen-field\"><label class=\"q\">3 — Akut Hastalık Etkisi</label>\n        <select id=\"must_acute\">\n          <option value=\"0\">Yok (0 puan)</option>\n          <option value=\"2\">Akut hastalık VAR ve ≥5 gündür (veya öngörülen sürede) besin alımı yok/olmayacak (2 puan)</option>\n        </select>\n      </div>\n      <button class=\"btn-primary\" onclick=\"dpCalcMust()\">Skoru Hesapla</button>\n      <div id=\"mustResult\" class=\"screen-result\"></div>\n    </div>\n\n    <div id=\"mnaForm\" style=\"display:none;\">\n      <div class=\"screen-field\"><label class=\"q\">A — Son 3 Ayda İştahsızlık Nedeniyle Besin Alımında Azalma</label>\n        <select id=\"mna_a\">\n          <option value=\"0\">Ciddi azalma (0)</option>\n          <option value=\"1\">Orta düzeyde azalma (1)</option>\n          <option value=\"2\">Azalma yok (2)</option>\n        </select>\n      </div>\n      <div class=\"screen-field\"><label class=\"q\">B — Son 3 Ayda İstemsiz Kilo Kaybı</label>\n        <select id=\"mna_b\">\n          <option value=\"0\">3 kg&#39;dan fazla (0)</option>\n          <option value=\"1\">Bilinmiyor (1)</option>\n          <option value=\"2\">1 – 3 kg (2)</option>\n          <option value=\"3\">Kilo kaybı yok (3)</option>\n        </select>\n      </div>\n      <div class=\"screen-field\"><label class=\"q\">C — Hareketlilik</label>\n        <select id=\"mna_c\">\n          <option value=\"0\">Yatağa veya sandalyeye bağımlı (0)</option>\n          <option value=\"1\">Yataktan/sandalyeden kalkabiliyor, dışarı çıkamıyor (1)</option>\n          <option value=\"2\">Bağımsız şekilde dışarı çıkabiliyor (2)</option>\n        </select>\n      </div>\n      <div class=\"screen-field\"><label class=\"q\">D — Son 3 Ayda Psikolojik Stres veya Akut Hastalık</label>\n        <select id=\"mna_d\">\n          <option value=\"0\">Evet (0)</option>\n          <option value=\"2\">Hayır (2)</option>\n        </select>\n      </div>\n      <div class=\"screen-field\"><label class=\"q\">E — Nöropsikolojik Problem</label>\n        <select id=\"mna_e\">\n          <option value=\"0\">Ağır demans veya depresyon (0)</option>\n          <option value=\"1\">Hafif demans (1)</option>\n          <option value=\"2\">Psikolojik problem yok (2)</option>\n        </select>\n      </div>\n      <div class=\"screen-field\"><label class=\"q\">F — BKİ</label>\n        <select id=\"mna_f\">\n          <option value=\"0\">&lt; 19 kg/m² (0)</option>\n          <option value=\"1\">19 – &lt;21 kg/m² (1)</option>\n          <option value=\"2\">21 – &lt;23 kg/m² (2)</option>\n          <option value=\"3\">≥ 23 kg/m² (3)</option>\n        </select>\n        <p style=\"font-size:11.5px;color:#8A8371;margin-top:4px;\">BKİ ölçülemiyorsa resmi MNA-SF formunda yerine baldır çevresi (≥31 cm = 3, &lt;31 cm = 0 puan) kullanılabilir; bu araç yalnızca BKİ koluyla hesaplar.</p>\n      </div>\n      <button class=\"btn-primary\" onclick=\"dpCalcMna()\">Skoru Hesapla</button>\n      <div id=\"mnaResult\" class=\"screen-result\"></div>\n    </div>\n\n    <div id=\"findriscForm\" style=\"display:none;\">\n      <div class=\"screen-field\"><label class=\"q\">1 — Yaş</label>\n        <select id=\"fr_age\">\n          <option value=\"0\">45 yaşından küçük (0)</option>\n          <option value=\"2\">45–54 yaş (2)</option>\n          <option value=\"3\">55–64 yaş (3)</option>\n          <option value=\"4\">64 yaşından büyük (4)</option>\n        </select>\n      </div>\n      <div class=\"screen-field\"><label class=\"q\">2 — BKİ</label>\n        <select id=\"fr_bmi\">\n          <option value=\"0\">25 kg/m²&#39;den az (0)</option>\n          <option value=\"1\">25 – 30 kg/m² (1)</option>\n          <option value=\"3\">30 kg/m²&#39;den fazla (3)</option>\n        </select>\n      </div>\n      <div class=\"screen-field\"><label class=\"q\">3 — Bel Çevresi</label>\n        <select id=\"fr_waist\">\n          <option value=\"0\">Erkek &lt;94 cm / Kadın &lt;80 cm (0)</option>\n          <option value=\"3\">Erkek 94–102 cm / Kadın 80–88 cm (3)</option>\n          <option value=\"4\">Erkek &gt;102 cm / Kadın &gt;88 cm (4)</option>\n        </select>\n      </div>\n      <div class=\"screen-field\"><label class=\"q\">4 — Günde En Az 30 Dakika Fiziksel Aktivite</label>\n        <select id=\"fr_activity\">\n          <option value=\"0\">Evet (0)</option>\n          <option value=\"2\">Hayır (2)</option>\n        </select>\n      </div>\n      <div class=\"screen-field\"><label class=\"q\">5 — Sebze/Meyve Tüketim Sıklığı</label>\n        <select id=\"fr_veg\">\n          <option value=\"0\">Her gün (0)</option>\n          <option value=\"1\">Her gün değil (1)</option>\n        </select>\n      </div>\n      <div class=\"screen-field\"><label class=\"q\">6 — Düzenli Tansiyon İlacı Kullanımı</label>\n        <select id=\"fr_bp\">\n          <option value=\"0\">Hayır (0)</option>\n          <option value=\"2\">Evet (2)</option>\n        </select>\n      </div>\n      <div class=\"screen-field\"><label class=\"q\">7 — Daha Önce Yüksek Kan Şekeri Tespiti (kontrol, hastalık veya gebelikte)</label>\n        <select id=\"fr_glucose\">\n          <option value=\"0\">Hayır (0)</option>\n          <option value=\"5\">Evet (5)</option>\n        </select>\n      </div>\n      <div class=\"screen-field\"><label class=\"q\">8 — Ailede Diyabet Öyküsü</label>\n        <select id=\"fr_family\">\n          <option value=\"0\">Yok (0)</option>\n          <option value=\"3\">Büyükanne/büyükbaba, teyze/hala/amca/dayı veya kuzen (3)</option>\n          <option value=\"5\">Anne, baba, kardeş veya çocuk (5)</option>\n        </select>\n      </div>\n      <button class=\"btn-primary\" onclick=\"dpCalcFindrisc()\">Skoru Hesapla</button>\n      <div id=\"findriscResult\" class=\"screen-result\"></div>\n    </div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">15 · Barkod ile Besin Değeri Sorgulama</p>\n    <p class=\"section-sub\">Ürün barkodunu kameradan taratın veya elle girin; Open Food Facts açık veritabanından besin değerlerini getirir. Bu veritabanı kullanıcı katkılıdır — özellikle Türkiye'deki ürünlerde kapsam sınırlı olabilir; sonuçları her zaman ürün etiketiyle karşılaştırın. Kamera ve sorgulama internet bağlantısı gerektirir. <b>Not:</b> Bu dosyayı doğrudan (çift tıklayarak) açtıysanız, tarayıcı güvenlik kuralları gereği kamera ve dış sunucu sorgusu çalışmayabilir — bu bir hata değildir; dosyayı bir web sunucusu üzerinden açtığınızda genellikle sorunsuz çalışır.</p>\n    <div class=\"grid\" style=\"margin-bottom:16px;\">\n      <div><label for=\"barcodeInput\">Barkod Numarası</label><input type=\"text\" id=\"barcodeInput\" inputmode=\"numeric\" placeholder=\"örn. 8690637000000\"></div>\n    </div>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;\" onclick=\"dpLookupBarcode()\">Sorgula</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\" onclick=\"dpToggleScanner()\">📷 Kamera ile Tara</button>\n    </div>\n    <div id=\"scannerBox\" style=\"display:none;margin-bottom:16px;\">\n      <div id=\"scannerReader\" style=\"width:100%;max-width:380px;margin:0 auto;\"></div>\n      <button class=\"btn-primary\" style=\"margin-top:12px;max-width:380px;display:block;margin-left:auto;margin-right:auto;background:transparent;border:1px solid currentColor;\" onclick=\"dpStopScanner()\">İptal</button>\n    </div>\n    <div id=\"barcodeResult\"></div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">16 · Su / Öğün Hatırlatıcı</p>\n    <p class=\"section-sub\">Bu hatırlatıcılar yalnızca bu tarayıcı sekmesi açık kaldığı sürece çalışır — sekme kapatılınca veya telefon uzun süre kilitlenince durur; gerçek bir sistem düzeyinde bildirim değildir. Tarayıcı bildirim izni verirseniz gerçek bildirim, vermezseniz sayfa içi uyarı olarak gösterilir.</p>\n\n    <p style=\"font-weight:700;color:var(--dp-head,#1E3F3A);margin-bottom:10px;\">💧 Su İçme Hatırlatıcısı</p>\n    <div class=\"menu-select-row\">\n      <div class=\"field\"><label for=\"waterIntervalSelect\">Aralık</label>\n        <select id=\"waterIntervalSelect\">\n          <option value=\"30\">30 dakikada bir</option>\n          <option value=\"60\" selected>60 dakikada bir</option>\n          <option value=\"90\">90 dakikada bir</option>\n          <option value=\"120\">120 dakikada bir</option>\n        </select>\n      </div>\n    </div>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;margin-bottom:8px;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;\" onclick=\"dpStartWaterReminder()\">Başlat</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\" onclick=\"dpStopWaterReminder()\">Durdur</button>\n    </div>\n    <p id=\"waterReminderStatus\" style=\"font-size:12.5px;color:#6B6455;margin-bottom:24px;\">Kapalı.</p>\n\n    <p style=\"font-weight:700;color:var(--dp-head,#1E3F3A);margin-bottom:10px;\">🍽️ Öğün Hatırlatıcısı</p>\n    <div class=\"grid\" style=\"margin-bottom:14px;\">\n      <div><label for=\"mealTimeInput\">Saat</label><input type=\"time\" id=\"mealTimeInput\"></div>\n      <div><label for=\"mealLabelInput\">Etiket</label><input type=\"text\" id=\"mealLabelInput\" placeholder=\"örn. Kahvaltı\"></div>\n    </div>\n    <button class=\"btn-primary\" style=\"margin-bottom:16px;\" onclick=\"dpAddMealReminder()\">+ Hatırlatıcı Ekle</button>\n    <div id=\"mealReminderList\" style=\"margin-bottom:16px;\"></div>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;\" onclick=\"dpStartMealReminders()\">Hatırlatıcıları Etkinleştir</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\" onclick=\"dpStopMealReminders()\">Durdur</button>\n    </div>\n    <p id=\"mealReminderStatus\" style=\"font-size:12.5px;color:#6B6455;margin-top:10px;\">Kapalı.</p>\n\n    <div id=\"reminderBanner\" style=\"display:none;margin-top:18px;background:var(--dp-soft,#EFE8D8);border-left:3px solid var(--dp-acc,#C08A2E);padding:12px 14px;border-radius:0 3px 3px 0;font-size:13.5px;color:var(--dp-head,#1E3F3A);\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">17 · Genişletilmiş Takip (Bel Çevresi / Yağ Oranı / Vitamin-Mineral)</p>\n    <p class=\"section-sub\">Kilo dışındaki ölçüm ve laboratuvar değerlerini zaman içinde izleyin. Veriler yalnızca bu oturumda tutulur; süreklilik için dışa/içe aktarma seçeneklerini kullanın.</p>\n    <div class=\"menu-select-row\">\n      <div class=\"field\"><label for=\"extMetricSelect\">İzlenecek Değer</label>\n        <select id=\"extMetricSelect\" onchange=\"dpExtUpdateLabel()\">\n          <option value=\"waist\">Bel Çevresi (cm)</option>\n          <option value=\"bodyfat\">Yağ Oranı (%)</option>\n          <option value=\"b12\">Vitamin B12 (pg/mL)</option>\n          <option value=\"vitd\">25-OH Vitamin D (ng/mL)</option>\n          <option value=\"folate\">Folat (ng/mL)</option>\n          <option value=\"ferritin\">Ferritin (ng/mL)</option>\n          <option value=\"iron\">Demir (µg/dL)</option>\n          <option value=\"calcium\">Kalsiyum (mg/dL)</option>\n        </select>\n      </div>\n    </div>\n    <div class=\"grid\" style=\"margin:16px 0;\">\n      <div><label for=\"extDate\">Tarih</label><input type=\"text\" id=\"extDate\" placeholder=\"gg.aa.yyyy\"></div>\n      <div><label for=\"extValue\" id=\"extValueLabel\">Bel Çevresi (cm)</label><input type=\"number\" id=\"extValue\" step=\"0.1\"></div>\n    </div>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;\" onclick=\"dpExtAddPoint()\">Kayıt Ekle</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\" onclick=\"dpExtExport()\">⬇️ Dışa Aktar (JSON)</button>\n      <label class=\"btn-primary file-btn\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\">\n        ⬆️ İçe Aktar (JSON)\n        <input type=\"file\" accept=\"application/json\" onchange=\"dpExtImport(this.files[0])\">\n      </label>\n    </div>\n    <canvas id=\"extCanvas\"></canvas>\n    <div id=\"extTable\" style=\"margin-top:16px;\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">18 · Günlük Hedef ve Motivasyon Takibi</p>\n    <p class=\"section-sub\">Basit bir günlük hedef kontrol listesi — ilerlemeyi görmek motivasyonu destekleyebilir.</p>\n    <div style=\"margin-bottom:18px;\">\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"goal_water\"> Bugün su hedefime ulaştım</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"goal_menu\"> Bugün önerilen menüyü takip ettim</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"goal_move\"> Bugün hareket/egzersiz yaptım</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"goal_sleep\"> Bugün yeterli uyudum</label>\n    </div>\n    <button class=\"btn-primary\" onclick=\"dpSaveDailyGoal()\">Bugünü Kaydet</button>\n    <div id=\"goalHistory\" style=\"margin-top:18px;\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">19 · Kilo Duraklaması Analizi</p>\n    <p class=\"section-sub\">Bu araç yapay zekâ değildir — kilo duraklamasının yaygın bilinen olası nedenlerini gözden geçiren bir kontrol listesidir. İşaretlenen her madde için genel bir açıklama sunar; danışanın <b>asıl</b> nedeni bu şekilde kesin olarak belirlenemez, klinik değerlendirme gerekir.</p>\n    <div style=\"margin-bottom:18px;\">\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"plateau_water\"> Su tüketimi yetersiz olabilir</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"plateau_protein\"> Protein alımı hedefin altında olabilir</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"plateau_sleep\"> Uyku düzensiz/yetersiz (haftada birkaç gece &lt;6 saat)</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"plateau_stress\"> Stres düzeyi yüksek</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"plateau_freq\"> Tartı çok sık kontrol ediliyor (günlük)</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"plateau_activity\"> Aktivite düzeyinde azalma oldu</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"plateau_hormonal\"> Yakın zamanda hormonal bir dönem var (adet döngüsü vb.)</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"plateau_hidden\"> Gizli kalori kaynakları olabilir (sos, atıştırmalık, içecek tam kaydedilmiyor olabilir)</label>\n    </div>\n    <button class=\"btn-primary\" onclick=\"dpAnalyzePlateau()\">Analiz Et</button>\n    <div id=\"plateauResult\" class=\"screen-result\"></div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">20 · Görüşme Notu Şablonu (SOAP)</p>\n    <p class=\"section-sub\">Görüşme sonrası klinik notunuzu düzenli bir şablonla oluşturun. Bu bir yapay zekâ değildir — yazdıklarınızı düzenli bir formatta bir araya getirir; danışan adı ve hesaplanan hedef değerler üstteki bilgilerden otomatik alınır.</p>\n    <div style=\"margin-bottom:16px;\">\n      <label style=\"display:block;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--dp-head,#1E3F3A);margin-bottom:6px;\">S — Subjektif (Danışanın İfadesi)</label>\n      <textarea id=\"soap_s\" rows=\"3\" style=\"width:100%;padding:10px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13.5px;box-sizing:border-box;\" placeholder=\"Danışanın kendi ifadesiyle şikayeti, hedefi, yaşam tarzı notları…\"></textarea>\n    </div>\n    <div style=\"margin-bottom:16px;\">\n      <label style=\"display:block;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--dp-head,#1E3F3A);margin-bottom:6px;\">O — Objektif (Ölçüm ve Bulgular)</label>\n      <textarea id=\"soap_o\" rows=\"3\" style=\"width:100%;padding:10px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13.5px;box-sizing:border-box;\" placeholder=\"Kilo, boy, BKİ, laboratuvar sonuçları, muayene bulguları…\"></textarea>\n    </div>\n    <div style=\"margin-bottom:16px;\">\n      <label style=\"display:block;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--dp-head,#1E3F3A);margin-bottom:6px;\">A — Değerlendirme (Assessment)</label>\n      <textarea id=\"soap_a\" rows=\"3\" style=\"width:100%;padding:10px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13.5px;box-sizing:border-box;\" placeholder=\"Klinik değerlendirmeniz, beslenme durumu yorumu…\"></textarea>\n    </div>\n    <div style=\"margin-bottom:18px;\">\n      <label style=\"display:block;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--dp-head,#1E3F3A);margin-bottom:6px;\">P — Plan</label>\n      <textarea id=\"soap_p\" rows=\"3\" style=\"width:100%;padding:10px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13.5px;box-sizing:border-box;\" placeholder=\"Beslenme planı, hedefler, bir sonraki randevu, takip edilecek parametreler…\"></textarea>\n    </div>\n    <button class=\"btn-primary\" onclick=\"dpBuildSoapNote()\">Notu Oluştur</button>\n    <div id=\"soapBox\" style=\"display:none;margin-top:16px;background:var(--dp-soft,#EFE8D8);border:1px solid var(--dp-line,#D8CFB6);border-radius:4px;padding:16px;\">\n      <textarea id=\"soapText\" readonly rows=\"14\" style=\"width:100%;padding:10px;border:1px solid var(--dp-line,#D8CFB6);border-radius:3px;font-family:inherit;font-size:13px;background:#fff;box-sizing:border-box;\"></textarea>\n      <button class=\"btn-primary\" style=\"margin-top:12px;\" onclick=\"dpCopySoapNote()\">📋 Notu Kopyala</button>\n      <p id=\"soapCopyMsg\" style=\"font-size:12px;color:var(--dp-head,#1E3F3A);margin-top:8px;display:none;\"></p>\n    </div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">21 · \"Ne Olur Eğer?\" Hesaplayıcı</p>\n    <p class=\"section-sub\">Bu bir yapay zekâ tahmini değildir — standart kalori/hareket formülleriyle yapılan basit bir aritmetik projeksiyondur (yaklaşık 7700 kcal ≈ 1 kg yağ dokusu). Gerçek sonuçlar metabolizma, su dengesi, kas kütlesi değişimi ve uyum düzeyine göre önemli ölçüde farklılık gösterebilir; yalnızca fikir vermek amaçlıdır.</p>\n    <div class=\"menu-select-row\">\n      <div class=\"field\"><label for=\"whatifType\">Senaryo</label>\n        <select id=\"whatifType\" onchange=\"dpWhatifSwitch()\">\n          <option value=\"activity\">Günlük aktivite eklersem</option>\n          <option value=\"calorie\">Günlük kalori değişikliği yaparsam</option>\n          <option value=\"swap\">Yaygın bir değişiklik yaparsam</option>\n        </select>\n      </div>\n    </div>\n\n    <div id=\"whatifActivity\">\n      <div class=\"grid\" style=\"margin:16px 0;\">\n        <div><label for=\"whatifActType\">Aktivite</label>\n          <select id=\"whatifActType\">\n            <option value=\"3.0\">Yavaş Yürüyüş</option>\n            <option value=\"3.5\" selected>Orta Tempo Yürüyüş</option>\n            <option value=\"5.0\">Tempolu Yürüyüş</option>\n            <option value=\"7.0\">Bisiklet (Orta Tempo)</option>\n            <option value=\"8.0\">Hafif Koşu</option>\n            <option value=\"10.0\">Koşu</option>\n          </select>\n        </div>\n        <div><label for=\"whatifActMin\">Süre (dakika/gün)</label><input type=\"number\" id=\"whatifActMin\" value=\"20\"></div>\n        <div><label for=\"whatifActWeight\">Kilo (kg)</label><input type=\"number\" id=\"whatifActWeight\" value=\"75\"></div>\n      </div>\n    </div>\n\n    <div id=\"whatifCalorie\" style=\"display:none;\">\n      <div class=\"grid\" style=\"margin:16px 0;\">\n        <div><label for=\"whatifKcalDelta\">Günlük Kalori Değişikliği (kcal)</label><input type=\"number\" id=\"whatifKcalDelta\" value=\"-300\" placeholder=\"azaltmak için negatif, artırmak için pozitif\"></div>\n      </div>\n    </div>\n\n    <div id=\"whatifSwap\" style=\"display:none;\">\n      <div class=\"menu-select-row\">\n        <div class=\"field\"><label for=\"whatifSwapPreset\">Değişiklik</label>\n          <select id=\"whatifSwapPreset\">\n            <option value=\"140\">Şekerli içecek yerine su (≈140 kcal/gün tasarruf)</option>\n            <option value=\"90\">Cips/kraker yerine meyve (≈90 kcal/gün tasarruf)</option>\n            <option value=\"60\">2 kesme şeker yerine tatlandırıcı (≈60 kcal/gün tasarruf)</option>\n            <option value=\"200\">Kızartma yerine ızgara/fırın (≈200 kcal/gün tasarruf)</option>\n            <option value=\"-250\">Günde 1 fazladan atıştırmalık eklersem (≈250 kcal/gün artış)</option>\n          </select>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"menu-select-row\" style=\"margin-top:16px;\">\n      <div class=\"field\"><label for=\"whatifPeriod\">Süre</label>\n        <select id=\"whatifPeriod\">\n          <option value=\"7\">1 Hafta</option>\n          <option value=\"30\" selected>1 Ay</option>\n          <option value=\"90\">3 Ay</option>\n          <option value=\"180\">6 Ay</option>\n        </select>\n      </div>\n    </div>\n\n    <button class=\"btn-primary\" onclick=\"dpCalcWhatif()\">Hesapla</button>\n    <div id=\"whatifResult\" class=\"screen-result\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">22 · Kanıt Özeti / Araştırma Notları</p>\n    <p class=\"section-sub\">Bu bölümdeki içerik, gerçek sistematik derleme ve meta-analizler taranarak hazırlanmıştır (kaynaklar her konunun altında belirtilmiştir) — ancak yine de <b>durağan bir anlık görüntüdür</b>, canlı bir literatür taraması değildir. Yeni yayınlanan çalışmaları otomatik yakalamaz; içerik zaman zaman elle güncellenmelidir. Karmaşık/kritik vakalarda güncel klinik rehberler ve birincil literatür ile teyit edilmelidir.</p>\n    <div class=\"menu-select-row\">\n      <div class=\"field\"><label for=\"evidenceTopic\">Konu</label>\n        <select id=\"evidenceTopic\" onchange=\"dpRenderEvidence()\">\n          <option value=\"pcos\">PCOS (Polikistik Over Sendromu)</option>\n          <option value=\"t2d\">Tip 2 Diyabet</option>\n          <option value=\"ckd\">Kronik Böbrek Hastalığı</option>\n          <option value=\"dyslipidemia\">Dislipidemi</option>\n          <option value=\"obesity\">Obezite</option>\n          <option value=\"htn\">Hipertansiyon</option>\n          <option value=\"celiac\">Çölyak Hastalığı</option>\n          <option value=\"nafld\">Karaciğer Yağlanması (NAFLD/MASLD)</option>\n          <option value=\"gout\">Gut Hastalığı</option>\n          <option value=\"hypothyroid\">Hipotiroidi</option>\n          <option value=\"pku\">Fenilketonüri (PKU)</option>\n          <option value=\"athlete\">Sporcu Beslenmesi — Protein Zamanlaması</option>\n        </select>\n      </div>\n    </div>\n    <div id=\"evidenceBox\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">23 · Besin Değişim Hesaplayıcı</p>\n    <p class=\"section-sub\">Bir besinin belirli miktarına, protein açısından eşdeğer olan başka bir besinin ne kadarının karşılık geldiğini hesaplar (kalori farkıyla birlikte). Programın besin veritabanını kullanır; yapay zekâ değildir, düz hesaptır.</p>\n    <div class=\"grid\" style=\"margin-bottom:16px;\">\n      <div><label for=\"exchFromFood\">Kaynak Besin</label><select id=\"exchFromFood\"></select></div>\n      <div><label for=\"exchFromAmount\">Miktar (porsiyon katsayısı)</label><input ty
