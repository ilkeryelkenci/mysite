then(function(){ showMsg('✓ Kopyalandı.'); })\n      .catch(function(){\n        try{ document.execCommand('copy'); showMsg('✓ Kopyalandı.'); }\n        catch(e2){ showMsg('Otomatik kopyalama olmadı — metin kutusundan elle seçip kopyalayabilirsiniz.'); }\n      });\n      return;\n    }\n  }catch(e){}\n  try{ document.execCommand('copy'); showMsg('✓ Kopyalandı.'); }\n  catch(e2){ showMsg('Otomatik kopyalama olmadı — metin kutusundan elle seçip kopyalayabilirsiniz.'); }\n}\n\n\n// ================= HASTANE YEMEK MENÜSÜ ÇAPRAZ KONTROLÜ (kural tabanlı, AI değil) =================\nconst DP_HOSPITAL_DISHES = {\n  corba:{label:'Çorbalar', items:[\n    {id:'mercimek_corba', n:'Mercimek Çorbası', flags:['highK','highP','highCarb']},\n    {id:'yesil_mercimek_corba', n:'Yeşil Mercimek Çorbası', flags:['highK','highP','highCarb']},\n    {id:'ezogelin_corba', n:'Ezogelin Çorbası', flags:['highK','highP','highCarb']},\n    {id:'yayla_corba', n:'Yayla Çorbası (Yoğurtlu)', flags:['hasLactose','highNa']},\n    {id:'yogurt_corba', n:'Nane\\'li Yoğurt Çorbası', flags:['hasLactose']},\n    {id:'tarhana_corba', n:'Tarhana Çorbası', flags:['hasLactose','highNa']},\n    {id:'un_corba', n:'Un Çorbası', flags:['hasGluten','highCarb']},\n    {id:'sebze_corba', n:'Sebze Çorbası', flags:['highNa']},\n    {id:'domates_corba', n:'Domates Çorbası', flags:['highK','highNa']},\n    {id:'brokoli_corba', n:'Brokoli Çorbası (Kremalı)', flags:['hasLactose','highK','highFat']},\n    {id:'mantar_corba', n:'Kremalı Mantar Çorbası', flags:['hasLactose','highNa','highFat']},\n    {id:'tavuk_sehriye', n:'Tavuk Suyu Çorba (Şehriyeli)', flags:['hasGluten']},\n    {id:'tavuklu_sebze_corba', n:'Tavuklu Sebze Çorbası', flags:[]},\n    {id:'balik_corba', n:'Balık Çorbası', flags:['highPurine']},\n    {id:'mahluta_corba', n:'Mahluta Çorbası', flags:['hasLactose','highK','highP']},\n    {id:'toyga_corba', n:'Toyga Çorbası', flags:['hasLactose','highK']},\n    {id:'elvankiz_corba', n:'Elvankız Çorbası', flags:['hig  var host = document.getElementById('hospitalMenuChecklist');\n  if(!host) return;\n  var html = '';\n  Object.keys(DP_HOSPITAL_DISHES).forEach(function(catKey){\n    var cat = DP_HOSPITAL_DISHES[catKey];\n    html += '<p style=\"font-size:12px;font-weight:600;text-transform:uppercase;color:var(--dp-acc,#C08A2E);letter-spacing:.04em;margin:14px 0 6px;\">'+cat.label+'</p>';\n    cat.items.forEach(function(item){\n      html += '<label class=\"screen-check\"><input type=\"checkbox\" class=\"hospitalDishCheck\" value=\"'+item.id+'\"> '+item.n+'</label>';\n    });\n  });\n  host.innerHTML = html;\n  dpAutoFillHospitalKcal();\n}\nfunction dpAutoFillHospitalKcal(){\n  var kcalEl = document.getElementById('hospitalKcalTarget');\n  if(!kcalEl || kcalEl.value) return; // zaten doluysa dokunma\n  try{\n    if(typeof dpTarget === 'function'){\n      var t = Math.round(dpTarget());\n      if(t && !isNaN(t)) kcalEl.value = t;\n    }\n  }catch(e){}\n}\n\nfunction dpFindDish(id){\n  var catKeys = Object.keys(DP_HOSPITAL_DISHES);\n  for(var i=0;i<catKeys.length;i++){\n    var cat = catKeys[i];\n    var items = DP_HOSPITAL_DISHES[cat].items;\n    for(var j=0;j<items.length;j++){\n      if(items[j].id === id) return {item:items[j], cat:cat};\n    }\n  }\n  return null;\n}\n\nconst DP_GOAL_LABELS = {\n  lose:'Kilo Verme', gain:'Kilo Alma', maintain:'Kilo Koruma', athlete:'Sporcu'\n};\nconst DP_STANDARD_PORTION = {\n  corba:{amount:200, unit:'ml'},\n  anayemek:{amount:150, unit:'g'},\n  pilav:{amount:150, unit:'g'},\n  sebze:{amount:150, unit:'g'},\n  salata:{amount:100, unit:'g'},\n  tatli:{amount:80, unit:'g'},\n  ekmek:{amount:50, unit:'g'}\n};\nconst DP_FREE_CATEGORIES = ['sebze','salata']; // kısıtlama yoksa serbest kabul edilir\n\nfunction dpSuggestPortion(cat, severity, hedefKcal){\n  var ref = DP_STANDARD_PORTION[cat];\n  if(!ref) return null;\n  if(!hedefKcal){\n    // hedef kalori girilmediyse, kısıtlama olmayan sebze/salata için \"serbest\" göster\n    if(severity==='ok' && DP_FREE_CATEGORIES.indexOf(cat) > -1) return 'Serbest (ölçülü)';\n    return null;\n  }\n  var scale = hedefKcal / 2000; // 2000 kcal genel referans günlük alım\n  var amount = ref.amount * scale;\n  if(severity === 'warn') amount *= 0.6; // dikkat/azalt işaretli kalemde ek kısıtlama\n  if(severity==='ok' && DP_FREE_CATEGORIES.indexOf(cat) > -1 && severity!=='warn') return 'Serbest (ölçülü)';\n  return '~'+Math.round(amount)+' '+ref.unit;\n}\n\nfunction dpGoalNote(item, cat, goal){\n  if(goal === 'lose'){\n    if(item.flags.indexOf('highFat') > -1){\n      return 'Kalori yoğunluğu yüksek; kilo verme hedefinde porsiyon sınırlandırılabilir veya sınırlı sıklıkla tüketilebilir.';\n    }\n  } else if(goal === 'gain'){\n    if(item.flags.length === 0){\n      return 'Hafif bir seçenek; kilo alımı hedefleniyorsa yanına ekmek, zeytinyağı, kuruyemiş veya süt ürünü gibi ek bir kalori kaynağı eklenmesi düşünülebilir.';\n    }\n  } else if(goal === 'athlete'){\n    if(cat === 'tatli'){\n      return 'Antrenman sonrası dönemde bu tatlı yerine veya yanında protein ağırlıklı bir seçenek (yoğurt, süt, peynir) tercih edilebilir.';\n    }\n    if(cat === 'anayemek' && item.flags.length === 0){\n      return 'İyi bir protein kaynağıdır; sporcu için uygun bir ana öğün seçeneğidir.';\n    }\n  }\n  return '';\n}\n\nfunction dpAnalyzeHospitalMenu(){\n  var checked = Array.prototype.slice.call(document.querySelectorAll('.hospitalDishCheck'))\n    .filter(function(c){ return c.checked; }).map(function(c){ return c.value; });\n  var restrictionIds = Object.keys(DP_RESTRICTIONS).filter(function(id){\n    var el = document.getElementById(id);\n    return el && el.checked;\n  });\n  var goalEl = document.getElementById('hospitalGoal');\n  var goal = goalEl ? goalEl.value : 'none';\n  var kcalEl = document.getElementById('hospitalKcalTarget');\n  var hedefKcal = kcalEl ? parseFloat(kcalEl.value) : NaN;\n  if(isNaN(hedefKcal)) hedefKcal = null;\n\n  var host = document.getElementById('hospitalMenuResult');\n  if(!checked.length){ host.innerHTML = '<p style=\"font-size:13px;color:#6B6455;\">Lütfen bugünkü menüden en az bir yemek işaretleyin.</p>'; return; }\n  if(!restrictionIds.length && goal==='none'){ host.innerHTML = '<p style=\"font-size:13px;color:#6B6455;\">Lütfen en az bir kısıtlama/durum veya hedef seçin.</p>'; return; }\n\n  var rows = checked.map(function(id){\n    var found = dpFindDish(id);\n    if(!found) return '';\n    var item = found.item, cat = found.cat;\n    var conflicts = restrictionIds.map(function(rid){ return DP_RESTRICTIONS[rid]; })\n      .filter(function(r){ return item.flags.indexOf(r.flag) > -1; });\n    var goalNote = goal !== 'none' ? dpGoalNote(item, cat, goal) : '';\n    var goalHtml = goalNote ? (' <i>('+DP_GOAL_LABELS[goal]+': '+goalNote+')</i>') : '';\n\n    if(!conflicts.length){\n      var portionOk = dpSuggestPortion(cat, 'ok', hedefKcal);\n      return '<tr><td>'+item.n+'</td><td><span class=\"risk-flag risk-no\">✔ Uygun</span></td><td>'+(portionOk||'—')+'</td><td>'+(goalHtml || '—')+'</td></tr>';\n    }\n\n    var removeConflicts = conflicts.filter(function(c){ return c.severity==='remove'; });\n    var warnConflicts = conflicts.filter(function(c){ return c.severity==='warn'; });\n\n    if(removeConflicts.length){\n      var altItem = DP_HOSPITAL_DISHES[cat].items.filter(function(alt){\n        if(alt.id === item.id) return false;\n        return !conflicts.some(function(c){ return alt.flags.indexOf(c.flag) > -1; });\n      })[0];\n      var reason = removeConflicts.map(function(c){ return c.label; }).join(', ');\n      var altText = altItem ? ('Önerilen alternatif: <b>'+altItem.n+'</b>'+(function(){ var p=dpSuggestPortion(cat,'ok',hedefKcal); return p?(' ('+p+')'):''; })()) : 'Bu kategoride uygun bir alternatif bulunamadı; diyetisyen değerlendirmesi gerekir.';\n      return '<tr><td>'+item.n+'</td><td><span class=\"risk-flag risk-yes\">❌ Çıkarılmalı</span></td><td>—</td><td>'+reason+' nedeniyle uygun değil. '+altText+goalHtml+'</td></tr>';\n    } else {\n      var reason2 = warnConflicts.map(function(c){ return c.label; }).join(', ');\n      var portionWarn = dpSuggestPortion(cat, 'warn', hedefKcal);\n      return '<tr><td>'+item.n+'</td><td><span class=\"risk-flag risk-yes\">⚠ Dikkat / Azalt</span></td><td>'+(portionWarn||'Azaltılmış porsiyon')+'</td><td>'+reason2+' açısından ölçülü porsiyon önerilir.'+goalHtml+'</td></tr>';\n    }\n  }).join('');\n\n  var kcalNote = hedefKcal\n    ? ('Porsiyon önerileri, girilen '+hedefKcal+' kcal/gün hedefine göre 2000 kcal referans alınarak ölçeklenmiştir.')\n    : 'Kişiye özel porsiyon miktarı için yukarıya hastanın günlük hedef kalorisini girin; girilmezse yalnızca sebze/salata gibi serbest kategoriler işaretlenir.';\n\n  host.innerHTML = '<table class=\"exchange-table\"><tr><th>Yemek</th><th>Durum</th><th>Önerilen Porsiyon</th><th>Not / Alternatif</th></tr>'+rows+'</table>'\n    + '<p style=\"font-size:11.5px;color:#6B6455;margin-top:12px;\">'+kcalNote+' Bu sonuçlar, yaygın hastane/kurum yemeklerinin genel bilinen besin özelliklerine dayalı bir <b>kural tabanlı ön kontroldür</b>; gerçek bir menü dosyasını okuyan yapay zekâ değildir. Porsiyon önerileri kaba bir tahmindir — kesin miktar danışanın laboratuvar değerleri ve klinik durumuna göre diyetisyen tarafından belirlenmelidir.</p>';\n}\ndpPopulateHospitalMenu();\n\n\n// ================= KILAVUZ KARŞILAŞTIRMASI (statik referans, canlı tarama değil) =================\nconst DP_GUIDELINES = {\n  protein_general:{title:'Protein İhtiyacı — Genel Hastane Hastası',\n    rows:[\n      ['ESPEN','1.2–1.5 g/kg/gün (malnütrisyon riski olmayan genel hastane hastası)'],\n      ['ASPEN','1.2–2.0 g/kg/gün (hastalık şiddetine göre değişken)'],\n      ['KDIGO','Böbrek fonksiyonuna ve evreye göre değişir — ayrı KBY başlıklarına bakınız']\n    ],\n    note:'Kılavuzlar arasında tam sayısal uyum yoktur; hastanın klinik tablosuna göre aralığın neresinde kalınacağına diyetisyen/hekim karar verir.'},\n  protein_icu:{title:'Protein İhtiyacı — Kritik Hasta (Yoğun Bakım)',\n    rows:[\n      ['ESPEN','~1.3 g/kg/gün, genellikle kademeli artırılarak'],\n      ['ASPEN','1.2–2.0 g/kg/gün; travma/yanık gibi hiperkatabolik durumlarda daha yüksek uçlar düşünülebilir']\n    ],\n    note:'Kesin hedef; hastanın klinik seyri, organ fonksiyonları ve tolere edilebilirliğine göre bireyselleştirilir.'},\n  energy_calc:{title:'Enerji İhtiyacı Hesaplama Yaklaşımı',\n    rows:[\n      ['ESPEN','Mümkünse indirekt kalorimetri; yoksa yaklaşık 25–30 kcal/kg/gün'],\n      ['ASPEN','Benzer şekilde; pratikte sıklıkla 25–30 kcal/kg/gün kullanılır']\n    ],\n    note:'Obezite, yanık, hiperkatabolik durumlar gibi özel tablolarda düzeltme faktörleri gerekebilir; bu hesap hekim/diyetisyen tarafından yapılmalıdır.'},\n  ckd_predialysis:{title:'KBY — Diyalize Girmeyen (Evre 3-5) Protein Yaklaşımı',\n    rows:[\n      ['KDIGO / KDOQI','~0.55–0.60 g/kg/gün (ağırlıklı bitkisel/karışık protein kaynaklı) VEYA uygun hastalarda çok düşük proteinli yaklaşım (0.28–0.43 g/kg/gün) + keto asit analogları']\n    ],\n    note:'Aşırı düşük protein alımı malnütrisyon riski taşır; yakın laboratuvar izlemi ve diyetisyen desteği olmadan uygulanmamalıdır.'},\n  ckd_hd:{title:'KBY — Hemodiyaliz Protein İhtiyacı',\n    rows:[\n      ['KDIGO / KDOQI','1.0–1.2 g/kg/gün — diyaliz sırasında oluşan protein kaybını telafi etmek için diyalize girmeyen hastaya göre daha yüksektir']\n    ],\n    note:'Periton diyalizi hastalarında da diyalizat sıvısıyla protein kaybı nedeniyle benzer veya biraz daha yüksek ihtiyaç söz konusu olabilir.'},\n  diabetes_approach:{title:'Diyabette Beslenme Yaklaşımı',\n    rows:[\n      ['ADA','Bireyselleştirilmiş yaklaşım; tek bir \"ideal\" karbonhidrat yüzdesi tanımlanmaz, karbonhidrat kalitesi ve tutarlılığı vurgulanır'],\n      ['EASD','Akdeniz tarzı beslenme desenini destekler; benzer şekilde bireyselleştirmeyi öne çıkarır']\n    ],\n    note:'Düşük karbonhidratlı yaklaşımlar bazı hastalarda kısa-orta vadede fayda gösterebilir — ayrıntı için \"Kanıt Özeti\" bölümündeki Tip 2 Diyabet başlığına bakınız.'},\n  refeeding_risk:{title:'Refeeding Sendromu Risk Değerlendirme Kriterleri',\n    rows:[\n      ['Yaygın klinik kriterler (NICE benzeri)','BMI &lt;16 kg/m², son 3-6 ayda %15\\'ten fazla istemsiz kilo kaybı, 10 günden uzun süredir çok az/hiç besin alımı, tedavi öncesi düşük potasyum/fosfor/magnezyum düzeyleri'],\n      ['ESPEN / ASPEN genel görüşü','Yüksek riskli hastalarda düşük enerji düzeyinde başlanıp kademeli artırılması; fosfor, potasyum, magnezyum düzeylerinin beslenme başlamadan önce ve sırasında yakından izlenmesi']\n    ],\n    note:'Bu bölüm yalnızca genel farkındalık amaçlıdır. Spesifik başlangıç hızı/miktarı bu programda hesaplanmaz; refeeding sendromu riski taşıyan hastalarda beslenme planı mutlaka hekim/diyetisyen tarafından yakın laboratuvar takibiyle bireyselleştirilmelidir.'},\n  enteral_timing:{title:'Enteral Beslenmeye Başlama Zamanlaması (Kritik Hasta)',\n    rows:[\n      ['ESPEN','Hemodinamik olarak stabil hastalarda genellikle ilk 24-48 saat içinde erken enteral beslenme önerilir'],\n      ['ASPEN','Benzer şekilde 24-48 saat içinde erken enteral beslenmeyi destekler']\n    ],\n    note:'Kontrolsüz şok veya hemodinamik instabilite gibi durumlarda başlama ertelenir; karar tamamen klinik tabloya ve hekim değerlendirmesine bağlıdır.'},\n  tuber_general:{title:'Genel Yaklaşım — TÜBER (Türkiye Beslenme Rehberi)',\n    rows:[\n      ['TÜBER (T.C. Sağlık Bakanlığı)','Bitki ağırlıklı, çeşitli ve dengeli bir beslenme deseni; sebze, meyve, tam tahıllar, tuzsuz yağlı tohumlar/sert kabuklu yemişler; et ve süt ürünlerinin ılımlı tüketimi; yağ, basit şeker veya tuz açısından zengin ama mikro besin ögesi açısından fakir besinlerin (kızarmış patates, şekerli besinler/içecekler) çok sınırlı tüketilmesi'],\n      ['TÜBER Tabak Modeli','Her öğünde tabakta yer alan besin gruplarından (sebze-meyve, tahıl, süt-yoğurt-peynir, et-yumurta-baklagil) birer seçim yapılması; günlük yeterli su tüketimi ve zeytinyağı kullanımı vurgulanır']\n    ],\n    note:'TÜBER, WHO/EFSA ile uyumlu, Türkiye\\'ye özgü porsiyon ve besin grubu önerileri sunan resmi ulusal rehberdir (T.C. Sağlık Bakanlığı Halk Sağlığı Genel Müdürlüğü). Bu programın \"Tabak Yöntemi Görsel Rehberi\" kartı, TÜBER\\'in tabak modeliyle büyük ölçüde örtüşür.'},\n  tuber_salt_sugar:{title:'Tuz ve Şeker Üst Sınırı — TÜBER / WHO',\n    rows:[\n      ['Tuz (WHO / TÜBER uyumlu)','Günlük &lt;5 gram (~1 tatlı kaşığı) önerilir'],\n      ['Serbest Şeker (WHO / TÜBER uyumlu)','Toplam günlük enerjinin &lt;%10\\'u, ideal olarak &lt;%5\\'i serbest şekerlerden gelmelidir (2000 kcal için ideal hedef ~25 g/gün civarı)'],\n      ['Türkiye\\'de Fiili Tüketim (TBSA-2017 verisi)','15 yaş üzeri bireylerde günlük ortalama sofra şekeri tüketimi ~20 g olarak bulunmuştur (bu yalnızca sofra şekeri; işlenmiş gıdalardaki gizli şekerler dahil değildir)']\n    ],\n    note:'Bu eşikler genel popülasyon içindir; diyabet, hipertansiyon gibi durumlarda bireysel hedefler daha sıkı olabilir. Ürün etiketi değerlendirmesi için \"Etiket Okuma Rehberi\" kartına bakınız.'}\n};\n\nfunction dpRenderGuideline(){\n  var key = document.getElementById('guidelineTopic').value;\n  var g = DP_GUIDELINES[key];\n  var host = document.getElementById('guidelineBox');\n  var rowsHtml = g.rows.map(function(r){\n    return '<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td></tr>';\n  }).join('');\n  host.innerHTML =\n    '<table class=\"exchange-table\" style=\"margin-bottom:12px;\"><tr><th>Kurum / Kaynak</th><th>Öneri</th></tr>'+rowsHtml+'</table>'\n    + '<div class=\"dp-prep\"><b>Not:</b> '+g.note+'</div>';\n}\ndpRenderGuideline();\n\n\n// ================= SU ALIM GÜNLÜĞÜ =================\nlet dpWaterLogTotal = 0;\nfunction dpAddWater(ml){ dpWaterLogTotal += ml; dpRenderWaterLog(); }\nfunction dpAddWaterCustom(){\n  var el = document.getElementById('waterLogCustom');\n  var v = parseFloat(el.value);\n  if(!v || v<=0){ alert('Lütfen geçerli bir miktar girin.'); return; }\n  dpWaterLogTotal += v;\n  el.value = '';\n  dpRenderWaterLog();\n}\nfunction dpResetWaterLog(){ dpWaterLogTotal = 0; dpRenderWaterLog(); }\nfunction dpRenderWaterLog(){\n  var goalEl = document.getElementById('waterLogGoal');\n  var bar = document.getElementById('waterLogBar');\n  var txt = document.getElementById('waterLogText');\n  if(!goalEl || !bar || !txt) return;\n  var goal = parseFloat(goalEl.value) || 2000;\n  var pct = Math.min(100, Math.round(dpWaterLogTotal/goal*100));\n  bar.style.width = pct+'%';\n  txt.textContent = Math.round(dpWaterLogTotal).toLocaleString('tr-TR')+' ml / '+goal.toLocaleString('tr-TR')+' ml ('+pct+'%)';\n}\ndpRenderWaterLog();\n\n\n// ================= FİZİKSEL AKTİVİTE GÜNLÜĞÜ =================\nlet dpActivityLog = [];\nconst DP_ACT_LABELS = {'3.0':'Yavaş Yürüyüş','3.5':'Orta Tempo Yürüyüş','5.0':'Tempolu Yürüyüş','7.0':'Bisiklet','8.0':'Hafif Koşu','10.0':'Koşu','4.0':'Yüzme (hafif)','6.0':'Direnç Antrenmanı'};\nfunction dpAddActivity(){\n  var met = parseFloat(document.getElementById('actLogType').value);\n  var mins = parseFloat(document.getElementById('actLogMin').value);\n  var wt = parseFloat(document.getElementById('actLogWeight').value) || 70;\n  if(!mins || mins<=0){ alert('Lütfen geçerli bir süre girin.'); return; }\n  var kcal = (met * 3.5 * wt / 200) * mins;\n  dpActivityLog.push({label: DP_ACT_LABELS[String(met)]||'Aktivite', mins:mins, kcal:kcal});\n  dpRenderActivityLog();\n}\nfunction dpDeleteActivity(i){ dpActivityLog.splice(i,1); dpRenderActivityLog(); }\nfunction dpResetActivityLog(){ dpActivityLog=[]; dpRenderActivityLog(); }\nfunction dpRenderActivityLog(){\n  var host = document.getElementById('actLogList');\n  var totalEl = document.getElementById('actLogTotal');\n  if(!host || !totalEl) return;\n  if(!dpActivityLog.length){ host.innerHTML = '<p style=\"font-size:13px;color:#6B6455;\">Henüz aktivite eklenmedi.</p>'; totalEl.textContent=''; return; }\n  host.innerHTML = '<ul style=\"margin:0;padding-left:20px;font-size:13.5px;\">' + dpActivityLog.map(function(a,i){\n    return '<li>'+a.label+' — '+a.mins+' dk (~'+Math.round(a.kcal)+' kcal) <span style=\"cursor:pointer;color:#A5452F;text-decoration:underline;margin-left:8px;\" onclick=\"dpDeleteActivity('+i+')\">Sil</span></li>';\n  }).join('') + '</ul>';\n  var totalKcal = dpActivityLog.reduce(function(s,a){return s+a.kcal;},0);\n  var totalMin = dpActivityLog.reduce(function(s,a){return s+a.mins;},0);\n  totalEl.textContent = 'Toplam: '+totalMin+' dakika, ~'+Math.round(totalKcal)+' kcal';\n}\ndpRenderActivityLog();\n\n\n// ================= MUTFAK ÖLÇÜ BİRİMİ ÇEVİRİCİ =================\nconst DP_VOLUME_ML = {su_bardagi:200, cay_bardagi:100, yemek_kasigi:15, tatli_kasigi:8, cay_kasigi:5, ml:1};\nconst DP_KITCHEN_DENSITY = {un:0.65, seker:1.0, pirinc:0.95, sivi_yag:0.90, sut_su_yogurt:1.0, bulgur:0.85};\nconst DP_KITCHEN_LABELS = {un:'Un', seker:'Toz Şeker', pirinc:'Pirinç', sivi_yag:'Sıvı Yağ', sut_su_yogurt:'Süt/Su/Yoğurt', bulgur:'Bulgur',\n  su_bardagi:'su bardağı', cay_bardagi:'çay bardağı', yemek_kasigi:'yemek kaşığı', tatli_kasigi:'tatlı kaşığı', cay_kasigi:'çay kaşığı', gram:'gram', ml:'ml'};\nfunction dpConvertKitchen(){\n  var ing = document.getElementById('kitchenIngredient').value;\n  var amount = parseFloat(document.getElementById('kitchenAmount').value);\n  var fromUnit = document.getElementById('kitchenFromUnit').value;\n  var toUnit = document.getElementById('kitchenToUnit').value;\n  if(!amount || amount<=0){ alert('Lütfen geçerli bir miktar girin.'); return; }\n  var density = DP_KITCHEN_DENSITY[ing];\n\n  var ml;\n  if(fromUnit === 'gram'){ ml = amount / density; }\n  else { ml = amount * DP_VOLUME_ML[fromUnit]; }\n\n  var result;\n  if(toUnit === 'gram'){ result = ml * density; }\n  else { result = ml / DP_VOLUME_ML[toUnit]; }\n\n  document.getElementById('kitchenResult').innerHTML =\n    '<div class=\"dp-prep\"><b>'+amount+' '+DP_KITCHEN_LABELS[fromUnit]+' '+DP_KITCHEN_LABELS[ing]+'</b> ≈ <b>'+result.toFixed(1)+' '+DP_KITCHEN_LABELS[toUnit]+'</b>'\n    + '<br><br><i>Bu değerler yaygın kullanılan pratik mutfak ölçü tablosuna dayanır; marka ve nem oranına göre küçük farklılıklar olabilir.</i></div>';\n}\n\n\n// ================= DANIŞAN MEMNUNİYET ANKETİ =================\nlet dpSurveys = [];\nfunction dpSaveSurvey(){\n  var name = document.getElementById('survName').value.trim() || 'İsimsiz';\n  var q1 = parseInt(document.getElementById('surv_q1').value,10);\n  var q2 = parseInt(document.getElementById('surv_q2').value,10);\n  var q3 = parseInt(document.getElementById('surv_q3').value,10);\n  var q4 = parseInt(document.getElementById('surv_q4').value,10);\n  var comment = document.getElementById('survComment').value.trim();\n  dpSurveys.push({name:name, date:new Date().toLocaleDateString('tr-TR'), q1:q1,q2:q2,q3:q3,q4:q4, comment:comment});\n  document.getElementById('survComment').value = '';\n  dpRenderSurveys();\n}\nfunction dpRenderSurveys(){\n  var host = document.getElementById('surveyList');\n  if(!dpSurveys.length){ host.innerHTML='<p style=\"font-size:13px;color:#6B6455;\">Henüz yanıt yok.</p>'; return; }\n  function avg(key){ return (dpSurveys.reduce(function(s,r){return s+r[key];},0)/dpSurveys.length).toFixed(1); }\n  host.innerHTML = '<p style=\"font-size:13.5px;margin-bottom:10px;\"><b>Ortalamalar</b> ('+dpSurveys.length+' yanıt): Memnuniyet '+avg('q1')+' · Uygunluk '+avg('q2')+' · İletişim '+avg('q3')+' · Genel '+avg('q4')+'</p>'\n    + '<table class=\"exchange-table\"><tr><th>Ad</th><th>Tarih</th><th>Ort.</th><th>Yorum</th></tr>'\n    + dpSurveys.map(function(r){\n        var ort = ((r.q1+r.q2+r.q3+r.q4)/4).toFixed(1);\n        return '<tr><td>'+r.name+'</td><td>'+r.date+'</td><td>'+ort+'</td><td>'+(r.comment||'—')+'</td></tr>';\n      }).join('') + '</table>';\n}\nfunction dpExportSurveys(){\n  var blob = new Blob([JSON.stringify(dpSurveys,null,2)], {type:'application/json'});\n  var url = URL.createObjectURL(blob);\n  var a = document.createElement('a'); a.href=url; a.download='memnuniyet-anketi.json';\n  document.body.appendChild(a); a.click();\n  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1000);\n}\ndpRenderSurveys();\n\n\n// ================= PAYLAŞILAN: DANIŞAN ÖZET VERİSİ TOPLAMA =================\nfunction dpParseTrDate(s){\n  if(!s) return null;\n  var m = String(s).match(/^(\\d{1,2})[.\\/](\\d{1,2})[.\\/](\\d{4})$/);\n  if(!m) return null;\n  return new Date(parseInt(m[3],10), parseInt(m[2],10)-1, parseInt(m[1],10));\n}\nfunction dpGatherClientSummary(){\n  var name = (document.getElementById('patientName')||{}).value || 'Danışan';\n  var date = (document.getElementById('patientDate')||{}).value || new Date().toLocaleDateString('tr-TR');\n  var condTxt='', target=null;\n  try{\n    var condSel = (typeof DP_COND_ID!=='undefined') ? document.getElementById(DP_COND_ID) : null;\n    if(condSel && condSel.selectedIndex>=0) condTxt = condSel.options[condSel.selectedIndex].textContent;\n    target = (typeof dpTarget==='function') ? Math.round(dpTarget()) : null;\n  }catch(e){}\n\n  var weightData = (typeof dpTrackData!=='undefined') ? dpTrackData.filter(function(d){return d.weight!=null && !isNaN(d.weight);}) : [];\n  var weightTrend = null;\n  if(weightData.length>=2){\n    var firstW = weightData[0], lastW = weightData[weightData.length-1];\n    weightTrend = { first:firstW, last:lastW, change: lastW.weight-firstW.weight, count: weightData.length };\n  } else if(weightData.length===1){\n    weightTrend = { first:weightData[0], last:weightData[0], change:0, count:1 };\n  }\n\n  var goalData = (typeof dpGoalHistory!=='undefined') ? dpGoalHistory : [];\n  var goalStats = null;\n  if(goalData.length){\n    var totalScore = goalData.reduce(function(s,r){return s+r.score;},0);\n    var totalMax = goalData.reduce(function(s,r){return s+r.total;},0);\n    goalStats = { pct: totalMax?Math.round(totalScore/totalMax*100):0, count: goalData.length };\n  }\n\n  return { name:name, date:date, condTxt:condTxt, target:target, weightData:weightData, weightTrend:weightTrend, goalData:goalData, goalStats:goalStats };\n}\n\n\n// ================= DANIŞAN TEK SAYFA ÖZET / ZAMAN ÇİZELGESİ =================\nfunction dpRenderTimeline(){\n  var s = dpGatherClientSummary();\n  var host = document.getElementById('timelineBox');\n\n  var headHtml = '<div class=\"dp-prep\" style=\"margin-bottom:12px;\"><b>'+s.name+'</b> — '+s.date\n    + (s.condTxt ? (' · '+s.condTxt) : '') + (s.target ? (' · Hedef: ~'+s.target+' kcal') : '') + '</div>';\n\n  var weightHtml = '';\n  if(s.weightTrend){\n    var dir = s.weightTrend.change>0 ? 'artış' : (s.weightTrend.change<0 ? 'azalış' : 'değişim yok');\n    weightHtml = '<div class=\"dp-prep\" style=\"margin-bottom:12px;\"><b>Kilo Trendi:</b> '+s.weightTrend.first.weight+' kg ('+s.weightTrend.first.date+') → '+s.weightTrend.last.weight+' kg ('+s.weightTrend.last.date+') — toplam '+dir+': '+Math.abs(s.weightTrend.change).toFixed(1)+' kg, '+s.weightTrend.count+' ölçüm</div>';\n  } else {\n    weightHtml = '<div class=\"dp-prep\" style=\"margin-bottom:12px;\"><b>Kilo Trendi:</b> Henüz kayıt yok (Takip Grafikleri kartından ekleyin).</div>';\n  }\n\n  var goalHtml = '';\n  if(s.goalStats){\n    goalHtml = '<div class=\"dp-prep\" style=\"margin-bottom:12px;\"><b>Günlük Hedef Başarı Oranı:</b> %'+s.goalStats.pct+' ('+s.goalStats.count+' gün kaydedildi)</div>';\n  } else {\n    goalHtml = '<div class=\"dp-prep\" style=\"margin-bottom:12px;\"><b>Günlük Hedef:</b> Henüz kayıt yok.</div>';\n  }\n\n  // Birleşik zaman çizelgesi: kilo + hedef girişlerini tarih sırasına göre listele\n  var events = [];\n  s.weightData.forEach(function(d){ events.push({date:d.date, parsed:dpParseTrDate(d.date), text:'Kilo: '+d.weight+' kg'}); });\n  s.goalData.forEach(function(d){ events.push({date:d.date, parsed:dpParseTrDate(d.date), text:'Günlük Hedef: '+d.score+'/'+d.total}); });\n  events.sort(function(a,b){\n    if(a.parsed && b.parsed) return a.parsed - b.parsed;\n    return 0;\n  });\n  var timelineHtml = '';\n  if(events.length){\n    timelineHtml = '<b>Birleşik Zaman Çizelgesi:</b><ul style=\"margin:8px 0 0;padding-left:20px;font-size:13.5px;\">'\n      + events.map(function(e){ return '<li>'+e.date+' — '+e.text+'</li>'; }).join('')\n      + '</ul>';\n  } else {\n    timelineHtml = '<i>Henüz zaman çizelgesi oluşturacak veri yok.</i>';\n  }\n\n  host.innerHTML = headHtml + weightHtml + goalHtml + '<div class=\"dp-prep\">'+timelineHtml+'</div>';\n}\n\n\n// ================= OTOMATİK TREND UYARILARI (kural tabanlı) =================\nfunction dpAnalyzeTrend(){\n  var host = document.getElementById('trendBox');\n  var data = (typeof dpTrackData!=='undefined') ? dpTrackData.filter(function(d){return d.weight!=null && !isNaN(d.weight);}) : [];\n  if(data.length < 2){\n    host.innerHTML = '<p style=\"font-size:13px;color:#6B6455;\">Trend belirlemek için Takip Grafikleri kartında en az 2 kilo ölçümü gerekli.</p>';\n    return;\n  }\n  var alerts = [];\n  var recent = data.slice(-3);\n  if(recent.length>=2){\n    var recentChange = recent[recent.length-1].weight - recent[0].weight;\n    if(Math.abs(recentChange) >= 0.1){\n      var dir = recentChange>0 ? 'artış' : 'azalış';\n      alerts.push('Son '+recent.length+' ölçümde '+Math.abs(recentChange).toFixed(1)+' kg '+dir+' yönünde bir eğilim var.');\n    } else {\n      alerts.push('Son ölçümler arasında belirgin bir değişim yok (kilo stabil görünüyor).');\n    }\n  }\n\n  var totalChange = data[data.length-1].weight - data[0].weight;\n  var avgPerEntry = totalChange / (data.length-1);\n  alerts.push('Toplam '+data.length+' ölçüm boyunca ortalama değişim: ölçüm başına ~'+avgPerEntry.toFixed(2)+' kg.');\n\n  var targetEl = document.getElementById('trendTargetWeight');\n  var target = parseFloat(targetEl.value);\n  if(target){\n    var remaining = data[data.length-1].weight - target;\n    if(Math.abs(remaining) < 0.1){\n      alerts.push('Hedef kiloya ulaşılmış görünüyor.');\n    } else {\n      alerts.push('Hedefe kalan: ~'+Math.abs(remaining).toFixed(1)+' kg ('+(remaining>0?'azaltma':'artırma')+' yönünde).');\n      if(avgPerEntry !== 0 && (remaining>0) === (avgPerEntry<0)){\n        var entriesNeeded = Math.abs(remaining/avgPerEntry);\n        alerts.push('Mevcut ortalama hızla devam edilirse, yaklaşık '+Math.ceil(entriesNeeded)+' ölçüm sonra hedefe ulaşılabilir (yalnızca kaba bir projeksiyon).');\n      }\n    }\n  }\n\n  var goalData = (typeof dpGoalHistory!=='undefined') ? dpGoalHistory : [];\n  if(goalData.length>=3){\n    var recentGoals = goalData.slice(-3);\n    var recentPct = recentGoals.reduce(function(s,r){return s+r.score/r.total;},0)/recentGoals.length*100;\n    var overallPct = goalData.reduce(function(s,r){return s+r.score/r.total;},0)/goalData.length*100;\n    if(recentPct < overallPct - 10){\n      alerts.push('Son günlerdeki hedef başarı oranı (%'+Math.round(recentPct)+'), genel ortalamanın (%'+Math.round(overallPct)+') altında — motivasyon desteği faydalı olabilir.');\n    } else if(recentPct > overallPct + 10){\n      alerts.push('Son günlerdeki hedef başarı oranı (%'+Math.round(recentPct)+'), genel ortalamanın (%'+Math.round(overallPct)+') üzerinde — olumlu bir gidişat.');\n    }\n  }\n\n  host.innerHTML = '<div class=\"dp-prep\"><ul style=\"margin:0;padding-left:20px;\">' + alerts.map(function(a){ return '<li style=\"margin-bottom:8px;\">'+a+'</li>'; }).join('') + '</ul>'\n    + '<p style=\"font-size:11.5px;color:#6B6455;margin-top:6px;\">Bu yalnızca kayıtlı verilerin aritmetik özetidir; gerçek nedenler (su dengesi, kas kütlesi, ölçüm koşulları) klinik değerlendirme gerektirir.</p></div>';\n}\n\n\n// ================= İLK GÖRÜŞME ANAMNEZ FORMU =================\nfunction dpBuildIntake(){\n  var name = (document.getElementById('patientName')||{}).value || 'Danışan';\n  var date = (document.getElementById('patientDate')||{}).value || new Date().toLocaleDateString('tr-TR');\n  function v(id){ return (document.getElementById(id)||{}).value || '—'; }\n\n  var text = 'İLK GÖRÜŞME ANAMNEZ FORMU\\n'\n    + 'Danışan: '+name+'   Tarih: '+date+'\\n\\n'\n    + 'Başvuru Nedeni: '+v('intakeComplaint')+'\\n\\n'\n    + 'Tıbbi Öykü:\\n'+v('intakeMedHistory')+'\\n\\n'\n    + 'Kullanılan İlaçlar / Takviyeler:\\n'+v('intakeMeds')+'\\n\\n'\n    + 'Bilinen Alerjiler / İntoleranslar:\\n'+v('intakeAllergies')+'\\n\\n'\n    + 'Sigara / Alkol Kullanımı: '+v('intakeSmoking')+'\\n\\n'\n    + 'Fiziksel Aktivite Düzeyi:\\n'+v('intakeActivity')+'\\n\\n'\n    + 'Beslenme Alışkanlıkları:\\n'+v('intakeEating')+'\\n\\n'\n    + 'Hedefler / Beklentiler:\\n'+v('intakeGoals');\n\n  document.getElementById('intakeText').value = text;\n  document.getElementById('intakeBox').style.display = 'block';\n  var msg = document.getElementById('intakeCopyMsg');\n  if(msg){ msg.style.display='none'; msg.textContent=''; }\n  document.getElementById('intakeBox').scrollIntoView({behavior:'smooth', block:'nearest'});\n}\nfunction dpCopyIntake(){\n  var ta = document.getElementById('intakeText');\n  var msg = document.getElementById('intakeCopyMsg');\n  function showMsg(t){ if(msg){ msg.textContent=t; msg.style.display='block'; } }\n  ta.focus(); ta.select();\n  try{\n    if(navigator.clipboard && navigator.clipboard.writeText){\n      navigator.clipboard.writeText(ta.value).then(function(){ showMsg('✓ Kopyalandı.'); })\n      .catch(function(){\n        try{ document.execCommand('copy'); showMsg('✓ Kopyalandı.'); }\n        catch(e2){ showMsg('Otomatik kopyalama olmadı — metin kutusundan elle seçip kopyalayabilirsiniz.'); }\n      });\n      return;\n    }\n  }catch(e){}\n  try{ document.execCommand('copy'); showMsg('✓ Kopyalandı.'); }\n  catch(e2){ showMsg('Otomatik kopyalama olmadı — metin kutusundan elle seçip kopyalayabilirsiniz.'); }\n}\n\n\n// ================= TAM DANIŞAN ÖZET RAPORU (yazdırılabilir) =================\nfunction dpPrintFullReport(mode){\n  var s = dpGatherClientSummary();\n\n  var weightHtml = '<p><i>Henüz kilo kaydı yok.</i></p>';\n  if(s.weightTrend){\n    var dir = s.weightTrend.change>0 ? 'artış' : (s.weightTrend.change<0 ? 'azalış' : 'değişim yok');\n    weightHtml = '<p><b>İlk ölçüm:</b> '+s.weightTrend.first.weight+' kg ('+s.weightTrend.first.date+') &nbsp; → &nbsp; <b>Son ölçüm:</b> '+s.weightTrend.last.weight+' kg ('+s.weightTrend.last.date+')<br>'\n      + '<b>Toplam '+dir+':</b> '+Math.abs(s.weightTrend.change).toFixed(1)+' kg &nbsp;(' +s.weightTrend.count+' ölçüm)</p>';\n  }\n\n  var goalHtml = s.goalStats\n    ? ('<p><b>Genel başarı oranı:</b> %'+s.goalStats.pct+' ('+s.goalStats.count+' gün kaydedildi)</p>')\n    : '<p><i>Henüz günlük hedef kaydı yok.</i></p>';\n\n  var weightRows = s.weightData.map(function(d){ return '<tr><td>'+d.date+'</td><td>'+d.weight+' kg</td></tr>'; }).join('');\n  var weightTableHtml = s.weightData.length\n    ? ('<table style=\"width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;\"><tr><th style=\"text-align:left;border-bottom:1px solid #ccc;padding:4px;\">Tarih</th><th style=\"text-align:left;border-bottom:1px solid #ccc;padding:4px;\">Kilo</th></tr>'+weightRows+'</table>')\n    : '';\n\n  var html = '<div class=\"dp-report-head\">'\n    + '<div class=\"dp-rh-title\">Diyetisyen İlker — Danışan Özet Raporu</div>'\n    + '<div class=\"dp-rh-meta\"><b>Danışan:</b> '+s.name+' &nbsp;|&nbsp; <b>Tarih:</b> '+s.date\n    + (s.condTxt ? (' &nbsp;|&nbsp; <b>Program:</b> '+s.condTxt) : '')\n    + (s.target ? (' &nbsp;|&nbsp; <b>Hedef:</b> ~'+s.target+' kcal/gün') : '') + '</div></div>'\n    + '<h3>Kilo Trendi</h3>' + weightHtml + weightTableHtml\n    + '<h3 style=\"margin-top:20px;\">Günlük Hedef Takibi</h3>' + goalHtml;\n\n  var css = Array.from(document.querySelectorAll('style')).map(function(s2){return s2.textContent;}).join('\\n')\n    + '.dp-report-head{border-bottom:2px solid #1E3F3A;padding-bottom:10px;margin-bottom:22px;}'\n    + '.dp-rh-title{font-family:Fraunces,serif;font-size:24px;font-weight:600;margin-bottom:6px;}'\n    + '.dp-rh-meta{font-size:13px;}'\n    + 'body{background:#fff;padding:24px;font-family:Inter,sans-serif;}'\n    + 'h3{font-family:Fraunces,serif;color:#1E3F3A;}';\n\n  var p = {type:'nutriPrint', css:css, html:html, title:'Danışan Özet Raporu', filename:'danisan-ozet-raporu.html', action:mode};\n\n  if(window.parent && window.parent!==window){ window.parent.postMessage(p,'*'); return; }\n  if(mode==='download'){ doDownload(p); return; }\n  var w = window.open('','_blank');\n  if(!w){ doDownload(p); return; }\n  w.document.write('<!DOCTYPE html><html lang=\"tr\"><head><meta charset=\"UTF-8\"><title>'+p.title+'</title>'\n    + '<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@500&display=swap\" rel=\"stylesheet\">'\n    + '<style>'+p.css+'<\/style></head><body>'+p.html+'</body></html>');\n  w.document.close();\n  setTimeout(function(){ w.focus(); w.print(); },600);\n}\n\n\n// ================= ÇOKLU HASTALIK KESİŞİM REHBERİ (kural tabanlı) =================\nconst DP_CONDITION_FLAGS = {\n  diyabet:{label:'Diyabet', flags:['limit_sugar','limit_refined_carb']},\n  hipertansiyon:{label:'Hipertansiyon', flags:['limit_sodium']},\n  kby_erken:{label:'KBY (Diyalize Girmeyen)', flags:['limit_sodium','limit_potassium','limit_phosphorus','limit_protein_moderate']},\n  kby_diyaliz:{label:'KBY (Hemodiyaliz)', flags:['increase_protein','limit_potassium','limit_phosphorus','limit_fluid']},\n  dislipidemi:{label:'Dislipidemi', flags:['limit_satfat','limit_transfat']},\n  obezite:{label:'Obezite', flags:['limit_calorie']},\n  gut:{label:'Gut', flags:['limit_purine','limit_alcohol']},\n  celiac:{label:'Çölyak', flags:['avoid_gluten']},\n  nafld:{label:'Karaciğer Yağlanması', flags:['limit_sugar','limit_satfat','limit_alcohol']},\n  kalp_yetmezligi:{label:'Kalp Yetmezliği', flags:['limit_sodium','limit_fluid']},\n  osteoporoz:{label:'Osteoporoz', flags:['increase_calcium_vitd']},\n  anemi:{label:'Anemi', flags:['increase_iron']}\n};\nconst DP_FLAG_LABELS = {\n  limit_sugar:'Şeker/rafine karbonhidrat kısıtlaması', limit_refined_carb:'Rafine karbonhidrat kısıtlaması',\n  limit_sodium:'Sodyum (tuz) kısıtlaması', limit_potassium:'Potasyum kısıtlaması', limit_phosphorus:'Fosfor kısıtlaması',\n  limit_protein_moderate:'Ilımlı protein kısıtlaması', increase_protein:'Artırılmış protein ihtiyacı',\n  limit_fluid:'Sıvı kısıtlaması', limit_satfat:'Doymuş yağ kısıtlaması', limit_transfat:'Trans yağ kısıtlaması',\n  limit_calorie:'Kalori kısıtlaması', limit_purine:'Pürin kısıtlaması', limit_alcohol:'Alkol kısıtlaması/kaçınma',\n  avoid_gluten:'Glutenden kaçınma', increase_calcium_vitd:'Artırılmış kalsiyum/D vitamini ihtiyacı', increase_iron:'Artırılmış demir ihtiyacı'\n};\nconst DP_OPPOSING_PAIRS = [['limit_protein_moderate','increase_protein']];\n\nfunction dpPopulateMultiCond(){\n  var host = document.getElementById('multiCondChecklist');\n  if(!host) return;\n  host.innerHTML = Object.keys(DP_CONDITION_FLAGS).map(function(key){\n    return '<label class=\"screen-check\"><input type=\"checkbox\" class=\"multiCondCheck\" value=\"'+key+'\"> '+DP_CONDITION_FLAGS[key].label+'</label>';\n  }).join('');\n}\nfunction dpAnalyzeMultiCondition(){\n  var checked = Array.prototype.slice.call(document.querySelectorAll('.multiCondCheck')).filter(function(c){return c.checked;}).map(function(c){return c.value;});\n  var host = document.getElementById('multiCondResult');\n  if(checked.length < 2){ host.innerHTML = '<p style=\"font-size:13px;color:#6B6455;\">Lütfen en az 2 durum seçin.</p>'; return; }\n\n  var flagCounts = {};\n  checked.forEach(function(c){\n    DP_CONDITION_FLAGS[c].flags.forEach(function(f){ flagCounts[f] = (flagCounts[f]||0)+1; });\n  });\n  var shared = Object.keys(flagCounts).filter(function(f){ return flagCounts[f] === checked.length; });\n  var partial = Object.keys(flagCounts).filter(function(f){ return flagCounts[f] > 1 && flagCounts[f] < checked.length; });\n  var conflicts = [];\n  DP_OPPOSING_PAIRS.forEach(function(pair){\n    if(flagCounts[pair[0]] && flagCounts[pair[1]]) conflicts.push(DP_FLAG_LABELS[pair[0]]+' ↔ '+DP_FLAG_LABELS[pair[1]]);\n  });\n\n  var html = '<div class=\"dp-prep\" style=\"margin-bottom:10px;\"><b>Seçilen durumlar:</b> '+checked.map(function(c){return DP_CONDITION_FLAGS[c].label;}).join(', ')+'</div>';\n  if(shared.length){\n    html += '<div class=\"dp-prep\" style=\"margin-bottom:10px;\"><b>✔ Tüm durumlarda ortak kısıtlama:</b><ul style=\"margin:6px 0 0;padding-left:20px;\">'+shared.map(function(f){return '<li>'+DP_FLAG_LABELS[f]+'</li>';}).join('')+'</ul></div>';\n  }\n  if(partial.length){\n    html += '<div class=\"dp-prep\" style=\"margin-bottom:10px;\"><b>⚠ Bazı durumlarda geçerli (tümünde değil):</b><ul style=\"margin:6px 0 0;padding-left:20px;\">'+partial.map(function(f){return '<li>'+DP_FLAG_LABELS[f]+' ('+flagCounts[f]+'/'+checked.length+' durumda)</li>';}).join('')+'</ul></div>';\n  }\n  if(conflicts.length){\n    html += '<div class=\"dp-prep\" style=\"margin-bottom:10px;background:#F5E1DC;\"><b>⚠️ Potansiyel çelişki:</b><ul style=\"margin:6px 0 0;padding-left:20px;\">'+conflicts.map(function(c){return '<li>'+c+' — bireysel değerlendirme gerektirir</li>';}).join('')+'</ul></div>';\n  }\n  if(!shared.length && !partial.length && !conflicts.length){\n    html += '<p style=\"font-size:13px;color:#6B6455;\">Seçilen durumlar arasında belirgin bir ortak kısıtlama veya çelişki tespit edilmedi.</p>';\n  }\n  html += '<p style=\"font-size:11.5px;color:#6B6455;margin-top:10px;\">Bu, kural tabanlı bir ön tarama aracıdır; her hastanın gerçek beslenme planı laboratuvar değerleri ve klinik durumuna göre bireyselleştirilmelidir.</p>';\n  host.innerHTML = html;\n}\ndpPopulateMultiCond();\n\n\n// ================= DANIŞAN GÖRÜNÜMÜ MODU =================\nconst DP_CLINICAL_ONLY_CARDS = [7,10,12,14,20,22,24,25,26,30,34,35,36,37,38];\nlet dpPatientViewActive = false;\nfunction dpTagCardsByNumber(){\n  document.querySelectorAll('.card').forEach(function(card){\n    var titleEl = card.querySelector('.section-title');\n    if(!titleEl) return;\n    var m = titleEl.textContent.match(/^(\\d+)\\s*·/);\n    if(m) card.setAttribute('data-card-num', m[1]);\n  });\n}\nfunction dpTogglePatientView(){\n  dpPatientViewActive = !dpPatientViewActive;\n  document.querySelectorAll('.card[data-card-num]').forEach(function(card){\n    var num = parseInt(card.getAttribute('data-card-num'), 10);\n    if(DP_CLINICAL_ONLY_CARDS.indexOf(num) > -1){\n      card.style.display = dpPatientViewActive ? 'none' : '';\n    }\n  });\n  var btn = document.getElementById('patientViewToggleBtn');\n  if(btn) btn.textContent = dpPatientViewActive ? '👁️ Klinik Görünüme Dön' : '👁️ Danışan Görünümüne Geç';\n}\ndpTagCardsByNumber();\n\n\n// ================= HAFTALIK ÖZ-DEĞERLENDİRME SORULARI =================\nlet dpReflections = [];\nfunction dpSaveReflection(){\n  var q1 = document.getElementById('reflect_q1').value.trim();\n  var q2 = document.getElementById('reflect_q2').value.trim();\n  var q3 = document.getElementById('reflect_q3').value.trim();\n  var q4 = document.getElementById('reflect_q4').value.trim();\n  if(!q1 && !q2 && !q3 && !q4){ alert('Lütfen en az bir soruyu yanıtlayın.'); return; }\n  dpReflections.push({date:new Date().toLocaleDateString('tr-TR'), q1:q1,q2:q2,q3:q3,q4:q4});\n  ['reflect_q1','reflect_q2','reflect_q3','reflect_q4'].forEach(function(id){ document.getElementById(id).value=''; });\n  dpRenderReflections();\n}\nfunction dpRenderReflections(){\n  var host = document.getElementById('reflectionHistory');\n  if(!host) return;\n  if(!dpReflections.length){ host.innerHTML = '<p style=\"font-size:13px;color:#6B6455;\">Henüz kayıt yok.</p>'; return; }\n  host.innerHTML = dpReflections.slice().reverse().map(function(r){\n    return '<div class=\"dp-prep\" style=\"margin-bottom:10px;\"><b>'+r.date+'</b>'\n plit('_');\n  var idx = parseInt(parts[parts.length-1],10);\n  var catKey = parts.slice(0,-1).join('_');\n  var cat = DP_REAL_MENU[catKey];\n  if(!cat) return null;\n  var item = cat.items[idx];\n  return item ? {name:item[0], kcal:item[1]} : null;\n}\nfunction dpAddShiftItem(){\n  var period = document.getElementById('shiftPeriod').value;\n  var dishVal = document.getElementById('shiftDish').value;\n  var qty = parseFloat(document.getElementById('shiftQty').value) || 1;\n  var dish = dpFindShiftDish(dishVal);\n  if(!dish){ alert('Lütfen bir yemek seçin.'); return; }\n  dpShiftItems[period].push({name:dish.name, kcal:dish.kcal, qty:qty});\n  dpRenderShiftMenu();\n}\nfunction dpDeleteShiftItem(period, idx){\n  dpShiftItems[period].splice(idx,1);\n  dpRenderShiftMenu();\n}\nfunction dpResetShiftMenu(){\n  dpShiftItems = {once:[], orta:[], gece:[], sonu:[]};\n  dpRenderShiftMenu();\n}\nfunction dpRenderShiftMenu(){\n  var host = document.getElementById('shiftPeriodsBox');\n  if(!host) return;\n  var grandTotal = 0;\n  var html = '';\n  Object.keys(DP_SHIFT_PERIOD_LABELS).forEach(function(period){\n    var items = dpShiftItems[period];\n    var subtotal = items.reduce(function(s,it){ return s + it.kcal*it.qty; }, 0);\n    grandTotal += subtotal;\n    html += '<div class=\"dp-prep\" style=\"margin-bottom:12px;\"><b>'+DP_SHIFT_PERIOD_LABELS[period]+'</b> — alt toplam: <b>'+Math.round(subtotal)+' kcal</b>';\n    if(items.length){\n      html += '<ul style=\"margin:8px 0 0;padding-left:20px;font-size:13.5px;\">' + items.map(function(it,i){\n        return '<li>'+it.name+' × '+it.qty+' (~'+Math.round(it.kcal*it.qty)+' kcal) <span style=\"cursor:pointer;color:#A5452F;text-decoration:underline;margin-left:8px;\" onclick=\"dpDeleteShiftItem(\\''+period+'\\','+i+')\">Sil</span></li>';\n      }).join('') + '</ul>';\n    } else {\n      html += '<p style=\"font-size:12.5px;color:#6B6455;margin:6px 0 0;\">Henüz yemek eklenmedi.</p>';\n    }\n    html += '</div>';\n  });\n  host.innerHTML = html;\n\n  var target = parseFloat((document.getElementById('shiftKcalTarget')||{}).value) || 0;\n  var totalEl = document.getElementById('shiftGrandTotal');\n  if(totalEl){\n    var diff = target ? (grandTotal - target) : null;\n    var diffText = (target && diff!==null) ? (' (hedeften '+(diff>=0?'+':'')+Math.round(diff)+' kcal)') : '';\n    totalEl.textContent = 'Nöbet Geneli Toplam: '+Math.round(grandTotal)+' kcal'+(target?(' / Hedef: '+target+' kcal'+diffText):'');\n    totalEl.style.color = (target && Math.abs(diff) > target*0.15) ? '#A5452F' : 'var(--dp-head,#1E3F3A)';\n  }\n}\ndpPopulateShiftDish();\ndpRenderShiftMenu();\n\n\n// ================= MEVSİMSEL MEYVE-SEBZE REHBERİ =================\nvar DP_SEASONAL_CALENDAR = {\n  1:{meyve:['portakal','mandalina','greyfurt','elma','armut','ayva','kivi','muz'], sebze:['lahana','pırasa','kereviz','havuç','turp','ıspanak','brokoli','karnabahar','pazı']},\n  2:{meyve:['portakal','mandalina','greyfurt','elma','armut','kivi'], sebze:['lahana','pırasa','kereviz','havuç','turp','ıspanak','brokoli','karnabahar','pazı']},\n  3:{meyve:['portakal','mandalina','elma','armut','çilek','kivi'], sebze:['ıspanak','pazı','semizotu','enginar','taze fasulye','havuç','turp']},\n  4:{meyve:['çilek','kiraz','elma'], sebze:['enginar','bezelye','kuşkonmaz','taze fasulye','ıspanak','semizotu']},\n  5:{meyve:['çilek','kiraz','kayısı','şeftali'], sebze:['bezelye','kuşkonmaz','taze fasulye','domates','salatalık','bamya']},\n  6:{meyve:['kiraz','kayısı','şeftali','erik','karpuz','kavun','üzüm'], sebze:['domates','salatalık','biber','patlıcan','bamya','taze fasulye','kabak']},\n  7:{meyve:['şeftali','kayısı','erik','karpuz','kavun','üzüm','incir'], sebze:['domates','salatalık','biber','patlıcan','bamya','kabak']},\n  8:{meyve:['şeftali','erik','karpuz','kavun','üzüm','incir','nar'], sebze:['domates','biber','patlıcan','bamya','kabak']},\n  9:{meyve:['üzüm','incir','nar','elma','armut','ayva'], sebze:['domates','biber','patlıcan','kabak'
