pe=\"number\" id=\"exchFromAmount\" value=\"1\" step=\"0.1\"></div>\n      <div><label for=\"exchToFood\">Karşılaştırılacak Besin</label><select id=\"exchToFood\"></select></div>\n    </div>\n    <button class=\"btn-primary\" onclick=\"dpCalcExchange()\">Eşdeğerini Hesapla</button>\n    <div id=\"exchResult\" class=\"screen-result\"></div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">24 · Beslenme Tanısı Şablonu (NCPT / PES)</p>\n    <p class=\"section-sub\">Nutrition Care Process Terminology (NCPT) formatında bir PES ifadesi oluşturmanıza yardımcı olan bir şablondur. Bu bir yapay zekâ değildir — girdiğiniz bilgileri standart formatta bir araya getirir; tanıyı belirleyen ve onaylayan her zaman diyetisyendir.</p>\n    <div class=\"grid\" style=\"margin-bottom:16px;\">\n      <div><label for=\"ncptProblem\">P — Problem (Beslenme Tanısı)</label>\n        <select id=\"ncptProblem\">\n          <option value=\"Yetersiz enerji alımı\">Yetersiz enerji alımı</option>\n          <option value=\"Aşırı enerji alımı\">Aşırı enerji alımı</option>\n          <option value=\"Yetersiz protein-enerji alımı\">Yetersiz protein-enerji alımı</option>\n          <option value=\"İstenmeyen kilo kaybı\">İstenmeyen kilo kaybı</option>\n          <option value=\"İstenmeyen kilo artışı\">İstenmeyen kilo artışı</option>\n          <option value=\"Besin-ilaç etkileşimi riski\">Besin-ilaç etkileşimi riski</option>\n          <option value=\"Yetersiz mikro besin alımı\">Yetersiz mikro besin alımı</option>\n          <option value=\"Aşırı karbonhidrat alımı\">Aşırı karbonhidrat alımı</option>\n          <option value=\"Aşırı sodyum alımı\">Aşırı sodyum alımı</option>\n          <option value=\"Beslenmeyle ilgili bilgi eksikliği\">Beslenmeyle ilgili bilgi eksikliği</option>\n          <option value=\"Diğer\">Diğer (aşağıya yazınız)</option>\n        </select>\n      </div>\n    </div>\n    <div style=\"margin-bottom:16px;\">\n      <label style=\"display:block;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--dp-head,#1E3F3A);margin-bottom:6px;\">E — Etiyoloji (Neden)</label>\n      <textarea id=\"ncptEtiology\" rows=\"2\" style=\"width:100%;padding:10px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13.5px;box-sizing:border-box;\" placeholder=\"Örn: iştahsızlık, yutma güçlüğü, bilgi eksikliği, sosyoekonomik kısıtlılık…\"></textarea>\n    </div>\n    <div style=\"margin-bottom:18px;\">\n      <label style=\"display:block;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--dp-head,#1E3F3A);margin-bottom:6px;\">S — Belirti / Bulgu (Kanıt)</label>\n      <textarea id=\"ncptSigns\" rows=\"2\" style=\"width:100%;padding:10px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13.5px;box-sizing:border-box;\" placeholder=\"Örn: son 3 ayda %8 istemsiz kilo kaybı, albümin 2.8 g/dL…\"></textarea>\n    </div>\n    <button class=\"btn-primary\" onclick=\"dpBuildPES()\">PES İfadesi Oluştur</button>\n    <div id=\"pesBox\" style=\"display:none;margin-top:16px;background:var(--dp-soft,#EFE8D8);border:1px solid var(--dp-line,#D8CFB6);border-radius:4px;padding:16px;\">\n      <textarea id=\"pesText\" readonly rows=\"4\" style=\"width:100%;padding:10px;border:1px solid var(--dp-line,#D8CFB6);border-radius:3px;font-family:inherit;font-size:13px;background:#fff;box-sizing:border-box;\"></textarea>\n      <button class=\"btn-primary\" style=\"margin-top:12px;\" onclick=\"dpCopyPES()\">📋 Kopyala</button>\n      <p id=\"pesCopyMsg\" style=\"font-size:12px;color:var(--dp-head,#1E3F3A);margin-top:8px;display:none;\"></p>\n    </div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">25 · Hastane Yemek Menüsü Çapraz Kontrolü</p>\n    <p class=\"section-sub\"><b>Bu bir yapay zekâ değildir</b> — yüklenen bir Excel/PDF'i otomatik okumaz. Yaygın hastane/kurum yemeklerinden oluşan kürate edilmiş bir listeden, bugünkü menüde <b>gerçekten olan</b> yemekleri işaretlersiniz; araç bunları seçtiğiniz kısıtlamalara göre kural tabanlı kontrol edip aynı kategoriden alternatif ve <b>kişiye özel porsiyon önerisi</b> sunar (hedef kalori girilirse). Son karar ve porsiyon kesinliği her zaman danışanın laboratuvar değerlerine göre diyetisyene aittir.</p>\n    <p style=\"font-weight:700;color:var(--dp-head,#1E3F3A);margin-bottom:6px;\">Bugünkü Menüde Olan Yemekler</p>\n    <div id=\"hospitalMenuChecklist\" style=\"margin-bottom:20px;\"></div>\n    <p style=\"font-weight:700;color:var(--dp-head,#1E3F3A);margin-bottom:6px;\">Danışanın Kısıtlamaları / Durumu</p>\n    <div style=\"margin-bottom:18px;\">\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"restrict_diabetes\"> Diyabet (karbonhidrat kısıtlı)</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"restrict_potassium\"> Potasyum Kısıtlı (KBY)</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"restrict_phosphorus\"> Fosfor Kısıtlı (KBY)</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"restrict_sodium\"> Düşük Sodyum / Hipertansiyon</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"restrict_purine\"> Düşük Pürin (Gut)</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"restrict_gluten\"> Glutensiz (Çölyak)</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"restrict_lactose\"> Laktozsuz</label>\n    </div>\n    <p style=\"font-weight:700;color:var(--dp-head,#1E3F3A);margin-bottom:6px;\">Danışanın Hedefi (Kilo / Sporcu)</p>\n    <div class=\"menu-select-row\" style=\"margin-bottom:18px;\">\n      <div class=\"field\"><label for=\"hospitalGoal\">Hedef</label>\n        <select id=\"hospitalGoal\">\n          <option value=\"none\">Belirtilmedi / Nötr</option>\n          <option value=\"lose\">Kilo Verme</option>\n          <option value=\"gain\">Kilo Alma</option>\n          <option value=\"maintain\">Kilo Koruma</option>\n          <option value=\"athlete\">Sporcu</option>\n        </select>\n      </div>\n      <div class=\"field\"><label for=\"hospitalKcalTarget\">Hastanın Günlük Hedef Kalorisi (kcal, opsiyonel)</label><input type=\"number\" id=\"hospitalKcalTarget\" placeholder=\"örn. 1600\"></div>\n    </div>\n    <button class=\"btn-primary\" onclick=\"dpAnalyzeHospitalMenu()\">Analiz Et</button>\n    <div id=\"hospitalMenuResult\" class=\"screen-result\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">26 · Kılavuz Karşılaştırması (ESPEN / ASPEN / KDIGO / ADA-EASD)</p>\n    <p class=\"section-sub\">Uluslararası beslenme kılavuzlarının belirli konulardaki genel önerilerini yan yana gösteren <b>statik bir referans tablosudur</b> — canlı bir literatür taraması değildir, otomatik güncellenmez. Kılavuzlar zaman zaman güncellenir; kritik kararlarda ilgili kılavuzun güncel/tam metnini kontrol edin. Bu bölüm doz/hız hesaplayan bir araç değildir; refeeding sendromu gibi yüksek riskli konularda yalnızca genel farkındalık kriterleri sunar.</p>\n    <div class=\"menu-select-row\">\n      <div class=\"field\"><label for=\"guidelineTopic\">Konu</label>\n        <select id=\"guidelineTopic\" onchange=\"dpRenderGuideline()\">\n          <option value=\"protein_general\">Protein İhtiyacı — Genel Hastane Hastası</option>\n          <option value=\"protein_icu\">Protein İhtiyacı — Kritik Hasta (Yoğun Bakım)</option>\n          <option value=\"energy_calc\">Enerji İhtiyacı Hesaplama Yaklaşımı</option>\n          <option value=\"ckd_predialysis\">KBY — Diyalize Girmeyen (Evre 3-5) Protein Yaklaşımı</option>\n          <option value=\"ckd_hd\">KBY — Hemodiyaliz Protein İhtiyacı</option>\n          <option value=\"diabetes_approach\">Diyabette Beslenme Yaklaşımı</option>\n          <option value=\"refeeding_risk\">Refeeding Sendromu Risk Değerlendirme Kriterleri</option>\n          <option value=\"enteral_timing\">Enteral Beslenmeye Başlama Zamanlaması (Kritik Hasta)</option>\n          <option value=\"tuber_general\">Genel Yaklaşım — TÜBER (Türkiye Beslenme Rehberi)</option>\n          <option value=\"tuber_salt_sugar\">Tuz ve Şeker Üst Sınırı — TÜBER / WHO</option>\n        </select>\n      </div>\n    </div>\n    <div id=\"guidelineBox\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">27 · Su Alım Günlüğü</p>\n    <p class=\"section-sub\">Bugün içtiğin suyu hızlıca ekle, hedefe göre ilerlemeni gör. Yalnızca bu oturumda tutulur.</p>\n    <div class=\"grid\" style=\"margin-bottom:14px;\">\n      <div><label for=\"waterLogGoal\">Günlük Hedef (ml)</label><input type=\"number\" id=\"waterLogGoal\" value=\"2000\" onchange=\"dpRenderWaterLog()\"></div>\n    </div>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:90px;\" onclick=\"dpAddWater(200)\">+200 ml</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:90px;\" onclick=\"dpAddWater(250)\">+250 ml</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:90px;\" onclick=\"dpAddWater(500)\">+500 ml</button>\n    </div>\n    <div style=\"display:flex;gap:10px;align-items:flex-end;margin-bottom:8px;\">\n      <div style=\"flex:1;\"><label for=\"waterLogCustom\">Özel miktar (ml)</label><input type=\"number\" id=\"waterLogCustom\"></div>\n      <button class=\"btn-primary\" style=\"margin-top:0;\" onclick=\"dpAddWaterCustom()\">Ekle</button>\n    </div>\n    <div style=\"background:var(--dp-soft,#EFE8D8);border-radius:6px;height:22px;overflow:hidden;margin:18px 0 8px;\">\n      <div id=\"waterLogBar\" style=\"background:var(--dp-acc,#C08A2E);height:100%;width:0%;transition:width .3s;\"></div>\n    </div>\n    <p id=\"waterLogText\" style=\"font-size:13.5px;margin-bottom:14px;\">0 ml / 2000 ml</p>\n    <button class=\"btn-primary\" style=\"background:transparent;border:1px solid currentColor;\" onclick=\"dpResetWaterLog()\">Günü Sıfırla</button>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">28 · Fiziksel Aktivite Günlüğü</p>\n    <p class=\"section-sub\">Bugünkü hareketlerini kaydet. Kalori tahminleri standart MET formülüyle yapılan yaklaşık hesaplardır (gerçek harcama kişiye göre değişir).</p>\n    <div class=\"grid\" style=\"margin-bottom:14px;\">\n      <div><label for=\"actLogType\">Aktivite</label>\n        <select id=\"actLogType\">\n          <option value=\"3.0\">Yavaş Yürüyüş</option>\n          <option value=\"3.5\" selected>Orta Tempo Yürüyüş</option>\n          <option value=\"5.0\">Tempolu Yürüyüş</option>\n          <option value=\"7.0\">Bisiklet</option>\n          <option value=\"8.0\">Hafif Koşu</option>\n          <option value=\"10.0\">Koşu</option>\n          <option value=\"4.0\">Yüzme (hafif)</option>\n          <option value=\"6.0\">Direnç Antrenmanı</option>\n        </select>\n      </div>\n      <div><label for=\"actLogMin\">Süre (dakika)</label><input type=\"number\" id=\"actLogMin\" value=\"30\"></div>\n      <div><label for=\"actLogWeight\">Kilo (kg)</label><input type=\"number\" id=\"actLogWeight\" value=\"70\"></div>\n    </div>\n    <button class=\"btn-primary\" onclick=\"dpAddActivity()\">+ Ekle</button>\n    <div id=\"actLogList\" style=\"margin:16px 0;\"></div>\n    <p id=\"actLogTotal\" style=\"font-size:13.5px;font-weight:700;margin-bottom:14px;\"></p>\n    <button class=\"btn-primary\" style=\"background:transparent;border:1px solid currentColor;\" onclick=\"dpResetActivityLog()\">Günü Sıfırla</button>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">29 · Mutfak Ölçü Birimi Çevirici</p>\n    <p class=\"section-sub\">Su bardağı, yemek kaşığı gibi ölçüleri grama/mililitreye çevirir. Değerler malzemeye göre değişir; yaygın kullanılan pratik Türk mutfağı ölçü tablosu esas alınmıştır, marka/neme göre küçük farklar olabilir.</p>\n    <div class=\"grid\" style=\"margin-bottom:16px;\">\n      <div><label for=\"kitchenIngredient\">Malzeme</label>\n        <select id=\"kitchenIngredient\">\n          <option value=\"un\">Un</option>\n          <option value=\"seker\">Toz Şeker</option>\n          <option value=\"pirinc\">Pirinç</option>\n          <option value=\"sivi_yag\">Sıvı Yağ</option>\n          <option value=\"sut_su_yogurt\">Süt / Su / Yoğurt</option>\n          <option value=\"bulgur\">Bulgur</option>\n        </select>\n      </div>\n      <div><label for=\"kitchenAmount\">Miktar</label><input type=\"number\" id=\"kitchenAmount\" value=\"1\" step=\"0.1\"></div>\n      <div><label for=\"kitchenFromUnit\">Kaynak Birim</label>\n        <select id=\"kitchenFromUnit\">\n          <option value=\"su_bardagi\">Su Bardağı</option>\n          <option value=\"cay_bardagi\">Çay Bardağı</option>\n          <option value=\"yemek_kasigi\">Yemek Kaşığı</option>\n          <option value=\"tatli_kasigi\">Tatlı Kaşığı</option>\n          <option value=\"cay_kasigi\">Çay Kaşığı</option>\n          <option value=\"gram\">Gram</option>\n          <option value=\"ml\">Mililitre</option>\n        </select>\n      </div>\n      <div><label for=\"kitchenToUnit\">Hedef Birim</label>\n        <select id=\"kitchenToUnit\">\n          <option value=\"gram\" selected>Gram</option>\n          <option value=\"su_bardagi\">Su Bardağı</option>\n          <option value=\"cay_bardagi\">Çay Bardağı</option>\n          <option value=\"yemek_kasigi\">Yemek Kaşığı</option>\n          <option value=\"tatli_kasigi\">Tatlı Kaşığı</option>\n          <option value=\"cay_kasigi\">Çay Kaşığı</option>\n          <option value=\"ml\">Mililitre</option>\n        </select>\n      </div>\n    </div>\n    <button class=\"btn-primary\" onclick=\"dpConvertKitchen()\">Çevir</button>\n    <div id=\"kitchenResult\" class=\"screen-result\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">30 · Danışan Memnuniyet Anketi</p>\n    <p class=\"section-sub\">Danışanlarınıza doldurtabileceğiniz basit bir memnuniyet anketi. Yanıtlar bu oturumda bir listede tutulur; \"Dışa Aktar\" ile JSON dosyası olarak biriktirebilirsiniz.</p>\n    <div class=\"grid\" style=\"margin-bottom:14px;\">\n      <div><label for=\"survName\">Danışan Adı (opsiyonel)</label><input type=\"text\" id=\"survName\"></div>\n    </div>\n    <div class=\"grid\" style=\"margin-bottom:14px;\">\n      <div><label for=\"surv_q1\">Hizmetten Genel Memnuniyet</label>\n        <select id=\"surv_q1\"><option value=\"5\">5 — Çok memnunum</option><option value=\"4\">4</option><option value=\"3\">3</option><option value=\"2\">2</option><option value=\"1\">1 — Hiç memnun değilim</option></select>\n      </div>\n      <div><label for=\"surv_q2\">Programın Günlük Hayata Uygunluğu</label>\n        <select id=\"surv_q2\"><option value=\"5\">5 — Çok uygun</option><option value=\"4\">4</option><option value=\"3\">3</option><option value=\"2\">2</option><option value=\"1\">1 — Hiç uygun değil</option></select>\n      </div>\n      <div><label for=\"surv_q3\">Diyetisyenle İletişim</label>\n        <select id=\"surv_q3\"><option value=\"5\">5 — Çok iyi</option><option value=\"4\">4</option><option value=\"3\">3</option><option value=\"2\">2</option><option value=\"1\">1 — Yetersiz</option></select>\n      </div>\n      <div><label for=\"surv_q4\">Genel Deneyim</label>\n        <select id=\"surv_q4\"><option value=\"5\">5 — Mükemmel</option><option value=\"4\">4</option><option value=\"3\">3</option><option value=\"2\">2</option><option value=\"1\">1 — Zayıf</option></select>\n      </div>\n    </div>\n    <textarea id=\"survComment\" rows=\"2\" placeholder=\"Ek yorum (opsiyonel)\" style=\"width:100%;padding:10px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13.5px;box-sizing:border-box;margin-bottom:14px;\"></textarea>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;\" onclick=\"dpSaveSurvey()\">Yanıtı Kaydet</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\" onclick=\"dpExportSurveys()\">⬇️ Dışa Aktar (JSON)</button>\n    </div>\n    <div id=\"surveyList\"></div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">31 · Tabak Yöntemi Görsel Rehberi</p>\n    <p class=\"section-sub\">Basit, kanıta dayalı bir porsiyon kontrolü yöntemi (Harvard Sağlıklı Beslenme Tabağı ve ADA Diyabet Tabağı Yöntemi'nden uyarlanmıştır).</p>\n    <div style=\"display:flex;justify-content:center;margin:20px 0;\">\n      <div style=\"width:220px;height:220px;border-radius:50%;background:conic-gradient(#6B8F71 0deg 180deg, #C08A2E 180deg 270deg, #D4A24C 270deg 360deg);box-shadow:0 2px 8px rgba(0,0,0,.15);\"></div>\n    </div>\n    <ul style=\"font-size:13.5px;line-height:1.8;padding-left:20px;\">\n      <li><span style=\"color:#6B8F71;font-weight:700;\">●</span> Yarım Tabak — Sebze/Salata (nişastasız): brokoli, ıspanak, domates, salatalık, biber vb.</li>\n      <li><span style=\"color:#C08A2E;font-weight:700;\">●</span> Çeyrek Tabak — Protein Kaynağı: tavuk, balık, yumurta, baklagil, az yağlı peynir</li>\n      <li><span style=\"color:#D4A24C;font-weight:700;\">●</span> Çeyrek Tabak — Tam Tahıl/Kompleks Karbonhidrat: bulgur, esmer pirinç, tam buğday makarna, tatlı patates</li>\n    </ul>\n    <p style=\"font-size:12.5px;color:#6B6455;margin-top:10px;\">Yanına bir avuç sağlıklı yağ (zeytinyağı, avokado, ceviz) ve bir bardak su/ayran eklenebilir. Bu genel bir rehberdir; KBY, PKU gibi bazı durumlarda diyetisyenin özel önerileri bu oranları değiştirebilir.</p>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">32 · Etiket Okuma Rehberi</p>\n    <p class=\"section-sub\">Ürün etiketlerini hızlıca değerlendirmek için pratik bir rehber (AB/İngiltere tarzı \"trafik ışığı\" eşiklerine dayanır — 100 g/ml başına).</p>\n    <table class=\"exchange-table\" style=\"margin-bottom:16px;\">\n      <tr><th>Besin Ögesi</th><th>Düşük (Yeşil)</th><th>Yüksek (Kırmızı, dikkat)</th></tr>\n      <tr><td>Şeker</td><td>&lt; 5 g/100g</td><td>&gt; 22,5 g/100g</td></tr>\n      <tr><td>Toplam Yağ</td><td>&lt; 3 g/100g</td><td>&gt; 17,5 g/100g</td></tr>\n      <tr><td>Doymuş Yağ</td><td>&lt; 1,5 g/100g</td><td>&gt; 5 g/100g</td></tr>\n      <tr><td>Tuz</td><td>&lt; 0,3 g/100g</td><td>&gt; 1,5 g/100g</td></tr>\n    </table>\n    <div class=\"dp-prep\" style=\"margin-bottom:10px;\"><b>İçindekiler listesi:</b> Malzemeler miktara göre azalan sırada yazılır — listenin başındaki 2-3 madde, ürünün ağırlıklı içeriğidir.</div>\n    <div class=\"dp-prep\" style=\"margin-bottom:10px;\"><b>\"Şekersiz\" ve \"İlave Şekersiz\" farklıdır:</b> \"İlave şekersiz\" sonradan şeker eklenmediği anlamına gelir; üründe doğal şeker (meyve, süt) yine de bulunabilir.</div>\n    <div class=\"dp-prep\"><b>E-kodları:</b> Tümü zararlı değildir; çoğu gıda güvenliği kurumlarınca onaylı, sınırları belirlenmiş katkı maddeleridir (örn. E300 = C vitamini). Belirli bir katkı maddesiyle ilgili endişe varsa diyetisyeninize danışın.</div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">33 · Ramazan / Oruç Dönemi Beslenme Rehberi</p>\n    <p class=\"section-sub\">Genel bilgilendirme amaçlıdır. <b>Diyabet, böbrek hastalığı, hamilelik, emzirme veya başka bir kronik durumu olan danışanlarda oruç tutma kararı mutlaka hekimle birlikte, bireysel olarak değerlendirilmelidir.</b></p>\n    <div class=\"dp-prep\" style=\"margin-bottom:10px;\"><b>Sahur:</b> Kompleks karbonhidrat (bulgur, yulaf, tam tahıllı ekmek), yeterli protein ve lif ağırlıklı, yavaş sindirilen besinler tercih edilebilir; bu besinler tokluk hissini daha uzun sürdürebilir.</div>\n    <div class=\"dp-prep\" style=\"margin-bottom:10px;\"><b>İftar:</b> Hurma ve su/ayranla açıp kademeli ilerlemek (önce çorba, sonra ana yemek) sindirim sistemine daha uygun olabilir. Aşırı yağlı/kızartma ağırlıklı iftar sofraları rahatsızlık hissi yaratabilir.</div>\n    <div class=\"dp-prep\" style=\"margin-bottom:10px;\"><b>Sıvı Tüketimi:</b> İftar-sahur arasında yeterli su tüketimine dikkat edilmesi, gündüz susuzluk hissini azaltabilir.</div>\n    <div class=\"dp-prep\"><b>Kilo Yönetimi:</b> Oruç döneminde ani kilo değişimleri yerine dengeli, ölçülü bir yaklaşım önerilir; iftar sofrasında porsiyon kontrolü önemlidir.</div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">34 · Danışan Tek Sayfa Özet / Zaman Çizelgesi</p>\n    <p class=\"section-sub\">Üstteki bilgilerden, Takip Grafikleri (kilo) ve Günlük Hedef kartlarındaki mevcut verilerden derlenir. Ayrı ayrı kartlara bakmak yerine tek bir görünümde özetler.</p>\n    <button class=\"btn-primary\" onclick=\"dpRenderTimeline()\">Özeti Oluştur</button>\n    <div id=\"timelineBox\" style=\"margin-top:16px;\"></div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">35 · Otomatik Trend Uyarıları</p>\n    <p class=\"section-sub\">Bu bir yapay zekâ değildir — Takip Grafikleri kartındaki kayıtlı kilo verisini kural tabanlı analiz eder. Yalnızca farkındalık amaçlıdır, klinik karar yerine geçmez.</p>\n    <div class=\"grid\" style=\"margin-bottom:16px;\">\n      <div><label for=\"trendTargetWeight\">Hedef Kilo (kg, opsiyonel)</label><input type=\"number\" id=\"trendTargetWeight\" step=\"0.1\"></div>\n    </div>\n    <button class=\"btn-primary\" onclick=\"dpAnalyzeTrend()\">Trend Analiz Et</button>\n    <div id=\"trendBox\" style=\"margin-top:16px;\"></div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">36 · İlk Görüşme Anamnez Formu</p>\n    <p class=\"section-sub\">Yeni bir danışanla ilk görüşmede kullanabileceğiniz yapılandırılmış bir ön bilgi formu şablonu. Doldurduklarınızı düzenli bir formatta bir araya getirir; kopyalayıp kendi dosyanıza/EMR'inize ekleyebilirsiniz.</p>\n    <div class=\"grid\" style=\"margin-bottom:14px;\">\n      <div><label for=\"intakeComplaint\">Başvuru Nedeni / Şikayet</label><input type=\"text\" id=\"intakeComplaint\"></div>\n      <div><label for=\"intakeSmoking\">Sigara / Alkol Kullanımı</label><input type=\"text\" id=\"intakeSmoking\"></div>\n    </div>\n    <div style=\"margin-bottom:14px;\"><label style=\"display:block;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--dp-head,#1E3F3A);margin-bottom:6px;\">Tıbbi Öykü</label>\n      <textarea id=\"intakeMedHistory\" rows=\"2\" style=\"width:100%;padding:10px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13.5px;box-sizing:border-box;\" placeholder=\"Bilinen kronik hastalıklar, geçirilmiş ameliyatlar…\"></textarea>\n    </div>\n    <div style=\"margin-bottom:14px;\"><label style=\"display:block;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--dp-head,#1E3F3A);margin-bottom:6px;\">Kullanılan İlaçlar / Takviyeler</label>\n      <textarea id=\"intakeMeds\" rows=\"2\" style=\"width:100%;padding:10px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13.5px;box-sizing:border-box;\"></textarea>\n    </div>\n    <div style=\"margin-bottom:14px;\"><label style=\"display:block;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--dp-head,#1E3F3A);margin-bottom:6px;\">Bilinen Alerjiler / İntoleranslar</label>\n      <textarea id=\"intakeAllergies\" rows=\"2\" style=\"width:100%;padding:10px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13.5px;box-sizing:border-box;\"></textarea>\n    </div>\n    <div style=\"margin-bottom:14px;\"><label style=\"display:block;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--dp-head,#1E3F3A);margin-bottom:6px;\">Fiziksel Aktivite Düzeyi</label>\n      <textarea id=\"intakeActivity\" rows=\"2\" style=\"width:100%;padding:10px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13.5px;box-sizing:border-box;\"></textarea>\n    </div>\n    <div style=\"margin-bottom:14px;\"><label style=\"display:block;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--dp-head,#1E3F3A);margin-bottom:6px;\">Beslenme Alışkanlıkları</label>\n      <textarea id=\"intakeEating\" rows=\"2\" style=\"width:100%;padding:10px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13.5px;box-sizing:border-box;\" placeholder=\"Öğün sayısı, atıştırma sıklığı, dışarıda yeme sıklığı…\"></textarea>\n    </div>\n    <div style=\"margin-bottom:18px;\"><label style=\"display:block;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--dp-head,#1E3F3A);margin-bottom:6px;\">Hedefler / Beklentiler</label>\n      <textarea id=\"intakeGoals\" rows=\"2\" style=\"width:100%;padding:10px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13.5px;box-sizing:border-box;\"></textarea>\n    </div>\n    <button class=\"btn-primary\" onclick=\"dpBuildIntake()\">Formu Oluştur</button>\n    <div id=\"intakeBox\" style=\"display:none;margin-top:16px;background:var(--dp-soft,#EFE8D8);border:1px solid var(--dp-line,#D8CFB6);border-radius:4px;padding:16px;\">\n      <textarea id=\"intakeText\" readonly rows=\"14\" style=\"width:100%;padding:10px;border:1px solid var(--dp-line,#D8CFB6);border-radius:3px;font-family:inherit;font-size:13px;background:#fff;box-sizing:border-box;\"></textarea>\n      <button class=\"btn-primary\" style=\"margin-top:12px;\" onclick=\"dpCopyIntake()\">📋 Kopyala</button>\n      <p id=\"intakeCopyMsg\" style=\"font-size:12px;color:var(--dp-head,#1E3F3A);margin-top:8px;display:none;\"></p>\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">37 · Tam Danışan Özet Raporu</p>\n    <p class=\"section-sub\">Danışanın profili, kilo trendi ve hedef başarı oranını tek bir yazdırılabilir sayfada birleştirir.</p>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;\" onclick=\"dpPrintFullReport('print')\">🖨️ Yazdır</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\" onclick=\"dpPrintFullReport('download')\">⬇️ İndir</button>\n    </div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">38 · Çoklu Hastalık Kesişim Rehberi</p>\n    <p class=\"section-sub\">Danışanda birden fazla durum varsa, hangi kısıtlamaların ortak olduğunu ve nerede dikkatli bir bireyselleştirme gerekebileceğini kural tabanlı gösterir. Bu bir tanı/tedavi aracı değildir.</p>\n    <div id=\"multiCondChecklist\" style=\"margin-bottom:16px;\"></div>\n    <button class=\"btn-primary\" onclick=\"dpAnalyzeMultiCondition()\">Analiz Et</button>\n    <div id=\"multiCondResult\" class=\"screen-result\"></div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">39 · Bütçe Dostu Beslenme Rehberi</p>\n    <p class=\"section-sub\">Sınırlı bütçeyle sağlıklı ve dengeli beslenmeyi sürdürmek için pratik öneriler.</p>\n    <div class=\"dp-prep\" style=\"margin-bottom:10px;\"><b>Ucuz Protein Kaynakları:</b> Yumurta, mercimek, nohut, kuru fasulye, konserve balık (ton/sardalya) ve tavuğun but/kanat gibi parçaları genellikle kırmızı ete göre daha uygun fiyatlıdır ve kaliteli protein sağlar.</div>\n    <div class=\"dp-prep\" style=\"margin-bottom:10px;\"><b>Mevsiminde Alışveriş:</b> Sebze ve meyveyi mevsiminde almak hem daha ucuz hem genellikle daha lezzetlidir. Donmuş sebzeler hasat anında dondurulduğu için besin değeri açısından tazeye yakın olabilir; fiyat ve israf avantajı sağlar.</div>\n    <div class=\"dp-prep\" style=\"margin-bottom:10px;\"><b>Haftalık Planlama:</b> Haftalık menü planlayıp ona göre alışveriş yapmak gereksiz alım ve gıda israfını azaltır. Kuru bakliyat, bulgur, yulaf gibi raf ömrü uzun ürünler toplu alınabilir.</div>\n    <div class=\"dp-prep\" style=\"margin-bottom:10px;\"><b>Ev Yapımı Tercih:</b> Hazır/işlenmiş gıdalar genellikle ev yapımı eşdeğerlerinden daha pahalıdır ve daha fazla tuz/şeker içerir; basit ev yemekleri hem bütçe hem sağlık açısından avantajlıdır.</div>\n    <div class=\"dp-prep\"><b>Tam Tahılda Ucuz Seçenek:</b> Bulgur, çoğunlukla pirince göre daha ekonomiktir ve lif içeriği daha yüksektir; iyi bir tam tahıl alternatifi olabilir.</div>\n  </div>\n\n  <div class=\"card\" style=\"background:var(--dp-soft,#EFE8D8);border:2px solid var(--dp-acc,#C08A2E);\">\n    <p class=\"section-title\">40 · Danışan Görünümü Modu</p>\n    <p class=\"section-sub\">Klinik/belgeleme araçlarını (SOAP notu, ilaç etkileşimi, laboratuvar değerlendirme, tarama araçları, kılavuz karşılaştırması vb.) gizleyip yalnızca danışana uygun kartları (menüler, hesaplayıcılar, takip araçları, rehberler) gösterir. Telefonu doğrudan danışana verirken kullanışlıdır. Tekrar dokunarak klinik görünüme dönebilirsiniz.</p>\n    <button class=\"btn-primary\" id=\"patientViewToggleBtn\" onclick=\"dpTogglePatientView()\">👁️ Danışan Görünümüne Geç</button>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">41 · Haftalık Öz-Değerlendirme Soruları</p>\n    <p class=\"section-sub\">Danışanın süreçle ilişkisini güçlendirmek için basit, yansıtıcı sorular. Klinik bir ölçüm değildir.</p>\n    <div style=\"margin-bottom:14px;\"><label style=\"display:block;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--dp-head,#1E3F3A);margin-bottom:6px;\">Bu hafta en çok neyle zorlandın?</label>\n      <textarea id=\"reflect_q1\" rows=\"2\" style=\"width:100%;padding:10px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13.5px;box-sizing:border-box;\"></textarea>\n    </div>\n    <div style=\"margin-bottom:14px;\"><label style=\"display:block;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--dp-head,#1E3F3A);margin-bottom:6px;\">Hangi değişikliği daha kolay uyguladın?</label>\n      <textarea id=\"reflect_q2\" rows=\"2\" style=\"width:100%;padding:10px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13.5px;box-sizing:border-box;\"></textarea>\n    </div>\n    <div style=\"margin-bottom:14px;\"><label style=\"display:block;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--dp-head,#1E3F3A);margin-bottom:6px;\">Bu hafta enerji/ruh halin nasıldı?</label>\n      <textarea id=\"reflect_q3\" rows=\"2\" style=\"width:100%;padding:10px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13.5px;box-sizing:border-box;\"></textarea>\n    </div>\n    <div style=\"margin-bottom:18px;\"><label style=\"display:block;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--dp-head,#1E3F3A);margin-bottom:6px;\">Gelecek hafta için küçük bir hedefin var mı?</label>\n      <textarea id=\"reflect_q4\" rows=\"2\" style=\"width:100%;padding:10px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13.5px;box-sizing:border-box;\"></textarea>\n    </div>\n    <button class=\"btn-primary\" onclick=\"dpSaveReflection()\">Bu Haftayı Kaydet</button>\n    <div id=\"reflectionHistory\" style=\"margin-top:18px;\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">43 · Danışana Verilecek Program (Yazdır)</p>\n    <p class=\"section-sub\">Danışana elden/yazdırarak vermek istediğin bölümleri seç. Varsayılan olarak <b>seçili günlük menü</b> ve <b>değişim listeleri</b> işaretlidir — böylece danışan hem ne yiyeceğini hem de neyle değiştirebileceğini görür.</p>\n    <div style=\"margin-bottom:18px;\">\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"handout_menu\" checked> Seçili Günlük Menü</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"handout_exchange\" checked> Değişim (Denklik) Listeleri</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"handout_week\" checked> 1 Haftalık Menü Görünümü</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"handout_lifestyle\"> Yaşam Tarzına Göre Öneriler</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"handout_recipes\" checked> Tarifler (Kart 11'de şu an görünen/filtrelenmiş olanlar)</label>\n    </div>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;\" onclick=\"dpPrintPatientHandout('print')\">🖨️ Yazdır</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\" onclick=\"dpPrintPatientHandout('download')\">⬇️ İndir</button>\n    </div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">44 · 24 Saat Nöbet İçin Gerçek Menüden Seçim</p>\n    <p class=\"section-sub\">Yüklediğin Temmuz 2026 iş yeri menüsündeki yemekler ve <b>gerçek kalori değerleri</b> aşağıdaki listede — tahmini değil, menüde yazan sayılar. Nöbet süresince (öncesi/ortası/gecesi/sonrası) hangi yemekten ne kadar aldığını ekle; hedef kaloriye göre anlık takip et.</p>\n    <div class=\"grid\" style=\"margin-bottom:16px;\">\n      <div><label for=\"shiftKcalTarget\">Nöbet İçin Toplam Hedef Kalori</label><input type=\"number\" id=\"shiftKcalTarget\" value=\"2400\"></div>\n    </div>\n    <div class=\"grid\" style=\"margin-bottom:14px;\">\n      <div><label for=\"shiftPeriod\">Dönem</label>\n        <select id=\"shiftPeriod\">\n          <option value=\"once\">Nöbet Öncesi</option>\n          <option value=\"orta\">Nöbet Ortası (Akşam)</option>\n          <option value=\"gece\">Nöbet Gecesi</option>\n          <option value=\"sonu\">Nöbet Sonu (Sabah)</option>\n        </select>\n      </div>\n      <div><label for=\"shiftDish\">Yemek</label><select id=\"shiftDish\"></select></div>\n      <div><label for=\"shiftQty\">Adet/Porsiyon</label><input type=\"number\" id=\"shiftQty\" value=\"1\" step=\"0.5\"></div>\n    </div>\n    <button class=\"btn-primary\" onclick=\"dpAddShiftItem()\">+ Ekle</button>\n    <div id=\"shiftPeriodsBox\" style=\"margin-top:18px;\"></div>\n    <p id=\"shiftGrandTotal\" style=\"font-size:14px;font-weight:700;margin-top:14px;\"></p>\n    <button class=\"btn-primary\" style=\"background:transparent;border:1px solid currentColor;\" onclick=\"dpResetShiftMenu()\">Nöbeti Sıfırla</button>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">45 · Mevsimsel Meyve-Sebze Rehberi</p>\n    <p class=\"section-sub\">İçinde bulunduğunuz aya göre Türkiye'de mevsiminde olan meyve ve sebzeleri gösterir — mevsiminde ürünler genellikle hem daha uygun fiyatlı hem de daha lezzetlidir. Bu takvim genel/tipik hasat dönemlerine dayanır; bölgeye ve hava koşullarına göre birkaç hafta farklılık gösterebilir.</p>\n    <div id=\"seasonalBox\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">46 · Diyet Protokolleri (Hazır Program Şablonları)</p>\n    <p class=\"section-sub\">Sık kullanılan beslenme protokolleri için hazır, gün gün menü şablonları. Protokolü ve seçenekleri belirleyin, istediğiniz süre için menü oluşturun. Menüler her protokolün kendi kurallarına göre hazırlanmıştır ve aynı ana besinin haftaya yığılmaması için otomatik çeşitlendirilir. <b>Bu şablonlar hazır başlangıç noktasıdır; danışanın hastalıkları, ilaçları, laboratuvar değerleri ve tercihlerine göre diyetisyen tarafından uyarlanmalıdır.</b></p>\n    <div class=\"grid\">\n      <div><label for=\"protoType\">Protokol</label><select id=\"protoType\" onchange=\"dpProtoSync()\"></select></div>\n      <div id=\"protoVarWrap\"><label for=\"protoVariant\">Seçenek</label><select id=\"protoVariant\"></select></div>\n      <div><label for=\"protoKcal\">Günlük Enerji (kcal)</label><select id=\"protoKcal\"></select></div>\n      <div><label for=\"protoDur\">Süre</label><select id=\"protoDur\"></select></div>\n    </div>\n    <div class=\"no-print\" style=\"display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:190px;\" onclick=\"dpProtoGenerate()\">Menüyü Oluştur</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:190px;\" onclick=\"dpProtoPrintStyled()\">🎨 Süslü Görünümde Yazdır</button>\n    </div>\n    <div id=\"protoOut\"></div>\n  </div>\n\n  <p class=\"disclaimer\">\n    Bu araç genel beslenme ilkelerine dayalı bir referans hesaplama, örnek menü ve değişim listesi sunar; tıbbi tanı veya tedavi yerine geçmez.\n    Değişim miktarları yaklaşık ortalama değerlerdir ve marka/pişirme yöntemine göre değişebilir. Böbrek, karaciğer, kalp yetmezliği gibi\n    karmaşık klinik tablolarda kalori ve besin ögesi hedefleri ilgili hekimle iş birliği içinde bireyselleştirilmelidir. Mifflin-St Jeor denklemi kullanılmıştır.\n  </p>\n</div>\n\n<script>\nlet gender='female';\nlet currentTarget=1800;\nlet disliked=new Set();\n\ndocument.getElementById('genderToggle').addEventListener('click',(e)=>{\n  const t=e.target.closest('.toggle'); if(!t) return;\n  document.querySelectorAll('#genderToggle .toggle').forEach(x=>x.classList.remove('active'));\n  t.classList.add('active'); gender=t.dataset.val;\n});\n\nfunction calculate(){\n  const age=parseFloat(document.getElementById('age').value);\n  const height=parseFloat(document.getElementById('height').value);\n  const weight=parseFloat(document.getElementById('weight').value);\n  const activity=parseFloat(document.getElementById('activity').value);\n  const goalAdj=parseFloat(document.getElementById('goal').value);\n  if(!age||!height||!weight){alert('Lütfen yaş, boy ve kilo bilgilerini giriniz.');return;}\n\n  const heightM=height/100;\n  const bmi=weight/(heightM*heightM);\n  let bmr = gender==='male' ? (10*weight+6.25*height-5*age+5) : (10*weight+6.25*height-5*age-161);\n  const tdee=bmr*activity;\n  const target=Math.max(1200,tdee+goalAdj);\n\n  document.getElementById('bmiVal').textContent=bmi.toFixed(1);\n  document.getElementById('bmrVal').textContent=Math.round(bmr).toLocaleString('tr-TR');\n  document.getElementById('tdeeVal').textContent=Math.round(tdee).toLocaleString('tr-TR');\n  document.getElementById('targetVal').textContent=Math.round(target).toLocaleString('tr-TR');\n\n  let cat = bmi<18.5?'Zayıf':bmi<25?'Normal Kilolu':bmi<30?'Fazla Kilolu':'Obez';\n  document.getElementById('bmiCategoryText').innerHTML=`<b>${bmi.toFixed(1)} kg/m²</b> — ${cat} aralığında.`;\n\n  const minScale=15,maxScale=40;\n  let pct=((bmi-minScale)/(maxScale-minScale))*100; pct=Math.max(0,Math.min(100,pct));\n  document.getElementById('bmiMarkerRow').innerHTML=`<div class=\"bmi-marker\" style=\"left:${pct}%\"></div>`;\n  document.getElementById('results').classList.add('show');\n\n  currentTarget=Math.round(target);\n  renderMenu();\n  if(typeof renderWeek === 'function') renderWeek();\n}\n\n// ---------- EXCHANGE (DENKLİK) LISTS ----------\nconst exchangeLists = {\n  ekmek:{ label:\"Ekmek / Nişasta Grubu (≈70 kcal / değişim)\",\n    items:[\n      {n:\"1 dilim tam tahıllı ekmek\", a:\"25 g\", k:70, tag:null},\n      {n:\"3 yemek kaşığı pirinç pilavı (pişmiş)\", a:\"45 g\", k:70, tag:\"pirinc\"},\n      {n:\"3 yemek kaşığı bulgur pilavı (pişmiş)\", a:\"45 g\", k:70, tag:\"bulgur\"},\n      {n:\"4 yemek kaşığı makarna (pişmiş)\", a:\"45 g\", k:70, tag:null},\n      {n:\"2 adet galeta\", a:\"20 g\", k:70, tag:null},\n      {n:\"Yarım küçük patates (haşlama)\", a:\"50 g\", k:70, tag:null},\n      {n:\"2 adet mısır patlağı bardağı\", a:\"—\", k:70, tag:null},\n      {n:\"3 yemek kaşığı yulaf ezmesi (kuru)\", a:\"20 g\", k:70, tag:null},\n      {n:\"3-4 adet kepekli/tam buğday krakeri\", a:\"20 g\", k:70, tag:null},\n      {n:\"Yarım simit (küçük boy)\", a:\"—\", k:70, tag:null},\n      {n:\"1 adet ince yufka\", a:\"30 g\", k:70, tag:null},\n      {n:\"3 yemek kaşığı kinoa (pişmiş)\", a:\"45 g\", k:70, tag:null},\n      {n:\"Yarım koçan mısır (haşlama)\", a:\"—\", k:70, tag:null},\n      {n:\"3 yemek kaşığı kuskus (pişmiş)\", a:\"45 g\", k:70, tag:null},\ {n:\"Yarım orta boy nar\", a:\"100 g\", k:60, tag:null},\n      {n:\"1 orta boy kivi\", a:\"100 g\", k:60, tag:null},\n      {n:\"1 su bardağı yaban mersini\", a:\"100 g\", k:60, tag:null},\n      {n:\"1 su bardağı böğürtlen / ahududu\", a:\"120 g\", k:60, tag:null},\n      {n:\"2-3 adet kuru hurma\", a:\"20 g\", k:60, tag:null},\n      {n:\"2 adet taze incir\", a:\"100 g\", k:60, tag:null},\n      {n:\"Yarım orta boy greyfurt\", a:\"150 g\", k:60, tag:null},\n    ]},\n  yag:{ label:\"Yağ Grubu (≈45 kcal / değişim)\",\n    items:[\n      {n:\"1 tatlı kaşığı zeytinyağı\", a:\"5 g\", k:45, tag:null},\n      {n:\"8-10 adet zeytin\", a:\"—\", k:45, tag:\"zeytin\"},\n      {n:\"5 adet badem / ceviz içi\", a:\"—\", k:45, tag:\"kuruyemis\"},\n      {n:\"1 tatlı kaşığı tereyağı\", a:\"5 g\", k:45, tag:null},\n      {n:\"1 yemek kaşığı light mayonez\", a:\"15 g\", k:45, tag:null},\n      {n:\"1 tatlı kaşığı ayçiçek yağı\", a:\"5 g\", k:45, tag:null},\n      {n:\"1/8 adet avokado\", a:\"—\", k:45, tag:null},\n      {n:\"1 tatlı kaşığı fıstık ezmesi\", a:\"8 g\", k:45, tag:null},\n      {n:\"1 tatlı kaşığı tahin\", a:\"8 g\", k:45, tag:null},\n      {n:\"10 adet yer fıstığı\", a:\"—\", k:45, tag:null},\n      {n:\"5 adet kaju\", a:\"—\", k:45, tag:null},\n      {n:\"10 adet Antep fıstığı\", a:\"—\", k:45, tag:null},\n      {n:\"1 yemek kaşığı kabak çekirdeği\", a:\"10 g\", k:45, tag:null},\n      {n:\"1 yemek kaşığı ayçekirdeği\", a:\"10 g\", k:45, tag:null},\n      {n:\"1 yemek kaşığı rendelenmiş Hindistan cevizi\", a:\"10 g\", k:45, tag:null},\n    ]},\n  sebze:{ label:\"Sebze Grubu (serbest — günde 2-3 porsiyon önerilir)\",\n    items:[\n      {n:\"Domates\", a:\"serbest\", k:0, tag:\"domates\"},\n      {n:\"Salatalık\", a:\"serbest\", k:0, tag:\"salatalik\"},\n      {n:\"Biber, roka, marul, ıspanak vb. yeşillik\", a:\"serbest\", k:0, tag:null},\n      {n:\"Brokoli / karnabahar (haşlama)\", a:\"1 porsiyon\", k:35, tag:null},\n      {n:\"Kabak / patlıcan (zeytinyağlı, az yağ te]}` : '');\n}\n\nrenderMenu();\n\n// ---------- WEEKLY MENU (Pazartesi-Pazar) ----------\nconst days = [\"Pazartesi\",\"Salı\",\"Çarşamba\",\"Perşembe\",\"Cuma\",\"Cumartesi\",\"Pazar\"];\n\nconst dislikeKeywords = {\n  yumurta:[\"yumurta\",\"omlet\"],\n  sut:[\"süt\",\"yoğurt\",\"yogurt\",\"ayran\",\"kefir\"],\n  peynir:[\"peynir\",\"lor\"],\n  tavuk:[\"tavuk\",\"hindi\"],\n  kirmizi_et:[\"kırmızı et\",\" et,\",\" et \",\"köfte\"],\n  balik:[\"balık\",\"somon\"],\n  baklagil:[\"mercimek\",\"nohut\"],\n  elma:[\"elma\"],\n  muz:[\"muz\"],\n  kuruyemis:[\"ceviz\",\"badem\",\"fındık\"],\n  zeytin:[\"zeytin\"],\n  bulgur:[\"bulgur\"],\n  pirinc:[\"pirinç\"],\n  domates:[\"domates\"],\n  salatalik:[\"salatalık\"],\n};\n\nfunction textConflicts(text){\n  const low = text.toLowerCase();\n  for(const tag of disliked){\n    const kws = dislikeKeywords[tag] || [];\n    if(kws.some(k=>low.includes(k))) return true;\n  }\n  return false;\n}\n\nfunction pickOption(pool, startIdx){\n  for(let i=0;i<pool.length;i++){\n    const opt = pool[(startIdx+i)%pool.length];\n    if(!textConflicts(opt)) return {text:opt, swapped:i>0};\n  }\n  return {text:pool[startIdx%pool.length], swapped:false, conflict:true};\n}\n\n/* --- Haftalık menü çeşitlilik motoru ---\n   İki sorunu çözer: (1) farklı yazılmış ama aynı görünen öğünler (\"Lor peyniri, salatalık\"\n   vs \"Lor peyniri, salatalık-domates\"), (2) aynı ana besinin haftaya yığılması\n   (ör. 7 akşamın 4'ü balık). */\nvar DP_SIG_MAP = [\n  ['uskumru','balık'],['sardalya','balık'],['levrek','balık'],['somon','balık'],['çipura','balık'],\n  ['ton balığı','balık'],['hamsi','balık'],['balık','balık'],['karides','deniz ürünü'],\n  ['hindi','hindi'],['tavuk','tavuk'],\n  ['köfte','kırmızı et'],['kıyma','kırmızı et'],['dana','kırmızı et'],['kuzu','kırmızı et'],\n  ['biftek','kırmızı et'],['etli','kırmızı et'],\n  ['mercimek','baklagil'],['nohut','baklagil'],['fasulye','baklagil'],['bezelye','baklagil'],['humus','baklagil'],\n  ['omlet','yumur h:[{n:\"Izgara tavuk (taze, işlenmemiş, 2 değişim)\",k:100,g:'protein',tag:'tavuk'},{n:\"Pirinç pilavı (1 değişim)\",k:70,g:'ekmek',tag:'pirinc'},{n:\"Taze salata\",k:20,g:'sebze',tag:null}],\n  snack:[{n:\"Taze meyve (turunçgil hariç tolere edilirse)\",k:60,g:'meyve',tag:'elma'}],\n  dinner:[{n:\"Balık (taze, 2 değişim)\",k:100,g:'protein',tag:'balik'},{n:\"Sebze yemeği\",k:50,g:'sebze',tag:null},{n:\"Taze yoğurt (1 değişim)\",k:100,g:'sut',tag:'sut'}],\n  caution:\"İşlenmiş et (nitrat), eskimiş peynir (tiramin), çikolata, alkol (özellikle kırmızı şarap) ve aşırı kafein bazı bireylerde tetikleyici olabilir; tetikleyiciler kişiye özel bir günlükle belirlenmelidir.\"};\n\nmenus.anemia_b12 = {title:\"Anemi (B12 / Folat Eksikliği)\",\n  breakfast:[{n:\"1 yumurta\",k:70,g:'protein',tag:'yumurta'},{n:\"Peynir (B12 kaynağı, 1 değişim)\",k:70,g:'protein',tag:'peynir'},{n:\"Tam tahıllı ekmek\",k:70,g:'ekmek',tag:null}],\n  lunch:[{n:\"Kırmızı et (B12 kaynağı, 2 değişim)\",k:150,g:'protein',tag:'kirmizi_et'},{n:\"Bulgur pilavı (1 değişim)\",k:70,g:'ekmek',tag:'bulgur'},{n:\"Yeşil yapraklı salata (folat, 1 porsiyon)\",k:20,g:'sebze',tag:null}],\n  snack:[{n:\"Meyve + kuruyemiş\",k:105,g:'yag',tag:'kuruyemis'}],\n  dinner:[{n:\"Balık (2 değişim)\",k:100,g:'protein',tag:'balik'},{n:\"Mercimek yemeği (folat, 1 değişim)\",k:80,g:'protein',tag:'baklagil'},{n:\"Yoğurt (1 değişim)\",k:100,g:'sut',tag:'sut'}],\n  caution:\"B12 eksikliğinde hayvansal kaynaklı gıdalar (et, yumurta, süt ürünleri) önemlidir; vejetaryen/vegan bireylerde B12 takviyesi genellikle gereklidir. Folat için yeşil yapraklı sebzeler ve baklagiller artırılır.\"};\n\n// ---------- VEJETARYEN MODU ----------\nlet vejeActive = false;\nfunction toggleVeje(el){\n  vejeActive = !vejeActive;\n  el.classList.toggle('active');\n  ['tavuk','balik','kirmizi_et'].forEach(tag=>{\n    const chip = document.querySelector(`#dislikeGrid .dislike-chip[data-tag=\"${tag}\"]`);\n    if(vejeActive){ disliked.add(tag); if(chip) chip.classList.add('active'); }\n    else { disliked.delete(tag); if(chip) chip.classList.remove('active'); }\n  });\n  renderMenu(); renderWeek();\n}\n\n// ---------- ALIŞVERİŞ LİSTESİ ----------\nfunction generateShoppingList(){\n  const box = document.getElementById('shoppingListBox');\n  const items = Array.from(document.querySelectorAll('#dayMenu .meal li')).map(li=>{\n    return li.textContent.replace(/değişim/gi,'').replace(/~?\\d+\\s*kcal/gi,'').replace(/serbest/gi,'').trim();\n  }).filter(Boolean);\n  const unique = [...new Set(items)];\n  box.style.display='block';\n  box.innerHTML = `<b style=\"color:var(--teal-deep);\">Alışveriş Listesi (bugünkü menüye göre):</b><ul style=\"margin:10px 0 0;padding-left:18px;\">${unique.map(i=>`<li>${i}</li>`).join('')}</ul>`;\n}\n\n// ---------- SU TÜKETİMİ ----------\nfunction calcWater(){\n  const w = parseFloat(document.getElementById('waterWeight').value);\n  const act = parseFloat(document.getElementById('waterActivity').value)||0;\n  if(!w){alert('Lütfen kilo bilgisini giriniz.');return;}\n  const base = w*33;\n  const extra = Math.round(act/30)*350;\n  const total = Math.round(base+extra);\n  document.getElementById('waterVal').textContent = total.toLocaleString('tr-TR');\n  document.getElementById('waterGlassVal').textContent = Math.round(total/200);\n  document.getElementById('waterResults').classList.add('show');\n}\n\n// ---------- VÜCUT YAĞI / BEL-KALÇA ----------\nfunction calcBodyFat(){\n  const height = parseFloat(document.getElementById('bfHeight').value);\n  const neck = parseFloat(document.getElementById('bfNeck').value);\n  const waist = parseFloat(document.getElementById('bfWaist').value);\n  const hip = parseFloat(document.getElementById('bfHip').value);\n  if(!height||!neck||!waist){alert('Lütfen boy, boyun ve bel çevresini giriniz.');return;}\n\n  // US Navy formülü log10(bel-boyun) veya log10(bel+kalça-boyun) kullanır;\n  // bu değer sıfır veya negatifse (ölçüm hatası/geçersiz giriş) sonuç NaN olur.\n  // Hesaba geçmeden önce bunu açıkça kontrol edip kullanıcıyı bilgilendiriyoruz.\n  const female = gender==='female';\n  const logArg = female ? (waist+hip-neck) : (waist-neck);\n  if(!(logArg>0)){\n    document.getElementById('bfVal').textContent='—';\n    document.getElementById('whrVal').textContent='--';\n    document.getElementById('whrNote').textContent =\n      female ? 'Bel + kalça çevresi toplamı, boyun çevresinden büyük olmalıdır; lütfen ölçümleri kontrol edin.'\n             : 'Bel çevresi, boyun çevresinden büyük olmalıdır; lütfen ölçümleri kontrol edin.';\n    document.getElementById('bfResults').classList.add('show');\n    return;\n  }\n\n  let bf;\n  if(gender==='male'){\n    bf = 495/(1.0324-0.19077*Math.log10(waist-neck)+0.15456*Math.log10(height)) - 450;\n  } else {\n    bf = 495/(1.29579-0.35004*Math.log10(waist+hip-neck)+0.22100*Math.log10(height)) - 450;\n  }\n  bf = Math.max(3, Math.min(60, bf));\n  document.getElementById('bfVal').textContent = bf.toFixed(1)+'%';\n\n  let whr='--', whrNote='';\n  if(gender==='female' && hip){\n    whr = (waist/hip).toFixed(2);\n    whrNote = parseFloat(whr) > 0.85 ? \"Kadınlarda 0.85 üzeri, artmış kardiyometabolik risk ile ilişkilendirilir.\" : \"Kadınlarda 0.85 altı, düşük risk aralığında kabul edilir.\";\n  } else if(gender==='male' && hip){\n    whr = (waist/hip).toFixed(2);\n    whrNote = parseFloat(whr) > 0.90 ? \"Erkeklerde 0.90 üzeri, artmış kardiyometabolik risk ile ilişkilendirilir.\" : \"Erkeklerde 0.90 altı, düşük risk aralığında kabul edilir.\";\n  }\n  document.getElementById('whrVal').textContent = whr;\n  document.getElementById('whrNote').textContent = whrNote;\n  document.getElementById('bfResults').classList.add('show');\n}\n\n// ---------- YAZDIRILABİLİR RAPOR ----------\n(function(){\n  const today = new Date();\n  const dd=String(today.getDate()).padStart(2,'0');\n  const mm=String(today.getMonth()+1).padStart(2,'0');\n  const yyyy=today.getFullYear();\n  const el=document.getElementById('patientDate');\n  if(el) el.value = dd+'.'+mm+'.'+yyyy;\n})();\n\nconst REPORT_TITLE = \"Diyetisyen İlker — Kişiye Özel Beslenme Programı (Yetişkin)\";\nconst REPORT_FILE  = \"beslenme-raporu-yetiskin.html\";\nconst REPORT_WHO   = \"Danışan\";\n\nfunction buildReportPayload(){\n  const nameEl=document.getElementById('patientName');\n  const dateEl=document.getElementById('patientDate');\n  const name=(nameEl&&nameEl.value.trim())||'—';\n  const date=(dateEl&&dateEl.value.trim())||'—';\n  const modeEl=document.querySelector('#modeToggle .mode-btn.active');\n  const modeTxt=modeEl?(' — '+modeEl.textContent.trim()):'';\n  const ph=document.getElementById('printHeader');\n  if(ph) ph.innerHTML='<b>'+REPORT_WHO+':</b> '+name+' &nbsp;&nbsp; <b>Tarih:</b> '+date+' &nbsp;&nbsp; <b>Rapor:</b> '+REPORT_TITLE+modeTxt;\n\n  // Girilen değerleri klonlamadan önce özniteliklere yaz (aksi halde klonda görünmez)\n  document.querySelectorAll('input').forEach(i=>i.setAttribute('value', i.value));\n  document.querySelectorAll('select').forEach(s=>{\n    Array.from(s.options).forEach(o=>o.removeAttribute('selected'));\n    if(s.selectedIndex>=0) s.options[s.selectedIndex].setAttribute('selected','selected');\n  });\n\n  const clone=document.body.cloneNode(true);\n  clone.querySelectorAll('script, button, .no-print').forEach(n=>n.remove());\n  clone.querySelectorAll('.toggle:not(.active), .mode-btn:not(.active), .dislike-chip:not(.active), .tag-btn:not(.active)').forEach(n=>n.remove());\n  clone.querySelectorAll('input').forEach(i=>{\n    const s=document.createElement('span'); s.className='pv';\n    s.textContent=i.getAttribute('value')||'—'; i.replaceWith(s);\n  });\n  clone.querySelectorAll('select').forEach(sel=>{\n    const o=sel.querySelector('option[selected]');\n    const s=document.createElement('span'); s.className='pv';\n    s.textContent=o?o.textContent:'—'; sel.replaceWith(s);\n  });\n\n  const css=Array.from(document.querySelectorAll('style')).map(s=>s.textContent).join('\\n')\n    + '\\n.pv{font-weight:600;} .print-only-header{display:block !important;}';\n  return {type:'nutriPrint', css:css, html:clone.innerHTML, title:REPORT_TITLE, filename:REPORT_FILE};\n}\n\nfunction reportDocHtml(p){\n  const extra='body{background:#fff;}'\n    +'header.hero{background:#fff !important;padding:0 0 14px !important;box-shadow:none !important;}'\n    +'header.hero::before,header.hero::after{display:none !important;}'\n    +'header.hero,header.hero *{color:#000 !important;}'\n    +'.card{box-shadow:none;border:1px solid #bbb;margin-top:14px;page-break-inside:avoid;}'\n    +'.results{display:block !important;}'\n    +'@media print{.card{page-break-inside:avoid;}}';\n  return '<!DOCTYPE html><html lang=\"tr\"><head><meta charset=\"UTF-8\">'\n    +'<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">'\n    +'<title>'+p.title+'</title>'\n    +'<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@500&display=swap\" rel=\"stylesheet\">'\n    +'<style>'+p.css+extra+'<\/style></head><body>'+p.html+'</body></html>';\n}\n\nfunction doDownload(p){\n  try{\n    const blob=new Blob([reportDocHtml(p)],{type:'text/html;charset=utf-8'});\n    const url=URL.createObjectURL(blob);\n    const a=document.createElement('a');\n    a.href=url; a.download=p.filename;\n    document.body.appendChild(a); a.click();\n    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1500);\n  }catch(err){\n    alert('Rapor indirilemedi. Lütfen dosyayı bilgisayarınıza indirip tarayıcıda açtıktan sonra tekrar deneyin.');\n  }\n}\n\nfunction printReport(){\n  const p=buildReportPayload();\n  if(window.parent && window.parent!==window){\n    p.action='print';\n    window.parent.postMessage(p,'*');\n    return;\n  }\n  try{ window.print(); }catch(e){ doDownload(p); }\n}\n\nfunction downloadReport(){\n  const p=buildReportPayload();\n  if(window.parent && window. ct/9;\n  var sp=1, sy=1, sd=1;\n  for(var it=0; it<12; it++){\n    var totP = pRaw.p*sp + yRaw.p*sy + dRaw.p*sd;\n    if(totP>0) sp = Math.max(0.4, Math.min(2.5, sp*(ptar/totP)));\n    var totF = pRaw.f*sp + yRaw.f*sy + dRaw.f*sd;\n    if(totF>0) sy = Math.max(0.25, Math.min(4.0, sy*(ftar/totF)));\n    var kWithoutD = pRaw.k*sp + yRaw.k*sy;\n    sd = dRaw.k>0 ? (target - kWithoutD)/dRaw.k : 1;\n    sd = Math.max(0.3, Math.min(4.0, sd||1));\n  }\n  return {sp:sp, sy:sy, sd:sd};\n}\n\nconst DP_DISLIKE_FOOD_IDS = {\n  yumurta:['yumurta'],\n  sut:['sut','lsut','yogurt','lyogurt','lakyogurt','kefir','ayran'],\n  peynir:['beyazpeynir','kasar','lor','keciPeyniri'],\n  tavuk:['tavuk','hindi','tavukbut'],\n  kirmizi_et:['et','kofte','danaeti','kuzu'],\n  balik:['balik','somon','ton','uskumru','karides','sardalya','levrek'],\n  baklagil:['mercimek','nohut','fasulye'],\n  elma:['elma'],\n  muz:['muz'],\n  kuruyemis:['ceviz','badem','findik','fistikezme'],\n  zeytin:['zeytin'],\n  bulgur:['bulgur'],\n  pirinc:['pirinc'],\n  domates:['domates'],\n  salatalik:['salatalik'],\n  ispanak:['ispanak'],\n  '__boğulma_riski__':['ceviz','badem','findik','kaju']\n};\nfunction dpIsYoungChild(){\n  var cAgeEl = (typeof document !== 'undefined') ? document.getElementById('cAge') : null;\n  if(!cAgeEl) return false;\n  var age = parseFloat(cAgeEl.value);\n  return !isNaN(age) && age <= 3;\n}\nfunction dpAllDislikeSets(){\n  var sets = [];\n  if(typeof disliked !== 'undefined' && disliked) sets.push(disliked);\n  if(typeof cDisliked !== 'undefined' && cDisliked) sets.push(cDisliked);\n  if(typeof bDisliked !== 'undefined' && bDisliked) sets.push(bDisliked);\n  if(dpIsYoungChild()) sets.push(['__boğulma_riski__']);\n  return sets;\n}\nfunction dpMealHasDislikedFood(meal){\n  var sets = dpAllDislikeSets();\n  for(var s=0; s<sets.length; s++){\n    for(const tag of sets[s]){\n      const ids = DP_DISLIKE_FOOD_IDS[tag] || [];\n      if(meal.it.some(function(pair){ return ids.indexOf(pair[0]) > -1; })) return true;\n    }\n  }\n  return false;\n}\nfunction dpPickMealId(pool, startIdx){\n  for(var i=0;i<pool.length;i++){\n    var id = pool[(startIdx+i)%pool.length];\n    var meal = DP_MEALS[id];\n    if(meal && !dpMealHasDislikedFood(meal)) return {id:id, swapped:i>0};\n  }\n  return {id: pool[startIdx%pool.length], swapped:false};\n}\nfunction dpMealCategory(meal){\n  if(!meal) return 'diger';\n  var ids = (meal.it||[]).map(function(p){ return String(p[0]).toLowerCase(); });\n  function has(list){ return ids.some(function(id){ return list.some(function(k){ return id.indexOf(k)>-1; }); }); }\n  if(has(['balik','somon','uskumru','sardalya','levrek','ton','karides','cipura','hamsi'])) return 'deniz';\n  if(has(['tavuk','hindi'])) return 'kumes';\n  if(has(['kuzu','dana','kiyma','kofte']) || ids.indexOf('et')>-1) return 'kirmizi';\n  if(has(['mercimek','nohut','fasulye','bezelye','tofu','humus'])) return 'baklagil';\n  if(has(['yumurta'])) return 'yumurta';\n  if(has(['yogurt','sut','peynir','lor','kefir','ayran'])) return 'sut';\n  return 'diger';\n}\n// Haftanın tamamını birden seçer: aynı tarif tekrar etmesin VE aynı protein\n// kategorisi (balık/tavuk/kırmızı et/baklagil...) haftaya yayılsın.\nfunction dpAssignWeekIds(pool, nDays, startIdx){\n  var picks=[], usedIds={}, catCount={};\n  for(var d=0; d<nDays; d++){\n    var natural = pool[(startIdx+d)%pool.length];\n    var naturalMeal = DP_MEALS[natural];\n    var naturalDisliked = naturalMeal ? dpMealHasDislikedFood(naturalMeal) : false;\n    var best=null, bestScore=Infinity;\n    for(var i=0;i<pool.length;i++){\n      var id = pool[(startIdx+d+i)%pool.length];\n      var meal = DP_MEALS[id];\n      if(!meal || dpMealHasDislikedFood(meal)) continue;\n      var cat = dpMealCategory(meal);\n      var score = (usedIds[id]?100000:0) + (catCount[cat]||0)*100 + i;\n      if(score < bestScore){ bestScore=score; best=id; }\n    }\n    if(best===null) best = natural;\n    usedIds[best]=1;\n    var bc = dpMealCategory eMeal(pRaw, yRaw, dRaw, mealTarget, mealPtar, fatpct);\n    var sp=sol.sp*scale, sy=sol.sy*scale, sd=sol.sd*scale;\n    function svOf(F){ return F.pr?sp:(F.ft?sy:sd); }\n\n    let mk=0,mp=0,mc=0,mf=0, rows='';\n    meal.it.forEach(function(pair){\n      const food=DP_FOODS[pair[0]];\n      const sv=pair[1]*svOf(food);\n      const k=food.k*sv, p=food.p*sv, c=food.c*sv, f=food.f*sv;\n      mk+=k; mp+=p; mc+=c; mf+=f;\n      rows+='<tr><td>'+dpFoodEmoji(food.n)+' '+food.n+'</td><td>'+dpAmount(food,sv)+'</td>'\n           +'<td class=\"num\">'+c.toFixed(1)+'</td><td class=\"num\">'+p.toFixed(1)+'</td>'\n           +'<td class=\"num\">'+f.toFixed(1)+'</td><td class=\"num\">'+Math.round(k)+'</td></tr>';\n    });\n    dk+=mk; dp+=mp; dc+=mc; df+=mf;\n    var mealType = dpClassifyMealType(label);\n    meals+='<div class=\"dp-meal\" data-meal-type=\"'+mealType+'\"><div class=\"meal-head-row\"><h5>'+label+'</h5><span class=\"kcal-target\">Hedef: ~'+Math.round(mealTarget)+' kcal</span></div><div class=\"mname\">'+dpFoodEmoji(meal.n)+' '+meal.n+(picked.swapped?' <span class=\"swap-tag\" style=\"font-size:10.5px;background:var(--dp-soft,#EFE8D8);color:#5B4A25;padding:1px 6px;border-radius:8px;\">değişim</span>':'')+'</div>'\n      +dpMacroBarHtml(mp,mc,mf)\n      +'<table class=\"dp-tbl\"><tr><th>Besin</th><th>Miktar</th><th class=\"num\">KH (g)</th><th class=\"num\">Prot (g)</th><th class=\"num\">Yağ (g)</th><th class=\"num\">kcal</th></tr>'\n      +rows\n      +'<tr class=\"tot\"><td colspan=\"2\">Öğün Toplamı</td><td class=\"num\">'+mc.toFixed(1)+'</td><td class=\"num\">'+mp.toFixed(1)+'</td><td class=\"num\">'+mf.toFixed(1)+'</td><td class=\"num\">'+Math.round(mk)+'</td></tr>'\n      +'</table><div class=\"dp-prep\"><b>Hazırlanışı:</b> '+meal.prep+'</div></div>';\n  });\n\n  return {html:meals, k:dk, p:dp, c:dc, f:df};\n}\n\nfunction dpRenderPlan(){\n  const host=document.getElementById('detailPlan');\n  if(!host) return;\n  const cond=dpCondition();\n  const slots=DP_PLAN[ eekHtml(days, opts){\n  opts = opts || {};\n  var title = opts.title || 'Haftalık Beslenme Programı';\n  var name = opts.patientName || '—';\n  var patientLabel = opts.patientLabel || 'Danışan';\n  var date = opts.dateValue || new Date().toLocaleDateString('tr-TR');\n  var tips = opts.tips || [\n    {icon:'💧', text:'Günde 8-10 bardak su'},\n    {icon:'🫒', text:'Sızma zeytinyağını tercih edin'},\n    {icon:'🐟', text:'Haftada 2 gün balık'},\n    {icon:'🥩', text:'Kırmızı et: haftada 1-2 kez'}\n  ];\n  var dayColors = ['#EAF6F0','#FDF1E1','#E9F2FB','#FBEAE7','#E7F5F3','#F8EEDA','#EFEAF7'];\n  var pillColors = ['#5F9A72','#D9922F','#4A7FB5','#C55C48','#2F8A7D','#A9752A','#7D6BA8'];\n\n  var cols = days.map(function(d, i){\n    var slotsHtml = d.slots.map(function(s){\n      var emoji = (typeof dpFoodEmoji==='function') ? dpFoodEmoji(s.text) : '🍽️';\n      var macro = s.macro ? '<div class=\"dp-sw-macro\">'+s.macro+'</div>' : '';\n      var prep  = s.prep  ? '<div class=\"dp-sw-prep\">'+s.prep+'</div>' : '';\n      return '<div class=\"dp-sw-slot\"><div class=\"dp-sw-slot-label\">'+s.label+'</div><div class=\"dp-sw-slot-text\">'+emoji+' '+s.text+'</div>'+macro+prep+'</div>';\n    }).join('');\n    var tot = d.total ? '<div class=\"dp-sw-daytot\">'+d.total+'</div>' : '';\n    return '<div class=\"dp-sw-day\" style=\"background:'+dayColors[i%dayColors.length]+'\">'\n      + '<div class=\"dp-sw-pill\" style=\"background:'+pillColors[i%pillColors.length]+'\">'+d.name+'</div>'\n      + slotsHtml + tot\n      + '</div>';\n  }).join('');\n\n  var tipsHtml = tips.map(function(t){\n    return '<div class=\"dp-sw-tip\"><span>'+t.icon+'</span><span>'+t.text+'</span></div>';\n  }).join('');\n\n  var css = '@import url(\\'https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap\\');'\n    + 'body{background:#FBF6E9;font-family:Inter,sans-serif;padding:32px;color:#2A2A22;}'\n    + '.dp-sw    patientName: (nameEl && nameEl.value.trim()) || '—',\n    sub: condTxt\n  });\n}\nfunction dpPrint(mode){\n  const nameEl=document.getElementById('patientName');\n  const dateEl=document.getElementById('patientDate');\n  const name=(nameEl&&nameEl.value.trim())||'—';\n  const date=(dateEl&&dateEl.value.trim())||'—';\n  const condSel=document.getElementById('condition');\n  const condTxt=condSel&&condSel.selectedIndex>=0?condSel.options[condSel.selectedIndex].textContent:'';\n  const host=document.getElementById('detailPlan');\n  if(!host||!host.innerHTML.trim()){ dpRenderPlan(); }\n\n  const head='<div class=\"dp-report-head\">'\n    +'<div class=\"dp-rh-title\">Diyetisyen İlker — 7 Günlük Kişiye Özel Beslenme Programı</div>'\n    +'<div class=\"dp-rh-meta\"><b>Danışan:</b> '+name+' &nbsp;&nbsp;|&nbsp;&nbsp; <b>Tarih:</b> '+date\n    +' &nbsp;&nbsp;|&nbsp;&nbsp; <b>Program:</b> '+condTxt\n    +' &nbsp;&nbsp;|&nbsp;&nbsp; <b>Hedef:</b> '+Math.round(dpTarget()).toLocaleString('tr-TR')+' kcal/gün</div></div>';\n\n  const css=Array.from(document.querySelectorAll('style')).map(function(s){return s.textContent;}).join('\\n')\n   +'.dp-report-head{border-bottom:2px solid #1E3F3A;padding-bottom:10px;margin-bottom:22px;}'\n   +'.dp-rh-title{font-family:Fraunces,serif;font-size:24px;font-weight:600;margin-bottom:6px;}'\n   +'.dp-rh-meta{font-size:13px;}'\n   +'body{background:#fff;padding:24px;font-family:Inter,sans-serif;}'\n   +'.day-block{border:none;padding:0;margin-bottom:26px;}';\n\n  const p={type:'nutriPrint',css:css,html:head+host.innerHTML,\n    title:'Diyetisyen İlker — 7 Günlük Beslenme Programı',filename:'7-gunluk-beslenme-programi.html',action:mode};\n\n  if(window.parent&&window.parent!==window){ window.parent.postMessage(p,'*'); return; }\n  if(mode==='download'){ doDownload(p); return; }\n  const w=window.open('','_blank');\n  if(!w){ doDownload(p); return; }\n  w.document.write('<!DOCTYPE html><html lang=\"tr\"><head><meta charset=\"UTF-8\"><title>'+p.tit ctedIndex>=0?condSel.options[condSel.selectedIndex].textContent:'';\n  return '<div style=\"border-bottom:2px solid #1E3F3A;padding-bottom:8px;margin-bottom:14px;font-family:Inter,Arial,sans-serif;\">'\n    +'<div style=\"font-family:Fraunces,Georgia,serif;font-size:19px;font-weight:600;\">Diyetisyen İlker — 7 Günlük Kişiye Özel Beslenme Programı</div>'\n    +'<div style=\"font-size:11.5px;margin-top:4px;\">'+DP_WHO+': <b>'+name+'</b> &nbsp;|&nbsp; Tarih: <b>'+date+'</b>'\n    +' &nbsp;|&nbsp; Program: <b>'+condTxt+'</b> &nbsp;|&nbsp; Hedef: <b>'\n    +Math.round(dpTarget()).toLocaleString('tr-TR')+' kcal/gün</b></div></div>';\n}\nfunction dpSetBusy(on,msg){\n  var b=document.getElementById('dpPdfBtn');\n  if(b){ b.disabled=!!on; b.textContent = on?(msg||'PDF hazırlanıyor…'):'📄 PDF olarak indir'; }\n}\nasync function dpPdf(){\n  var host=document.getElementById('detailPlan');\n  if(!host||!host.innerHTML.trim()) dpRenderPlan();\n  var days=host.querySelectorAll('.day-block');\n  if(!days.length){ alert('Önce programı oluşturun.'); return; }\n\n  dpSetBusy(true,'Kütüphaneler yükleniyor…');\n  try{ await dpEnsurePdfLibs(); }\n  catch(err){\n    dpSetBusy(false);\n    alert('PDF kütüphanesi yüklenemedi (internet bağlantısı gerekiyor). Bunun yerine \"İndir (HTML)\" seçeneğini kullanabilirsiniz.');\n    return;\n  }\n\n  var jsPDF=window.jspdf.jsPDF;\n  var pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});\n  var PW=210, PH=297, M=10, CW=PW-M*2;\n\n  // Ekran dışında, beyaz zeminli geçici kutu\n  var stage=document.createElement('div');\n  stage.style.cssText='position:fixed;left:-10000px;top:0;width:780px;background:#fff;padding:18px;font-family:Inter,Arial,sans-serif;';\n  document.body.appendChild(stage);\n\n  try{\n    for(var i=0;i<days.length;i++){\n      dpSetBusy(true,'Sayfa '+(i+1)+' / '+days.length+'…');\n      stage.innerHTML = dpHeaderHtml() + days[i].outerHTML;\n      // sayfa kırılımı stillerini geçici kutuda etkisiz kıl\n      var blk=stage.querySelector('.day-block');\n      if(blk){ blk.style.pageBreakBefore='auto'; blk.style.border='none'; blk.style.padding='0'; }\n\n      var canvas=await html2canvas(stage,{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true});\n      var img=canvas.toDataURL('image/jpeg',0.92);\n      var h=canvas.height*CW/canvas.width;\n\n      if(i>0) pdf.addPage();\n      if(h<=PH-M*2){\n        pdf.addImage(img,'JPEG',M,M,CW,h);\n      }else{\n        // gün tek sayfaya sığmazsa dilimleyerek devam ettir\n        var pageH=PH-M*2, sliceH=canvas.width*pageH/CW, y=0, first=true;\n        while(y<canvas.height-1){\n          var c2=document.createElement('canvas');\n          c2.width=canvas.width;\n          c2.height=Math.min(sliceH,canvas.height-y);\n          c2.getContext('2d').drawImage(canvas,0,y,canvas.width,c2.height,0,0,canvas.width,c2.height);\n          if(!first) pdf.addPage();\n          pdf.addImage(c2.toDataURL('image/jpeg',0.92),'JPEG',M,M,CW,c2.height*CW/canvas.width);\n          y+=c2.height; first=false;\n        }\n      }\n    }\n\n    var blob=pdf.output('blob');\n    var fname='7-gunluk-beslenme-programi.pdf';\n    if(window.parent&&window.parent!==window){\n      window.parent.postMessage({type:'nutriPdf',blob:blob,filename:fname},'*');\n    }else{\n      var url=URL.createObjectURL(blob);\n      var a=document.createElement('a'); a.href=url; a.download=fname;\n      document.body.appendChild(a); a.click();\n      setTimeout(function(){URL.revokeObjectURL(url); a.remove();},1500);\n    }\n  }catch(err){\n    alert('PDF oluşturulurken bir sorun oluştu: '+err.message);\n  }finally{\n    stage.remove();\n    dpSetBusy(false);\n  }\n}\n\n\n// ================= YAŞAM TARZINA GÖRE GENEL ÖNERİLER =================\nconst DP_LIFESTYLE_MEALS = {\n  l1:{n:'Hazırla-Götür Ofis Kahvaltısı',it:[['yumurta',2],['ekmek',2],['domates',1]],\n      prep:'Yumurtaları bir önceki akşam haşlayıp buzdolabında saklayın. Sabah ekmek ve domatesle birlikte kutuya koyup işe götürün.'},\n  l2:{n:'Termoslu Mercimek Çorbası',it:[['mercimekcorba',1],['ekmek',1]],\n      prep:'Çorbayı evde hazırlayıp termosta taşıyın; öğle arasında ekmekle birlikte tüketin.'},\n  l3:{n:'Vardiya Öncesi Doyurucu Ana Öğün',it:[['tavuk',1],['bulgur',1],['sebze',0.5]],\n      prep:'Vardiyaya başlamadan 1-2 saat önce tüketin; bulgur pilavını önceden hazırlayıp ısıtabilirsiniz.'},\n  l4:{n:'Vardiya Ortası Hafif Ara Öğün',it:[['yogurt',1],['ceviz',1]],\n      prep:'Gece vardiyasında ağır/yağlı yiyecekten kaçının; bu hafif protein+yağ kombinasyonu uyanıklığı desteklerken sindirimi zorlamaz.'},\n  l5:{n:'Vardiya Sonrası Hafif Kahvaltı',it:[['yulaf',0.7],['sut',1],['muz',0.5]],\n      prep:'Eve döndükten sonra ağır bir öğün yerine bu hafif seçeneği tercih edin; uyumadan hemen önce doyurucu yemekten kaçının.'},\n  l6:{n:'Soğutma Gerektirmeyen Seyahat Kahvaltısı',it:[['yumurta',2],['badem',1],['elma',1]],\n      prep:'Yumurtaları önceden haşlayıp kabuğuyla taşıyın; oda sıcaklığında birkaç saat güvenlidir. Badem ve elma ile tamamlayın.'},\n  l7:{n:'Yolda Pratik Öğün',it:[['ton',1],['ekmek',1],['salatalik',1]],\n      prep:'Konserve ton balığı ve paketlenmiş sebzeler seyahatte pratik ve güvenli protein kaynağıdır; ekmekle birlikte tüketin.'},\n  l8:{n:'Bütçe Dostu Baklagil Yemeği',it:[['mercimek',1],['bulgur',1]],\n      prep:'Kuru baklagiller ucuz ve doyurucu bir protein kaynağıdır; toplu pişirip birkaç güne bölerek buzdolabında saklayabilirsiniz.'},\n  l9:{n:'Hızlı ve Ekonomik Kahvaltı',it:[['yulaf',0.7],['sut',1],['muz',0.5]],\n      prep:'Yulafı sütle birlikte 5 dakikada hazırlayın; ekonomik ve hızlı bir kahvaltı seçeneğidir.'},\n  l10:{n:'Gebelik / Emzirme Dönemi Örnek Öğün',it:[['yumurta',1],['ispanak',0.5],['ekmek',1],['sut',1]],\n      prep:'Bu örnek öğün folat, demir ve kalsiyum açısından zengin gıdaları bir araya getirir; bu dönemde beslenme mutlaka doktor/diyetisyen takibiyle bireyselleştirilmelidir.'}\n};\nObject.assign(DP_MEALS, DP_LIFESTYLE_MEALS);\nconst DP_LIFESTYLE = {\n  office:{label:'Masa Başı / Ofis Çalışanı',\n    tips:['Her 1-2 saatte bir kısa süreliğine ayağa kalkıp hareket etmeye çalışın.','Su şişesini masanızda bulundurup düzenli aralıklarla için.','Öğle yemeğini mümkünse dışarıdan sipariş yerine evden hazırlayıp getirin.','Masa başı atıştırmalıklarını (kuruyemiş, meyve) önceden hazırlayıp yanınızda bulundurun.'],\n    slots:[['Kahvaltı',['l1','b6','b8']],['Öğle Yemeği (Ofiste)',['l2','m4','m10']],['Ara Öğün (Masada)',['s2','s6','s4']],['Akşam Yemeği',['m1','m6','m9']]]},\n  shift:{label:'Vardiyalı / Gece Çalışanı',\n    tips:['Vardiya öncesi doyurucu, dengeli bir ana öğün tüketmeye çalışın.','Gece boyunca ağır/yağlı atıştırmalıklardan kaçının; sindirimi kolay, hafif seçenekler tercih edin.','Vardiya sonunda eve dönüşte ağır bir öğün yerine hafif bir seçenekle uyku öncesi rahatlayın.','Kafeini vardiyanın ilk yarısıyla sınırlamaya çalışın; uyku kalitesini etkileyebilir.'],\n    slots:[['Vardiya Öncesi Ana Öğün',['l3','m3']],['Vardiya Ortası Ara Öğün',['l4','s8']],['Vardiya Sonu (Sabah)',['l5','b11']],['Uyku Öncesi Hafif Atıştırmalık',['s3','s6']]]},\n  travel:{label:'Sık Seyahat Eden',\n    tips:['Yanınızda bozulmayan, soğutma gerektirmeyen atıştırmalıklar (kuruyemiş, kuru meyve) taşıyın.','Seyahat noktalarında mümkünse ızgara/haşlama seçenekleri tercih edin.','Seyahat sırasında su tüketimini ihmal etmeyin; uçak/araç ortamı sıvı kaybını artırabilir.'],\n    slots:[['Seyahat Kahvaltısı',['l6','b10']],['Yolda Öğle Yemeği',['l7','m12']],['Ara Öğün (Taşınabilir)',['s5','s9']],['Akşam Yemeği (Otel/Ev)',['m1','m2']]]},\n  active:{label:'Aktif / Ayakta-Sahada Çalışan',\n    tips:['Fiziksel olarak aktif bir işte çalışıyorsanız sıvı ve elektrolit alımına dikkat edin.','Enerji ihtiyacınız artabileceğinden öğün aralarını çok uzun tutmamaya çalışın.','Taşınabilir, dengeli ara öğünler (meyve, kuruyemiş, ayran) enerjinizi gün boyu destekleyebilir.'],\n    slots:[['Kahvaltı',['b1','b3']],['Öğle Yemeği',['m1','m7']],['Ara Öğün',['s3','s1']],['Akşam Yemeği',['m9','m6']]]},\n  student:{label:'Öğrenci / Bütçe Dostu',\n    tips:['Kuru baklagiller (mercimek, nohut, fasulye) ucuz ve doyurucu protein kaynaklarıdır.','Toplu pişirip birkaç güne bölmek hem zamandan hem bütçeden tasarruf sağlar.','Mevsim sebze ve meyvesi genelde daha uygun fiyatlıdır.','Şekerli/işlenmiş atıştırmalıklar yerine ucuz ve doyurucu alternatifleri (yulaf, muz, yoğurt) tercih edin.'],\n    slots:[['Kahvaltı (Hızlı-Ucuz)',['l9','b3']],['Öğle Yemeği (Bütçe Dostu)',['l8','m4']],['Ara Öğün',['s3','s6']],['Akşam Yemeği (Bütçe Dostu)',['m4','m13']]]},\n  pregnancy:{label:'Gebelik / Emzirme Dönemi (Genel Örnek)',\n    tips:['Bu dönemde beslenme mutlaka doktor/diyetisyen takibiyle bireyselleştirilmelidir; burada yalnızca genel bir örnek gösterilmektedir.','Folat, demir ve kalsiyum içeren gıdalara yer vermek genel olarak önemlidir.','Az ve sık öğünler, özellikle erken dönemde bulantıyı hafifletebilir.','Yeterli sıvı alımına özen gösterin.'],\n    slots:[['Kahvaltı',['l10','b1']],['Öğle Yemeği',['m6','m3']],['Ara Öğün',['s2','s8']],['Akşam Yemeği',['m9','m4']]]}\n};\n\nfunction dpRenderLifestyle(){\n  var sel=document.getElementById('lifestyleSelect');\n  var key=(sel && DP_LIFESTYLE[sel.value]) ? sel.value : Object.keys(DP_LIFESTYLE)[0];\n  var L=DP_LIFESTYLE[key];\n  var tipsHtml=L.tips.map(function(t){return '<li>'+t+'</li>';}).join('');\n  var target=dpTarget(), ptar=dpProteinTarget(), scale=dpScale();\n  var r=dpBuildDaySlots(L.slots,0,target,ptar,DP_FATPCT,scale);\n  var host=document.getElementById('lifestylePlan');\n  host.innerHTML =\n    '<div class=\"dp-prep\" style=\"margin-bottom:16px;\"><b>'+L.label+' için pratik öneriler:</b><ul style=\"margin:8px 0 0;padding-left:20px;\">'+tipsHtml+'</ul></div>'\n    +'<div class=\"day-block\"><h3>Örnek Gün — '+L.label+'</h3>'\n    +'<p class=\"day-sum\">Bu örnek günün toplamı: <b>'+Math.round(r.k)+' kcal</b> &nbsp;·&nbsp; Karbonhidrat <b>'+r.c.toFixed(1)+' g</b> &nbsp;·&nbsp; Protein <b>'+r.p.toFixed(1)+' g</b> &nbsp;·&nbsp; Yağ <b>'+r.f.toFixed(1)+' g</b></p>'\n    +r.html+'</div>';\n}\ndpRenderLifestyle();\n\n\n// ================= LABORATUVAR SONUÇLARI DEĞERLENDİRME =================\nconst DP_LABS = [{\"id\":\"hb\",\"label\":\"Hemoglobin\",\"unit\":\"g/dL\",\"rangeM\":[13.5,17.5],\"rangeF\":[12,15.5],\"crit\":[7,20],\"lowAdv\":\"Demir, B12 ve folat açısından zengin besinler (kırmızı et, karaciğer, yumurta, yeşil yapraklı sebze, baklagil) artırılabilir; C vitamini ile birlikte tüketmek demir emilimini destekler.\",\"highAdv\":\"Genellikle beslenmeyle doğrudan ilişkili değildir; dehidratasyon veya başka bir klinik neden söz konusu olabilir, hekiminize danışın.\",\"linkLow\":\"anemia_b12\",\"linkHigh\":null},{\"id\":\"ferritin\",\"label\":\"Ferritin\",\"unit\":\"ng/mL\",\"rangeM\":[20,250],\"rangeF\":[10,120],\"crit\":null,\"lowAdv\":\"Kırmızı et, karaciğer, yumurta sarısı, mercimek, ıspanak gibi demir kaynakları C vitamini ile birlikte tüketilebilir; çay/kahveyi ana öğünlerden ayrı için (demir emilimini azaltabilir).\",\"highAdv\":\"Fazla demir takviyesi ve aşırı kırmızı et tüketiminden kaçının; kesin neden ve gereken önlem için hekiminize danışın.\",\"linkLow\":\"anemia_b12\",\"linkHigh\":null},{\"id\":\"b12\",\"label\":\"Vitamin B12\",\"unit\":\"pg/mL\",\"rangeM\":[200,900],\"rangeF\":[200,900],\"crit\":null,\"lowAdv\":\"Et, yumurta, süt ürünleri, balık gibi hayvansal kaynaklar artırılabilir; vegan/vejetaryen beslenenlerde takviye hekim önerisiyle değerlendirilebilir.\",\"highAdv\":\"Genellikle klinik önemi sınırlıdır; takviye kullanıyorsanız dozu hekiminizle gözden geçirin.\",\"linkLow\":\"anemia_b12\",\"linkHigh\":null},{\"id\":\"folate\",\"label\":\"Folat\",\"unit\":\"ng/mL\",\"rangeM\":[3,17],\"rangeF\":[3,17],\"crit\":null,\"lowAdv\":\"Yeşil yapraklı sebzeler, baklagiller, turunçgiller ve tam tahıllar artırılabilir.\",\"highAdv\":\"Genellikle klinik önemi sınırlıdır; hekiminize danışın.\",\"linkLow\":\"anemia_b12\",\"linkHigh\":null}, eleyebilirsiniz.\",\"linkLow\":null,\"linkHigh\":\"dyslipidemia\"},{\"id\":\"ldl\",\"label\":\"LDL Kolesterol\",\"unit\":\"mg/dL\",\"rangeM\":[0,100],\"rangeF\":[0,100],\"crit\":null,\"lowAdv\":\"Düşük LDL genellikle klinik olarak önemli kabul edilmez.\",\"highAdv\":\"Doymuş yağ azaltımı, yulaf/baklagil gibi çözünür lif ve omega-3 artırımı faydalı olabilir; \\\"Dislipidemi\\\" menüsünü inceleyebilirsiniz.\",\"linkLow\":null,\"linkHigh\":\"dyslipidemia\"},{\"id\":\"hdl\",\"label\":\"HDL Kolesterol\",\"unit\":\"mg/dL\",\"rangeM\":[40,999],\"rangeF\":[50,999],\"crit\":null,\"lowAdv\":\"Zeytinyağı, yağlı balık, kuruyemiş gibi tekli/çoklu doymamış yağ kaynakları ve düzenli fiziksel aktivite HDL düzeyini destekleyebilir.\",\"highAdv\":\"Yüksek HDL genellikle olumlu kabul edilir, özel bir kısıtlama gerekmez.\",\"linkLow\":\"dyslipidemia\",\"linkHigh\":null},{\"id\":\"tg\",\"label\":\"Trigliserit\",\"unit\":\"mg/dL\",\"rangeM\":[0,150],\"rangeF\":[0,150],\"crit\":null,\"lowAdv\":\"Düşük trigliserit genellikle klinik olarak önemli kabul edilmez.\",\"highAdv\":\"Basit şeker ve alkol tüketimi azaltılabilir, omega-3 kaynakları artırılabilir; \\\"Dislipidemi\\\" menüsünü inceleyebilirsiniz.\",\"linkLow\":null,\"linkHigh\":\"dyslipidemia\"},{\"id\":\"k\",\"label\":\"Potasyum\",\"unit\":\"mmol/L\",\"rangeM\":[3.5,5],\"rangeF\":[3.5,5],\"crit\":[2.5,6],\"lowAdv\":\"Muz, patates, kuru meyve, portakal gibi potasyum kaynakları artırılabilir.\",\"highAdv\":\"Potasyumdan zengin besinler (muz, patates, kuru meyve, domates) sınırlandırılabilir; böbrek fonksiyonu değerlendirmesi için hekiminize danışın — \\\"Kronik Böbrek Hastalığı\\\" menüsü fikir verebilir.\",\"linkLow\":null,\"linkHigh\":\"ckd\"},{\"id\":\"na\",\"label\":\"Sodyum\",\"unit\":\"mmol/L\",\"rangeM\":[135,145],\"rangeF\":[135,145],\"crit\":[120,155],\"lowAdv\":\"Elektrolit dengesizliği diyetle kendi başına yönetilmemelidir; hekiminize danışın.\",\"highAdv\":\"Tuz ve işlenmiş gıda tüketimi azaltılabilir; \\\"Hipertansiyon\\\" menüsündeki düşük sodyum yaklaşımı fikir verebilir.\",\"linkLow\":null,\"linkHigh\":\"hypertension\"},{\"id\":\"ca\",\"label\":\"Kalsiyum\",\"unit\":\"mg/dL\",\"rangeM\":[8.5,10.5],\"rangeF\":[8.5,10.5],\"crit\":null,\"lowAdv\":\"Süt ürünleri, yeşil yapraklı sebzeler ve yeterli D vitamini alımı desteklenebilir.\",\"highAdv\":\"Kalsiyum düzeyi diyetle kendi başına yönetilmemelidir; hekiminize danışın.\",\"linkLow\":null,\"linkHigh\":null},{\"id\":\"albumin\",\"label\":\"Albümin\",\"unit\":\"g/dL\",\"rangeM\":[3.5,5],\"rangeF\":[3.5,5],\"crit\":null,\"lowAdv\":\"Yeterli ve kaliteli protein alımı (et, yumurta, süt ürünleri, baklagil) desteklenebilir; altta yatan neden için hekiminize danışın.\",\"highAdv\":\"Genellikle dehidratasyonla ilişkilidir; hekiminize danışın.\",\"linkLow\":null,\"linkHigh\":null},{\"id\":\"creatinine\",\"label\":\"Kreatinin\",\"unit\":\"mg/dL\",\"rangeM\":[0.7,1.3],\"rangeF\":[0.6,1.1],\"crit\":null,\"lowAdv\":\"Genellikle klinik önemi sınırlıdır.\",\"highAdv\":\"Protein, potasyum ve fosfor alımı hekim/diyetisyen eşliğinde gözden geçirilebilir; \\\"Kronik Böbrek Hastalığı\\\" menüsünü inceleyebilirsiniz.\",\"linkLow\":null,\"linkHigh\":\"ckd\"},{\"id\":\"crp\",\"label\":\"CRP\",\"unit\":\"mg/L\",\"rangeM\":[0,5],\"rangeF\":[0,5],\"crit\":null,\"lowAdv\":\"Düşük CRP genellikle klinik olarak önemli kabul edilmez.\",\"highAdv\":\"Sebze/meyve, omega-3 kaynakları ve tam tahıl ağırlıklı, işlenmiş gıdası azaltılmış bir beslenme düzeni genel olarak desteklenebilir; altta yatan neden için hekiminize danışın.\",\"linkLow\":null,\"linkHigh\":null},{\"id\":\"uricacid\",\"label\":\"Ürik Asit\",\"unit\":\"mg/dL\",\"rangeM\":[3.4,7],\"rangeF\":[2.4,6],\"crit\":null,\"lowAdv\":\"Düşük ürik asit genellikle klinik olarak önemli kabul edilmez.\",\"highAdv\":\"Kırmızı et, sakatat, deniz ürünleri ve alkol azaltılabilir, bol su tüketilebilir; \\\"Gut\\\" menüsünü inceleyebilirsiniz.\",\"linkLow\":null,\"linkHigh\":\"gout\"}];\n\nfunction dpJumpToCondition(key){\n
