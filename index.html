ound:var(--white);font-size:18px;cursor:pointer;line-height:1;}\n  .counter-num{font-family:'Fraunces',serif;font-size:24px;color:var(--teal-deep);min-width:36px;}\n\n  .disclaimer{margin-top:40px;font-size:12.5px;color:#7A7364;line-height:1.6;border-top:1px solid var(--line);padding-top:18px;}\n  .hidden{display:none !important;}\n  @media (max-width:600px){header.hero{padding:40px 18px 56px;} .card{padding:22px;}}\n\n  /* Danışan bilgi çubuğu */\n  .patient-bar{display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap; margin-top:24px; padding-top:18px; border-top:1px solid rgba(246,242,233,.2);}\n  .patient-bar label{color:var(--sage); font-size:11px; margin-bottom:4px;}\n  .patient-bar input{background:rgba(255,255,255,.08); border:1px solid rgba(246,242,233,.3); color:var(--paper); border-radius:3px; padding:8px 10px; font-size:14px;}\n  .patient-bar input::placeholder{color:rgba(246,242,233,.5);}\n  .print-btn{background:var(--amber); color:var(--teal-deep); border:none; border-radius:3px; padding:10px 18px; font-weight:700; cursor:pointer; font-size:14px;}\n  .print-only-header{display:none;}\n\n  @media print{\n    body{background:#fff;}\n    header.hero{background:#fff !important; box-shadow:none; padding:0 0 14px;}\n    header.hero::before, header.hero::after{display:none;}\n    header.hero, header.hero *{color:#000 !important;}\n    .eyebrow{color:#444 !important;}\n    .no-print{display:none !important;}\n    button{display:none !important;}\n    .print-only-header{display:block !important; margin-top:10px; font-size:13px; border-top:1px solid #999; padding-top:8px;}\n    .card{box-shadow:none; border:1px solid #bbb; margin-top:14px; page-break-inside:avoid;}\n    input[type=number], select{\n      border:none !important; background:transparent !important; padding:2px 0 !important;\n      -webkit-appearance:none; appearance:none; font-weight:600; color:#000 !important;\n    }\n    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }\n  }\n\n  :root{--dp-line:#D8CFB6;--dp-head:#1E3F3A;--dp-acc:#C08A2E;--dp-soft:#EFE8D8;}\n\n  /* --- Detaylı 7 günlük program --- */\n  .day-block{border:1px solid var(--dp-line,#D8CFB6);border-radius:4px;padding:20px;margin-bottom:22px;background:#fff;}\n  .day-block h3{font-family:'Fraunces',serif;font-size:20px;margin:0 0 4px;color:var(--dp-head,#1E3F3A);position:relative;padding-left:14px;}\n  .day-block h3::before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:5px;border-radius:3px;background:linear-gradient(180deg,#C08A2E,#1E3F3A);}\n  .day-sum{font-size:12.5px;color:#6B6455;margin:0 0 16px;padding-bottom:12px;border-bottom:1px dashed var(--dp-line,#D8CFB6);}\n  .day-sum b{color:var(--dp-head,#1E3F3A);}\n  .dp-meal{margin-bottom:18px;border-left:3px solid var(--meal-color,#C08A2E);padding-left:14px;border-radius:0 4px 4px 0;}\n  .dp-meal[data-meal-type=\"breakfast\"]{--meal-color:#C08A2E;}\n  .dp-meal[data-meal-type=\"main\"]{--meal-color:#1E3F3A;}\n  .dp-meal[data-meal-type=\"snack\"]{--meal-color:#A9713F;}\n  .dp-meal[data-meal-type=\"workout\"]{--meal-color:#2D6E8F;}\n  .dp-meal[data-meal-type=\"bedtime\"]{--meal-color:#6B5B95;}\n  .dp-meal[data-meal-type=\"other\"]{--meal-color:#6B6455;}\n  .dp-meal .meal-head-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px;}\n  .dp-meal .kcal-target{font-size:11px;color:#6B6455;font-weight:600;white-space:nowrap;}\n  .dp-meal h5{font-family:'Source Code Pro',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--meal-color,#C08A2E);margin:0;}\n  .dp-meal .mname{font-weight:700;font-size:15px;margin-bottom:8px;color:var(--dp-head,#1E3F3A);}\n  .macro-bar{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:2px 0 10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);}\n  .macro-seg{height:100%;}\n  .macro-seg.macro-p{background:#A9713F;}\n  .macro-seg.macro-c{background:#C08A2E;}\n  .macro-seg.macro-f{background:#2D6E8F;}\n  .macro-legend{font-size:10.5px;color:#6B6455;margin:0 0 14px;display:flex;gap:14px;flex-wrap:wrap;}\n  .dp-tips-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;padding:16px;background:var(--dp-soft,#EFE8D8);border-radius:6px;}\n  .dp-tip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--dp-line,#D8CFB6);border-radius:20px;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--dp-head,#1E3F3A);flex:1;min-width:150px;}\n  .dp-tip-icon{font-size:18px;}\n  .macro-legend span{display:inline-flex;align-items:center;gap:4px;}\n  .macro-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;}\n  table.dp-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px;}\n  table.dp-tbl th{text-align:left;background:var(--dp-head,#1E3F3A);color:#fff;padding:6px 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;}\n  table.dp-tbl td{padding:6px 8px;border-bottom:1px solid var(--dp-line,#D8CFB6);}\n  table.dp-tbl td.num,table.dp-tbl th.num{text-align:right;white-space:nowrap;}\n  table.dp-tbl tr.tot td{font-weight:700;background:var(--dp-soft,#EFE8D8);border-bottom:none;}\n  .dp-prep{font-size:12.5px;color:#4A4638;background:var(--dp-soft,#EFE8D8);border-left:3px solid var(--dp-acc,#C08A2E);padding:8px 12px;border-radius:0 3px 3px 0;}\n  .dp-prep b{color:var(--dp-head,#1E3F3A);}\n  @media print{\n    .day-block{page-break-before:always;page-break-inside:avoid;border:none;padding:0;}\n    .day-block:first-of-type{page-break-before:auto;}\n    .dp-meal{border-left-width:3px !important;}\n    .macro-bar{-webkit-print-color-adjust:exact;print-color-adjust:exact;}\n  }\n\n\n  /* --- Laboratuvar değerlendirme --- */\n  .lab-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11.5px;font-weight:700;}\n  .lab-ok{background:#DCEEE3;color:#1E3F3A;}\n  .lab-low{background:#FDE9D2;color:#7A4A12;}\n  .lab-high{background:#F8D7D2;color:#8C2E1F;}\n  .lab-critical{background:#F8D7D2;border:1px solid #E0796A;color:#7A2013;padding:14px 16px;border-radius:4px;margin-bottom:16px;font-size:13.5px;}\n  .lab-link{color:#C08A2E;cursor:pointer;text-decoration:underline;font-size:12px;white-space:nowrap;}\n\n  /* --- Tarifler --- */\n  .recipe-group-title{font-family:'Fraunces',serif;font-size:17px;margin:22px 0 12px;border-bottom:1px solid var(--dp-line,#D8CFB6);padding-bottom:6px;color:var(--dp-head,#1E3F3A);}\n  .recipe-group-title:first-child{margin-top:0;}\n  .recipe-card{border:1px solid var(--dp-line,#D8CFB6);border-radius:4px;padding:14px 16px;margin-bottom:12px;background:#fff;page-break-inside:avoid;break-inside:avoid;}\n  .recipe-name{font-weight:700;font-size:14.5px;margin-bottom:3px;}\n  .recipe-macro{font-size:11.5px;color:#6B6455;margin-bottom:8px;}\n  .recipe-ingr{margin:0 0 8px;padding-left:18px;font-size:13px;}\n  .recipe-ingr li{margin-bottom:3px;}\n  .diet-badge{display:inline-block;font-size:11px;font-weight:600;background:var(--dp-soft,#EFE8D8);color:var(--dp-head,#1E3F3A);border-radius:12px;padding:2px 10px;margin-right:6px;}\n\n\n  /* ===== Telefon/Bilgisayar Kullanılabilirlik İyileştirmeleri ===== */\n  @media (max-width: 720px){\n    /* Geniş tabloları sayfayı yatay kaydırmaya zorlamak yerine\n       kendi içinde yatay kaydırılabilir yap */\n    table.exchange-table, table.dp-tbl, table.supp-table{\n      display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; white-space:nowrap;\n      max-width:100%;\n    }\n    table.exchange-table th, table.exchange-table td,\n    table.dp-tbl th, table.dp-tbl td,\n    table.supp-table th, table.supp-table td{ white-space:nowrap; }\n\n    /* Dokunmatik hedefleri büyüt */\n    .toggle{ padding:12px 8px; }\n    .dislike-chip, .tag-btn{ padding:10px 15px; }\n    .btn-primary{ padding:16px; }\n  }\n\n  /* iOS Safari'de odaklanınca otomatik yakınlaştırmayı önlemek için\n     tüm form elemanları en az 16px olmalı */\n  input[type=number], input[type=text], select{ font-size:16px; }\n\n\n  /* --- Danışan Listesi / Takip Grafikleri --- */\n  .file-btn{display:inline-block;text-align:center;cursor:pointer;}\n  .file-btn input[type=file]{display:none;}\n  #trackCanvas{width:100%;height:260px;display:block;}\n\n\n  /* --- Barkod / Hatırlatıcı --- */\n  #scannerReader video{border-radius:4px;}\n  #reminderBanner{transition:opacity .3s;}\n\n\n  /* --- Diyetisyen İlker marka etiketi + renklendirme --- */\n  .dp-brand-tag{display:inline-flex;align-items:center;font-family:'Source Code Pro',monospace;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:6px 16px 6px 8px;border-radius:22px;margin-bottom:14px;box-shadow:0 2px 5px rgba(0,0,0,.12);}\n  .dp-masthead{display:flex;align-items:center;justify-content:center;gap:14px;padding:22px 0 26px;}\n  .dp-masthead-name{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:#1E3F3A;}\n  .dp-masthead-sub{font-family:'Source Code Pro',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8A8062;margin-top:2px;}\n  .dp-masthead-tag{font-family:'Fraunces',serif;font-size:12.5px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:#8A8062;margin-top:7px;}\n  @media print{\n    .dp-brand-tag{-webkit-print-color-adjust:exact;print-color-adjust:exact;}\n    .card{background:#fff !important;}\n  }\n\n<\/style>\n</head>\n<body>\n\n<header class=\"hero\">\n  <div class=\"hero-inner\">\n    <p class=\"eyebrow\">Diyetisyen İlker</p>\n    <h1>Bebek ve Çocuk Beslenme<br>Programı</h1>\n    <p>Yaş grubuna göre kalori ihtiyacı / BKİ değerlendirmesi, sevilmeyen besinlere göre uyarlanabilir hastalık bazlı öğün ve haftalık menüler, değişim listeleri.</p>\n    <div class=\"mode-toggle no-print\" id=\"modeToggle\">\n      <div class=\"mode-btn active\" data-mode=\"bebek\">Bebek (0-12 Ay)</div>\n      <div class=\"mode-btn\" data-mode=\"cocuk\">Çocuk (1-18 Yaş)</div>\n    </div>\n    <div class=\"patient-bar no-print\">\n      <div><label>Danışan Adı Soyadı</label><input type=\"text\" id=\"patientName\" placeholder=\"Ad Soyad (bebek/çocuk)\"></div>\n      <div><label>Tarih</label><input type=\"text\" id=\"patientDate\" placeholder=\"gg.aa.yyyy\"></div>\n      <button class=\"print-btn\" onclick=\"printReport()\">🖨️ Yazdır</button>\n      <button class=\"print-btn\" style=\"background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;\" onclick=\"downloadReport()\">⬇️ Raporu İndir (HTML)</button>\n    </div>\n    <div class=\"print-only-header\" id=\"printHeader\"></div>\n  </div>\n</header>\n\n<div class=\"wrap\">\n\n<!-- ================= BEBEK MODE ================= -->\n<div id=\"bebekSection\">\n\n  <div class=\"card\">\n    <p class=\"section-title\">1 · Bebek Bilgileri ve Enerji İhtiyacı</p>\n    <p class=\"section-sub\">0-12 ay bebeklerde beslenme, öğün/menü değil anne sütü, mama ve ek gıda dengesine dayanır. Aşağıdaki hesaplama yalnızca yaklaşık günlük enerji ihtiyacını gösterir.</p>\n    <div class=\"grid\">\n      <div><label for=\"bAge\">Yaş (Ay)</label><input type=\"number\" id=\"bAge\" value=\"4\" min=\"0\" max=\"12\" onchange=\"renderBebek(); dpSyncInfantMonthFromBebek();\"></div>\n      <div><label for=\"bWeight\">Kilo (kg)</label><input type=\"number\" id=\"bWeight\" value=\"6.5\" min=\"2\" max=\"15\" step=\"0.1\"></div>\n      <div>\n        <label>Cinsiyet</label>\n        <div class=\"toggle-row\" id=\"bGenderToggle\">\n          <div class=\"toggle active\" data-val=\"female\">Kız</div>\n          <div class=\"toggle\" data-val=\"male\">Erkek</div>\n        </div>\n      </div>\n    </div>\n    <button class=\"btn-primary\" onclick=\"calcBebek()\">Günlük Enerji İhtiyacını Hesapla</button>\n    <div class=\"results\" id=\"bebekResults\">\n      <div class=\"result-grid\">\n        <div class=\"result-box accent\"><div class=\"num\" id=\"bKcal\">--</div><div class=\"lbl\">Yaklaşık Günlük Enerji (kcal)</div></div>\n        <div class=\"result-box\"><div class=\"num\" id=\"bMl\">--</div><div class=\"lbl\">Yaklaşık Süt/Mama Miktarı (ml/gün)</div></div>\n      </div>\n      <p id=\"bNote\" style=\"font-size:13px;color:#6B6455;\"></p>\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">2 · Formül Mama Türleri ve Kullanım Alanları</p>\n    <p class=\"section-sub\">Hangi formülün kullanılacağı, bebeğin klinik durumuna göre hekim (gerekirse pediatrik gastroenteroloji/metabolizma uzmanı) tarafından belirlenir. Aşağıdaki tablo genel bir yönlendirme referansıdır.</p>\n    <table class=\"exchange-table\">\n      <tr><th>Formül Türü</th><th>Genel Kullanım Alanı</th><th>Not</th></tr>\n      <tr><td>Standart (inek sütü bazlı) başlangıç/devam formülü</td><td>Sağlıklı, anne sütü alamayan/yetersiz alan bebekler</td><td>0-6 ay \"başlangıç\", 6-12 ay \"devam\" formülü olarak ayrılır</td></tr>\n      <tr><td>Kısmi hidrolize (HA) formül</td><td>Ailede alerji öyküsü olan, önleyici amaçlı kullanımda değerlendirilebilir</td><td>Kanıtlanmış inek sütü alerjisi tedavisi için yeterli değildir</td></tr>\n      <tr><td>Ekstensif/tam hidrolize formül</td><td>Kanıtlanmış veya kuvvetle şüphelenilen inek sütü protein alerjisi</td><td>Protein küçük parçalara ayrılmıştır; hekim reçetesiyle kullanılır</td></tr>\n      <tr><td>Amino asit bazlı formül</td><td>Ağır/çoklu gıda alerjisi, hidrolize formüle yanıt vermeyen vakalar</td><td>En az alerjenik seçenek; hekim takibiyle kullanılır</td></tr>\n      <tr><td>Laktozsuz formül</td><td>Konjenital veya geçici laktoz intoleransı (örn. ishal sonrası)</td><td>Rutin kullanım için önerilmez, klinik endikasyon gerekir</td></tr>\n      <tr><td>Anti-regürjitasyon (AR) formül</td><td>Sık kusma/reflü eğilimi olan bebekler</td><td>Koyulaştırılmış kıvamdadır; hekim önerisiyle kullanılır</td></tr>\n      <tr><td>Prematüre/düşük doğum ağırlığı formülü</td><td>Prematüre veya düşük doğum ağırlıklı bebekler</td><td>Enerji, protein, kalsiyum, fosfor açısından zenginleştirilmiştir</td></tr>\n      <tr><td>Metabolik formül (örn. PKU için fenilalaninsiz/düşük)</td><td>Fenilketonüri ve benzeri doğuştan metabolizma hastalıkları</td><td>Yalnızca metabolizma uzmanı/diyetisyeni tarafından reçetelendirilir ve izlenir</td></tr>\n    </table>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">3 · Duruma Göre Beslenme Rehberi</p>\n    <p class=\"section-sub\">Bebeğin durumunu seçin; ek gıda döneminde sevilmeyen/tepki verilen ilk gıdaları işaretleyebilirsiniz.</p>\n\n    <label>Ek Gıda Döneminde Tepki Verilen / Tercih Dışı Gıdalar (6-12 ay için)</label>\n    <div class=\"dislike-grid\" id=\"bDislikeGrid\"></div>\n\n    <label for=\"bCondition\">Durum</label>\n    <select id=\"bCondition\" onchange=\"renderBebek(); dpSyncInfantMonthFromBebek();\" style=\"margin-bottom:20px;\">\n      <option value=\"healthy0_6\">Sağlıklı Bebek (0-6 Ay)</option>\n      <option value=\"transition6_12\">Ek Gıdaya Geçiş (6-12 Ay)</option>\n      <option value=\"cmpa\">İnek Sütü Protein Alerjisi</option>\n      <option value=\"reflux\">Reflü / Kusma Eğilimi</option>\n      <option value=\"preterm\">Prematüre Bebek</option>\n      <option value=\"constipation\">Kabızlık</option>\n      <option value=\"pku\">Fenilketonüri (PKU)</option>\n      <option value=\"galactosemia\">Galaktozemi</option>\n      <option value=\"msud\">Akçaağaç Şurubu İdrar Hastalığı (MSUD)</option>\n    </select>\n\n    <div id=\"bebekGuide\"></div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">4 · Ek Gıda Takvimi (6-24 Ay İlerleme Rehberi)</p>\n    <p class=\"section-sub\">Aya göre genel ilerleme sırası; her bebeğin hazır olma belirtileri (baş kontrolü, oturabilme, ilgi gösterme) bireysel değerlendirilmelidir.</p>\n    <table class=\"exchange-table\">\n      <tr><th>Dönem</th><th>Kıvam / Yaklaşım</th><th>Örnek Gıdalar</th></tr>\n      <tr><td>6. Ay</td><td>Pürüzsüz püre, tek gıda ile başlama (3-5 gün ara)</td><td>Pirinç/yulaf püresi, elma, armut, havuç, kabak püresi</td></tr>\n      <tr><td>7-8. Ay</td><td>Biraz daha kaba pürelenmiş, karışık tatlar</td><td>Tavuk/kırmızı et püresi, mercimek püresi, muz, avokado</td></tr>\n      <tr><td>9-10. Ay</td><td>Parmak gıdalara geçiş, yumuşak lokmalar</td><td>Haşlanmış sebze parçaları, yumuşak meyve dilimleri, köfte parçaları</td></tr>\n      <tr><td>11-12. Ay</td><td>Aile sofrasına yakın kıvam, kendi kendine yeme desteklenir</td><td>Ufalanmış ekmek, küçük parçalanmış et/sebze, yumurta</td></tr>\n      <tr><td>12-24. Ay</td><td>Aile beslenmesine kademeli geçiş, 3 ana + 2 ara öğün</td><td>Çoğu aile yemeği (tuz/şeker azaltılmış), süt ürünleri, tam yumurta</td></tr>\n    </table>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">5 · Emzirme / Bez Takip Sayacı</p>\n    <p class=\"section-sub\">Günlük besleme ve ıslak/kirli bez sayımı için basit sayaç (yalnızca bu oturumda tutulur, kaydedilmez).</p>\n    <div class=\"grid\" id=\"trackerGrid\"></div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">6 · PKU Takip Formu</p>\n    <p class=\"section-sub\">\n      Fenilalanin/protein sınırı ve miktarları bu araç tarafından önerilmez; aşağıdaki alanlar yalnızca metabolizma uzmanı/diyetisyeni tarafından\n      belirlenen ve düzenli kan tetkikleriyle güncellenen değerlerin kaydını tutmaya yarar.\n    </p>\n    <div style=\"overflow-x:auto;\">\n      <table class=\"exchange-table\" id=\"pkuLogTable\">\n        <tr><th>Tarih</th><th>Kan Fenilalanin Düzeyi</th><th>Hekim/Diyetisyenin Belirlediği Günlük Fe/Protein Sınırı</th><th>Tüketilen Gıdalar / Notlar</th><th></th></tr>\n      </table>\n    </div>\n    <div class=\"grid\" style=\"margin-top:16px;\">\n      <div><label for=\"pkuDate\">Tarih</label><input type=\"text\" id=\"pkuDate\" placeholder=\"gg.aa.yyyy\"></div>\n      <div><label for=\"pkuLevel\">Kan Fenilalanin Düzeyi</label><input type=\"text\" id=\"pkuLevel\" placeholder=\"Hekim raporundan giriniz\"></div>\n      <div><label for=\"pkuLimit\">Günlük Fe/Protein Sınırı</label><input type=\"text\" id=\"pkuLimit\" placeholder=\"Hekim/diyetisyen tarafından belirlenen\"></div>\n      <div><label for=\"pkuNotes\">Tüketilen Gıdalar / Notlar</label><input type=\"text\" id=\"pkuNotes\" placeholder=\"Serbest metin\"></div>\n    </div>\n    <button class=\"btn-primary\" onclick=\"addPkuLog()\">Kayıt Ekle</button>\n    <p style=\"font-size:12px;color:#6B6455;margin-top:10px;\">Bu form yalnızca bu oturumda tutulur, sayfa kapatıldığında kaydedilmez; kalıcı takip için danışan dosyasına aktarılması önerilir.</p>\n  </div>\n</div>\n\n<!-- ================= ÇOCUK MODE ================= -->\n<div id=\"cocukSection\" class=\"hidden\">\n\n  <div class=\"card\">\n    <p class=\"section-title\">1 · Çocuk Bilgileri</p>\n    <p class=\"section-sub\">Çocuklarda BKİ tek başına değil, yaşa ve cinsiyete göre persentil eğrileriyle birlikte değerlendirilir; aşağıdaki değer yalnızca ham BKİ ve yaklaşık günlük enerji ihtiyacını gösterir.</p>\n    <div class=\"grid\">\n      <div>\n        <label>Cinsiyet</label>\n        <div class=\"toggle-row\" id=\"cGenderToggle\">\n          <div class=\"toggle active\" data-val=\"female\">Kız</div>\n          <div class=\"toggle\" data-val=\"male\">Erkek</div>\n        </div>\n      </div>\n      <div><label for=\"cAge\">Yaş</label><input type=\"number\" id=\"cAge\" value=\"9\" min=\"1\" max=\"18\" onchange=\"if(typeof dpRenderPlan==='function') dpRenderPlan(); if(typeof renderCocukWeek==='function') renderCocukWeek();\"></div>\n      <div><label for=\"cHeight\">Boy (cm)</label><input type=\"number\" id=\"cHeight\" value=\"132\" min=\"60\" max=\"200\"></div>\n      <div><label for=\"cWeight\">Kilo (kg)</label><input type=\"number\" id=\"cWeight\" value=\"30\" min=\"6\" max=\"120\"></div>\n      <div>\n        <label for=\"cActivity\">Aktivite Düzeyi</label>\n        <select id=\"cActivity\">\n          <option value=\"1.2\">Sedanter</option>\n          <option value=\"1.4\" selected>Hafif aktif</option>\n          <option value=\"1.6\">Orta aktif</option>\n          <option value=\"1.8\">Çok aktif</option>\n        </select>\n      </div>\n    </div>\n    <button class=\"btn-primary\" onclick=\"calcCocuk()\">BKİ ve Kalori İhtiyacını Hesapla</button>\n    <div class=\"results\" id=\"cocukResults\">\n      <div class=\"result-grid\">\n        <div class=\"result-box accent\"><div class=\"num\" id=\"cBmi\">--</div><div class=\"lbl\">BKİ (kg/m²)</div></div>\n        <div class=\"result-box\"><div class=\"num\" id=\"cKcalKg\">--</div><div class=\"lbl\">kcal/kg Referans (yaşa göre)</div></div>\n        <div class=\"result-box pink\"><div class=\"num\" id=\"cTarget\">--</div><div class=\"lbl\">Yaklaşık Günlük Enerji (kcal)</div></div>\n      </div>\n      <p style=\"font-size:12.5px;color:#6B6455;\">Bu değer yaşa göre genel kcal/kg referansından hesaplanmıştır; büyüme eğrisi, aktivite ve klinik duruma göre diyetisyen tarafından kesinleştirilmelidir.</p>\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">2 · Büyüme Takip (Genel Referans)</p>\n    <p class=\"section-sub\">Bu tablo resmi WHO/persentil büyüme eğrisinin yerini tutmaz; yalnızca kaba bir karşılaştırma sunar. Kesin değerlendirme için çocuk hekimi/diyetisyeni tarafından resmi büyüme eğrisi kullanılmalıdır.</p>\n    <table class=\"exchange-table\">\n      <tr><th>Yaş</th><th>Yaklaşık Ortalama Kilo (kg)</th><th>Yaklaşık Ortalama Boy (cm)</th></tr>\n      <tr><td>2 yaş</td><td>12-13</td><td>85-88</td></tr>\n      <tr><td>4 yaş</td><td>16-17</td><td>100-103</td></tr>\n      <tr><td>6 yaş</td><td>20-21</td><td>114-117</td></tr>\n      <tr><td>8 yaş</td><td>25-27</td><td>127-130</td></tr>\n      <tr><td>10 yaş</td><td>31-33</td><td>138-141</td></tr>\n      <tr><td>12 yaş</td><td>38-42</td><td>149-153</td></tr>\n      <tr><td>14 yaş</td><td>47-52</td><td>160-165</td></tr>\n      <tr><td>16 yaş</td><td>54-60</td><td>165-172</td></tr>\n    </table>\n    <p style=\"font-size:12.5px;color:#6B6455;margin-top:12px;\">Girilen kilo/boy bu aralıkların önemli ölçüde dışındaysa (özellikle altında), çocuk hekimi değerlendirmesi önerilir.</p>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">3 · Hastalığa Özel, Kişiselleştirilmiş Gün Menüsü</p>\n    <p class=\"section-sub\">Sevilmeyen besinleri işaretleyin — menü aynı besin grubundan otomatik alternatifle güncellenir.</p>\n\n    <label>Sevilmeyen / Tüketilmek İstenmeyen Besinler</label>\n    <div class=\"dislike-grid\" id=\"cDislikeGrid\"></div>\n    <div style=\"margin:-8px 0 20px;\">\n      <div class=\"dislike-chip\" id=\"cVejeToggle\" style=\"display:inline-block;\" onclick=\"toggleCVeje(this)\">🌱 Vejetaryen Modu (et/tavuk/balık hariç tut)</div>\n    </div>\n\n    <div class=\"menu-select-row\">\n      <div class=\"field\">\n        <label for=\"cCondition\">Hastalık / Durum</label>\n        <select id=\"cCondition\" onchange=\"renderCocukMenu(); renderCocukWeek(); if(typeof dpRenderPlan === 'function') dpRenderPlan();\">\n          <option value=\"growth\">Büyüme Geriliği / Yetersiz Kilo Alımı</option>\n          <option value=\"obesity\">Çocukluk Çağı Obezitesi</option>\n          <option value=\"t1d\">Tip 1 Diyabet</option>\n          <option value=\"allergy\">Besin Alerjisi (yumurta, fıstık, gluten vb.)</option>\n          <option value=\"celiac\">Çölyak Hastalığı</option>\n          <option value=\"anemia\">Demir Eksikliği Anemisi</option>\n          <option value=\"constipation\">Kabızlık</option>\n          <option value=\"adhd\">DEHB - Destekleyici Beslenme</option>\n          <option value=\"pku\">Fenilketonüri (PKU)</option>\n        </select>\n      </div>\n    </div>\n    <p class=\"meal-target-note\" id=\"cTargetNote\"></p>\n\n    <div class=\"day-menu\" id=\"cDayMenu\"></div>\n    <div class=\"caution-box\" id=\"cCautionBox\"></div>\n    <button class=\"btn-primary\" style=\"margin-top:16px;\" onclick=\"generateCShoppingList()\">Bu Menüden Alışveriş Listesi Oluştur</button>\n    <div id=\"cShoppingListBox\" style=\"display:none; margin-top:16px; background:var(--paper-2); border:1px solid var(--line); border-radius:3px; padding:16px;\"></div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">4 · 1 Haftalık Menü Görünümü</p>\n    <p class=\"section-sub\">Seçili duruma göre Pazartesi-Pazar örnek menü; sevilmeyen besin içeren seçenekler otomatik atlanır.</p>\n    <button class=\"btn-primary no-print\" style=\"margin-bottom:14px;\" onclick=\"dpPrintStyledCocukWeek()\">🎨 Süslü Görünümde Yazdır</button>\n    <div style=\"overflow-x:auto;\">\n      <table class=\"exchange-table\" id=\"cWeekTable\" style=\"min-width:760px;\"></table>\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">5 · Değişim (Denklik) Listeleri — Çocuk Porsiyonları</p>\n    <p style=\"font-size:13.5px;color:#4A4638;margin-bottom:18px;\">Çocuk porsiyonları yetişkine göre küçüktür. \"Ekmek yerine ne geçer\", \"protein olarak neler geçer\" sorularının cevabı için kullanın.</p>\n    <div id=\"cExchangeLists\"></div>\n  </div>\n</div>\n\n  \n  <div class=\"card\">\n    <p class=\"section-title\">6 · Detaylı 7 Günlük Diyet Programı (Miktarlı) — Çocuk</p>\n    <p class=\"section-sub\">Seçili duruma ve hesaplanan hedef kaloriye göre gün gün ayrılmış, porsiyon miktarları, hazırlanış adımları ve her öğün için karbonhidrat / protein / yağ değerleri belirtilmiş ayrıntılı program. <b>Güvenlik notu:</b> Yaş 3 ve altı girildiğinde, boğulma riski taşıyan bütün kuruyemişler (ceviz, badem, fındık vb.) menüden otomatik olarak çıkarılır; 12 ay altı bebekler için bu kart yerine 16. karttaki Aylık Bebek Beslenme Rehberi kullanılmalıdır.</p>\n    <div class=\"no-print\" style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:200px;\" onclick=\"dpRenderPlan()\">Programı Yenile</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:200px;\" onclick=\"dpPrint('print')\">🖨️ 7 Günlük Programı Yazdır</button>\n      <button type=\"button\" class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:200px;background:#25D366;color:#fff;\" onclick=\"dpPrepWhatsApp()\">📱 WhatsApp Mesajı Hazırla</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:220px;\" onclick=\"dpWeeklyShoppingList()\">🛒 7 Günlük Alışveriş Listesi Oluştur</button>\n      <button class=\"btn-primary\" id=\"dpPdfBtn\" style=\"margin-top:0;flex:1;min-width:200px;\" onclick=\"dpPdf()\">📄 PDF olarak indir</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:200px;background:transparent;border:1px solid currentColor;\" onclick=\"dpPrint('download')\">⬇️ İndir (HTML)</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:200px;\" onclick=\"dpPrintStyledDetailPlan()\">🎨 Süslü Görünümde Yazdır</button>\n    </div>\n        <div id=\"waBox\" style=\"display:none;margin-top:16px;background:var(--dp-soft,#EFE8D8);border:1px solid var(--dp-line,#D8CFB6);border-radius:4px;padding:16px;\">\n      <label style=\"display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--dp-head,#1E3F3A);margin-bottom:8px;\">WhatsApp Mesajı — metni kopyalayıp WhatsApp'a yapıştırabilirsiniz</label>\n      <textarea id=\"waText\" readonly rows=\"6\" style=\"width:100%;padding:10px;border:1px solid var(--dp-line,#D8CFB6);border-radius:3px;font-family:inherit;font-size:13px;background:#fff;box-sizing:border-box;\"></textarea>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;\">\n        <button type=\"button\" class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;\" onclick=\"dpCopyWhatsAppText()\">📋 Metni Kopyala</button>\n        <a id=\"waDirectLink\" href=\"https://wa.me/\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:#25D366;color:#fff;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box;\">WhatsApp'ta Doğrudan Aç (varsa)</a>\n      </div>\n      <p id=\"waCopyMsg\" style=\"font-size:12px;color:var(--dp-head,#1E3F3A);margin-top:8px;display:none;\"></p>\n    </div>\n        <div id=\"weeklyShopBox\" style=\"display:none;margin-top:16px;background:var(--dp-soft,#EFE8D8);border:1px solid var(--dp-line,#D8CFB6);border-radius:4px;padding:16px;\">\n      <b style=\"color:var(--dp-head,#1E3F3A);\">7 Günlük Alışveriş Listesi (toplam miktarlar)</b>\n      <div id=\"weeklyShopList\" style=\"margin-top:10px;\"></div>\n    </div>\n    <div id=\"detailPlan\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">7 · Tarifler / Yemek Tarifleri</p>\n    <p class=\"section-sub\">Programdaki menülerde kullanılan yemeklerin malzeme miktarları ve hazırlanış adımları. Aşağıdaki liste, bu modüldeki tüm durumlarda kullanılan tarifleri kapsar; filtreler yeni tarif üretmez, mevcutlar arasından seçer. Vejetaryen/glutensiz etiketleri tarifin gerçek malzemelerinden otomatik hesaplanır.</p>\n    <div class=\"no-print\">\n    <input type=\"text\" id=\"recipeSearch\" placeholder=\"Tarif ara…\" oninput=\"dpFilterRecipes()\" style=\"width:100%;padding:11px 12px;border:1px solid var(--dp-line,#D8CFB6);border-radius:3px;margin-bottom:12px;font-size:15px;box-sizing:border-box;\">\n    <div class=\"grid\" style=\"margin-bottom:10px;\">\n      <div><label for=\"recipeMaxKcal\">Maks. Kalori (kcal)</label><input type=\"number\" id=\"recipeMaxKcal\" placeholder=\"örn. 400\" oninput=\"dpFilterRecipes()\"></div>\n      <div><label for=\"recipeMinProtein\">Min. Protein (g)</label><input type=\"number\" id=\"recipeMinProtein\" placeholder=\"örn. 20\" oninput=\"dpFilterRecipes()\"></div>\n    </div>\n    <div style=\"margin-bottom:12px;\">\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"recipeVegOnly\" onchange=\"dpFilterRecipes()\"> Sadece Vejetaryen</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"recipeGfOnly\" onchange=\"dpFilterRecipes()\"> Sadece Glutensiz</label>\n    </div>\n    <button class=\"btn-primary\" style=\"margin-top:0;margin-bottom:18px;\" onclick=\"dpPrintRecipes()\">🖨️ Görünen Tarifleri Yazdır</button>\n    </div>\n    <div id=\"recipeList\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">8 · Danışan Listesi (Oturum İçi)</p>\n    <p class=\"section-sub\">Bu liste yalnızca bu tarayıcı sekmesi açıkken tutulur, sayfa kapatılınca silinir — kalıcı bir hasta kayıt sistemi değildir. Kaydederken o an seçili olan program ve hedef kalori de bir \"arşiv\" notu olarak saklanır. Süreklilik için \"Dışa Aktar\" ile JSON dosyası indirip bir sonraki seansta \"İçe Aktar\" ile geri yükleyebilirsiniz. Bir danışana \"Yükle\" demek, yukarıdaki tüm alanları o danışanın bilgileriyle doldurur.</p>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:220px;\" onclick=\"dpSaveClient()\">+ Şu Anki Bilgileri Danışan Olarak Kaydet</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\" onclick=\"dpExportClients()\">⬇️ Dışa Aktar (JSON)</button>\n      <label class=\"btn-primary file-btn\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\">\n        ⬆️ İçe Aktar (JSON)\n        <input type=\"file\" accept=\"application/json\" onchange=\"dpImportClients(this.files[0])\">\n      </label>\n    </div>\n    <div id=\"clientList\"></div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">9 · Takip Grafikleri (Kilo Takibi)</p>\n    <p class=\"section-sub\">Danışanın kilo değişimini zaman içinde izleyin. Veriler yalnızca bu oturumda tutulur; süreklilik için dışa/içe aktarma seçeneklerini kullanın.</p>\n    <div class=\"grid\" style=\"margin-bottom:16px;\">\n      <div><label for=\"trackDate\">Tarih</label><input type=\"text\" id=\"trackDate\" placeholder=\"gg.aa.yyyy\"></div>\n      <div><label for=\"trackWeight\">Kilo (kg)</label><input type=\"number\" id=\"trackWeight\" step=\"0.1\"></div>\n      <div><label for=\"trackHeightCm\">Boy (cm) — BKİ için, opsiyonel</label><input type=\"number\" id=\"trackHeightCm\" step=\"0.1\"></div>\n    </div>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;\" onclick=\"dpAddTrackPoint()\">Kayıt Ekle</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\" onclick=\"dpExportTrack()\">⬇️ Dışa Aktar (JSON)</button>\n      <label class=\"btn-primary file-btn\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\">\n        ⬆️ İçe Aktar (JSON)\n        <input type=\"file\" accept=\"application/json\" onchange=\"dpImportTrack(this.files[0])\">\n      </label>\n    </div>\n    <canvas id=\"trackCanvas\"></canvas>\n    <div id=\"trackTable\" style=\"margin-top:16px;\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">10 · Barkod ile Besin Değeri Sorgulama</p>\n    <p class=\"section-sub\">Ürün barkodunu kameradan taratın veya elle girin; Open Food Facts açık veritabanından besin değerlerini getirir. Bu veritabanı kullanıcı katkılıdır — özellikle Türkiye'deki ürünlerde kapsam sınırlı olabilir; sonuçları her zaman ürün etiketiyle karşılaştırın. Kamera ve sorgulama internet bağlantısı gerektirir. <b>Not:</b> Bu dosyayı doğrudan (çift tıklayarak) açtıysanız, tarayıcı güvenlik kuralları gereği kamera ve dış sunucu sorgusu çalışmayabilir — bu bir hata değildir; dosyayı bir web sunucusu üzerinden açtığınızda genellikle sorunsuz çalışır.</p>\n    <div class=\"grid\" style=\"margin-bottom:16px;\">\n      <div><label for=\"barcodeInput\">Barkod Numarası</label><input type=\"text\" id=\"barcodeInput\" inputmode=\"numeric\" placeholder=\"örn. 8690637000000\"></div>\n    </div>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;\" onclick=\"dpLookupBarcode()\">Sorgula</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\" onclick=\"dpToggleScanner()\">📷 Kamera ile Tara</button>\n    </div>\n    <div id=\"scannerBox\" style=\"display:none;margin-bottom:16px;\">\n      <div id=\"scannerReader\" style=\"width:100%;max-width:380px;margin:0 auto;\"></div>\n      <button class=\"btn-primary\" style=\"margin-top:12px;max-width:380px;display:block;margin-left:auto;margin-right:auto;background:transparent;border:1px solid currentColor;\" onclick=\"dpStopScanner()\">İptal</button>\n    </div>\n    <div id=\"barcodeResult\"></div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">11 · Su / Öğün Hatırlatıcı</p>\n    <p class=\"section-sub\">Bu hatırlatıcılar yalnızca bu tarayıcı sekmesi açık kaldığı sürece çalışır — sekme kapatılınca veya telefon uzun süre kilitlenince durur; gerçek bir sistem düzeyinde bildirim değildir. Tarayıcı bildirim izni verirseniz gerçek bildirim, vermezseniz sayfa içi uyarı olarak gösterilir.</p>\n\n    <p style=\"font-weight:700;color:var(--dp-head,#1E3F3A);margin-bottom:10px;\">💧 Su İçme Hatırlatıcısı</p>\n    <div class=\"menu-select-row\">\n      <div class=\"field\"><label for=\"waterIntervalSelect\">Aralık</label>\n        <select id=\"waterIntervalSelect\">\n          <option value=\"30\">30 dakikada bir</option>\n          <option value=\"60\" selected>60 dakikada bir</option>\n          <option value=\"90\">90 dakikada bir</option>\n          <option value=\"120\">120 dakikada bir</option>\n        </select>\n      </div>\n    </div>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;margin-bottom:8px;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;\" onclick=\"dpStartWaterReminder()\">Başlat</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\" onclick=\"dpStopWaterReminder()\">Durdur</button>\n    </div>\n    <p id=\"waterReminderStatus\" style=\"font-size:12.5px;color:#6B6455;margin-bottom:24px;\">Kapalı.</p>\n\n    <p style=\"font-weight:700;color:var(--dp-head,#1E3F3A);margin-bottom:10px;\">🍽️ Öğün Hatırlatıcısı</p>\n    <div class=\"grid\" style=\"margin-bottom:14px;\">\n      <div><label for=\"mealTimeInput\">Saat</label><input type=\"time\" id=\"mealTimeInput\"></div>\n      <div><label for=\"mealLabelInput\">Etiket</label><input type=\"text\" id=\"mealLabelInput\" placeholder=\"örn. Kahvaltı\"></div>\n    </div>\n    <button class=\"btn-primary\" style=\"margin-bottom:16px;\" onclick=\"dpAddMealReminder()\">+ Hatırlatıcı Ekle</button>\n    <div id=\"mealReminderList\" style=\"margin-bottom:16px;\"></div>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;\" onclick=\"dpStartMealReminders()\">Hatırlatıcıları Etkinleştir</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\" onclick=\"dpStopMealReminders()\">Durdur</button>\n    </div>\n    <p id=\"mealReminderStatus\" style=\"font-size:12.5px;color:#6B6455;margin-top:10px;\">Kapalı.</p>\n\n    <div id=\"reminderBanner\" style=\"display:none;margin-top:18px;background:var(--dp-soft,#EFE8D8);border-left:3px solid var(--dp-acc,#C08A2E);padding:12px 14px;border-radius:0 3px 3px 0;font-size:13.5px;color:var(--dp-head,#1E3F3A);\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">12 · Günlük Hedef ve Motivasyon Takibi</p>\n    <p class=\"section-sub\">Basit bir günlük hedef kontrol listesi — ilerlemeyi görmek motivasyonu destekleyebilir.</p>\n    <div style=\"margin-bottom:18px;\">\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"goal_water\"> Bugün su hedefime ulaştım</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"goal_menu\"> Bugün önerilen menüyü takip ettim</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"goal_move\"> Bugün hareket/egzersiz yaptım</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"goal_sleep\"> Bugün yeterli uyudum</label>\n    </div>\n    <button class=\"btn-primary\" onclick=\"dpSaveDailyGoal()\">Bugünü Kaydet</button>\n    <div id=\"goalHistory\" style=\"margin-top:18px;\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">13 · Su Alım Günlüğü</p>\n    <p class=\"section-sub\">Bugün içtiğin suyu hızlıca ekle, hedefe göre ilerlemeni gör. Yalnızca bu oturumda tutulur.</p>\n    <div class=\"grid\" style=\"margin-bottom:14px;\">\n      <div><label for=\"waterLogGoal\">Günlük Hedef (ml)</label><input type=\"number\" id=\"waterLogGoal\" value=\"2000\" onchange=\"dpRenderWaterLog()\"></div>\n    </div>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:90px;\" onclick=\"dpAddWater(200)\">+200 ml</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:90px;\" onclick=\"dpAddWater(250)\">+250 ml</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:90px;\" onclick=\"dpAddWater(500)\">+500 ml</button>\n    </div>\n    <div style=\"display:flex;gap:10px;align-items:flex-end;margin-bottom:8px;\">\n      <div style=\"flex:1;\"><label for=\"waterLogCustom\">Özel miktar (ml)</label><input type=\"number\" id=\"waterLogCustom\"></div>\n      <button class=\"btn-primary\" style=\"margin-top:0;\" onclick=\"dpAddWaterCustom()\">Ekle</button>\n    </div>\n    <div style=\"background:var(--dp-soft,#EFE8D8);border-radius:6px;height:22px;overflow:hidden;margin:18px 0 8px;\">\n      <div id=\"waterLogBar\" style=\"background:var(--dp-acc,#C08A2E);height:100%;width:0%;transition:width .3s;\"></div>\n    </div>\n    <p id=\"waterLogText\" style=\"font-size:13.5px;margin-bottom:14px;\">0 ml / 2000 ml</p>\n    <button class=\"btn-primary\" style=\"background:transparent;border:1px solid currentColor;\" onclick=\"dpResetWaterLog()\">Günü Sıfırla</button>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">14 · Fiziksel Aktivite Günlüğü</p>\n    <p class=\"section-sub\">Bugünkü hareketlerini kaydet. Kalori tahminleri standart MET formülüyle yapılan yaklaşık hesaplardır (gerçek harcama kişiye göre değişir).</p>\n    <div class=\"grid\" style=\"margin-bottom:14px;\">\n      <div><label for=\"actLogType\">Aktivite</label>\n        <select id=\"actLogType\">\n          <option value=\"3.0\">Yavaş Yürüyüş</option>\n          <option value=\"3.5\" selected>Orta Tempo Yürüyüş</option>\n          <option value=\"5.0\">Tempolu Yürüyüş</option>\n          <option value=\"7.0\">Bisiklet</option>\n          <option value=\"8.0\">Hafif Koşu</option>\n          <option value=\"10.0\">Koşu</option>\n          <option value=\"4.0\">Yüzme (hafif)</option>\n          <option value=\"6.0\">Direnç Antrenmanı</option>\n        </select>\n      </div>\n      <div><label for=\"actLogMin\">Süre (dakika)</label><input type=\"number\" id=\"actLogMin\" value=\"30\"></div>\n      <div><label for=\"actLogWeight\">Kilo (kg)</label><input type=\"number\" id=\"actLogWeight\" value=\"70\"></div>\n    </div>\n    <button class=\"btn-primary\" onclick=\"dpAddActivity()\">+ Ekle</button>\n    <div id=\"actLogList\" style=\"margin:16px 0;\"></div>\n    <p id=\"actLogTotal\" style=\"font-size:13.5px;font-weight:700;margin-bottom:14px;\"></p>\n    <button class=\"btn-primary\" style=\"background:transparent;border:1px solid currentColor;\" onclick=\"dpResetActivityLog()\">Günü Sıfırla</button>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">15 · Mutfak Ölçü Birimi Çevirici</p>\n    <p class=\"section-sub\">Su bardağı, yemek kaşığı gibi ölçüleri grama/mililitreye çevirir. Değerler malzemeye göre değişir; yaygın kullanılan pratik Türk mutfağı ölçü tablosu esas alınmıştır, marka/neme göre küçük farklar olabilir.</p>\n    <div class=\"grid\" style=\"margin-bottom:16px;\">\n      <div><label for=\"kitchenIngredient\">Malzeme</label>\n        <select id=\"kitchenIngredient\">\n          <option value=\"un\">Un</option>\n          <option value=\"seker\">Toz Şeker</option>\n          <option value=\"pirinc\">Pirinç</option>\n          <option value=\"sivi_yag\">Sıvı Yağ</option>\n          <option value=\"sut_su_yogurt\">Süt / Su / Yoğurt</option>\n          <option value=\"bulgur\">Bulgur</option>\n        </select>\n      </div>\n      <div><label for=\"kitchenAmount\">Miktar</label><input type=\"number\" id=\"kitchenAmount\" value=\"1\" step=\"0.1\"></div>\n      <div><label for=\"kitchenFromUnit\">Kaynak Birim</label>\n        <select id=\"kitchenFromUnit\">\n          <option value=\"su_bardagi\">Su Bardağı</option>\n          <option value=\"cay_bardagi\">Çay Bardağı</option>\n          <option value=\"yemek_kasigi\">Yemek Kaşığı</option>\n          <option value=\"tatli_kasigi\">Tatlı Kaşığı</option>\n          <option value=\"cay_kasigi\">Çay Kaşığı</option>\n          <option value=\"gram\">Gram</option>\n          <option value=\"ml\">Mililitre</option>\n        </select>\n      </div>\n      <div><label for=\"kitchenToUnit\">Hedef Birim</label>\n        <select id=\"kitchenToUnit\">\n          <option value=\"gram\" selected>Gram</option>\n          <option value=\"su_bardagi\">Su Bardağı</option>\n          <option value=\"cay_bardagi\">Çay Bardağı</option>\n          <option value=\"yemek_kasigi\">Yemek Kaşığı</option>\n          <option value=\"tatli_kasigi\">Tatlı Kaşığı</option>\n          <option value=\"cay_kasigi\">Çay Kaşığı</option>\n          <option value=\"ml\">Mililitre</option>\n        </select>\n      </div>\n    </div>\n    <button class=\"btn-primary\" onclick=\"dpConvertKitchen()\">Çevir</button>\n    <div id=\"kitchenResult\" class=\"screen-result\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">16 · Aylık Bebek Beslenme Rehberi (1-12 Ay)</p>\n    <p class=\"section-sub\"><b>Önemli:</b> Bu genel bir rehberdir, bireysel tıbbi tavsiye değildir. Her bebeğin hazır olma belirtileri, alerji öyküsü, prematürelik durumu farklıdır — ek gıdaya başlama zamanı ve içeriği mutlaka çocuk hekimiyle birlikte belirlenmelidir. Ailede alerji öyküsü varsa yeni gıdalar hekim yönlendirmesiyle tanıtılmalıdır.</p>\n    <div class=\"menu-select-row\">\n      <div class=\"field\"><label for=\"infantMonthSelect\">Ay</label>\n        <select id=\"infantMonthSelect\" onchange=\"dpRenderInfantMonth()\">\n          <option value=\"1\">1. Ay</option><option value=\"2\">2. Ay</option><option value=\"3\">3. Ay</option>\n          <option value=\"4\">4. Ay</option><option value=\"5\">5. Ay</option><option value=\"6\">6. Ay</option>\n          <option value=\"7\">7. Ay</option><option value=\"8\">8. Ay</option><option value=\"9\">9. Ay</option>\n          <option value=\"10\">10. Ay</option><option value=\"11\">11. Ay</option><option value=\"12\">12. Ay</option>\n        </select>\n      </div>\n    </div>\n    <button class=\"btn-primary no-print\" style=\"margin:4px 0 14px;\" onclick=\"dpPrintInfantMonthRecipes()\">🖨️ Bu Ayın Tariflerini Yazdır</button>\n    <div id=\"infantMonthBox\"></div>\n    <p style=\"font-weight:600;color:var(--dp-head,#1E3F3A);margin:20px 0 8px;\">1 Haftalık Menü Görünümü (Seçili Aya Göre)</p>\n    <button class=\"btn-primary no-print\" style=\"margin-bottom:14px;\" onclick=\"dpPrintStyledInfantWeek()\">🎨 Süslü Görünümde Yazdır</button>\n    <div style=\"overflow-x:auto;\"><div id=\"infantWeekBox\"></div></div>\n  </div>\n\n  <p class=\"disclaimer\">\n    Bu araç genel beslenme ilkelerine dayalı bir referans hesaplama, örnek menü ve değişim listesi sunar; tıbbi tanı veya tedavi yerine geçmez.\n    Bebeklerde ek gıdaya 6. aydan önce başlanmaz; bal, tuz ve şeker 1 yaş altı bebeklere verilmez. Çocuklarda büyüme ve gelişme, boy/kilo persentil\n    eğrileriyle birlikte hekim/diyetisyen tarafından izlenmelidir. Klinik tablosu karmaşık olgularda (örn. tip 1 diyabet, çölyak, böbrek hastalığı)\n    plan mutlaka ilgili hekimle iş birliği içinde bireyselleştirilir.\n  </p>\n</div>\n\n<script>\n// ---------------- MODE SWITCH ----------------\ndocument.getElementById('modeToggle').addEventListener('click',(e)=>{\n  const b = e.target.closest('.mode-btn'); if(!b) return;\n  document.querySelectorAll('#modeToggle .mode-btn').forEach(x=>x.classList.remove('active'));\n  b.classList.add('active');\n  const mode = b.dataset.mode;\n  document.getElementById('bebekSection').classList.toggle('hidden', mode!=='bebek');\n  document.getElementById('cocukSection').classList.toggle('hidden', mode!=='cocuk');\n});\n\n// ================= BEBEK LOGIC =================\nlet bGender='female';\ndocument.getElementById('bGenderToggle').addEventListener('click',(e)=>{\n  const t=e.target.closest('.toggle'); if(!t) return;\n  document.querySelectorAll('#bGenderToggle .toggle').forEach(x=>x.classList.remove('active'));\n  t.classList.add('active'); bGender=t.dataset.val;\n});\n\nfunction calcBebek(){\n  const age=parseFloat(document.getElementById('bAge').value);\n  const weight=parseFloat(document.getElementById('bWeight').value);\n  if(age===''||weight===''||isNaN(age)||isNaN(weight)){alert('Lütfen ay ve kilo bilgisini giriniz.');return;}\n\n  // kcal/kg guideline: 0-6 ay ~108, 6-12 ay ~98\n  const kcalPerKg = age<6 ? 108 : 98;\n  const kcal = Math.round(weight*kcalPerKg);\n  document.getElementById('bKcal').textContent = kcal.toLocaleString('tr-TR');\n\n  // ml/gün guideline: 0-6 ay ~150-160 ml/kg anne sütü/mama; 6-12 ay azalan, ek gıdayla birlikte ~90-120 ml/kg\n  const mlPerKg = age<6 ? 155 : 105;\n  const ml = Math.round(weight*mlPerKg);\n  document.getElementById('bMl').textContent = ml.toLocaleString('tr-TR');\n\n  document.getElementById('bNote').textContent = age<6\n    ? \"0-6 ay bebeklerde beslenme yalnızca anne sütü veya formül mama ile sağlanır; ek gıdaya başlanmaz.\"\n    : \"6-12 ay bebeklerde bu miktarın bir kısmı ek gıdalarla, kalanı anne sütü/mama ile karşılanır.\";\n\n  document.getElementById('bebekResults').classList.add('show');\n}\n\n// bebek dislike chips (6-12 ay ilk gıdalar)\nconst bDislikeOptions=[\n  {tag:'yumurta',label:'Yumurta (sarısı)'},\n  {tag:'inek_sutu',label:'İnek Sütü Ürünü'},\n  {tag:'muz',label:'Muz'},\n  {tag:'elma',label:'Elma'},\n  {tag:'havuc',label:'Havuç'},\n  {tag:'tavuk',label:'Tavuk'},\n  {tag:'kirmizi_et',label:'Kırmızı Et'},\n  {tag:'yogurt',label:'Yoğurt'},\n  {tag:'bakliyat',label:'Bakliyat (mercimek vb.)'},\n];\nlet bDisliked = new Set();\ndocument.getElementById('bDislikeGrid').innerHTML = bDislikeOptions.map(o=>\n  `<div class=\"dislike-chip\" data-tag=\"${o.tag}\" onclick=\"toggleBDislike(this,'${o.tag}')\">${o.label}</div>`\n).join('');\nfunction toggleBDislike(el,tag){\n  el.classList.toggle('active');\n  if(bDisliked.has(tag)) bDisliked.delete(tag); else bDisliked.add(tag);\n  renderBebek();\n  if(typeof dpRenderPlan === 'function') dpRenderPlan();\n}\n\nconst bebekGuides = {\n  healthy0_6:{title:\"Sağlıklı Bebek (0-6 Ay)\",\n    points:[\"Yalnızca anne sütü veya formül mama önerilir; ek gıdaya başlanmaz.\",\"D vitamini desteği rutin olarak değerlendirilir.\",\"Talebe dayalı (on-demand) besleme önerilir.\"],\n    caution:\"Bal, inek sütü, tuz ve şeker bu dönemde verilmez; su desteği genellikle gerekmez.\"},\n  transition6_12:{title:\"Ek Gıdaya Geçiş (6-12 Ay)\",\n    points:[\"Demirden zengin püre kıvamında gıdalarla başlanır: {p1}, {p2}, {p3}.\",\"Tek gıda ile başlanıp 3-5 gün beklenir, tepki izlenir.\",\"Kıvam kademeli olarak katılaştırılır; 9. aydan sonra parmak gıdalara geçilebilir.\"],\n    caution:\"Bal, tuz, şeker ve işlenmiş gıda verilmez; yeni gıdalar tek tek, alerjik reaksiyon açısından izlenerek eklenir.\"},\n  cmpa:{title:\"İnek Sütü Protein Alerjisi\",\n    points:[\"Anne sütü devam ederse annede süt/süt ürünü kısıtlaması önerilir.\",\"Formülle beslenen bebekte hidrolize veya amino asit bazlı formül kullanılır.\",\"Ek gıda döneminde de süt/süt ürünü içeren gıdalardan kaçınılır.\"],\n    caution:\"Gizli süt içeriği olan işlenmiş gıdalar (etiket kontrolü) atlanmamalı; kalsiyum ve D vitamini alımı izlenir.\"},\n  reflux:{title:\"Reflü / Kusma Eğilimi\",\n    points:[\"Sık aralıklarla az miktarda besleme önerilir.\",\"Besleme sonrası bebek dik pozisyonda tutulur.\",\"Ek gıda döneminde koyu kıvamlı gıdalar reflüyü azaltabilir (hekim önerisiyle).\"],\n    caution:\"Aşırı doyurma ve hızlı besleme reflüyü artırabilir.\"},\n  preterm:{title:\"Prematüre Bebek\",\n    points:[\"Enerji ve protein yoğunluğu artırılmış beslenme planı hekim/diyetisyen tarafından belirlenir.\",\"Demir, kalsiyum ve fosfor desteği hekim takibiyle sağlanır.\"],\n    caution:\"Büyüme eğrileri düzeltilmiş (correceted) yaşa göre değerlendirilir; tüm beslenme planı hekimle birlikte yürütülür.\"},\n  constipation:{title:\"Kabızlık\",\n    points:[\"Ek gıdaya geçilmişse posa içeren meyve/sebze püreleri önerilir: {p1}, {p2}.\",\"Yeterli sıvı alımına dikkat edilir (ek gıda sonrası).\"],\n    caution:\"6 aydan küçük bebeklerde su/meyve suyu rutin olarak önerilmez.\"},\n  pku:{title:\"Fenilketonüri (PKU)\",\n    points:[\"Yenidoğan tarama testinde tanı konduktan sonra beslenme, metabolizma uzmanı/diyetisyeni tarafından planlanan özel fenilalaninsiz/düşük metabolik formül ile yürütülür.\",\"Anne sütü, hekim/diyetisyen kontrolünde ve metabolik formülle birlikte ölçülü miktarlarda sürdürülebilir; tamamen kesilmesi gerekmez.\",\"Ek gıda döneminde, doğal protein (fenilalanin) içeriği düşük besinler (çoğu meyve ve sebze) tercih edilir; et, yumurta, süt ürünleri ve standart un ürünleri hekim/diyetisyen tarafından belirlenen sıkı sınırlar dahilinde verilir.\"],\n    caution:\"PKU yönetimi tamamen bireyselleştirilmiş, ömür boyu sürecek bir tedavidir; fenilalanin alımı mutlaka metabolizma uzmanı ve diyetisyeni tarafından düzenli kan tetkikleriyle izlenerek belirlenir. Bu araç genel bilgi amaçlıdır, spesifik miktar/sınır önermez.\"},\n  galactosemia:{title:\"Galaktozemi\",\n    points:[\"Tanı konur konmaz anne sütü ve standart/inek sütü bazlı formüller tamamen kesilir; soya bazlı veya galaktozsuz özel formülle beslenme başlanır.\",\"Ek gıda döneminde süt ve süt ürünleri (peynir, yoğurt, tereyağı dahil) ömür boyu dışlanır; bazı meyve/sebzelerde de galaktoz/laktoz izleri hekim/diyetisyen tarafından değerlendirilir.\",\"Kalsiyum ve D vitamini alternatif kaynaklarla (galaktozsuz takviyeler) karşılanır.\"],\n    caution:\"Galaktozemi acil ve ömür boyu sıkı diyet gerektiren bir hastalıktır; tanı sonrası beslenme planı istisnasız metabolizma uzmanı ve diyetisyeni tarafından belirlenir ve düzenli izlenir. Bu araç yalnızca genel bilgi amaçlıdır.\"},\n  msud:{title:\"Akçaağaç Şurubu İdrar Hastalığı (MSUD)\",\n    points:[\"Dallı zincirli amino asitleri (lösin, izolösin, valin) kısıtlanmış özel metabolik formülle beslenme, tanı sonrası hemen başlanır.\",\"Anne sütü, hekim/diyetisyen kontrolünde ölçülü miktarlarda metabolik formülle birlikte sürdürülebilir.\",\"Ek gıda döneminde yüksek proteinli gıdalardan (et, yumurta, süt ürünleri, baklagil) sıkı sınırlarla ve yalnızca hekim/diyetisyen reçetesiyle söz edilir.\"],\n    caution:\"MSUD, akut metabolik krizlere yol açabilen ciddi bir hastalıktır; beslenme planı istisnasız metabolizma uzmanı ve diyetisyeni tarafından düzenli kan amino asit takibiyle belirlenir. Bu araç yalnızca genel bilgi amaçlıdır, spesifik miktar önermez.\"},\n};\n\n// pool of first-food alternatives for {p1}/{p2}/{p3} substitution based on dislikes\nconst firstFoodPool = [\n  {n:\"muz püresi\", tag:\"muz\"},\n  {n:\"elma püresi\", tag:\"elma\"},\n  {n:\"havuç püresi\", tag:\"havuc\"},\n  {n:\"tavuk püresi\", tag:\"tavuk\"},\n  {n:\"kırmızı et püresi\", tag:\"kirmizi_et\"},\n  {n:\"mercimek püresi\", tag:\"bakliyat\"},\n  {n:\"yulaf/tahıl püresi\", tag:null},\n  {n:\"armut püresi\", tag:null},\n  {n:\"kabak püresi\", tag:null},\n];\nfunction pickFirstFoods(n, startIdx){\n  const out=[];\n  let i=startIdx;\n  let guard=0;\n  while(out.length<n && guard<30){\n    const item = firstFoodPool[i%firstFoodPool.length];\n    if(!item.tag || !bDisliked.has(item.tag)) out.push(item.n);\n    i++; guard++;\n  }\n  while(out.length<n) out.push(\"mevsim sebze/meyve püresi\");\n  return out;\n}\n\nfunction renderBebek(){\n  const key = document.getElementById('bCondition').value;\n  const g = bebekGuides[key];\n  const foods = pickFirstFoods(3, 0);\n  const pointsHtml = g.points.map(p=>{\n    let text = p.replace(\"{p1}\",foods[0]).replace(\"{p2}\",foods[1]).replace(\"{p3}\",foods[2]);\n    return `<li>${text}</li>`;\n  }).join('');\n  document.getElementById('bebekGuide').innerHTML = `\n    <div class=\"infant-card\">\n      <h4>${g.title}</h4>\n      <ul>${pointsHtml}</ul>\n    </div>\n    <div class=\"caution-box\"><b>Dikkat Edilecekler:</b> ${g.caution}</div>\n  `;\n}\nrenderBebek();\n\n// ================= ÇOCUK LOGIC =================\nlet cGender='female';\nlet cTarget=1500;\nlet cDisliked = new Set();\n\ndocument.getElementById('cGenderToggle').addEventListener('click',(e)=>{\n  const t=e.target.closest('.toggle'); if(!t) return;\n  document.querySelectorAll('#cGenderToggle .toggle').forEach(x=>x.classList.remove('active'));\n  t.classList.add('active'); cGender=t.dataset.val;\n});\n\nfunction kcalPerKgForAge(age, gender){\n  if(age<=3) return 82;\n  if(age<=8) return gender==='male' ? 75 : 70;\n  if(age<=13) return gender==='male' ? 60 : 52;\n  return gender==='male' ? 45 : 38; // 14-18\n}\n\nfunction calcCocuk(){\n  const age=parseFloat(document.getElementById('cAge').value);\n  const height=parseFloat(document.getElementById('cHeight').value);\n  const weight=parseFloat(document.getElementById('cWeight').value);\n  const activity=parseFloat(document.getElementById('cActivity').value);\n  if(!age||!height||!weight){alert('Lütfen yaş, boy ve kilo bilgilerini giriniz.');return;}\n\n  const heightM=height/100;\n  const bmi=weight/(heightM*heightM);\n  const kcalKg = kcalPerKgForAge(age,cGender);\n  const target = Math.round(weight*kcalKg*(activity/1.4)); // mild activity normalization\n\n  document.getElementById('cBmi').textContent = bmi.toFixed(1);\n  document.getElementById('cKcalKg').textContent = kcalKg;\n  document.getElementById('cTarget').textContent = target.toLocaleString('tr-TR');\n  document.getElementById('cocukResults').classList.add('show');\n\n  cTarget = target;\n  renderCocukMenu();\n  renderCocukWeek();\n}\n\n// dislike chips (çocuk)\nconst cDislikeOptions=[\n  {tag:'yumurta',label:'Yumurta'},\n  {tag:'sut',label:'Süt / Yoğurt'},\n  {tag:'peynir',label:'Peynir'},\n  {tag:'tavuk',label:'Tavuk'},\n  {tag:'kirmizi_et',label:'Kırmızı Et'},\n  {tag:'balik',label:'Balık'},\n  {tag:'baklagil',label:'Baklagil (mercimek vb.)'},\n  {tag:'elma',label:'Elma'},\n  {tag:'muz',label:'Muz'},\n  {tag:'kuruyemis',label:'Kuruyemiş'},\n  {tag:'bulgur',label:'Bulgur'},\n  {tag:'pirinc',label:'Pirinç'},\n  {tag:'domates',label:'Domates'},\n  {tag:'ıspanak',label:'Ispanak / Yeşillik'},\n];\ndocument.getElementById('cDislikeGrid').innerHTML = cDislikeOptions.map(o=>\n  `<div class=\"dislike-chip\" data-tag=\"${o.tag}\" onclick=\"toggleCDislike(this,'${o.tag}')\">${o.label}</div>`\n).join('');\nfunction toggleCDislike(el,tag){\n  el.classList.toggle('active');\n  if(cDisliked.has(tag)) cDisliked.delete(tag); else cDisliked.add(tag);\n  renderCocukMenu(); renderCocukWeek();\n  if(typeof dpRenderPlan === 'function') dpRenderPlan();\n}\n\n// exchange lists (çocuk porsiyonları — biraz daha küçük)\nconst cExchangeLists = {\n  ekmek:{label:\"Ekmek / Nişasta Grubu (≈50-60 kcal / çocuk değişimi)\", items:[\n    {n:\"1 küçük dilim tam tahıllı ekmek\", a:\"20 g\", k:55},\n    {n:\"2 yemek kaşığı pirinç pilavı (pişmiş)\", a:\"35 g\", k:55},\n    {n:\"2 yemek kaşığı bulgur pilavı (pişmiş)\", a:\"35 g\", k:55},\n    {n:\"3 yemek kaşığı makarna (pişmiş)\", a:\"35 g\", k:55},\n    {n:\"Yarım küçük patates (haşlama)\", a:\"40 g\", k:55},\n  ]},\n  sut:{label:\"Süt / Yoğurt Grubu (≈90-100 kcal / çocuk değişimi)\", items:[\n    {n:\"1 su bardağı süt\", a:\"150-200 ml\", k:100},\n    {n:\"1 kase sade yoğurt\", a:\"150 g\", k:90},\n    {n:\"1 su bardağı laktozsuz süt\", a:\"150-200 ml\", k:100},\n    {n:\"1 dilim kaşar peyniri (ayrıca protein grubunda da sayılabilir)\", a:\"20 g\", k:60},\n  ]},\n  protein:{label:\"Et – Yumurta – Peynir Grubu (≈50-60 kcal / çocuk değişimi)\", items:[\n    {n:\"1 adet yumurta\", a:\"50 g\", k:70},\n    {n:\"Beyaz peynir\", a:\"20 g\", k:50},\n    {n:\"Izgara tavuk göğsü\", a:\"20 g\", k:35},\n    {n:\"Kırmızı et (az yağlı)\", a:\"20 g\", k:50},\n    {n:\"Balık (ızgara/fırın)\", a:\"20 g\", k:35},\n    {n:\"Haşlanmış mercimek/nohut\", a:\"2 yemek kaşığı (40 g)\", k:55},\n  ]},\n  meyve:{label:\"Meyve Grubu (≈40-50 kcal / çocuk değişimi)\", items:[\n    {n:\"Küçük boy elma\", a:\"100 g\", k:45},\n    {n:\"Küçük muz\", a:\"70 g\", k:45},\n    {n:\"Küçük mandalina/portakal\", a:\"100 g\", k:45},\n    {n:\"10-12 adet çilek\", a:\"120 g\", k:45},\n  ]},\n  yag:{label:\"Yağ Grubu (≈45 kcal / değişim — çocuklarda az miktarda)\", items:[\n    {n:\"1 tatlı kaşığı zeytinyağı\", a:\"5 g\", k:45},\n    {n:\"4-5 adet badem/ceviz içi\", a:\"—\", k:40},\n    {n:\"1 tatlı kaşığı tereyağı\", a:\"5 g\", k:45},\n  ]},\n  sebze:{label:\"Sebze Grubu (serbest — günde 2-3 porsiyon önerilir)\", items:[\n    {n:\"Domates, salatalık\", a:\"serbest\", k:0},\n    {n:\"Havuç (çubuk, haşlama)\", a:\"1 porsiyon\", k:25},\n    {n:\"Brokoli / kabak (haşlama)\", a:\"1 porsiyon\", k:30},\n    {n:\"Yeşillik / ıspanak\", a:\"serbest\", k:0},\n  ]},\n};\nfunction renderCExchange(){\n  const order=['ekmek','sut','protein','meyve','yag','sebze'];\n  let html='';\n  order.forEach(key=>{\n    const g=cExchangeLists[key];\n    html+=`<div class=\"exchange-group\"><h4>${g.label}</h4><table class=\"exchange-table\">\n      <tr><th>Besin</th><th>Miktar</th><th>Yaklaşık Kalori</th></tr>\n      ${g.items.map(i=>`<tr><td>${i.n}</td><td>${i.a}</td><td>${i.k>0?i.k+' kcal':'—'}</td></tr>`).join('')}\n      </table></div>`;\n  });\n  document.getElementById('cExchangeLists').innerHTML = html;\n}\nrenderCExchange();\n\n// çocuk daily menus (item-level, with group+tag for substitution)\nconst cocukMenus = {\ngrowth:{title:\"Büyüme Geriliği / Yetersiz Kilo Alımı\",\n  breakfast:[{n:\"1 yumurta (menemen)\",k:90,g:'protein',tag:'yumurta'},{n:\"Kaşar peyniri\",k:60,g:'sut',tag:'peynir'},{n:\"Tam tahıllı ekmek\",k:55,g:'ekmek',tag:null},{n:\"Süt\",k:100,g:'sut',tag:'sut'}],\n  lunch:[{n:\"Izgara tavuk (2 değişim)\",k:70,g:'protein',tag:'tavuk'},{n:\"Bulgur pilavı (1.5 değişim)\",k:85,g:'ekmek',tag:'bulgur'},{n:\"Sebze yemeği (yağlı)\",k:60,g:'sebze',tag:null}],\n  snack:[{n:\"Muzlu süt\",k:140,g:'sut',tag:'muz'},{n:\"Ceviz (küçük porsiyon)\",k:40,g:'yag',tag:'kuruyemis'}],\n  dinner:[{n:\"Mercimek yemeği (1.5 değişim)\",k:80,g:'protein',tag:'baklagil'},{n:\"Peynirli tam tahıllı ekmek\",k:55,g:'ekmek',tag:null},{n:\"Yoğurt (1 değişim)\",k:90,g:'sut',tag:'sut'}],\n  caution:\"Enerji ve protein yoğunluğu artırılmış öğün ve ara öğünler önerilir; zorla besleme yerine iştahı destekleyici yaklaşım tercih edilir.\"},\n\nobesity:{title:\"Çocukluk Çağı Obezitesi\",\n  breakfast:[{n:\"1 haşlanmış yumurta\",k:70,g:'protein',tag:'yumurta'},{n:\"Az yağlı peynir\",k:50,g:'protein',tag:'peynir'},{n:\"Domates-salatalık\",k:15,g:'sebze',tag:'domates'},{n:\"Tam tahıllı ekmek (1 değişim)\",k:55,g:'ekmek',tag:null}],\n  lunch:[{n:\"Izgara tavuk (2 deği "Düşük proteinli ekmek + bal (1 yaş üstü) + metabolik formül\",\"Meyve + düşük proteinli galeta + metabolik içecek\",\"Düşük proteinli ekmek + reçel + meyve\"],\n  lunch:[\"Düşük proteinli makarna + sebze sosu + salata\",\"Pişmiş sebze çeşitleri (patates, kabak, havuç) + düşük proteinli ekmek\",\"Düşük proteinli pirinç + sebze yemeği\",\"Sebzeli düşük proteinli makarna\",\"Patates püresi + haşlanmış sebze\"],\n  snack:[\"Mevsim meyvesi + metabolik atıştırmalık\",\"Meyve suyu (taze, ölçülü) + düşük proteinli kraker\",\"Meyve + metabolik içecek\",\"Kuru meyve (ölçülü) + su\"],\n  dinner:[\"Düşük proteinli ekmek + sebze yemeği + metabolik formül\",\"Pişmiş sebze + düşük proteinli pirinç\",\"Sebze çorbası (düşük proteinli) + ekmek\",\"Patates + haşlanmış sebze + metabolik formül\",\"Düşük proteinli makarna + sebze sosu\"]},\n};\n\n/* --- Haftalık menü çeşitlilik motoru (aynı ana besin haftaya yayılsın) --- */\nvar DP_SIG_MAP = [\n  ['uskumru','balık'],['sardalya','balık'],['levrek','balık'],['somon','balık'],['çipura','balık'],\n  ['ton balığı','balık'],['hamsi','balık'],['balık','balık'],['karides','deniz ürünü'],\n  ['hindi','hindi'],['tavuk','tavuk'],\n  ['köfte','kırmızı et'],['kıyma','kırmızı et'],['dana','kırmızı et'],['kuzu','kırmızı et'],\n  ['biftek','kırmızı et'],['etli','kırmızı et'],\n  ['mercimek','baklagil'],['nohut','baklagil'],['fasulye','baklagil'],['bezelye','baklagil'],['humus','baklagil'],\n  ['omlet','yumurta'],['menemen','yumurta'],['yumurta','yumurta'],\n  ['lor','süt ürünü'],['peynir','süt ürünü'],['yoğurt','süt ürünü'],['kefir','süt ürünü'],\n  ['ayran','süt ürünü'],['süt','süt ürünü'],\n  ['ceviz','kuruyemiş'],['badem','kuruyemiş'],['fındık','kuruyemiş'],['fıstık','kuruyemiş']\n];\nfunction dpMealSignature(t){\n  var low=(t||'').toLowerCase();\n  for(var i=0;i<DP_SIG_MAP.length;i++){ if(low.indexOf(DP_SIG_MAP[i][0])>-1) return DP_SIG_MAP[i][1]; }\n  return null;\n}\nfunction dpMealKey(t){\n  var s=(t||'').toLowerCase().replace(/[⏱🍲🔥]/g,'').replace(/\\([^)]*\\)/g,'').replace(/[^a-zçğıöşü ]/g,' ');\n  return s.split(/\\s+/).filter(function(w){ return w.length>2; }).sort();\n}\nfunction dpSimilar(a,b){\n  var A=dpMealKey(a), B=dpMealKey(b);\n  if(!A.length||!B.length) return 0;\n  var inter=A.filter(function(w){ return B.indexOf(w)>-1; }).length;\n  return inter/Math.max(A.length,B.length);\n}\nfunction dpNewWeekState(){ return {exact:{}, slot:{}, sig:{}}; }\nfunction dpPickVariedText(pool, startIdx, state, slotKey, conflictFn){\n  var usedSlot = state.slot[slotKey] || (state.slot[slotKey]=[]);\n  var sig = state.sig[slotKey] || (state.sig[slotKey]={});\n  var base = startIdx % pool.length;\n  var conflicts = conflictFn || function(){ return false; };\n  var naturalConflict = conflicts(pool[base]);\n  var best=null, bestIdx=base, bestScore=Infinity;\n  for(var i=0;i<pool.length;i++){\n    var idx=(startIdx+i)%pool.length, opt=pool[idx];\n    if(conflicts(opt)) continue;\n    if(state.exact[opt]) continue;\n    var near=0;\n    for(var j=0;j<usedSlot.length;j++){ if(dpSimilar(opt,usedSlot[j])>=0.6){ near=1; break; } }\n    var sg=dpMealSignature(opt), used=sg?(sig[sg]||0):0;\n    var score=near*100000 + used*1000 + i;\n    if(score<bestScore){ bestScore=score; best=opt; bestIdx=idx; }\n  }\n  if(best===null) return {text: pool[base], swapped:false};\n  state.exact[best]=1; usedSlot.push(best);\n  var bs=dpMealSignature(best); if(bs) sig[bs]=(sig[bs]||0)+1;\n  return {text:best, swapped:(best!==pool[base])&&naturalConflict};\n}\n\nfunction renderCocukWeek(){\n  const cond = document.getElementById('cCondition').value;\n  const pools = cWeekPools[cond];\n  if(!pools) return;\n  let html = `<tr><th>Gün</th><th>Kahvaltı</th><th>Öğle Yemeği</th><th>Ara Öğün</th><th>Akşam Yemeği</th></tr>`;\n  const st = dpNewWeekState();\n  days.forEach((day,d)=>{\n    const b = dpPickVariedText(pools.breakfast, d+0, st, 'breakfast', textConflicts);\n    const l = dpPickVariedText(pools.lunch, d+1, st, 'lunch', textConflicts);\n    const s = dpPickVariedText(pools.snack, d+2, st, 'snack', textConflicts);\n    const dn = dpPickVariedText(pools.dinner, d+3, st, 'dinner', textConflicts);\n    const cellHtml = (o)=> (typeof dpFoodEmoji==='function' ? dpFoodEmoji(o.text)+' ' : '') + o.text + (o.swapped ? ' <span class=\"swap-tag\">değişim</span>' : '');\n    html += `<tr><td><b>${day}</b></td><td>${cellHtml(b)}</td><td>${cellHtml(l)}</td><td>${cellHtml(s)}</td><td>${cellHtml(dn)}</td></tr>`;\n  });\n  document.getElementById('cWeekTable').innerHTML = html;\n}\nrenderCocukWeek();\nfunction dpPrintStyledCocukWeek(){\n  var cond = document.getElementById('cCondition').value;\n  var pools = cWeekPools[cond];\n  if(!pools) return;\n  var styledDays = days.map(function(day, d){\n    var b = pickOption(pools.breakfast, d+0);\n    var l = pickOption(pools.lunch, d+1);\n    var s = pickOption(pools.snack, d+2);\n    var dn = pickOption(pools.dinner, d+3);\n    return {name: day, slots: [\n      {label:'Kahvaltı', text: b.text},\n      {label:'Öğle Yemeği', text: l.text},\n      {label:'Ara Öğün', text: s.text},\n      {label:'Akşam Yemeği', text: dn.text}\n    ]};\n  });\n  var condSel = document.getElementById('cCondition');\n  var condTxt = (condSel && condSel.selectedIndex>=0 && condSel.options[condSel.selectedIndex]) ? condSel.options[condSel.selectedIndex].textContent : '';\n  var nameEl = document.getElementById('cPatientName') || document.getElementById('patientName');\n  dpOpenStyledPrint(styledDays, {\n    title: 'Haftalık Beslenme Programı',\n    patientLabel: 'Çocuk',\n    patientName: (nameEl && nameEl.value.trim()) || '—',\n    sub: condTxt\n  });\n}\n\n// ---------- ÇOCUK VEJETARYEN MODU ----------\nlet cVejeActive = false;\nfunction toggleCVeje(el){\n  cVejeActive = !cVejeActive;\n  el.classList.toggle('active');\n  ['tavuk','kirmizi_et','balik'].forEach(tag=>{\n    const chip = document.querySelector(`#cDislikeGrid .dislike-chip[data-tag=\"${tag}\"]`);\n    if(cVejeActive){ cDisliked.add(tag); if(chip) chip.classList.add('active'); }\n    else { cDisliked.delete(tag); if(chip) chip.classList.remove('active'); }\n  });\n  renderCocukMenu(); renderCocukWeek();\n}\n\n// ---------- ÇOCUK ALIŞVERİŞ LİSTESİ ----------\nfunction generateCShoppingList(){\n  const box = document.getElementById('cShoppingListBox');\n  const items = Array.from(document.querySelectorAll('#cDayMenu .meal li')).map(li=>{\n    return li.textContent.replace(/değişim/gi,'').replace(/~?\\d+\\s*kcal/gi,'').replace(/serbest/gi,'').trim();\n  }).filter(Boolean);\n  const unique = [...new Set(items)];\n  box.style.display='block';\n  box.innerHTML = `<b style=\"color:var(--teal-deep);\">Alışveriş Listesi (bugünkü menüye göre):</b><ul style=\"margin:10px 0 0;padding-left:18px;\">${unique.map(i=>`<li>${i}</li>`).join('')}</ul>`;\n}\n\n// ---------- EMZİRME / BEZ TAKİP SAYACI ----------\nconst trackers = [\n  {id:'feedCount', label:'Emzirme / Biberon Sayısı'},\n  {id:'wetCount', label:'Islak Bez Sayısı'},\n  {id:'dirtyCount', label:'Kirli Bez Sayısı'},\n];\nconst trackerValues = {feedCount:0, wetCount:0, dirtyCount:0};\nfunction renderTrackers(){\n  document.getElementById('trackerGrid').innerHTML = trackers.map(t=>`\n    <div class=\"counter-box\">\n      <div class=\"clabel\">${t.label}</div>\n      <div class=\"counter-controls\">\n        <button class=\"counter-btn\" onclick=\"changeTracker('${t.id}',-1)\">−</button>\n        <span class=\"counter-num\" id=\"${t.id}\">${trackerValues[t.id]}</span>\n        <button class=\"counter-btn\" onclick=\"changeTracker('${t.id}',1)\">+</button>\n      </div>\n    </div>\n  `).join('') + `<div class=\"counter-box\"><div class=\"clabel\">Sıfırla</div><div class=\"counter-controls\"><button class=\"counter-btn\" style=\"width:auto;border-radius:20px;padding:6px 16px;\" onclick=\"resetTrackers()\">Günü Sıfırla</button></div></div>`;\n}\nfunction changeTracker(id, delta){\n  trackerValues[id] = Math.max(0, trackerValues[id]+delta);\n  document.getElementById(id).textContent = trackerValues[id];\n}\nfunction resetTrackers(){\n  Object.keys(trackerValues).forEach(k=>trackerValues[k]=0);\n  renderTrackers();\n}\nrenderTrackers();\n\n// ---------- PKU TAKİP FORMU (yalnızca kayıt tutma, miktar önerisi yok) ----------\nlet pkuLogs = [];\nfunction addPkuLog(){\n  const date = document.getElementById('pkuDate').value.trim();\n  const level = document.getElementById('pkuLevel').value.trim();\n  const limit = document.getElementById('pkuLimit').value.trim();\n  const notes = document.getElementById('pkuNotes').value.trim();\n  if(!date && !level && !limit && !notes){ alert('Lütfen en az bir alan doldurunuz.'); return; }\n  pkuLogs.push({date, level, limit, notes});\n  ['pkuDate','pkuLevel','pkuLimit','pkuNotes'].forEach(id=>document.getElementById(id).value='');\n  renderPkuLog();\n}\nfunction removePkuLog(idx){\n  pkuLogs.splice(idx,1);\n  renderPkuLog();\n}\nfunction renderPkuLog(){\n  const table = document.getElementById('pkuLogTable');\n  const header = `<tr><th>Tarih</th><th>Kan Fenilalanin Düzeyi</th><th>Hekim/Diyetisyenin Belirlediği Günlük Fe/Protein Sınırı</th><th>Tüketilen Gıdalar / Notlar</th><th></th></tr>`;\n  const rows = pkuLogs.map((r,i)=>`<tr><td>${r.date||'—'}</td><td>${r.level||'—'}</td><td>${r.limit||'—'}</td><td>${r.notes||'—'}</td><td><span style=\"cursor:pointer;color:var(--red);\" onclick=\"removePkuLog(${i})\">Sil</span></td></tr>`).join('');\n  table.innerHTML = header + rows;\n}\nrenderPkuLog();\n\n// ---------- YAZDIRILABİLİR RAPOR ----------\n(function(){\n  const today = new Date();\n  const dd=String(today.getDate()).padStart(2,'0');\n  const mm=String(today.getMonth()+1).padStart(2,'0');\n  const yyyy=today.getFullYear();\n  const el=document.getElementById('patientDate');\n  if(el) el.value = dd+'.'+mm+'.'+yyyy;\n})();\n\nconst REPORT_TITLE = \"Diyetisyen İlker — Bebek ve Çocuk Beslenme Programı\";\nconst REPORT_FILE  = \"beslenme-raporu-bebek-cocuk.html\";\nconst REPORT_WHO   = \"Danışan\";\n\nfunction buildReportPayload(){\n  const nameEl=document.getElementById('patientName');\n  const dateEl=document.getElementById('patientDate');\n  const name=(nameEl&&nameEl.value.trim())||'—';\n  const date=(dateEl&&dateEl.value.trim())||'—';\n  const modeEl=document.querySelector('#modeToggle .mode-btn.active');\n  const modeTxt=modeEl?(' — '+modeEl.textContent.trim()):'';\n  const ph=document.getElementById('printHeader');\n  if(ph) ph.innerHTML='<b>'+REPORT_WHO+':</b> '+name+' &nbsp;&nbsp; <b>Tarih:</b> '+date+' &nbsp;&nbsp; <b>Rapor:</b> '+REPORT_TITLE+modeTxt;\n\n  // Girilen değerleri klonlamadan önce özniteliklere yaz (aksi halde klonda görünmez)\n  document.querySelectorAll('input').forEach(i=>i.setAttribute('value', i.value));\n  document.querySelectorAll('select').forEach(s=>{\n    Array.from(s.options).forEach(o=>o.removeAttribute('selected'));\n    if(s.selectedIndex>=0) s.options[s.selectedIndex].setAttribute('selected','selected');\n  });\n\n  const clone=document.body.cloneNode(true);\n  clone.querySelectorAll('script, button, .no-print').forEach(n=>n.remove());\n  clone.querySelectorAll('.toggle:not(.active), .mode-btn:not(.active), .dislike-chip:not(.active), .tag-btn:not(.active)').forEach(n=>n.remove());\n  clone.querySelectorAll('input').forEach(i=>{\n    const s=document.createElement('span'); s.className='pv';\n    s.textContent=i.getAttribute('value')||'—'; i.replaceWith(s);\n  });\n  clone.querySelectorAll('select').forEach(sel=>{\n    const o=sel.querySelector('option[selected]');\n    const s=document.createElement('span'); s.className='pv';\n    s.textContent=o?o.textContent:'—'; sel.replaceWith(s);\n  });\n\n  const css=Array.from(document.querySelectorAll('style')).map(s=>s.textContent).join('\\n')\n    + '\\n.pv{font-weight:600;} .print-only-header{display:block !important;}';\n  return {type:'nutriPrint', css:css, html:clone.innerHTML, title:REPORT_TITLE, filename:REPORT_FILE};\n}\n\nfunction reportDocHtml(p){\n  const extra='body{background:#fff;}'\n    +'header.hero{background:#fff !important;padding:0 0 14px !important;box-shadow:none !important;}'\n    +'header.hero::before,header.hero::after{display:none !important;}'\n    +'header.hero,header.hero *{color:#000 !important;}'\n    +'.card{box-shadow:none;border:1px solid #bbb;margin-top:14px;page-break-inside:avoid;}'\n    +'.results{display:block !important;}'\n    +'@media print{.card{page-break-inside:avoid;}}';\n  return '<!DOCTYPE html><html lang=\"tr\"><head><meta charset=\"UTF-8\">'\n    +'<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">'\n    +'<title>'+p.title+'</title>'\n    +'<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@500&display=swap\" rel=\"stylesheet\">'\n    +'<style>'+p.css+extra+'<\/style></head><body>'+p.html+'</body></html>';\n}\n\nfunction doDownload(p){\n  try{\n    const blob=new Blob([reportDocHtml(p)],{type:'text/html;charset=utf-8'});\n    const url=URL.createObjectURL(blob);\n    const a=document.createElement('a');\n    a.href=url; a.download=p.filename;\n    document.body.appendChild(a); a.click();\n    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1500);\n  }catch(err){\n    alert('Rapor indirilemedi. Lütfen dosyayı bilgisayarınıza indirip tarayıcıda açtıktan sonra tekrar deneyin.');\n  }\n}\n\nfunction printReport(){\n  const p=buildReportPayload();\n  if(window.parent && window.parent!==window){\n    p.action='print';\n    window.parent.postMessage(p,'*');\n    return;\n  }\n  try{ window.print(); }catch(e){ doDownload(p); }\n}\n\nfunction downloadReport(){\n  const p=buildReportPayload();\n  if(window.parent && window.parent!==window){\n    p.action='download';\n    window.parent.postMessage(p,'*');\n    return;\n  }\n  doDownload(p);\n}\n\n// ================= DETAYLI 7 GÜNLÜK PROGRAM MOTORU =================\nconst DP_FOODS = {\n  yumurta:{n:'Yumur
