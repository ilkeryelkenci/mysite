e{border-left-color:var(--orange);background:#FBEADC;}\n\n  .macro-bar{display:flex;height:26px;border-radius:4px;overflow:hidden;margin-bottom:8px;font-size:11.5px;font-weight:700;}\n  .macro-bar div{display:flex;align-items:center;justify-content:center;color:#fff;}\n  .macro-protein{background:var(--steel);}\n  .macro-carb{background:var(--lime);color:var(--navy) !important;}\n  .macro-fat{background:var(--orange);}\n  .macro-legend{display:flex;gap:18px;font-size:12.5px;color:#5B6675;margin-bottom:22px;flex-wrap:wrap;}\n  .macro-legend span{display:inline-flex;align-items:center;gap:6px;}\n  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}\n\n  .menu-select-row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px;}\n  .menu-select-row .field{flex:1;min-width:220px;}\n  .plan-note{font-size:12.5px;color:#5B6675;margin:14px 0 18px;}\n\n  .day-menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;}\n  .meal{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:16px 16px 14px;}\n  .meal-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}\n  .meal h4{font-family:'Source Code Pro',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);margin:0;}\n  .meal .kcal-target{font-size:11px;color:#5B6675;font-weight:600;}\n  .meal ul{margin:0;padding-left:18px;font-size:14px;}\n  .meal li{margin-bottom:7px;}\n  .meal li .kc{color:#8A95A3;font-size:12px;}\n\n  table.supp-table, table.exchange-table{width:100%;border-collapse:collapse;font-size:13.5px;}\n  table.supp-table th, table.exchange-table th{text-align:left;background:var(--navy);color:var(--white);padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;}\n  table.supp-table td, table.exchange-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}\n  table.supp-table tr:nth-child(even) td, table.exchange-table tr:nth-child(even) td{background:var(--paper-2);}\n  .supp-group{margin-bottom:22px;}\n  .supp-group h4{font-family:'Fraunces',serif;font-size:16px;color:var(--navy);margin:0 0 10px;border-left:3px solid var(--lime);padding-left:10px;}\n\n  .caution-box{margin-top:20px;padding:14px 16px;background:#FBEADC;border:1px solid #F0CBA3;border-left:3px solid var(--orange);border-radius:3px;font-size:13.5px;color:#6A4423;}\n  .caution-box b{color:var(--navy);}\n\n  .disclaimer{margin-top:40px;font-size:12.5px;color:#6B7683;line-height:1.6;border-top:1px solid var(--line);padding-top:18px;}\n  @media (max-width:600px){header.hero{padding:40px 18px 56px;} .card{padding:22px;}}\n\n  /* Danışan bilgi çubuğu */\n  .patient-bar{display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap; margin-top:24px; padding-top:18px; border-top:1px solid rgba(243,245,247,.2);}\n  .patient-bar label{color:var(--lime); font-size:11px; margin-bottom:4px; display:block; text-transform:uppercase; letter-spacing:.05em;}\n  .patient-bar input{background:rgba(255,255,255,.08); border:1px solid rgba(243,245,247,.3); color:var(--paper); border-radius:3px; padding:8px 10px; font-size:14px;}\n  .patient-bar input::placeholder{color:rgba(243,245,247,.5);}\n  .print-btn{background:var(--lime); color:var(--navy); border:none; border-radius:3px; padding:10px 18px; font-weight:700; cursor:pointer; font-size:14px;}\n  .print-only-header{display:none;}\n\n  @media print{\n    body{background:#fff;}\n    header.hero{background:#fff !important; box-shadow:none; padding:0 0 14px;}\n    header.hero::before, header.hero::after{display:none;}\n    header.hero, header.hero *{color:#000 !important;}\n    .eyebrow{color:#444 !important;}\n    .no-print{display:none !important;}\n    button{display:none !important;}\n    .print-only-header{display:block !important; margin-top:10px; font-size:13px; border-top:1px solid #999; padding-top:8px;}\n    .card{box-shadow:none; border:1px solid #bbb; margin-top:14px; page-break-inside:avoid;}\n    input[type=number], select{\n      border:none !important; background:transparent !important; padding:2px 0 !important;\n      -webkit-appearance:none; appearance:none; font-weight:600; color:#000 !important;\n    }\n    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }\n  }\n\n  :root{--dp-line:#D7DEE6;--dp-head:#16233A;--dp-acc:#D97A34;--dp-soft:#E7ECF1;}\n\n  /* --- Detaylı 7 günlük program --- */\n  .day-block{border:1px solid var(--dp-line,#D8CFB6);border-radius:4px;padding:20px;margin-bottom:22px;background:#fff;}\n  .day-block h3{font-family:'Fraunces',serif;font-size:20px;margin:0 0 4px;color:var(--dp-head,#1E3F3A);position:relative;padding-left:14px;}\n  .day-block h3::before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:5px;border-radius:3px;background:linear-gradient(180deg,#C08A2E,#1E3F3A);}\n  .day-sum{font-size:12.5px;color:#6B6455;margin:0 0 16px;padding-bottom:12px;border-bottom:1px dashed var(--dp-line,#D8CFB6);}\n  .day-sum b{color:var(--dp-head,#1E3F3A);}\n  .dp-meal{margin-bottom:18px;border-left:3px solid var(--meal-color,#C08A2E);padding-left:14px;border-radius:0 4px 4px 0;}\n  .dp-meal[data-meal-type=\"breakfast\"]{--meal-color:#C08A2E;}\n  .dp-meal[data-meal-type=\"main\"]{--meal-color:#1E3F3A;}\n  .dp-meal[data-meal-type=\"snack\"]{--meal-color:#A9713F;}\n  .dp-meal[data-meal-type=\"workout\"]{--meal-color:#2D6E8F;}\n  .dp-meal[data-meal-type=\"bedtime\"]{--meal-color:#6B5B95;}\n  .dp-meal[data-meal-type=\"other\"]{--meal-color:#6B6455;}\n  .dp-meal .meal-head-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px;}\n  .dp-meal .kcal-target{font-size:11px;color:#6B6455;font-weight:600;white-space:nowrap;}\n  .dp-meal h5{font-family:'Source Code Pro',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--meal-color,#C08A2E);margin:0;}\n  .dp-meal .mname{font-weight:700;font-size:15px;margin-bottom:8px;color:var(--dp-head,#1E3F3A);}\n  .macro-bar{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:2px 0 10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);}\n  .macro-seg{height:100%;}\n  .macro-seg.macro-p{background:#A9713F;}\n  .macro-seg.macro-c{background:#C08A2E;}\n  .macro-seg.macro-f{background:#2D6E8F;}\n  .macro-legend{font-size:10.5px;color:#6B6455;margin:0 0 14px;display:flex;gap:14px;flex-wrap:wrap;}\n  .dp-tips-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;padding:16px;background:var(--dp-soft,#EFE8D8);border-radius:6px;}\n  .dp-tip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--dp-line,#D8CFB6);border-radius:20px;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--dp-head,#1E3F3A);flex:1;min-width:150px;}\n  .dp-tip-icon{font-size:18px;}\n  .macro-legend span{display:inline-flex;align-items:center;gap:4px;}\n  .macro-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;}\n  table.dp-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px;}\n  table.dp-tbl th{text-align:left;background:var(--dp-head,#1E3F3A);color:#fff;padding:6px 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;}\n  table.dp-tbl td{padding:6px 8px;border-bottom:1px solid var(--dp-line,#D8CFB6);}\n  table.dp-tbl td.num,table.dp-tbl th.num{text-align:right;white-space:nowrap;}\n  table.dp-tbl tr.tot td{font-weight:700;background:var(--dp-soft,#EFE8D8);border-bottom:none;}\n  .dp-prep{font-size:12.5px;color:#4A4638;background:var(--dp-soft,#EFE8D8);border-left:3px solid var(--dp-acc,#C08A2E);padding:8px 12px;border-radius:0 3px 3px 0;}\n  .dp-prep b{color:var(--dp-head,#1E3F3A);}\n  @media print{\n    .day-block{page-break-before:always;page-break-inside:avoid;border:none;padding:0;}\n    .day-block:first-of-type{page-break-before:auto;}\n    .dp-meal{border-left-width:3px !important;}\n    .macro-bar{-webkit-print-color-adjust:exact;print-color-adjust:exact;}\n  }\n\n\n  /* --- Laboratuvar değerlendirme --- */\n  .lab-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11.5px;font-weight:700;}\n  .lab-ok{background:#DCEEE3;color:#1E3F3A;}\n  .lab-low{background:#FDE9D2;color:#7A4A12;}\n  .lab-high{background:#F8D7D2;color:#8C2E1F;}\n  .lab-critical{background:#F8D7D2;border:1px solid #E0796A;color:#7A2013;padding:14px 16px;border-radius:4px;margin-bottom:16px;font-size:13.5px;}\n  .lab-link{color:#C08A2E;cursor:pointer;text-decoration:underline;font-size:12px;white-space:nowrap;}\n\n  /* --- Tarifler --- */\n  .recipe-group-title{font-family:'Fraunces',serif;font-size:17px;margin:22px 0 12px;border-bottom:1px solid var(--dp-line,#D8CFB6);padding-bottom:6px;color:var(--dp-head,#1E3F3A);}\n  .recipe-group-title:first-child{margin-top:0;}\n  .recipe-card{border:1px solid var(--dp-line,#D8CFB6);border-radius:4px;padding:14px 16px;margin-bottom:12px;background:#fff;page-break-inside:avoid;break-inside:avoid;}\n  .recipe-name{font-weight:700;font-size:14.5px;margin-bottom:3px;}\n  .recipe-macro{font-size:11.5px;color:#6B6455;margin-bottom:8px;}\n  .recipe-ingr{margin:0 0 8px;padding-left:18px;font-size:13px;}\n  .recipe-ingr li{margin-bottom:3px;}\n  .diet-badge{display:inline-block;font-size:11px;font-weight:600;background:var(--dp-soft,#EFE8D8);color:var(--dp-head,#1E3F3A);border-radius:12px;padding:2px 10px;margin-right:6px;}\n\n\n  /* ===== Telefon/Bilgisayar Kullanılabilirlik İyileştirmeleri ===== */\n  @media (max-width: 720px){\n    /* Geniş tabloları sayfayı yatay kaydırmaya zorlamak yerine\n       kendi içinde yatay kaydırılabilir yap */\n    table.exchange-table, table.dp-tbl, table.supp-table{\n      display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; white-space:nowrap;\n      max-width:100%;\n    }\n    table.exchange-table th, table.exchange-table td,\n    table.dp-tbl th, table.dp-tbl td,\n    table.supp-table th, table.supp-table td{ white-space:nowrap; }\n\n    /* Dokunmatik hedefleri büyüt */\n    .toggle{ padding:12px 8px; }\n    .dislike-chip, .tag-btn{ padding:10px 15px; }\n    .btn-primary{ padding:16px; }\n  }\n\n  /* iOS Safari'de odaklanınca otomatik yakınlaştırmayı önlemek için\n     tüm form elemanları en az 16px olmalı */\n  input[type=number], input[type=text], select{ font-size:16px; }\n\n\n  /* --- Danışan Listesi / Takip Grafikleri --- */\n  .file-btn{display:inline-block;text-align:center;cursor:pointer;}\n  .file-btn input[type=file]{display:none;}\n  #trackCanvas{width:100%;height:260px;display:block;}\n\n\n  /* --- Barkod / Hatırlatıcı --- */\n  #scannerReader video{border-radius:4px;}\n  #reminderBanner{transition:opacity .3s;}\n\n\n  /* --- Diyetisyen İlker marka etiketi + renklendirme --- */\n  .dp-brand-tag{display:inline-flex;align-items:center;font-family:'Source Code Pro',monospace;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:6px 16px 6px 8px;border-radius:22px;margin-bottom:14px;box-shadow:0 2px 5px rgba(0,0,0,.12);}\n  .dp-masthead{display:flex;align-items:center;justify-content:center;gap:14px;padding:22px 0 26px;}\n  .dp-masthead-name{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:#1E3F3A;}\n  .dp-masthead-sub{font-family:'Source Code Pro',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8A8062;margin-top:2px;}\n  .dp-masthead-tag{font-family:'Fraunces',serif;font-size:12.5px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:#8A8062;margin-top:7px;}\n  @media print{\n    .dp-brand-tag{-webkit-print-color-adjust:exact;print-color-adjust:exact;}\n    .card{background:#fff !important;}\n  }\n\n<\/style>\n</head>\n<body>\n\n<header class=\"hero\">\n  <div class=\"hero-inner\">\n    <p class=\"eyebrow\">Diyetisyen İlker</p>\n    <h1>Sporcuya Özel Beslenme<br>ve Takviye Programı</h1>\n    <p>Vücut ağırlığı, spor türü ve hedefe göre günlük kalori, protein, karbonhidrat ve yağ ihtiyacını hesaplayın; antrenman günü örnek öğün planını ve kanıta dayalı takviye rehberini görüntüleyin.</p>\n    <div class=\"patient-bar no-print\">\n      <div><label>Sporcu Adı Soyadı</label><input type=\"text\" id=\"patientName\" placeholder=\"Ad Soyad\"></div>\n      <div><label>Tarih</label><input type=\"text\" id=\"patientDate\" placeholder=\"gg.aa.yyyy\"></div>\n      <button class=\"print-btn\" onclick=\"printReport()\">🖨️ Yazdır</button>\n      <button class=\"print-btn\" style=\"background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;\" onclick=\"downloadReport()\">⬇️ Raporu İndir (HTML)</button>\n    </div>\n    <div class=\"print-only-header\" id=\"printHeader\"></div>\n  </div>\n</header>\n\n<div class=\"wrap\">\n\n  <!-- INPUT CARD -->\n  <div class=\"card\">\n    <p class=\"section-title\">1 · Sporcu Bilgileri</p>\n    <p class=\"section-sub\">Tüm alanlar makro hesaplamasını kişiselleştirmek için kullanılır.</p>\n\n    <div class=\"grid\">\n      <div>\n        <label>Cinsiyet</label>\n        <div class=\"toggle-row\" id=\"genderToggle\">\n          <div class=\"toggle active\" data-val=\"female\">Kadın</div>\n          <div class=\"toggle\" data-val=\"male\">Erkek</div>\n        </div>\n      </div>\n      <div><label for=\"age\">Yaş</label><input type=\"number\" id=\"age\" value=\"27\" min=\"14\" max=\"70\"></div>\n      <div><label for=\"height\">Boy (cm)</label><input type=\"number\" id=\"height\" value=\"175\" min=\"120\" max=\"220\"></div>\n      <div><label for=\"weight\">Kilo (kg)</label><input type=\"number\" id=\"weight\" value=\"72\" min=\"30\" max=\"180\"></div>\n      <div>\n        <label for=\"sportType\">Spor Türü</label>\n        <select id=\"sportType\" onchange=\"renderPlan(); if(typeof renderWeek==='function') renderWeek(); if(typeof renderTimeline==='function') renderTimeline();\">\n          <option value=\"endurance\">Dayanıklılık (koşu, bisiklet, yüzme vb.)</option>\n          <option value=\"strength\" selected>Kuvvet / Güç (halter, vücut geliştirme vb.)</option>\n          <option value=\"team\">Takım Sporu (futbol, basketbol vb.)</option>\n        </select>\n      </div>\n      <div>\n        <label for=\"trainFreq\">Haftalık Antrenman Sıklığı</label>\n        <select id=\"trainFreq\">\n          <option value=\"1.4\">2-3 gün / hafta</option>\n          <option value=\"1.6\" selected>4-5 gün / hafta</option>\n          <option value=\"1.8\">6-7 gün / hafta</option>\n          <option value=\"2.0\">Günde 2 antrenman / üst düzey</option>\n        </select>\n      </div>\n      <div>\n        <label for=\"goal\">Hedef</label>\n        <select id=\"goal\" onchange=\"renderPlan()\">\n          <option value=\"-450\">Kesim / Yağ Kaybı</option>\n          <option value=\"0\" selected>Kiloyu Koruma / Performans</option>\n          <option value=\"400\">Kütle Artırma (Bulk)</option>\n        </select>\n      </div>\n    </div>\n\n    <button class=\"btn-primary\" onclick=\"calculate()\">Kalori ve Makro İhtiyacını Hesapla</button>\n\n    <div class=\"results\" id=\"results\">\n      <div class=\"result-grid\">\n        <div class=\"result-box\"><div class=\"num\" id=\"bmrVal\">--</div><div class=\"lbl\">Bazal Metabolizma (kcal)</div></div>\n        <div class=\"result-box\"><div class=\"num\" id=\"tdeeVal\">--</div><div class=\"lbl\">Antrenmanlı Günlük Harcama (kcal)</div></div>\n        <div class=\"result-box accent\"><div class=\"num\" id=\"targetVal\">--</div><div class=\"lbl\">Hedef Günlük Alım (kcal)</div></div>\n        <div class=\"result-box orange\"><div class=\"num\" id=\"proteinPerKgVal\">--</div><div class=\"lbl\">Protein Hedefi (g/kg)</div></div>\n      </div>\n\n      <div class=\"macro-bar\" id=\"macroBar\"></div>\n      <div class=\"macro-legend\">\n        <span><span class=\"dot\" style=\"background:var(--steel)\"></span>Protein: <b id=\"proteinG\">--</b> g (<span id=\"proteinKcal\">--</span> kcal)</span>\n        <span><span class=\"dot\" style=\"background:var(--lime)\"></span>Karbonhidrat: <b id=\"carbG\">--</b> g (<span id=\"carbKcal\">--</span> kcal)</span>\n        <span><span class=\"dot\" style=\"background:var(--orange)\"></span>Yağ: <b id=\"fatG\">--</b> g (<span id=\"fatKcal\">--</span> kcal)</span>\n      </div>\n    </div>\n  </div>\n\n  <!-- MEAL PLAN CARD -->\n  <div class=\"card\">\n    <p class=\"section-title\">2 · Antrenman Günü Örnek Öğün Planı</p>\n    <p class=\"section-sub\">Spor türüne göre antrenman öncesi/sonrası beslenme dahil örnek gün planı. Porsiyonlar hedef kaloriye göre diyetisyen tarafından ayarlanmalıdır.</p>\n    <p class=\"plan-note\" id=\"planNote\"></p>\n    <div class=\"day-menu\" id=\"dayMenu\"></div>\n    <div class=\"caution-box\" id=\"planCaution\"></div>\n  </div>\n\n  <!-- WEEKLY PLAN CARD -->\n  <div class=\"card\">\n    <p class=\"section-title\">3 · 1 Haftalık Antrenman Menüsü</p>\n    <p class=\"section-sub\">Seçili spor türüne göre Pazartesi-Pazar örnek menü; öğün içerikleri haftalık çeşitlilik için rotasyonla değişir.</p>\n    <button class=\"btn-primary no-print\" style=\"margin-bottom:14px;\" onclick=\"dpPrintStyledSportWeek()\">🎨 Süslü Görünümde Yazdır</button>\n    <div style=\"overflow-x:auto;\">\n      <table class=\"exchange-table\" id=\"weekTable\" style=\"min-width:820px;\"></table>\n    </div>\n  </div>\n\n  <!-- SUPPLEMENT CARD -->\n  <div class=\"card\">\n    <p class=\"section-title\">4 · Takviye Rehberi</p>\n    <p class=\"section-sub\">Kanıt düzeyi güçlü, yaygın kullanılan takviyeler genel referans olarak listelenmiştir. Herhangi bir takviyeye başlamadan önce mevcut sağlık durumu, ilaç etkileşimleri ve federasyon/WADA yasaklı madde listeleri açısından hekim/diyetisyene danışılmalıdır.</p>\n    <div id=\"suppLists\"></div>\n  </div>\n\n  <!-- MATCH DAY TIMELINE CARD -->\n  <div class=\"card\">\n    <p class=\"section-title\">5 · Maç / Yarışma Günü Saatlik Beslenme Zaman Çizelgesi</p>\n    <p class=\"section-sub\">Seçili spor türüne göre saatlik örnek zaman çizelgesi; gerçek saatler antrenman/müsabaka programına göre kaydırılmalıdır.</p>\n    <table class=\"exchange-table\" id=\"timelineTable\"></table>\n  </div>\n\n  <!-- FLUID LOSS CALCULATOR CARD -->\n  <div class=\"card\">\n    <p class=\"section-title\">6 · Antrenman Sıvı Kaybı Hesaplayıcı</p>\n    <p class=\"section-sub\">Antrenman öncesi ve sonrası tartı farkına göre yaklaşık sıvı kaybı ve rehidrasyon önerisi.</p>\n    <div class=\"grid\">\n      <div><label for=\"preWeight\">Antrenman Öncesi Kilo (kg)</label><input type=\"number\" id=\"preWeight\" value=\"72.0\" step=\"0.1\" min=\"30\" max=\"180\"></div>\n      <div><label for=\"postWeight\">Antrenman Sonrası Kilo (kg)</label><input type=\"number\" id=\"postWeight\" value=\"71.2\" step=\"0.1\" min=\"30\" max=\"180\"></div>\n      <div><label for=\"fluidDuring\">Antrenman Sırasında İçilen Sıvı (ml)</label><input type=\"number\" id=\"fluidDuring\" value=\"500\" min=\"0\" max=\"5000\"></div>\n    </div>\n    <button class=\"btn-primary\" onclick=\"calcFluidLoss()\">Sıvı Kaybını Hesapla</button>\n    <div class=\"results\" id=\"fluidResults\">\n      <div class=\"result-grid\">\n        <div class=\"result-box orange\"><div class=\"num\" id=\"fluidLossVal\">--</div><div class=\"lbl\">Toplam Sıvı Kaybı (ml)</div></div>\n        <div class=\"result-box accent\"><div class=\"num\" id=\"fluidLossPctVal\">--</div><div class=\"lbl\">Vücut Ağırlığının % Kaybı</div></div>\n        <div class=\"result-box\"><div class=\"num\" id=\"rehydrateVal\">--</div><div class=\"lbl\">Önerilen Rehidrasyon (ml)</div></div>\n      </div>\n      <p id=\"fluidNote\" style=\"font-size:13px;\"></p>\n    </div>\n  </div>\n\n  <!-- RED-S AWARENESS CARD -->\n  <div class=\"card\">\n    <p class=\"section-title\">7 · Kadın Sporcu Üçlüsü / RED-S Farkındalığı</p>\n    <p class=\"section-sub\">Yetersiz enerji alımına bağlı sağlık sorunları (Relative Energy Deficiency in Sport) konusunda genel farkındalık bilgisi.</p>\n    <div class=\"caution-box\" style=\"margin-top:0;\">\n      <b>Dikkat edilmesi gereken belirtiler:</b> adet düzensizliği/kesilmesi, tekrarlayan stres kırıkları, sık hastalanma, sürekli yorgunluk, performans platosu/düşüşü,\n      beklenmedik kilo değişimleri, yemekle ilgili artan kaygı. Bu belirtilerden birkaçının bir arada görülmesi, sporcunun harcadığı enerjiye kıyasla\n      yetersiz beslendiğine işaret edebilir.\n    </div>\n    <p style=\"font-size:13.5px;color:#4A4638;margin-top:14px;\">\n      Bu durum yalnızca kadın sporcularla sınırlı değildir, erkek sporcularda da görülebilir. Bu belirtileri gösteren bir sporcu, kısıtlayıcı diyet önerileri yerine\n      spor hekimi, spor diyetisyeni ve gerekirse ruh sağlığı uzmanından oluşan bir ekip tarafından değerlendirilmelidir. Bu araç tarama veya tanı amacıyla kullanılamaz.\n    </p>\n  </div>\n\n  <!-- VEGETARIAN PROTEIN CARD -->\n  <div class=\"card\">\n    <p class=\"section-title\">8 · Vejetaryen / Vegan Sporcu Protein Kaynakları</p>\n    <p class=\"section-sub\">Hayvansal protein tüketmeyen sporcular için yaklaşık protein içerikleri (100 g / porsiyon başına).</p>\n    <table class=\"exchange-table\">\n      <tr><th>Kaynak</th><th>Porsiyon</th><th>Yaklaşık Protein</th></tr>\n      <tr><td>Tofu</td><td>100 g</td><td>~8 g</td></tr>\n      <tr><td>Tempeh</td><td>100 g</td><td>~19 g</td></tr>\n      <tr><td>Mercimek (pişmiş)</td><td>1 su bardağı (200 g)</td><td>~18 g</td></tr>\n      <tr><td>Nohut (pişmiş)</td><td>1 su bardağı (200 g)</td><td>~15 g</td></tr>\n      <tr><td>Kinoa (pişmiş)</td><td>1 su bardağı (185 g)</td><td>~8 g</td></tr>\n      <tr><td>Seitan (buğday glüteni)</td><td>100 g</td><td>~25 g</td></tr>\n      <tr><td>Bitkisel protein tozu (bezelye/pirinç)</td><td>1 ölçek (~30 g)</td><td>~20-24 g</td></tr>\n      <tr><td>Yer fıstığı ezmesi</td><td>2 yemek kaşığı (32 g)</td><td>~7 g</td></tr>\n      <tr><td>Yunan usulü bitkisel yoğurt (soya bazlı)</td><td>200 g</td><td>~10-15 g (markaya göre değişir)</td></tr>\n    </table>\n    <p style=\"font-size:12.5px;color:#6B7683;margin-top:12px;\">Bitkisel proteinler genelde bir veya birkaç esansiyel amino asit açısından sınırlıdır; gün içinde farklı kaynakların (tahıl + baklagil gibi) birlikte tüketilmesi tam amino asit profili sağlanmasına yardımcı olur.</p>\n  </div>\n\n  \n  <div class=\"card\">\n    <p class=\"section-title\">9 · Detaylı 7 Günlük Diyet Programı (Miktarlı)</p>\n    <p class=\"section-sub\">Seçili duruma ve hesaplanan hedef kaloriye göre gün gün ayrılmış, porsiyon miktarları, hazırlanış adımları ve her öğün için karbonhidrat / protein / yağ değerleri belirtilmiş ayrıntılı program.</p>\n    <div class=\"no-print\" style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:200px;\" onclick=\"dpRenderPlan()\">Programı Yenile</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:200px;\" onclick=\"dpPrint('print')\">🖨️ 7 Günlük Programı Yazdır</button>\n      <button type=\"button\" class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:200px;background:#25D366;color:#fff;\" onclick=\"dpPrepWhatsApp()\">📱 WhatsApp Mesajı Hazırla</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:220px;\" onclick=\"dpWeeklyShoppingList()\">🛒 7 Günlük Alışveriş Listesi Oluştur</button>\n      <button class=\"btn-primary\" id=\"dpPdfBtn\" style=\"margin-top:0;flex:1;min-width:200px;\" onclick=\"dpPdf()\">📄 PDF olarak indir</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:200px;background:transparent;border:1px solid currentColor;\" onclick=\"dpPrint('download')\">⬇️ İndir (HTML)</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:200px;\" onclick=\"dpPrintStyledDetailPlan()\">🎨 Süslü Görünümde Yazdır</button>\n    </div>\n        <div id=\"waBox\" style=\"display:none;margin-top:16px;background:var(--dp-soft,#EFE8D8);border:1px solid var(--dp-line,#D8CFB6);border-radius:4px;padding:16px;\">\n      <label style=\"display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--dp-head,#1E3F3A);margin-bottom:8px;\">WhatsApp Mesajı — metni kopyalayıp WhatsApp'a yapıştırabilirsiniz</label>\n      <textarea id=\"waText\" readonly rows=\"6\" style=\"width:100%;padding:10px;border:1px solid var(--dp-line,#D8CFB6);border-radius:3px;font-family:inherit;font-size:13px;background:#fff;box-sizing:border-box;\"></textarea>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;\">\n        <button type=\"button\" class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;\" onclick=\"dpCopyWhatsAppText()\">📋 Metni Kopyala</button>\n        <a id=\"waDirectLink\" href=\"https://wa.me/\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:#25D366;color:#fff;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box;\">WhatsApp'ta Doğrudan Aç (varsa)</a>\n      </div>\n      <p id=\"waCopyMsg\" style=\"font-size:12px;color:var(--dp-head,#1E3F3A);margin-top:8px;display:none;\"></p>\n    </div>\n        <div id=\"weeklyShopBox\" style=\"display:none;margin-top:16px;background:var(--dp-soft,#EFE8D8);border:1px solid var(--dp-line,#D8CFB6);border-radius:4px;padding:16px;\">\n      <b style=\"color:var(--dp-head,#1E3F3A);\">7 Günlük Alışveriş Listesi (toplam miktarlar)</b>\n      <div id=\"weeklyShopList\" style=\"margin-top:10px;\"></div>\n    </div>\n    <div id=\"detailPlan\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">10 · Tarifler / Yemek Tarifleri</p>\n    <p class=\"section-sub\">Programdaki menülerde kullanılan yemeklerin malzeme miktarları ve hazırlanış adımları. Aşağıdaki liste, bu modüldeki tüm durumlarda kullanılan tarifleri kapsar; filtreler yeni tarif üretmez, mevcutlar arasından seçer. Vejetaryen/glutensiz etiketleri tarifin gerçek malzemelerinden otomatik hesaplanır.</p>\n    <div class=\"no-print\">\n    <input type=\"text\" id=\"recipeSearch\" placeholder=\"Tarif ara…\" oninput=\"dpFilterRecipes()\" style=\"width:100%;padding:11px 12px;border:1px solid var(--dp-line,#D8CFB6);border-radius:3px;margin-bottom:12px;font-size:15px;box-sizing:border-box;\">\n    <div class=\"grid\" style=\"margin-bottom:10px;\">\n      <div><label for=\"recipeMaxKcal\">Maks. Kalori (kcal)</label><input type=\"number\" id=\"recipeMaxKcal\" placeholder=\"örn. 400\" oninput=\"dpFilterRecipes()\"></div>\n      <div><label for=\"recipeMinProtein\">Min. Protein (g)</label><input type=\"number\" id=\"recipeMinProtein\" placeholder=\"örn. 20\" oninput=\"dpFilterRecipes()\"></div>\n    </div>\n    <div style=\"margin-bottom:12px;\">\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"recipeVegOnly\" onchange=\"dpFilterRecipes()\"> Sadece Vejetaryen</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"recipeGfOnly\" onchange=\"dpFilterRecipes()\"> Sadece Glutensiz</label>\n    </div>\n    <button class=\"btn-primary\" style=\"margin-top:0;margin-bottom:18px;\" onclick=\"dpPrintRecipes()\">🖨️ Görünen Tarifleri Yazdır</button>\n    </div>\n    <div id=\"recipeList\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">11 · Danışan Listesi (Oturum İçi)</p>\n    <p class=\"section-sub\">Bu liste yalnızca bu tarayıcı sekmesi açıkken tutulur, sayfa kapatılınca silinir — kalıcı bir hasta kayıt sistemi değildir. Kaydederken o an seçili olan program ve hedef kalori de bir \"arşiv\" notu olarak saklanır. Süreklilik için \"Dışa Aktar\" ile JSON dosyası indirip bir sonraki seansta \"İçe Aktar\" ile geri yükleyebilirsiniz. Bir danışana \"Yükle\" demek, yukarıdaki tüm alanları o danışanın bilgileriyle doldurur.</p>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:220px;\" onclick=\"dpSaveClient()\">+ Şu Anki Bilgileri Danışan Olarak Kaydet</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\" onclick=\"dpExportClients()\">⬇️ Dışa Aktar (JSON)</button>\n      <label class=\"btn-primary file-btn\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\">\n        ⬆️ İçe Aktar (JSON)\n        <input type=\"file\" accept=\"application/json\" onchange=\"dpImportClients(this.files[0])\">\n      </label>\n    </div>\n    <div id=\"clientList\"></div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">12 · Takip Grafikleri (Kilo Takibi)</p>\n    <p class=\"section-sub\">Danışanın kilo değişimini zaman içinde izleyin. Veriler yalnızca bu oturumda tutulur; süreklilik için dışa/içe aktarma seçeneklerini kullanın.</p>\n    <div class=\"grid\" style=\"margin-bottom:16px;\">\n      <div><label for=\"trackDate\">Tarih</label><input type=\"text\" id=\"trackDate\" placeholder=\"gg.aa.yyyy\"></div>\n      <div><label for=\"trackWeight\">Kilo (kg)</label><input type=\"number\" id=\"trackWeight\" step=\"0.1\"></div>\n      <div><label for=\"trackHeightCm\">Boy (cm) — BKİ için, opsiyonel</label><input type=\"number\" id=\"trackHeightCm\" step=\"0.1\"></div>\n    </div>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;\" onclick=\"dpAddTrackPoint()\">Kayıt Ekle</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\" onclick=\"dpExportTrack()\">⬇️ Dışa Aktar (JSON)</button>\n      <label class=\"btn-primary file-btn\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\">\n        ⬆️ İçe Aktar (JSON)\n        <input type=\"file\" accept=\"application/json\" onchange=\"dpImportTrack(this.files[0])\">\n      </label>\n    </div>\n    <canvas id=\"trackCanvas\"></canvas>\n    <div id=\"trackTable\" style=\"margin-top:16px;\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">13 · Barkod ile Besin Değeri Sorgulama</p>\n    <p class=\"section-sub\">Ürün barkodunu kameradan taratın veya elle girin; Open Food Facts açık veritabanından besin değerlerini getirir. Bu veritabanı kullanıcı katkılıdır — özellikle Türkiye'deki ürünlerde kapsam sınırlı olabilir; sonuçları her zaman ürün etiketiyle karşılaştırın. Kamera ve sorgulama internet bağlantısı gerektirir. <b>Not:</b> Bu dosyayı doğrudan (çift tıklayarak) açtıysanız, tarayıcı güvenlik kuralları gereği kamera ve dış sunucu sorgusu çalışmayabilir — bu bir hata değildir; dosyayı bir web sunucusu üzerinden açtığınızda genellikle sorunsuz çalışır.</p>\n    <div class=\"grid\" style=\"margin-bottom:16px;\">\n      <div><label for=\"barcodeInput\">Barkod Numarası</label><input type=\"text\" id=\"barcodeInput\" inputmode=\"numeric\" placeholder=\"örn. 8690637000000\"></div>\n    </div>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;\" onclick=\"dpLookupBarcode()\">Sorgula</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\" onclick=\"dpToggleScanner()\">📷 Kamera ile Tara</button>\n    </div>\n    <div id=\"scannerBox\" style=\"display:none;margin-bottom:16px;\">\n      <div id=\"scannerReader\" style=\"width:100%;max-width:380px;margin:0 auto;\"></div>\n      <button class=\"btn-primary\" style=\"margin-top:12px;max-width:380px;display:block;margin-left:auto;margin-right:auto;background:transparent;border:1px solid currentColor;\" onclick=\"dpStopScanner()\">İptal</button>\n    </div>\n    <div id=\"barcodeResult\"></div>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">14 · Su / Öğün Hatırlatıcı</p>\n    <p class=\"section-sub\">Bu hatırlatıcılar yalnızca bu tarayıcı sekmesi açık kaldığı sürece çalışır — sekme kapatılınca veya telefon uzun süre kilitlenince durur; gerçek bir sistem düzeyinde bildirim değildir. Tarayıcı bildirim izni verirseniz gerçek bildirim, vermezseniz sayfa içi uyarı olarak gösterilir.</p>\n\n    <p style=\"font-weight:700;color:var(--dp-head,#1E3F3A);margin-bottom:10px;\">💧 Su İçme Hatırlatıcısı</p>\n    <div class=\"menu-select-row\">\n      <div class=\"field\"><label for=\"waterIntervalSelect\">Aralık</label>\n        <select id=\"waterIntervalSelect\">\n          <option value=\"30\">30 dakikada bir</option>\n          <option value=\"60\" selected>60 dakikada bir</option>\n          <option value=\"90\">90 dakikada bir</option>\n          <option value=\"120\">120 dakikada bir</option>\n        </select>\n      </div>\n    </div>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;margin-bottom:8px;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;\" onclick=\"dpStartWaterReminder()\">Başlat</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\" onclick=\"dpStopWaterReminder()\">Durdur</button>\n    </div>\n    <p id=\"waterReminderStatus\" style=\"font-size:12.5px;color:#6B6455;margin-bottom:24px;\">Kapalı.</p>\n\n    <p style=\"font-weight:700;color:var(--dp-head,#1E3F3A);margin-bottom:10px;\">🍽️ Öğün Hatırlatıcısı</p>\n    <div class=\"grid\" style=\"margin-bottom:14px;\">\n      <div><label for=\"mealTimeInput\">Saat</label><input type=\"time\" id=\"mealTimeInput\"></div>\n      <div><label for=\"mealLabelInput\">Etiket</label><input type=\"text\" id=\"mealLabelInput\" placeholder=\"örn. Kahvaltı\"></div>\n    </div>\n    <button class=\"btn-primary\" style=\"margin-bottom:16px;\" onclick=\"dpAddMealReminder()\">+ Hatırlatıcı Ekle</button>\n    <div id=\"mealReminderList\" style=\"margin-bottom:16px;\"></div>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;\" onclick=\"dpStartMealReminders()\">Hatırlatıcıları Etkinleştir</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:160px;background:transparent;border:1px solid currentColor;\" onclick=\"dpStopMealReminders()\">Durdur</button>\n    </div>\n    <p id=\"mealReminderStatus\" style=\"font-size:12.5px;color:#6B6455;margin-top:10px;\">Kapalı.</p>\n\n    <div id=\"reminderBanner\" style=\"display:none;margin-top:18px;background:var(--dp-soft,#EFE8D8);border-left:3px solid var(--dp-acc,#C08A2E);padding:12px 14px;border-radius:0 3px 3px 0;font-size:13.5px;color:var(--dp-head,#1E3F3A);\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">15 · Günlük Hedef ve Motivasyon Takibi</p>\n    <p class=\"section-sub\">Basit bir günlük hedef kontrol listesi — ilerlemeyi görmek motivasyonu destekleyebilir.</p>\n    <div style=\"margin-bottom:18px;\">\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"goal_water\"> Bugün su hedefime ulaştım</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"goal_menu\"> Bugün önerilen menüyü takip ettim</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"goal_move\"> Bugün hareket/egzersiz yaptım</label>\n      <label class=\"screen-check\"><input type=\"checkbox\" id=\"goal_sleep\"> Bugün yeterli uyudum</label>\n    </div>\n    <button class=\"btn-primary\" onclick=\"dpSaveDailyGoal()\">Bugünü Kaydet</button>\n    <div id=\"goalHistory\" style=\"margin-top:18px;\"></div>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">16 · Su Alım Günlüğü</p>\n    <p class=\"section-sub\">Bugün içtiğin suyu hızlıca ekle, hedefe göre ilerlemeni gör. Yalnızca bu oturumda tutulur.</p>\n    <div class=\"grid\" style=\"margin-bottom:14px;\">\n      <div><label for=\"waterLogGoal\">Günlük Hedef (ml)</label><input type=\"number\" id=\"waterLogGoal\" value=\"2000\" onchange=\"dpRenderWaterLog()\"></div>\n    </div>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;\">\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:90px;\" onclick=\"dpAddWater(200)\">+200 ml</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:90px;\" onclick=\"dpAddWater(250)\">+250 ml</button>\n      <button class=\"btn-primary\" style=\"margin-top:0;flex:1;min-width:90px;\" onclick=\"dpAddWater(500)\">+500 ml</button>\n    </div>\n    <div style=\"display:flex;gap:10px;align-items:flex-end;margin-bottom:8px;\">\n      <div style=\"flex:1;\"><label for=\"waterLogCustom\">Özel miktar (ml)</label><input type=\"number\" id=\"waterLogCustom\"></div>\n      <button class=\"btn-primary\" style=\"margin-top:0;\" onclick=\"dpAddWaterCustom()\">Ekle</button>\n    </div>\n    <div style=\"background:var(--dp-soft,#EFE8D8);border-radius:6px;height:22px;overflow:hidden;margin:18px 0 8px;\">\n      <div id=\"waterLogBar\" style=\"background:var(--dp-acc,#C08A2E);height:100%;width:0%;transition:width .3s;\"></div>\n    </div>\n    <p id=\"waterLogText\" style=\"font-size:13.5px;margin-bottom:14px;\">0 ml / 2000 ml</p>\n    <button class=\"btn-primary\" style=\"background:transparent;border:1px solid currentColor;\" onclick=\"dpResetWaterLog()\">Günü Sıfırla</button>\n  </div>\n\n  <div class=\"card\">\n    <p class=\"section-title\">17 · Fiziksel Aktivite Günlüğü</p>\n    <p class=\"section-sub\">Bugünkü hareketlerini kaydet. Kalori tahminleri standart MET formülüyle yapılan yaklaşık hesaplardır (gerçek harcama kişiye göre değişir).</p>\n    <div class=\"grid\" style=\"margin-bottom:14px;\">\n      <div><label for=\"actLogType\">Aktivite</label>\n        <select id=\"actLogType\">\n          <option value=\"3.0\">Yavaş Yürüyüş</option>\n          <option value=\"3.5\" selected>Orta Tempo Yürüyüş</option>\n          <option value=\"5.0\">Tempolu Yürüyüş</option>\n          <option value=\"7.0\">Bisiklet</option>\n          <option value=\"8.0\">Hafif Koşu</option>\n          <option value=\"10.0\">Koşu</option>\n          <option value=\"4.0\">Yüzme (hafif)</option>\n          <option value=\"6.0\">Direnç Antrenmanı</option>\n        </select>\n      </div>\n      <div><label for=\"actLogMin\">Süre (dakika)</label><input type=\"number\" id=\"actLogMin\" value=\"30\"></div>\n      <div><label for=\"actLogWeight\">Kilo (kg)</label><input type=\"number\" id=\"actLogWeight\" value=\"70\"></div>\n    </div>\n    <button class=\"btn-primary\" onclick=\"dpAddActivity()\">+ Ekle</button>\n    <div id=\"actLogList\" style=\"margin:16px 0;\"></div>\n    <p id=\"actLogTotal\" style=\"font-size:13.5px;font-weight:700;margin-bottom:14px;\"></p>\n    <button class=\"btn-primary\" style=\"background:transparent;border:1px solid currentColor;\" onclick=\"dpResetActivityLog()\">Günü Sıfırla</button>\n  </div>\n\n    <div class=\"card\">\n    <p class=\"section-title\">18 · Mutfak Ölçü Birimi Çevirici</p>\n    <p class=\"section-sub\">Su bardağı, yemek kaşığı gibi ölçüleri grama/mililitreye çevirir. Değerler malzemeye göre değişir; yaygın kullanılan pratik Türk mutfağı ölçü tablosu esas alınmıştır, marka/neme göre küçük farklar olabilir.</p>\n    <div class=\"grid\" style=\"margin-bottom:16px;\">\n      <div><label for=\"kitchenIngredient\">Malzeme</label>\n        <select id=\"kitchenIngredient\">\n          <option value=\"un\">Un</option>\n          <option value=\"seker\">Toz Şeker</option>\n          <option value=\"pirinc\">Pirinç</option>\n          <option value=\"sivi_yag\">Sıvı Yağ</option>\n          <option value=\"sut_su_yogurt\">Süt / Su / Yoğurt</option>\n          <option value=\"bulgur\">Bulgur</option>\n        </select>\n      </div>\n      <div><label for=\"kitchenAmount\">Miktar</label><input type=\"number\" id=\"kitchenAmount\" value=\"1\" step=\"0.1\"></div>\n      <div><label for=\"kitchenFromUnit\">Kaynak Birim</label>\n        <select id=\"kitchenFromUnit\">\n          <option value=\"su_bardagi\">Su Bardağı</option>\n          <option value=\"cay_bardagi\">Çay Bardağı</option>\n          <option value=\"yemek_kasigi\">Yemek Kaşığı</option>\n          <option value=\"tatli_kasigi\">Tatlı Kaşığı</option>\n          <option value=\"cay_kasigi\">Çay Kaşığı</option>\n          <option value=\"gram\">Gram</option>\n          <option value=\"ml\">Mililitre</option>\n        </select>\n      </div>\n      <div><label for=\"kitchenToUnit\">Hedef Birim</label>\n        <select id=\"kitchenToUnit\">\n          <option value=\"gram\" selected>Gram</option>\n          <option value=\"su_bardagi\">Su Bardağı</option>\n          <option value=\"cay_bardagi\">Çay Bardağı</option>\n          <option value=\"yemek_kasigi\">Yemek Kaşığı</option>\n          <option value=\"tatli_kasigi\">Tatlı Kaşığı</option>\n          <option value=\"cay_kasigi\">Çay Kaşığı</option>\n          <option value=\"ml\">Mililitre</option>\n        </select>\n      </div>\n    </div>\n    <button class=\"btn-primary\" onclick=\"dpConvertKitchen()\">Çevir</button>\n    <div id=\"kitchenResult\" class=\"screen-result\"></div>\n  </div>\n\n  <p class=\"disclaimer\">\n    Bu araç genel spor beslenmesi ilkelerine dayalı bir referans hesaplama, örnek öğün planı ve takviye rehberi sunar; tıbbi tanı, tedavi veya bireysel reçete yerine geçmez.\n    Böbrek/karaciğer hastalığı, kalp rahatsızlığı veya ilaç kullanımı olan sporcularda yüksek proteinli beslenme ve takviyeler hekim onayı olmadan uygulanmamalıdır.\n    Rekabetçi sporcular, kullandıkları her takviyeyi bağlı oldukları federasyonun ve WADA'nın güncel yasaklı madde listesiyle karşılaştırmalıdır.\n  </p>\n</div>\n\n<script>\nlet gender='male';\ndocument.getElementById('genderToggle').addEventListener('click',(e)=>{\n  const t=e.target.closest('.toggle'); if(!t) return;\n  document.querySelectorAll('#genderToggle .toggle').forEach(x=>x.classList.remove('active'));\n  t.classList.add('active'); gender=t.dataset.val;\n});\n// default toggle to male since input defaults suit that; sync initial state\ndocument.querySelectorAll('#genderToggle .toggle').forEach(t=>t.classList.remove('active'));\ndocument.querySelector('#genderToggle .toggle[data-val=\"male\"]').classList.add('active');\n\nconst proteinPerKgBySport = { endurance:1.4, strength:1.9, team:1.6 };\n// cutting increases protein need to preserve lean mass; bulk slightly increases too\nfunction proteinPerKgFor(sport, goalAdj){\n  let base = proteinPerKgBySport[sport];\n  if(goalAdj < 0) base += 0.3; // kesim\n  else if(goalAdj > 0) base += 0.1; // bulk\n  return Math.round(base*10)/10;\n}\nconst fatPct = 0.27;\n\nlet lastCalc = null;\n\nfunction calculate(){\n  const age=parseFloat(document.getElementById('age').value);\n  const height=parseFloat(document.getElementById('height').value);\n  const weight=parseFloat(document.getElementById('weight').value);\n  const trainFreq=parseFloat(document.getElementById('trainFreq').value);\n  const goalAdj=parseFloat(document.getElementById('goal').value);\n  const sport=document.getElementById('sportType').value;\n\n  if(!age||!height||!weight){alert('Lütfen yaş, boy ve kilo bilgilerini giriniz.');return;}\n\n  let bmr = gender==='male' ? (10*weight+6.25*height-5*age+5) : (10*weight+6.25*height-5*age-161);\n  const tdee = bmr*trainFreq;\n  const target = Math.max(1200, Math.round(tdee+goalAdj));\n\n  const proteinPerKg = proteinPerKgFor(sport, goalAdj);\n  const proteinG = Math.round(weight*proteinPerKg);\n  const proteinKcal = proteinG*4;\n  const fatKcal = Math.round(target*fatPct);\n  const fatG = Math.round(fatKcal/9);\n  const carbKcal = Math.max(0, target - proteinKcal - fatKcal);\n  const carbG = Math.round(carbKcal/4);\n\n  document.getElementById('bmrVal').textContent = Math.round(bmr).toLocaleString('tr-TR');\n  document.getElementById('tdeeVal').textContent = Math.round(tdee).toLocaleString('tr-TR');\n  document.getElementById('targetVal').textContent = target.toLocaleString('tr-TR');\n  document.getElementById('proteinPerKgVal').textContent = proteinPerKg;\n\n  document.getElementById('proteinG').textContent = proteinG;\n  document.getElementById('proteinKcal').textContent = proteinKcal;\n  document.getElementById('carbG').textContent = carbG;\n  document.getElementById('carbKcal').textContent = carbKcal;\n  document.getElementById('fatG').textContent = fatG;\n  document.getElementById('fatKcal').textContent = fatKcal;\n\n  const pPct = Math.round((proteinKcal/target)*100);\n  const cPct = Math.round((carbKcal/target)*100);\n  const fPct = Math.max(0,100-pPct-cPct);\n  document.getElementById('macroBar').innerHTML =\n    `<div class=\"macro-protein\" style=\"flex:${pPct}\">${pPct}%</div>\n     <div class=\"macro-carb\" style=\"flex:${cPct}\">${cPct}%</div>\n     <div class=\"macro-fat\" style=\"flex:${fPct}\">${fPct}%</div>`;\n\n  document.getElementById('results').classList.add('show');\n\n  lastCalc = {target, proteinG, carbG, fatG, sport, goalAdj};\n  renderPlan();\n}\n\n// ---------- MEAL PLAN BY SPORT TYPE ----------\nconst plans = {\nendurance:{\n  label:\"Dayanıklılık Sporcusu\",\n  meals:[\n    {key:\"Kahvaltı\", items:[\"Yulaf ezmesi + muz + bal\", \"Yoğurt\", \"1 dilim tam tahıllı ekmek + fındık ezmesi\"]},\n    {key:\"Antrenman Öncesi\", items:[\"Muz + hurma (hızlı sindirilen karbonhidrat)\", \"Az yağlı, kolay sindirilen bir atıştırmalık\"]},\n    {key:\"Antrenman Sonrası\", items:[\"Whey protein + meyve suyu veya muzlu smoothie (karbonhidrat:protein ~3:1)\"]},\n    {key:\"Öğle Yemeği\", items:[\"Izgara tavuk/balık\", \"Bol pirinç/bulgur pilavı\", \"Sebze yemeği\"]},\n    {key:\"Akşam Yemeği\", items:[\"Somon veya baklagil yemeği\", \"Tatlı patates/patates\", \"Yeşil salata\"]},\n  ],\n  caution:\"Dayanıklılık sporcularında karbonhidrat, antrenman hacmine göre günlük 6-10 g/kg'a kadar çıkabilir; uzun antrenmanlarda antrenman sırasında karbonhidrat alımı (jel/içecek) gerekebilir.\"},\n\nstrength:{\n  label:\"Kuvvet / Güç Sporcusu\",\n  meals:[\n    {key:\"Kahvaltı\", items:[\"Yumurta (3-4 adet) + tam tahıllı ekmek\", \"Avokado\", \"Meyve\"]},\n    {key:\"Antrenman Öncesi\", items:[\"Tavuk göğsü + pirinç/bulgur (orta miktarda karbonhidrat + protein)\"]},\n    {key:\"Antrenman Sonrası\", items:[\"Whey protein shake + muz\", \"(İsteğe bağlı) kreatin dozu ile birlikte\"]},\n    {key:\"Öğle Yemeği\", items:[\"Kırmızı et veya tavuk (yüksek protein)\", \"Bulgur/pirinç pilavı\", \"Bol sebze\"]},\n    {key:\"Akşam Yemeği\", items:[\"Balık veya yumurta bazlı yemek\", \"Kompleks karbonhidrat (tatlı patates, kinoa)\", \"Salata + zeytinyağı\"]},\n    {key:\"Yatmadan Önce (opsiyonel)\", items:[\"Kazein proteini veya lor peyniri (gece boyu yavaş salınımlı protein)\"]},\n  ],\n  caution:\"Kuvvet sporcularında protein alımının gün içine (3-5 öğün) eşit dağıtılması, her öğünde ~0.3-0.4 g/kg protein hedeflenmesi kas protein sentezi açısından faydalıdır.\"},\n\nteam:{\n  label:\"Takım Sporu Sporcusu\",\n  meals:[\n    {key:\"Kahvaltı\", items:[\"Yulaf + süt + meyve\", \"Yumurta\", \"Tam tahıllı ekmek\"]},\n    {key:\"Antrenman/Maç Öncesi\", items:[\"Makarna veya pirinç (orta-yüksek karbonhidrat) + az yağlı protein\", \"Antrenmandan 3-4 saat önce tüketilmesi önerilir\"]},\n    {key:\"Antrenman/Maç Sonrası\", items:[\"Whey protein + karbonhidrat kaynağı (meyve, bal)\", \"Elektrolit içeren sıvı\"]},\n    {key:\"Öğle Yemeği\", items:[\"Izgara tavuk\", \"Bulgur pilavı\", \"Sebze yemeği\"]},\n    {key:\"Akşam Yemeği\", items:[\"Balık veya kırmızı et\", \"Patates/pirinç\", \"Salata\"]},\n  ],\n  caution:\"Takım sporlarında maç günü sıvı-elektrolit dengesi ve maçtan 3-4 saat önceki karbonhidrat ağırlıklı öğün performans açısından önemlidir.\"},\n};\n\nfunction renderPlan(){\n  const sport = document.getElementById('sportType').value;\n  const p = plans[sport];\n  const target = lastCalc ? lastCalc.target : 2200;\n\n  document.getElementById('planNote').textContent =\n    `${p.label} için örnek gün planı — hedef günlük alım: ${target.toLocaleString('tr-TR')} kcal (hesaplanmadıysa varsayılan değer gösterilir).`;\n\n  document.getElementById('dayMenu').innerHTML = p.meals.map(m=>`\n    <div class=\"meal\">\n      <div class=\"meal-head\"><h4>${m.key}</h4></div>\n      <ul>${m.items.map(i=>`<li>${(typeof dpFoodEmoji==='function' ? dpFoodEmoji(i)+' ' : '')}${i}</li>`).join('')}</ul>\n    </div>\n  `).join('');\n\n  document.getElementById('planCaution').innerHTML = `<b>${p.label} — Not:</b> ${p.caution}`;\n}\nrenderPlan();\n\n// ---------- SUPPLEMENT GUIDE ----------\nconst suppGroups = [\n{ title:\"Performans / Güç\", items:[\n  {n:\"Kreatin monohidrat\", dose:\"3-5 g/gün (günlük, süreklilik önemli)\", timing:\"Günün herhangi bir saati; antrenman sonrası pratikte tercih edilebilir\", note:\"En çok araştırılmış takviyelerden biri; kısa süreli güç/patlayıcı performansı destekler. Böbrek hastalığı olanlarda hekim onayı gerekir.\"},\n  {n:\"Kafein\", dose:\"~3-6 mg/kg vücut ağırlığı\", timing:\"Antrenman/müsabakadan 30-60 dk önce\", note:\"Dayanıklılık ve uyanıklığı destekler; yüksek dozlarda çarpıntı, uykusuzluk yapabilir. Kalp rahatsızlığı olanlarda dikkatli olunmalı.\"},\n  {n:\"Beta-alanin\", dose:\"3-6 g/gün (bölünmüş dozlarda)\", timing:\"Günlük, kümülatif etkiye dayanır\", note:\"Yüksek yoğunluklu, 1-4 dk süren efor gerektiren sporlarda faydalı olabilir; ciltte karıncalanma (paresteziler) yapabilir, zararsızdır.\"},\n]},\n{ title:\"Kas Onarımı / Protein\", items:[\n  {n:\"Whey protein (peyniraltı suyu proteini)\", dose:\"20-40 g / porsiyon\", timing:\"Antrenman sonrası veya öğünler arasında protein hedefine ulaşmak için\", note:\"Hızlı emilir; gıdalarla protein hedefi karşılanamıyorsa pratik bir tamamlayıcıdır, gıdanın yerini almaz.\"},\n  {n:\"Kazein proteini\", dose:\"20-30 g / porsiyon\", timing:\"Yatmadan önce\", note:\"Yavaş salınımlı; gece boyu kas protein sentezini destekleyebilir.\"},\n  {n:\"EAA / BCAA (esansiyel amino asitler)\", dose:\"5-10 g / porsiyon\", timing:\"Antrenman öncesi/sırası (opsiyonel)\", note:\"Günlük toplam protein alımı yeterliyse ek faydası sınırlıdır; aç karnına antrenmanlarda tercih edilebilir.\"},\n]},\n{ title:\"Dayanıklılık / Enerji\", items:[\n  {n:\"Karbonhidrat jel / spor içeceği\", dose:\"30-60 g karbonhidrat / saat (uzun süreli efor)\", timing:\"60 dakikadan uzun süren antrenman/yarış sırasında\", note:\"Uzun süreli dayanıklılık performansında glikojen tükenmesini geciktirir.\"},\n  {n:\"Elektrolit takviyesi (sodyum ağırlıklı)\", dose:\"Antrenman/iklime göre değişir\", timing:\"Uzun süreli veya sıcak ortamda yapılan antrenman sırasında\", note:\"Aşırı terleyen sporcularda kramp ve performans düşüşünü önlemeye yardımcı olabilir.\"},\n]},\n{ title:\"Genel Sağlık Desteği\", items:[\n  {n:\"D vitamini\", dose:\"Kan düzeyine göre hekim tarafından belirlenir\", timing:\"Günlük\", note:\"Kemik sağlığı ve kas fonksiyonu için önemlidir; özellikle kapalı alanda/kış aylarında antrenman yapan sporcularda eksiklik sık görülür.\"},\n  {n:\"Omega-3 (balık yağı)\", dose:\"1-2 g EPA+DHA/gün\", timing:\"Öğünlerle birlikte\", note:\"Genel sağlık ve iltihap yanıtı açısından destekleyici olabilir.\"},\n  {n:\"Demir\", dose:\"Kan tetkikine göre hekim tarafından belirlenir\", timing:\"Eksiklik saptanırsa\", note:\"Özellikle kadın dayanıklılık sporcularında demir eksikliği anemisi riski artmıştır; rutin değil, tetkik sonucuna göre kullanılmalıdır.\"},\n]},\n];\n\ndocument.getElementById('suppLists').innerHTML = suppGroups.map(g=>`\n  <div class=\"supp-group\">\n    <h4>${g.title}</h4>\n    <table class=\"supp-table\">\n      <tr><th>Takviye</th><th>Tipik Doz</th><th>Zamanlama</th><th>Not</th></tr>\n      ${g.items.map(i=>`<tr><td><b>${i.n}</b></td><td>${i.dose}</td><td>${i.timing}</td><td>${i.note}</td></tr>`).join('')}\n    </table>\n  </div>\n`).join('');\n\n// ---------- 7-DAY WEEKLY PLAN ----------\nconst days = [\"Pazartesi\",\"Salı\",\"Çarşamba\",\"Perşembe\",\"Cuma\",\"Cumartesi\",\"Pazar\"];\n\nconst weekPools = {\nendurance:{\n  breakfast:[\"Yulaf ezmesi + muz + bal + süt\",\"Tam tahıllı ekmek + fındık ezmesi + muz\",\"Yoğurt + granola + kuru meyve\",\"Omlet + tam tahıllı ekmek + portakal suyu\",\"Yulaf + kuru kayısı + ceviz\"],\n  pre:[\"Muz + hurma\",\"Kuru meyve karışımı (az)\",\"Bal + tam tahıllı kraker\",\"Elma + bir avuç kuru üzüm\",\"Enerji barı (düşük yağlı)\"],\n  post:[\"Whey protein + muz smoothie\",\"Çikolatalı süt (karbonhidrat:protein dengeli)\",\"Yoğurt + bal + meyve\",\"Whey protein + yulaf ezmesi\",\"Protein shake + hurma\"],\n  lunch:[\"Izgara tavuk, bulgur pilavı, sebze yemeği\",\"Fırında balık, pirinç pilavı, salata\",\"Etli sebze yemeği, bulgur, yoğurt\",\"Izgara hindi, makarna, sebze\",\"Somon, kinoa, közlenmiş sebze\"],\n  dinner:[\"Baklagil yemeği, tatlı patates, salata\",\"Izgara balık, patates, yeşil salata\",\"Tavuklu sebze sote, pirinç\",\"Mercimek yemeği, tam tahıllı ekmek, salata\",\"Etli sebze yemeği, bulgur pilavı\"]},\n\nstrength:{\n  breakfast:[\"Yumurta (3-4 adet) + tam tahıllı ekmek + avokado\",\"Omlet + peynir + tam tahıllı ekmek\",\"Yulaf + whey protein + fındık ezmesi\",\"Yumurta + peynir + zeytin + ekmek\",\"Süt + yulaf + muz + ceviz\"],\n  pre:[\"Tavuk göğsü + pirinç (orta miktarda)\",\"Hindi + bulgur pilavı\",\"Yumurta + tam tahıllı ekmek\",\"Balık + patates (küçük porsiyon)\",\"Protein shake + yulaf\"],\n  post:[\"Whey protein shake + muz\",\"Whey protein + yulaf ezmesi\",\"Süt + whey protein + bal\",\"Protein shake + hurma\",\"Whey protein + meyve\"],\n  lunch:[\"Kırmızı et, bulgur pilavı, bol sebze\",\"Izgara tavuk, pirinç pilavı, salata\",\"Balık, patates, sebze yemeği\",\"Etli nohut yemeği, salata\",\"Hindi, kinoa, közlenmiş sebze\"],\n  dinner:[\"Balık veya yumurta bazlı yemek, tatlı patates, salata\",\"Izgara tavuk, kinoa, sebze\",\"Kırmızı et, bulgur pilavı, yeşillik\",\"Somon, patates, brokoli\",\"Etli sebze yemeği, pirinç pilavı\"]},\n\nteam:{\n  breakfast:[\"Yulaf + süt + meyve\",\"Yumurta + tam tahıllı ekmek + peynir\",\"Omlet + sebze + ekmek\",\"Yoğurt + granola + muz\",\"Süt + yulaf + bal + ceviz\"],\n  pre:[\"Makarna + az yağlı tavuk (antrenmandan 3-4 saat önce)\",\"Pirinç + ızgara balık\",\"Bulgur pilavı + tavuk\",\"Patates + hindi\",\"Tam tahıllı ekmek + peynir + meyve\"],\n  post:[\"Whey protein + meyve + elektrolit içeceği\",\"Çikolatalı süt\",\"Whey protein + muz\",\"Yoğurt + bal + meyve\",\"Protein shake + hurma\"],\n  lunch:[\"Izgara tavuk, bulgur pilavı, sebze yemeği\",\"Balık, pirinç pilavı, salata\",\"Etli sebze yemeği, makarna\",\"Hindi, kinoa, sebze\",\"Köfte, patates, salata\"],\n  dinner:[\"Balık veya kırmızı et, patates/pirinç, salata\",\"Izgara tavuk, bulgur, sebze\",\"Etli sebze yemeği, pirinç\",\"Somon, kinoa, közlenmiş sebze\",\"Mercimek yemeği, tam tahıllı ekmek, salata\"]},\n};\n\n/* --- Haftalık menü çeşitlilik motoru (aynı ana besin haftaya yayılsın) --- */\nvar DP_SIG_MAP = [\n  ['uskumru','balık'],['sardalya','balık'],['levrek','balık'],['somon','balık'],['çipura','balık'],\n  ['ton balığı','balık'],['hamsi','balık'],['balık','balık'],['karides','deniz ürünü'],\n  ['hindi','hindi'],['tavuk','tavuk'],\n  ['köfte','kırmızı et'],['kıyma','kırmızı et'],['dana','kırmızı et'],['kuzu','kırmızı et'],\n  ['biftek','kırmızı et'],['etli','kırmızı et'],\n  ['mercimek','baklagil'],['nohut','baklagil'],['fasulye','baklagil'],['bezelye','baklagil'],['humus','baklagil'],\n  ['omlet','yumurta'],['menemen','yumurta'],['yumurta','yumurta'],\n  ['lor','süt ürünü'],['peynir','süt ürünü'],['yoğurt','süt ürünü'],['kefir','süt ürünü'],\n  ['ayran','süt ürünü'],['süt','süt ürünü'],\n  ['ceviz','kuruyemiş'],['badem','kuruyemiş'],['fındık','kuruyemiş'],['fıstık','kuruyemiş']\n];\nfunction dpMealSignature(t){\n  var low=(t||'').toLowerCase();\n  for(var i=0;i<DP_SIG_MAP.length;i++){ if(low.indexOf(DP_SIG_MAP[i][0])>-1) return DP_SIG_MAP[i][1]; }\n  return null;\n}\nfunction dpMealKey(t){\n  var s=(t||'').toLowerCase().replace(/[⏱🍲🔥]/g,'').replace(/\\([^)]*\\)/g,'').replace(/[^a-zçğıöşü ]/g,' ');\n  return s.split(/\\s+/).filter(function(w){ return w.length>2; }).sort();\n}\nfunction dpSimilar(a,b){\n  var A=dpMealKey(a), B=dpMealKey(b);\n  if(!A.length||!B.length) return 0;\n  var inter=A.filter(function(w){ return B.indexOf(w)>-1; }).length;\n  return inter/Math.max(A.length,B.length);\n}\nfunction dpNewWeekState(){ return {exact:{}, slot:{}, sig:{}}; }\nfunction dpPickVariedText(pool, startIdx, state, slotKey, conflictFn){\n  var usedSlot = state.slot[slotKey] || (state.slot[slotKey]=[]);\n  var sig = state.sig[slotKey] || (state.sig[slotKey]={});\n  var base = startIdx % pool.length;\n  var conflicts = conflictFn || function(){ return false; };\n  var naturalConflict = conflicts(pool[base]);\n  var best=null, bestIdx=base, bestScore=Infinity;\n  for(var i=0;i<pool.length;i++){\n    var idx=(startIdx+i)%pool.length, opt=pool[idx];\n    if(conflicts(opt)) continue;\n    if(state.exact[opt]) continue;\n    var near=0;\n    for(var j=0;j<usedSlot.length;j++){ if(dpSimilar(opt,usedSlot[j])>=0.6){ near=1; break; } }\n    var sg=dpMealSignature(opt), used=sg?(sig[sg]||0):0;\n    var score=near*100000 + used*1000 + i;\n    if(score<bestScore){ bestScore=score; best=opt; bestIdx=idx; }\n  }\n  if(best===null) return {text: pool[base], swapped:false};\n  state.exact[best]=1; usedSlot.push(best);\n  var bs=dpMealSignature(best); if(bs) sig[bs]=(sig[bs]||0)+1;\n  return {text:best, swapped:(best!==pool[base])&&naturalConflict};\n}\n\nfunction renderWeek(){\n  const sport = document.getElementById('sportType').value;\n  const pools = weekPools[sport];\n  let html = `<tr><th>Gün</th><th>Kahvaltı</th><th>Antrenman Öncesi</th><th>Antrenman Sonrası</th><th>Öğle Yemeği</th><th>Akşam Yemeği</th></tr>`;\n  const st = dpNewWeekState();\n  days.forEach((day,d)=>{\n    const b = dpPickVariedText(pools.breakfast, d+0, st, 'breakfast').text;\n    const pr = dpPickVariedText(pools.pre, d+1, st, 'pre').text;\n    const po = dpPickVariedText(pools.post, d+2, st, 'post').text;\n    const l = dpPickVariedText(pools.lunch, d+3, st, 'lunch').text;\n    const dn = dpPickVariedText(pools.dinner, d+4, st, 'dinner').text;\n    function withEmoji(t){ return (typeof dpFoodEmoji==='function' ? dpFoodEmoji(t)+' ' : '') + t; }\n    html += `<tr><td><b>${day}</b></td><td>${withEmoji(b)}</td><td>${withEmoji(pr)}</td><td>${withEmoji(po)}</td><td>${withEmoji(l)}</td><td>${withEmoji(dn)}</td></tr>`;\n  });\n  document.getElementById('weekTable').innerHTML = html;\n}\nrenderWeek();\nfunction dpPrintStyledSportWeek(){\n  var sport = document.getElementById('sportType').value;\n  var pools = weekPools[sport];\n  if(!pools) return;\n  var styledDays = days.map(function(day, d){\n    var b = pools.breakfast[(d+0)%pools.breakfast.length];\n    var pr = pools.pre[(d+1)%pools.pre.length];\n    var po = pools.post[(d+2)%pools.post.length];\n    var l = pools.lunch[(d+3)%pools.lunch.length];\n    var dn = pools.dinner[(d+4)%pools.dinner.length];\n    return {name: day, slots: [\n      {label:'Kahvaltı', text: b},\n      {label:'Antrenman Öncesi', text: pr},\n      {label:'Antrenman Sonrası', text: po},\n      {label:'Öğle Yemeği', text: l},\n      {label:'Akşam Yemeği', text: dn}\n    ]};\n  });\n  var sportSel = document.getElementById('sportType');\n  var sportTxt = (sportSel && sportSel.selectedIndex>=0 && sportSel.options[sportSel.selectedIndex]) ? sportSel.options[sportSel.selectedIndex].textContent : '';\n  var nameEl = document.getElementById('patientName');\n  dpOpenStyledPrint(styledDays, {\n    title: 'Haftalık Antrenman Beslenme Programı',\n    patientLabel: 'Sporcu',\n    patientName: (nameEl && nameEl.value.trim()) || '—',\n    sub: sportTxt\n  });\n}\n\n// ---------- MAÇ / YARIŞMA GÜNÜ ZAMAN ÇİZELGESİ ----------\nconst timelines = {\nendurance:[\n  {t:\"Antrenman/Yarıştan 3-4 Saat Önce\", a:\"Kompleks karbonhidrat ağırlıklı öğün + orta miktar protein (örn. yulaf, tavuk, muz)\"},\n  {t:\"1 Saat Önce\", a:\"Hafif, hızlı sindirilen karbonhidrat (muz, hurma) + su\"},\n  {t:\"Antrenman/Yarış Sırasında (60 dk üzeri)\", a:\"30-60 g/saat karbonhidrat (jel/spor içeceği) + düzenli sıvı\"},\n  {t:\"Bitişten Sonraki 30 Dk İçinde\", a:\"Karbonhidrat:protein ~3:1 oranında atıştırmalık (çikolatalı süt, smoothie)\"},\n  {t:\"2 Saat Sonra\", a:\"Dengeli ana öğün (protein + kompleks karbonhidrat + sebze)\"},\n],\nstrength:[\n  {t:\"Antrenmandan 2-3 Saat Önce\", a:\"Protein + orta miktar karbonhidrat içeren tam öğün\"},\n  {t:\"30-60 Dk Önce\", a:\"Hafif protein + az karbonhidrat atıştırmalık (isteğe bağlı kafein/kreatin)\"},\n  {t:\"Antrenman Sırasında\", a:\"Su (uzun süren seanslarda elektrolit)\"},\n  {t:\"Bitişten Sonraki 30-45 Dk İçinde\", a:\"20-40 g yüksek kaliteli protein (whey) + orta karbonhidrat\"},\n  {t:\"2-3 Saat Sonra\", a:\"Dengeli ana öğün\"},\n  {t:\"Yatmadan Önce\", a:\"Yavaş salınımlı protein (kazein, lor peyniri) — isteğe bağlı\"},\n],\nteam:[\n  {t:\"Maçtan 3-4 Saat Önce\", a:\"Yüksek karbonhidrat + orta protein içeren tam öğün (makarna/pirinç + az yağlı protein)\"},\n  {t:\"1-2 Saat Önce\", a:\"Hafif karbonhidrat ağırlıklı atıştırmalık + su\"},\n  {t:\"Maç Sırasında (devre arası dahil)\", a:\"Su/elektrolit içeceği, uzun maçlarda az miktarda karbonhidrat\"},\n  {t:\"Maçtan Sonraki 30 Dk İçinde\", a:\"Karbonhidrat:protein dengeli atıştırmalık + sıvı replasmanı\"},\n  {t:\"2 Saat Sonra\", a:\"Dengeli ana öğün + devam eden rehidrasyon\"},\n],\n};\n\nfunction renderTimeline(){\n  const sport = document.getElementById('sportType').value;\n  const rows = timelines[sport];\n  document.getElementById('timelineTable').innerHTML =\n    `<tr><th>Zaman</th><th>Öneri</th></tr>` +\n    rows.map(r=>`<tr><td><b>${r.t}</b></td><td>${r.a}</td></tr>`).join('');\n}\nrenderTimeline();\n\n// ---------- SIVI KAYBI HESAPLAYICI ----------\nfunction calcFluidLoss(){\n  const pre = parseFloat(document.getElementById('preWeight').value);\n  const post = parseFloat(document.getElementById('postWeight').value);\n  const during = parseFloat(document.getElementById('fluidDuring').value)||0;\n  if(!pre || !post){ alert('Lütfen antrenman öncesi ve sonrası kiloyu giriniz.'); return; }\n\n  const weightLossKg = pre-post;\n  const totalLossMl = Math.round(weightLossKg*1000 + during);\n  const lossPct = ((weightLossKg/pre)*100).toFixed(1);\n  const rehydrate = Math.round(totalLossMl*1.5);\n\n  document.getElementById('fluidLossVal').textContent = totalLossMl.toLocaleString('tr-TR');\n  document.getElementById('fluidLossPctVal').textContent = lossPct+'%';\n  document.getElementById('rehydrateVal').textContent = rehydrate.toLocaleString('tr-TR');\n\n  let note;\n  if(lossPct < 1) note = \"Sıvı kaybı düşük düzeyde; normal günlük sıvı alımı yeterli olabilir.\";\n  else if(lossPct < 2) note = \"Orta düzey sıvı kaybı; antrenman sonrası bilinçli rehidrasyon önerilir.\";\n  else note = \"Vücut ağırlığının %2'sinden fazla sıvı kaybı performansı olumsuz etkileyebilir; rehidrasyon planına ve antrenman yoğunluğuna dikkat edilmelidir.\";\n  document.getElementById('fluidNote').textContent = note;\n  document.getElementById('fluidResults').classList.add('show');\n}\n\n// ---------- YAZDIRILABİLİR RAPOR ----------\n(function(){\n  const today = new Date();\n  const dd=String(today.getDate()).padStart(2,'0');\n  const mm=String(today.getMonth()+1).padStart(2,'0');\n  const yyyy=today.getFullYear();\n  const el=document.getElementById('patientDate');\n  if(el) el.value = dd+'.'+mm+'.'+yyyy;\n})();\n\nconst REPORT_TITLE = \"Diyetisyen İlker — Sporcuya Özel Beslenme ve Takviye Programı\";\nconst REPORT_FILE  = \"beslenme-raporu-sporcu.html\";\nconst REPORT_WHO   = \"Sporcu\";\n\nfunction buildReportPayload(){\n  const nameEl=document.getElementById('patientName');\n  const dateEl=document.getElementById('patientDate');\n  const name=(nameEl&&nameEl.value.trim())||'—';\n  const date=(dateEl&&dateEl.value.trim())||'—';\n  const modeEl=document.querySelector('#modeToggle .mode-btn.active');\n  const modeTxt=modeEl?(' — '+modeEl.textContent.trim()):'';\n  const ph=document.getElementById('printHeader');\n  if(ph) ph.innerHTML='<b>'+REPORT_WHO+':</b> '+name+' &nbsp;&nbsp; <b>Tarih:</b> '+date+' &nbsp;&nbsp; <b>Rapor:</b> '+REPORT_TITLE+modeTxt;\n\n  // Girilen değerleri klonlamadan önce özniteliklere yaz (aksi halde klonda görünmez)\n  document.querySelectorAll('input').forEach(i=>i.setAttribute('value', i.value));\n  document.querySelectorAll('select').forEach(s=>{\n    Array.from(s.options).forEach(o=>o.removeAttribute('selected'));\n    if(s.selectedIndex>=0) s.options[s.selectedIndex].setAttribute('selected','selected');\n  });\n\n  const clone=document.body.cloneNode(true);\n  clone.querySelectorAll('script, button, .no-print').forEach(n=>n.remove());\n  clone.querySelectorAll('.toggle:not(.active), .mode-btn:not(.active), .dislike-chip:not(.active), .tag-btn:not(.active)').forEach(n=>n.remove());\n  clone.querySelectorAll('input').forEach(i=>{\n    const s=document.createElement('span'); s.className='pv';\n    s.textContent=i.getAttribute('value')||'—'; i.replaceWith(s);\n  });\n  clone.querySelectorAll('select').forEach(sel=>{\n    const o=sel.querySelector('option[selected]');\n    const s=document.createElement('span'); s.className='pv';\n    s.textContent=o?o.textContent:'—'; sel.replaceWith(s);\n  });\n\n  const css=Array.from(document.querySelectorAll('style')).map(s=>s.textContent).join('\\n')\n    + '\\n.pv{font-weight:600;} .print-only-header{display:block !important;}';\n  return {type:'nutriPrint', css:css, html:clone.innerHTML, title:REPORT_TITLE, filename:REPORT_FILE};\n}\n\nfunction reportDocHtml(p){\n  const extra='body{background:#fff;}'\n    +'header.hero{background:#fff !important;padding:0 0 14px !important;box-shadow:none !important;}'\n    +'header.hero::before,header.hero::after{display:none !important; Tek Tencere Etli Nohut Yemeği',it:[['et',0.7],['nohut',1],['domates',1]],\n      prep:'Eti tencerede kavurup domatesi ekleyin, haşlanmış nohudu ilave edip 20 dk kısık ateşte pişirin.'},\n  m73:{n:'🍲 Tek Tencere Mercimekli Bulgur Pilavı',it:[['mercimek',0.7],['bulgur',0.7]],\n      prep:'Mercimeği tencerede suyla 10 dk haşlayın, bulguru ekleyip 10 dk daha pişirin — tek kapta hazır.'},\n  m74:{n:'🍲 Tek Tencere Sebzeli Tavuk Sote',it:[['tavuk',1],['sebze',0.7]],\n      prep:'Tavuk ve doğranmış sebzeyi aynı tavada 15 dk birlikte soteleyin.'},\n  m75:{n:'🍲 Tek Tencere Balıklı Pirinç',it:[['balik',1],['pirinc',0.6],['sebze',0.5]],\n      prep:'Pirinç ve sebzeyi tencerede suyla pişirmeye başlayın, son 8 dk balığı üzerine ekleyip kapağı kapatarak buğulayın.'},\n  m76:{n:'🍲 Tek Tencere Nohutlu Ispanak Yemeği',it:[['nohut',1],['ispanak',1]],\n      prep:'Haşlanmış nohut ve ıspanağı aynı tencerede domates sosuyla 15 dk pişirin.'},\n  m77:{n:'🍲 Tek Tencere Fasulyeli Sebze Yemeği',it:[['fasulye',1],['sebze',0.7]],\n      prep:'Fasulye ve doğranmış sebzeyi aynı tencerede 20 dk birlikte pişirin.'},\n  m78:{n:'🍲 Tek Tencere Etli Bulgur Pilavı',it:[['et',0.7],['bulgur',0.7]],\n      prep:'Eti tencerede kavurun, su ekleyip kaynatın, bulguru ilave edip 15 dk pişirin.'},\n  m79:{n:'🍲 Tek Tencere Karidesli Pirinç',it:[['karides',1],['pirinc',0.6],['sebze',0.5]],\n      prep:'Pirinç ve sebzeyi tencerede pişirmeye başlayın, son 5 dk karidesleri ekleyip kapağı kapatın.'},\n  m80:{n:'🍲 Tek Tencere Kinoalı Sebze Yemeği',it:[['kinoa',0.7],['sebze',0.7]],\n      prep:'Kinoa ve doğranmış sebzeyi aynı tencerede suyla 15 dk birlikte pişirin.'},\n  m81:{n:'🍲 Tek Tencere Etli Sebze Çorbası',it:[['et',0.5],['sebze',1]],\n      prep:'Eti tencerede kavurup bol suyla sebzelerle birlikte 25 dk kaynatın.'},\n  m82:{n:'🍲 Tek Tencere Tavuklu Kinoa Pilavı',it:[['tavuk',1],['kinoa',0.6]],\n      prep:'Tavuğu tencerede kavurun, su ve kinoayı ekleyip 15 dk kısık ateşte pişirin.'},\n  m83:{n:'🍲 Tek Tencere Nohu '⏱ Hızlı Kuruyemiş Karışımı (1 dk)',it:[['findik',1],['kkayisi',1]],prep:'Fındık içi ve kuru kayısıyı bir kâseye koyup tüketin.'},\n  s32:{n:'⏱ Hızlı Yoğurt-Bal (2 dk)',it:[['yogurt',1],['bal',1]],prep:'Yoğurdu kâseye alıp üzerine bal gezdirin.'},\n  s33:{n:'⏱ Hızlı Salatalık-Peynir Çubukları (3 dk)',it:[['salatalik',1],['beyazpeynir',1]],prep:'Salatalığı çubuk şeklinde kesip peynirle birlikte tüketin.'},\n  s34:{n:'⏱ Hızlı Domates-Peynir (3 dk)',it:[['domates',1],['lor',1]],prep:'Domatesi dilimleyip lor peyniriyle birlikte tüketin.'},\n  s35:{n:'🔥 Fırında Elma Dilimleri (Tarçınlı)',it:[['elma',1]],prep:'Elma dilimlerini fırın tepsisine dizip az tarçın serpin. 180°C fırında 15 dk pişirin.'},\n  s36:{n:'🔥 Fırında Meyveli Yulaf Çubuğu',it:[['yulaf',1],['muz',0.5],['badem',1]],prep:'Yulaf, ezilmiş muz ve dövülmüş bademi karıştırıp tepsiye yayın. 170°C fırında 15-18 dk pişirip dilimleyin.'},\n\n  sp1:{n:'Antrenman Öncesi: Muz ve Hurma',it:[['muz',1],['hurma',1]],prep:'Antrenmandan 45-60 dk önce tüketin; hızlı sindirilen karbonhidrat sağlar.'},\n  sp2:{n:'Antrenman Sonrası: Whey ve Muz',it:[['whey',1],['muz',1]],prep:'Protein tozunu 250-300 ml su veya sütle çalkalayın, muzla birlikte antrenmandan sonraki 30-45 dk içinde tüketin.'},\n  sp3:{n:'Antrenman Öncesi: Tavuk ve Pirinç',it:[['tavuk',0.7],['pirinc',0.7]],prep:'Antrenmandan 2-3 saat önce tüketin; yavaş salınımlı enerji ve protein sağlar.'},\n  sp4:{n:'Antrenman Sonrası: Whey ve Yulaf',it:[['whey',1],['yulaf',0.7]],prep:'Yulafı sıcak suyla hazırlayıp protein tozunu ekleyin ve karıştırın.'},\n  sp5:{n:'Yatmadan Önce: Kazein',it:[['kazein',1],['sut',0.6]],prep:'Kazein tozunu 250 ml su veya sütle çalkalayarak yatmadan 30-60 dk önce için; gece boyu yavaş protein salınımı sağlar.'},\n  sp6:{n:'Antrenman Sonrası: Ballı Sütlü Shake',it:[['sut',1],['bal',1],['whey',0.5]],prep:'Süt, bal ve protein tozunu blenderdan geçirip antrenman sonrası tüketin.'}\n};\nconst DP_PLAN  = {\n  endurance:[['Kahvaltı',['b3','b10','b5','b4','b7']],['Antrenman Öncesi',['sp1','s3','s9','s5']],['Antrenman Sonrası',['sp2','sp6','sp4','s2']],['Öğle Yemeği',['m1','m2','m8','m11','m6']],['Akşam Yemeği',['m6','m13','m5','m2','m3']]],\n  strength:[['Kahvaltı',['b1','b2','b7','b6','b10']],['Antrenman Öncesi',['sp3','s4','s3','sp1']],['Antrenman Sonrası',['sp2','sp4','sp6','s2']],['Öğle Yemeği',['m3','m1','m6','m7','m11']],['Akşam Yemeği',['m6','m2','m3','m11','m7']],['Yatmadan Önce',['sp5']]],\n  team:[['Kahvaltı',['b3','b1','b4','b5','b10']],['Antrenman / Maç Öncesi',['sp3','sp1','s4','s7']],['Antrenman / Maç Sonrası',['sp2','sp6','sp4','s2']],['Öğle Yemeği',['m1','m2','m8','m7','m11']],['Akşam Yemeği',['m2','m6','m3','m7','m11']]]\n};\nconst DP_REF    = 2600;\nconst DP_FACTOR = 1;\nconst DP_FATPCT = 0.27;\nconst DP_DAYS = ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];\n\nfunction dpTarget(){\n  return (typeof lastCalc!=='undefined'&&lastCalc&&lastCalc.target)?lastCalc.target:2600;\n}\nfunction dpCondition(){\n  const el=document.getElementById('sportType');\n  return el?el.value:Object.keys(DP_PLAN)[0];\n}\nfunction dpProteinTarget(){\n  if(typeof lastCalc!=='undefined'&&lastCalc&&lastCalc.proteinG) return lastCalc.proteinG; var w=parseFloat((document.getElementById('weight')||{}).value); if(w>0) return w*1.8; return dpTarget()*0.25/4;\n}\nfunction dpScale(){\n  return DP_FACTOR;\n}\nfunction dpMealRaw(meal){\n  let k=0;\n  meal.it.forEach(function(pair){ k += DP_FOODS[pair[0]].k * pair[1]; });\n  return k;\n}\nfunction dpAmount(food, servings){\n  if(food.unit==='g'||food.unit==='ml'){\n    const v = Math.max(5, Math.round(food.g*servings/5)*5);\n    return v+' '+food.unit;\n  }\n  let n = Math.round(food.per*servings*2)/2;\n  if(n<0.5) n=0.5;\n  const gr = food.g? ' ('+Math.max(5,Math.round(food.g*servings/5)*5)+' g)' : '';\n  return n+' '+food.unit+gr;\n}\n// Öğün etiketine göre günün hedefinden ne kadar pay alacağını belirler.\n// Bilinmeyen bir etiket gelirse (ör. yeni bir yaşam tarzı öğünü) eşit pay verilir;\n// ağırlıklar her zaman normalize edilip toplamı 1'e getirilir.\nconst DP_MEAL_PCT = {\n  'Kahvaltı':0.25, 'Öğle Yemeği':0.30, 'Ara Öğün':0.15, 'Akşam Yemeği':0.30,\n  'Antrenman Öncesi':0.15, 'Antrenman Sonrası':0.15,\n  'Antrenman / Maç Öncesi':0.15, 'Antrenman / Maç Sonrası':0.15,\n  'Yatmadan Önce':0.08\n};\nfunction dpMealWeights(slots){\n  var raw = slots.map(function(slot){\n    var w = DP_MEAL_PCT[slot[0]];\n    return (w!==undefined) ? w : (1/slots.length);\n  });\n  var sum = raw.reduce(function(a,b){ return a+b; }, 0) || 1;\n  return raw.map(function(w){ return w/sum; });\n}\n\n// Tek bir öğün için protein/yağ/kalori hedeflerini birlikte karşılayan\n// ölçek katsayılarını çözer (protein-yoğun / yağ-yoğun / diğer besinler).\nfunction dpSolveMeal(pRaw, yRaw, dRaw, target, ptar, fatpct){\n  var ftar = target*fatpct/9;\n  var sp=1, sy=1, sd=1;\n  for(var it=0; it<12; it++){\n    var totP = pRaw.p*sp + yRaw.p*sy + dRaw.p*sd;\n    if(totP>0) sp = Math.max(0.4, Math.min(2.5, sp*(ptar/totP)));\n    var totF = pRaw.f*sp + yRaw.f*sy + dRaw.f*sd;\n    if(totF>0) sy = Math.max(0.25, Math.min(4.0, sy*(ftar/totF)));\n    var kWithoutD = pRaw.k*sp + yRaw.k*sy;\n    sd = dRaw.k>0 ? (target - kWithoutD)/dRaw.k : 1;\n    sd = Math.max(0.3, Math.min(4.0, sd||1));\n  }\n  return {sp:sp, sy:sy, sd:sd};\n}\n\nconst DP_DISLIKE_FOOD_IDS = {\n  yumurta:['yumurta'],\n  sut:['sut','lsut','yogurt','lyogurt','lakyogurt','kefir','ayran'],\n  peynir:['beyazpeynir','kasar','lor','keciPeyniri'],\n  tavuk:['tavuk','hindi','tavukbut'],\n  kirmizi_et:['et','kofte','danaeti','kuzu'],\n  balik:['balik','somon','ton','uskumru','karides','sardalya','levrek'],\n  baklagil:['mercimek','nohut','fasulye'],\n  elma:['elma'],\n  muz:['muz'],\n  kuruyemis:['ceviz','badem','findik','fistikezme'],\n  zeytin:['zeytin'],\n  bulgur:['bulgur'],\n  pirinc:['pirinc'],\n  domates:['domates'],\n  salatalik:['salatalik'],\n  ispanak:['ispanak'],\n  '__boğulma_riski__':['ceviz','badem','findik','kaju']\n};\nfunction dpIsYoungChild(){\n  var cAgeEl = (typeof document !== 'undefined') ? document.getElementById('cAge') : null;\n  if(!cAgeEl) return false;\n  var age = parseFloat(cAgeEl.value);\n  return !isNaN(age) && age <= 3;\n}\nfunction dpAllDislikeSets(){\n  var sets = [];\n  if(typeof disliked !== 'undefined' && disliked) sets.push(disliked);\n  if(typeof cDisliked !== 'undefined' && cDisliked) sets.push(cDisliked);\n  if(typeof bDisliked !== 'undefined' && bDisliked) sets.push(bDisliked);\n  if(dpIsYoungChild()) sets.push(['__boğulma_riski__']);\n  return sets;\n}\nfunction dpMealHasDislikedFood(meal){\n  var sets = dpAllDislikeSets();\n  for(var s=0; s<sets.length; s++){\n    for(const tag of sets[s]){\n      const ids = DP_DISLIKE_FOOD_IDS[tag] || [];\n      if(meal.it.some(function(pair){ return ids.indexOf(pair[0]) > -1; })) return true;\n    }\n  }\n  return false;\n}\nfunction dpPickMealId(pool, startIdx){\n  for(var i=0;i<pool.length;i++){\n    var id = pool[(startIdx+i)%pool.length];\n    var meal = DP_MEALS[id];\n    if(meal && !dpMealHasDislikedFood(meal)) return {id:id, swapped:i>0};\n  }\n  return {id: pool[startIdx%pool.length], swapped:false};\n}\nfunction dpMealCategory(meal){\n  if(!meal) return 'diger';\n  var ids = (meal.it||[]).map(function(p){ return String(p[0]).toLowerCase(); });\n  function has(list){ return ids.some(function(id){ return list.some(function(k){ return id.indexOf(k)>-1; }); }); }\n  if(has(['balik','somon','uskumru','sardalya','levrek','ton','karides','cipura','hamsi'])) return 'deniz';\n  if(has(['tavuk','hindi'])) return 'kumes';\n  if(has(['kuzu','dana','kiyma','kofte']) || ids.indexOf('et')>-1) return 'kirmizi';\n  if(has(['mercimek','nohut','fasulye','bezelye','tofu','humus'])) return 'baklagil';\n  if(has(['yumurta'])) return 'yumurta';\n  if(has(['yogurt','sut','peynir','lor','kefir','ayran'])) return 'sut';\n  return 'diger';\n}\n// Haftanın tamamını birden seçer: aynı tarif tekrar etmesin VE aynı protein\n// kategorisi (balık/tavuk/kırmızı et/baklagil...) haftaya yayılsın.\nfunction dpAssignWeekIds(pool, nDays, startIdx){\n  var picks=[], usedIds={}, catCount={};\n  for(var d=0; d<nDays; d++){\n    var natural = pool[(startIdx+d)%pool.length];\n    var naturalMeal = DP_MEALS[natural];\n    var naturalDisliked = naturalMeal ? dpMealHasDislikedFood(naturalMeal) : false;\n    var best=null, bestScore=Infinity;\n    for(var i=0;i<pool.length;i++){\n      var id = pool[(startIdx+d+i)%pool.length];\n      var meal = DP_MEALS[id];\n      if(!meal || dpMealHasDislikedFood(meal)) continue;\n      var cat = dpMealCategory(meal);\n      var score = (usedIds[id]?100000:0) + (catCount[cat]||0)*100 + i;\n      if(score < bestScore){ bestScore=score; best=id; }\n    }\n    if(best===null) best = natural;\n    usedIds[best]=1;\n    var bc = dpMealCategory(DP_MEALS[best]);\n    catCount[bc] = (catCount[bc]||0)+1;\n    picks.push({id:best, swapped: (best!==natural) && naturalDisliked});\n  }\n  return picks;\n}\nvar DP_WEEK_PICKS = null;\nfunction dpClassifyMealType(label){\n  var l = label.toLowerCase();\n  if(l.indexOf('kahvalt')>-1) return 'breakfast';\n  if(l.indexOf('ara öğün')>-1 || l.indexOf('ara sıcak')>-1 || l.indexOf('atıştırma')>-1) return 'snack';\n  if(l.indexOf('antrenman')>-1 || l.indexOf('maç')>-1) return 'workout';\n  if(l.indexOf('yatmadan')>-1) return 'bedtime';\n  if(l.indexOf('öğle')>-1 || l.indexOf('akşam')>-1 || l.indexOf('ana öğün')>-1) return 'main';\n  return 'other';\n}\nfunction dpMacroBarHtml(mp, mc, mf){\n  var pKcal = mp*4, cKcal = mc*4, fKcal = mf*9;\n  var total = Math.max(1, pKcal+cKcal+fKcal);\n  var pPct = (pKcal/total*100).toFixed(1), cPct = (cKcal/total*100).toFixed(1), fPct = (fKcal/total*100).toFixed(1);\n  return '<div class=\"macro-bar\" title=\"Protein '+pPct+'% · Karbonhidrat '+cPct+'% · Yağ '+fPct+'%\">'\n    + '<div class=\"macro-seg macro-p\" style=\"width:'+pPct+'%\"></div>'\n    + '<div class=\"macro-seg macro-c\" style=\"width:'+cPct+'%\"></div>'\n    + '<div class=\"macro-seg macro-f\" style=\"width:'+fPct+'%\"></div>'\n    + '</div>';\n}\nvar DP_FOOD_EMOJI = [\n  ['zeytinyağı','🫒'],['zeytin','🫒'],['yumurta','🥚'],['peynir','🧀'],\n  ['ekmek','🍞'],['lavaş','🫓'],['yufka','🫓'],['yulaf','🥣'],['granola','🥣'],\n  ['süt','🥛'],['yoğurt','🥣'],['kefir','🥛'],['ayran','🥛'],\n  ['tavuk','🍗'],['hindi','🍗'],['kuzu','🍖'],['kırmızı et','🥩'],['dana','🥩'],['köfte','🍖'],\n  ['karides','🦐'],['somon','🐟'],['ton balığı','🐟'],['uskumru','🐟'],['sardalya','🐟'],\n  ['levrek','🐟'],['çipura','🐟'],['balık','🐟'],['tofu','🌱'],\n  ['mercimek','🫘'],['nohut','🫘'],['fasulye','🫘'],['bezelye','🫘'],\n  ['bulgur','🌾'],['pirinç','🍚'],['makarna','🍝'],['erişte','🍝'],['kinoa','🌾'],\n  ['tatlı patates','🍠'],['patates','🥔'],['balkabağı','🎃'],\n  ['ıspanak','🥬'],['pazı','🥬'],['semizotu','🥬'],['brokoli','🥦'],['karnabahar','🥦'],\n  ['kabak','🥒'],['salatalık','🥒'],['biber','🫑'],['domates','🍅'],['havuç','🥕'],['mısır','🌽'],\n  ['salata','🥗'],['sebze','🥗'],['enginar','🌿'],['kuşkonmaz','🌿'],['pancar','🌿'],\n  ['elma','🍎'],['muz','🍌'],['portakal','🍊'],['mandalina','🍊'],['greyfurt','🍊'],\n  ['çilek','🍓'],['armut','🍐'],['ayva','🍐'],['kayısı','🍑'],['şeftali','🍑'],['erik','🍑'],\n  ['hurma','🌴'],['üzüm','🍇'],['kiraz','🍒'],['vişne','🍒'],['nar','🔴'],['kivi','🥝'],\n  ['yaban mersini','🫐'],['böğürtlen','🫐'],['ahududu','🫐'],['incir','🟣'],\n  ['karpuz','🍉'],['kavun','🍈'],['tereyağı','🧈'],\n  ['ceviz','🌰'],['badem','🌰'],['fındık','🌰'],['kaju','🌰'],['fıstık','🥜'],['tahin','🥜'],\n  ['avokado','🥑'],['keten tohumu','🌾'],['chia','🌾'],['bal','🍯'],['reçel','🍯']\n];\nfunction dpFoodEmoji(name){\n  if(!DP_FOOD_EMOJI || !name) return '🍽️';\n  var lower = name.toLowerCase();\n  for(var i=0;i<DP_FOOD_EMOJI.length;i++){\n    if(lower.indexOf(DP_FOOD_EMOJI[i][0]) > -1) return DP_FOOD_EMOJI[i][1];\n  }\n  return '🍽️';\n}\n\nfunction dpBuildDaySlots(slots, offset, target, ptar, fatpct, scale){\n  var weights = dpMealWeights(slots);\n  let dk=0,dp=0,dc=0,df=0, meals='';
