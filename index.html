if(!key) return;\n  var sel=document.getElementById(DP_COND_ID);\n  if(!sel) return;\n  sel.value=key;\n  if(typeof renderMenu==='function') renderMenu();\n  if(typeof renderWeek==='function') renderWeek();\n  if(typeof dpRenderPlan==='function') dpRenderPlan();\n  sel.scrollIntoView({behavior:'smooth',block:'center'});\n}\n\nfunction dpRenderLabs(){\n  var g=(typeof gender!=='undefined')?gender:'male';\n  var rows='', criticals=[];\n  DP_LABS.forEach(function(m){\n    var el=document.getElementById('lab_'+m.id);\n    if(!el) return;\n    var raw=el.value;\n    if(raw===''||raw===null||typeof raw==='undefined') return;\n    var val=parseFloat(raw);\n    if(isNaN(val)) return;\n    var rg = g==='male'?m.rangeM:m.rangeF;\n    var lo=rg[0], hi=rg[1];\n    var status = val<lo?'Düşük':(val>hi?'Yüksek':'Normal');\n    var badgeClass = status==='Normal'?'lab-ok':(status==='Düşük'?'lab-low':'lab-high');\n    var advice = status==='Düşük' ? (m.lowAdv||'Bu yönde özel bir beslenme önerisi yoktur; hekiminize danışın.')\n               : status==='Yüksek' ? (m.highAdv||'Bu yönde özel bir beslenme önerisi yoktur; hekiminize danışın.')\n               : '—';\n    var linkKey = status==='Düşük'?m.linkLow:(status==='Yüksek'?m.linkHigh:null);\n    var linkHtml = linkKey ? ' <span class=\"lab-link\" onclick=\"dpJumpToCondition(\\''+linkKey+'\\')\">→ İlgili menüyü göster</span>' : '';\n    if(m.crit && (val<=m.crit[0] || val>=m.crit[1])){\n      criticals.push(m.label+' ('+val+' '+m.unit+')');\n    }\n    rows += '<tr><td>'+m.label+'</td><td>'+val+' '+m.unit+'</td><td>'+lo+'–'+hi+' '+m.unit+'</td>'\n          + '<td><span class=\"lab-badge '+badgeClass+'\">'+status+'</span></td>'\n          + '<td>'+advice+linkHtml+'</td></tr>';\n  });\n\n  var host=document.getElementById('labResults');\n  if(!rows){ host.innerHTML='<p style=\"font-size:13px;color:#6B6455;\">Değerlendirme için en az bir laboratuvar değeri giriniz.</p>'; return; }\n\n  var critBanner='';\n  if(criticals.length){\n    critBanner = '<div class=\"lab-critical\">⚠️ <b>Girilen değerlerden bazıları acil tıbbi değerlendirme gerektirebilecek düzeyde:</b> '\n      + criticals.join(', ') + '. Bu bir tanı değildir; lütfen en kısa sürede hekiminize veya en yakın sağlık kuruluşuna başvurun.</div>';\n  }\n\n  host.innerHTML = critBanner\n    + '<table class=\"exchange-table\"><tr><th>Parametre</th><th>Girilen Değer</th><th>Referans Aralığı</th><th>Durum</th><th>Beslenme Notu</th></tr>'\n    + rows + '</table>'\n    + '<p style=\"font-size:11.5px;color:#6B6455;margin-top:12px;\">Referans aralıkları genel/tipik değerlerdir; laboratuvarınızın kendi cihaz ve yöntemine göre küçük farklılıklar olabilir — kendi laboratuvar raporunuzdaki aralığı esas alın. Bu değerlendirme tanı veya tedavi yerine geçmez; sonuçları her durumda hekiminizle birlikte yorumlayın.</p>';\n}\n\nfunction dpClearLabs(){\n  DP_LABS.forEach(function(m){ var el=document.getElementById('lab_'+m.id); if(el) el.value=''; });\n  var host=document.getElementById('labResults'); if(host) host.innerHTML='';\n}\n\n// ================= TOPLU GİRİŞ: METİNDEN LAB DEĞERLERİ AYIRMA =================\nconst DP_LAB_ALIASES = {\n  hba1c:['hba1c','a1c'],\n  ldl:['ldl'],\n  hdl:['hdl'],\n  tchol:['total kolesterol','t.kolesterol'],\n  hb:['hemoglobin','hgb'],\n  ferritin:['ferritin'],\n  b12:['vitamin b12','vit b12','cobalamin','b12'],\n  folate:['folik asit','folat','folate'],\n  vitd:['25-oh vitamin d','25(oh)d','vitamin d','vit d','d vitamini'],\n  tsh:['tsh'],\n  glucose:['açlık kan şekeri','kan şekeri','glukoz','glucose'],\n  tg:['trigliserit','trigliserid'],\n  k:['potasyum'],\n  na:['sodyum'],\n  ca:['kalsiyum'],\n  albumin:['albümin','albumin'],\n  creatinine:['kreatinin','creatinine'],\n  crp:['crp'],\n  uricacid:['ürik asit','uric acid']\n};\nconst DP_LAB_PRIORITY = ['hba1c','ldl','hdl','tchol','hb','ferritin','b12','folate','vitd','tsh','glucose','tg','k','na','ca','albumin','creatinine','crp','uricacid'];\n\nfunction dpParseLabBulkText(){\n  var textarea = document.getElementById('labBulkInput');\n  var resultHost = document.getElementById('labBulkResult');\n  if(!textarea || !resultHost) return;\n  var lines = textarea.value.split('\\n');\n  var matched = [], unmatched = [];\n\n  lines.forEach(function(line){\n    var trimmed = line.trim();\n    if(!trimmed) return;\n    var numMatches = trimmed.match(/-?[0-9]+[.,]?[0-9]*/g);\n    if(!numMatches || !numMatches.length){ unmatched.push(trimmed); return; }\n    var num = parseFloat(numMatches[numMatches.length-1].replace(',','.'));\n    var lower = trimmed.toLowerCase();\n\n    var foundId = null;\n    for(var i=0;i<DP_LAB_PRIORITY.length;i++){\n      var id = DP_LAB_PRIORITY[i];\n      var aliases = DP_LAB_ALIASES[id] || [];\n      if(aliases.some(function(a){ return lower.indexOf(a) > -1; })){ foundId = id; break; }\n    }\n    if(foundId){\n      var el = document.getElementById('lab_'+foundId);\n      if(el){\n        el.value = num;\n        var labInfo = DP_LABS.filter(function(l){ return l.id===foundId; })[0];\n        matched.push((labInfo?labInfo.label:foundId)+': '+num);\n      }\n    } else {\n      unmatched.push(trimmed);\n    }\n  });\n\n  var html = '';\n  if(matched.length) html += '<div class=\"dp-prep\" style=\"margin-bottom:8px;\"><b>✔ Alanlara dağıtıldı ('+matched.length+'):</b> '+matched.join(', ')+'</div>';\n  if(unmatched.length) html += '<div class=\"dp-prep\" style=\"background:#F5E1DC;\"><b>⚠ Tanınamayan satırlar (yukarıdaki ilgili alana elle girin):</b> '+unmatched.join(' &nbsp;|&nbsp; ')+'</div>';\n  if(!matched.length && !unmatched.length) html = '<p style=\"font-size:13px;color:#6B6455;\">Lütfen kutuya en az bir satır yapıştırın.</p>';\n  resultHost.innerHTML = html;\n}\n\n// ================= LAB SONUCU FOTOĞRAFI (yalnızca referans, otomatik okuma yok) =================\nlet dpLabPhotoDataUrl = null;\nfunction dpHandleLabPhoto(event){\n  var file = event.target.files && event.target.files[0];\n  if(!file) return;\n  var reader = new FileReader();\n  reader.onload = function(e){\n    dpLabPhotoDataUrl = e.target.result;\n    dpRenderLabPhotoPreview();\n  };\n  reader.readAsDataURL(file);\n}\nfunction dpRenderLabPhotoPreview(){\n  var host = document.getElementById('labPhotoPreview');\n  if(!host) return;\n  if(!dpLabPhotoDataUrl){ host.innerHTML = ''; return; }\n  host.innerHTML = '<img src=\"'+dpLabPhotoDataUrl+'\" style=\"max-width:100%;max-height:320px;border-radius:4px;border:1px solid var(--dp-line,#D8CFB6);display:block;\">'\n    + '<button class=\"btn-primary no-print\" style=\"margin-top:8px;background:transparent;border:1px solid currentColor;\" onclick=\"dpClearLabPhoto()\">Fotoğrafı Kaldır</button>';\n}\nfunction dpClearLabPhoto(){\n  dpLabPhotoDataUrl = null;\n  var input = document.getElementById('labPhotoInput');\n  if(input) input.value = '';\n  dpRenderLabPhotoPreview();\n}\n\n\n// ================= TARİFLER / YEMEK TARİFLERİ =================\nconst DP_MEAT_FISH_IDS = ['tavuk','hindi','et','kofte','balik','somon','ton','hindi','kuzu','dana','sucuk','sosis','pastirma','jambon','tavukbut','tavukkanat'];\nconst DP_DAIRY_IDS = ['sut','yogurt','lyogurt','kefir','ayran','beyazpeynir','kasar','lor','tereyagi','krema','sutlu'];\nconst DP_EGG_IDS = ['yumurta'];\nconst DP_GLUTEN_IDS = ['ekmek','bulgur','makarna','granola','yulaf','un','erişte','şehriye','sehriye'];\nconst DP_HONEY_IDS = ['bal'];\nfunction dpMealDietTags(meal){\n  var hasMeatFish=false, hasDairy=false, hasEgg=false, hasGluten=false, hasHoney=false;\n  meal.it.forEach(function(pair){\n    var id = pair[0];\n    if(DP_MEAT_FISH_IDS.indexOf(id)>-1) hasMeatFish=true;\n    if(DP_DAIRY_IDS.indexOf(id)>-1) hasDairy=true;\n    if(DP_EGG_IDS.indexOf(id)>-1) hasEgg=true;\n    if(DP_GLUTEN_IDS.indexOf(id)>-1) hasGluten=true;\n    if(DP_HONEY_IDS.indexOf(id)>-1) hasHoney=true;\n  });\n  return { vejetaryen: !hasMeatFish, vegan: !hasMeatFish && !hasDairy && !hasEgg && !hasHoney, glutensiz: !hasGluten };\n}\nfunction dpMealMacros(meal){\n  var k=0,p=0,c=0,f=0;\n  meal.it.forEach(function(pair){ var F=DP_FOODS[pair[0]], q=pair[1]; k+=F.k*q; p+=F.p*q; c+=F.c*q; f+=F.f*q; });\n  return {k:k,p:p,c:c,f:f};\n}\nfunction dpCollectMealIds(){\n  var set={};\n  Object.keys(DP_PLAN).forEach(function(cond){\n    DP_PLAN[cond].forEach(function(slot){ slot[1].forEach(function(id){ set[id]=true; }); });\n  });\n  if(typeof DP_LIFESTYLE!=='undefined'){\n    Object.keys(DP_LIFESTYLE).forEach(function(key){\n      DP_LIFESTYLE[key].slots.forEach(function(slot){ slot[1].forEach(function(id){ set[id]=true; }); });\n    });\n  }\n  return Object.keys(set);\n}\nfunction dpGroupLabel(id){\n  if(id.indexOf('sp')===0) return 'Sporcu Antrenman Tarifleri';\n  if(id.indexOf('l')===0) return 'Yaşam Tarzına Özel Tarifler';\n  if(id.indexOf('b')===0) return 'Kahvaltı Tarifleri';\n  if(id.indexOf('m')===0) return 'Ana Öğün Tarifleri';\n  if(id.indexOf('s')===0) return 'Ara Öğün Tarifleri';\n  return 'Diğer';\n}\nfunction dpRenderRecipes(){\n  var ids=Object.keys(DP_MEALS);\n  var groups={};\n  ids.forEach(function(id){\n    var meal=DP_MEALS[id]; if(!meal) return;\n    var g=dpGroupLabel(id);\n    if(!groups[g]) groups[g]=[];\n    groups[g].push(id);\n  });\n  var order=['Kahvaltı Tarifleri','Ana Öğün Tarifleri','Ara Öğün Tarifleri','Sporcu Antrenman Tarifleri','Yaşam Tarzına Özel Tarifler','Diğer'];\n  var html='';\n  order.forEach(function(g){\n    if(!groups[g]||!groups[g].length) return;\n    html+='<h4 class=\"recipe-group-title\">'+g+'</h4>';\n    groups[g].sort(function(a,b){ return DP_MEALS[a].n.localeCompare(DP_MEALS[b].n,'tr'); });\n    groups[g].forEach(function(id){\n      var meal=DP_MEALS[id];\n      var mm=dpMealMacros(meal);\n      var tags=dpMealDietTags(meal);\n      var ingredRows=meal.it.map(function(pair){\n        var F=DP_FOODS[pair[0]];\n        return '<li>'+F.n+' — '+dpAmount(F,pair[1])+'</li>';\n      }).join('');\n      var badgeHtml = (tags.vejetaryen?'<span class=\"diet-badge\">🌱 Vejetaryen'+(tags.vegan?' (Vegan)':'')+'</span>':'')\n        + (tags.glutensiz?'<span class=\"diet-badge\">🌾 Glutensiz</span>':'');\n      html+='<div class=\"recipe-card\" data-name=\"'+meal.n.toLowerCase()+'\" data-kcal=\"'+Math.round(mm.k)+'\" data-protein=\"'+mm.p.toFixed(1)+'\" data-veg=\"'+(tags.vejetaryen?1:0)+'\" data-gf=\"'+(tags.glutensiz?1:0)+'\">'\n        +'<div class=\"recipe-name\">'+meal.n+'</div>'\n        +(badgeHtml?'<div style=\"margin:4px 0 8px;\">'+badgeHtml+'</div>':'')\n        +'<div class=\"recipe-macro\">Yaklaşık (belirtilen ölçüyle): '+Math.round(mm.k)+' kcal · KH '+mm.c.toFixed(1)+' g · Protein '+mm.p.toFixed(1)+' g · Yağ '+mm.f.toFixed(1)+' g</div>'\n        +'<ul class=\"recipe-ingr\">'+ingredRows+'</ul>'\n        +'<div class=\"dp-prep\"><b>Hazırlanışı:</b> '+meal.prep+'</div>'\n        +'</div>';\n    });\n  });\n  var host=document.getElementById('recipeList');\n  if(host) host.innerHTML = html || '<p>Tarif bulunamadı.</p>';\n}\nfunction dpFilterRecipes(){\n  var q=(document.getElementById('recipeSearch').value||'').toLowerCase();\n  var maxKcalEl = document.getElementById('recipeMaxKcal');\n  var minProtEl = document.getElementById('recipeMinProtein');\n  var vegEl = document.getElementById('recipeVegOnly');\n  var gfEl = document.getElementById('recipeGfOnly');\n  var maxKcal = maxKcalEl && maxKcalEl.value !== '' ? parseFloat(maxKcalEl.value) : null;\n  var minProt = minProtEl && minProtEl.value !== '' ? parseFloat(minProtEl.value) : null;\n  var vegOnly = vegEl && vegEl.checked;\n  var gfOnly = gfEl && gfEl.checked;\n  document.querySelectorAll('#recipeList .recipe-card').forEach(function(card){\n    var nameOk = card.getAttribute('data-name').indexOf(q) > -1;\n    var kcalOk = maxKcal===null || parseFloat(card.getAttribute('data-kcal')) <= maxKcal;\n    var protOk = minProt===null || parseFloat(card.getAttribute('data-protein')) >= minProt;\n    var vegOk = !vegOnly || card.getAttribute('data-veg')==='1';\n    var gfOk = !gfOnly || card.getAttribute('data-gf')==='1';\n    card.style.display = (nameOk && kcalOk && protOk && vegOk && gfOk) ? '' : 'none';\n  });\n  // Boş kalan grup başlıklarını da gizle\n  document.querySelectorAll('#recipeList .recipe-group-title').forEach(function(title){\n    var next = title.nextElementSibling;\n    var anyVisible = false;\n    while(next && !next.classList.contains('recipe-group-title')){\n      if(next.classList.contains('recipe-card') && next.style.display !== 'none'){ anyVisible = true; break; }\n      next = next.nextElementSibling;\n    }\n    title.style.display = anyVisible ? '' : 'none';\n  });\n}\nfunction dpPrintRecipes(){\n  var host = document.getElementById('recipeList');\n  if(!host || !host.innerHTML.trim()){ if(typeof dpRenderRecipes==='function') dpRenderRecipes(); }\n  var cards = Array.prototype.slice.call(host.querySelectorAll('.recipe-card')).filter(function(c){\n    return c.style.display !== 'none';\n  });\n  if(!cards.length){ alert('Yazdırılacak tarif bulunamadı — önce filtreleri gözden geçirin.'); return; }\n\n  var groupsHtml = '';\n  var currentGroup = null;\n  cards.forEach(function(c){\n    var h4 = c;\n    while(h4 && h4.tagName !== 'H4'){ h4 = h4.previousElementSibling; if(!h4) break; }\n    var groupName = h4 ? h4.textContent : null;\n    if(groupName && groupName !== currentGroup){\n      groupsHtml += '<h4 class=\"recipe-group-title\">'+groupName+'</h4>';\n      currentGroup = groupName;\n    }\n    groupsHtml += c.outerHTML;\n  });\n\n  var css = Array.from(document.querySelectorAll('style')).map(function(s){return s.textContent;}).join('\\n')\n    + '.dp-report-head{border-bottom:2px solid #1E3F3A;padding-bottom:10px;margin-bottom:22px;}'\n    + '.dp-rh-title{font-family:Fraunces,serif;font-size:24px;font-weight:600;margin-bottom:6px;}'\n    + '.dp-rh-meta{font-size:13px;color:#6B6455;}'\n    + 'body{background:#fff;padding:24px;font-family:Inter,sans-serif;}'\n    + '.recipe-card{margin-bottom:18px;}'\n    + '.recipe-name{font-size:16px;}'\n    + '.recipe-ingr{font-size:14px;}'\n    + '.dp-prep{font-size:13.5px;line-height:1.5;}';\n\n  var bigLogo = (typeof dpSealSvg === 'function') ? dpSealSvg('#2F9E8F', 88) : '';\n  var head = '<div class=\"dp-report-head\" style=\"text-align:center;\">'\n    + (bigLogo ? '<div style=\"margin-bottom:8px;\">'+bigLogo+'</div>' : '')\n    + '<div class=\"dp-rh-title\">Diyetisyen İlker Yelkencioğlu</div>'\n    + '<div style=\"font-family:Fraunces,serif;font-size:11.5px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:#8A8062;margin:5px 0 8px;\">Beslenmenin Yeni Dili</div>'\n    + '<div style=\"font-family:Fraunces,serif;font-size:15px;color:#3F6B4A;\">Tarifler</div>'\n    + '<div class=\"dp-rh-meta\">'+cards.length+' tarif &nbsp;·&nbsp; '+new Date().toLocaleDateString('tr-TR')+'</div></div>';\n\n  var w = window.open('', '_blank');\n  var fullHtml = '<!DOCTYPE html><html lang=\"tr\"><head><meta charset=\"UTF-8\"><title>Diyetisyen İlker — Tarifler</title>'\n    + '<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@500&display=swap\" rel=\"stylesheet\">'\n    + '<style>'+css+'<\/style></head><body>'+head+groupsHtml+'</body></html>';\n  if(!w){\n    var blob = new Blob([fullHtml], {type:'text/html'});\n    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'tarifler.html'; a.click();\n    return;\n  }\n  w.document.write(fullHtml);\n  w.document.close();\n  setTimeout(function(){ w.focus(); w.print(); }, 600);\n}\ndpRenderRecipes();\n\n\n// ================= ENTER İLE HESAPLAMA (klavye dostu kullanım) =================\ndocument.addEventListener('keydown', function(e){\n  if(e.key !== 'Enter') return;\n  var t = e.target;\n  if(!t || t.tagName !== 'INPUT' || t.type !== 'number') return;\n  var card = t.closest('.card');\n  if(!card) return;\n  var btn = card.querySelector('.btn-primary');\n  if(btn){ e.preventDefault(); btn.click(); }\n});\n\n\n// ================= DANIŞAN LİSTESİ (OTURUM İÇİ) =================\nconst CLIENT_FIELD_IDS = [\"age\",\"height\",\"weight\",\"activity\",\"goal\",\"condition\",\"menuGender\"];\nconst CLIENT_GENDER_TOGGLES = [\"genderToggle\"];\nlet dpClients = [];\n\nfunction dpGetActiveToggleVal(containerId){\n  var el = document.querySelector('#'+containerId+' .toggle.active');\n  return el ? el.getAttribute('data-val') : null;\n}\nfunction dpSetToggleVal(containerId, val){\n  if(!val) return;\n  var el = document.querySelector('#'+containerId+' .toggle[data-val=\"'+val+'\"]');\n  if(el) el.click();\n}\nfunction dpRefreshAll(){\n  try{ if(typeof calculate==='function') calculate(); }catch(e){}\n  try{ if(typeof calcBebek==='function') calcBebek(); }catch(e){}\n  try{ if(typeof calcCocuk==='function') calcCocuk(); }catch(e){}\n  try{ if(typeof renderMenu==='function') renderMenu(); }catch(e){}\n  try{ if(typeof renderWeek==='function') renderWeek(); }catch(e){}\n  try{ if(typeof renderCocukMenu==='function') renderCocukMenu(); }catch(e){}\n  try{ if(typeof renderCocukWeek==='function') renderCocukWeek(); }catch(e){}\n  try{ if(typeof renderPlan==='function') renderPlan(); }catch(e){}\n  try{ if(typeof dpRenderPlan==='function') dpRenderPlan(); }catch(e){}\n}\n\nfunction dpBuildPlanSummary(){\n  try{\n    var condSel = (typeof DP_COND_ID!=='undefined') ? document.getElementById(DP_COND_ID) : null;\n    var condTxt = (condSel && condSel.selectedIndex>=0) ? condSel.options[condSel.selectedIndex].textContent : '';\n    var target = (typeof dpTarget==='function') ? Math.round(dpTarget()) : null;\n    var ptar = (typeof dpProteinTarget==='function') ? Math.round(dpProteinTarget()) : null;\n    var parts = [];\n    if(condTxt) parts.push(condTxt);\n    if(target) parts.push('~'+target+' kcal');\n    if(ptar) parts.push('protein ~'+ptar+' g');\n    return parts.join(' · ');\n  }catch(e){ return ''; }\n}\nfunction dpSaveClient(){\n  var nameEl = document.getElementById('patientName');\n  var name = nameEl ? nameEl.value.trim() : '';\n  if(!name){ alert('Lütfen önce üstteki \"Danışan Adı Soyadı\" alanını doldurun.'); return; }\n  var record = { name:name, date:(document.getElementById('patientDate')||{}).value||'',\n                 savedAt:new Date().toLocaleString('tr-TR'), fields:{}, toggles:{},\n                 planSummary: dpBuildPlanSummary(),\n                 disliked: (typeof disliked!=='undefined' && disliked) ? Array.from(disliked) : [],\n                 trackData: (typeof dpTrackData!=='undefined' && dpTrackData) ? JSON.parse(JSON.stringify(dpTrackData)) : [],\n                 goalHistory: (typeof dpGoalHistory!=='undefined' && dpGoalHistory) ? JSON.parse(JSON.stringify(dpGoalHistory)) : [],\n                 extTrackData: (typeof dpExtTrackData!=='undefined' && dpExtTrackData) ? JSON.parse(JSON.stringify(dpExtTrackData)) : null,\n                 reflections: (typeof dpReflections!=='undefined' && dpReflections) ? JSON.parse(JSON.stringify(dpReflections)) : [],\n                 labPhoto: (typeof dpLabPhotoDataUrl!=='undefined') ? dpLabPhotoDataUrl : null\n               };\n  CLIENT_FIELD_IDS.forEach(function(id){ var el=document.getElementById(id); if(el) record.fields[id]=el.value; });\n  CLIENT_GENDER_TOGGLES.forEach(function(cid){ record.toggles[cid]=dpGetActiveToggleVal(cid); });\n  dpClients.push(record);\n  dpRenderClientList();\n}\nfunction dpLoadClient(idx){\n  var r = dpClients[idx]; if(!r) return;\n  if(document.getElementById('patientName')) document.getElementById('patientName').value = r.name;\n  if(document.getElementById('patientDate')) document.getElementById('patientDate').value = r.date;\n  Object.keys(r.fields).forEach(function(id){ var el=document.getElementById(id); if(el) el.value = r.fields[id]; });\n  Object.keys(r.toggles).forEach(function(cid){ dpSetToggleVal(cid, r.toggles[cid]); });\n\n  if(typeof disliked!=='undefined' && disliked){\n    disliked.clear();\n    (r.disliked||[]).forEach(function(tag){ disliked.add(tag); });\n    document.querySelectorAll('.dislike-chip').forEach(function(chip){\n      var tag = chip.getAttribute('data-tag');\n      if(disliked.has(tag)) chip.classList.add('active'); else chip.classList.remove('active');\n    });\n  }\n  if(typeof dpTrackData!=='undefined' && dpTrackData){\n    dpTrackData.length = 0;\n    (r.trackData||[]).forEach(function(d){ dpTrackData.push(d); });\n    if(typeof dpRenderTrackTable==='function') dpRenderTrackTable();\n    if(typeof dpDrawTrackChart==='function') dpDrawTrackChart();\n  }\n  if(typeof dpGoalHistory!=='undefined' && dpGoalHistory){\n    dpGoalHistory.length = 0;\n    (r.goalHistory||[]).forEach(function(d){ dpGoalHistory.push(d); });\n    if(typeof dpRenderGoalHistory==='function') dpRenderGoalHistory();\n  }\n  if(typeof dpExtTrackData!=='undefined' && dpExtTrackData && r.extTrackData){\n    Object.keys(r.extTrackData).forEach(function(k){ if(dpExtTrackData[k]!==undefined) dpExtTrackData[k] = r.extTrackData[k]; });\n    if(typeof dpExtDrawChart==='function') dpExtDrawChart();\n    if(typeof dpExtRenderTable==='function') dpExtRenderTable();\n  }\n  if(typeof dpReflections!=='undefined' && dpReflections){\n    dpReflections.length = 0;\n    (r.reflections||[]).forEach(function(d){ dpReflections.push(d); });\n    if(typeof dpRenderReflections==='function') dpRenderReflections();\n  }\n  if(typeof dpLabPhotoDataUrl!=='undefined'){\n    dpLabPhotoDataUrl = r.labPhoto || null;\n    if(typeof dpRenderLabPhotoPreview==='function') dpRenderLabPhotoPreview();\n  }\n\n  dpRefreshAll();\n}\nfunction dpDeleteClient(idx){ dpClients.splice(idx,1); dpRenderClientList(); }\nfunction dpRenderClientList(){\n  var host = document.getElementById('clientList'); if(!host) return;\n  if(!dpClients.length){ host.innerHTML='<p style=\"font-size:13px;color:#6B6455;\">Henüz danışan eklenmedi.</p>'; return; }\n  var rows = dpClients.map(function(r,i){\n    return '<tr><td>'+r.name+'</td><td>'+(r.date||'—')+'</td><td>'+(r.planSummary||'—')+'</td><td>'+r.savedAt+'</td>'\n      +'<td><span style=\"cursor:pointer;color:var(--dp-head,#1E3F3A);text-decoration:underline;margin-right:14px;\" onclick=\"dpLoadClient('+i+')\">Yükle</span>'\n      +'<span style=\"cursor:pointer;color:#A5452F;text-decoration:underline;\" onclick=\"dpDeleteClient('+i+')\">Sil</span></td></tr>';\n  }).join('');\n  host.innerHTML = '<table class=\"exchange-table\"><tr><th>Ad Soyad</th><th>Tarih</th><th>Program (Arşiv)</th><th>Kaydedilme</th><th></th></tr>'+rows+'</table>';\n}\nfunction dpExportClients(){\n  var blob = new Blob([JSON.stringify(dpClients,null,2)], {type:'application/json'});\n  var url = URL.createObjectURL(blob);\n  var a = document.createElement('a'); a.href=url; a.download='danisan-listesi.json';\n  document.body.appendChild(a); a.click();\n  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1000);\n}\nfunction dpImportClients(file){\n  if(!file) return;\n  var reader = new FileReader();\n  reader.onload = function(e){\n    try{\n      var data = JSON.parse(e.target.result);\n      if(Array.isArray(data)){ dpClients = dpClients.concat(data); dpRenderClientList(); }\n      else alert('Geçersiz dosya formatı.');\n    }catch(err){ alert('Dosya okunamadı: '+err.message); }\n  };\n  reader.readAsText(file);\n}\ndpRenderClientList();\n\n// ================= TAKİP GRAFİKLERİ (KİLO) =================\nlet dpTrackData = [];\nfunction dpAddTrackPoint(){\n  var dateEl=document.getElementById('trackDate'), weightEl=document.getElementById('trackWeight'), heightEl=document.getElementById('trackHeightCm');\n  var date=dateEl?dateEl.value.trim():'';\n  var weight=parseFloat(weightEl?weightEl.value:'');\n  var height=parseFloat(heightEl?heightEl.value:'');\n  if(!weight){ alert('Lütfen kilo giriniz.'); return; }\n  dpTrackData.push({date: date || ('#'+(dpTrackData.length+1)), weight:weight, height: isNaN(height)?null:height});\n  if(dateEl) dateEl.value=''; if(weightEl) weightEl.value='';\n  dpDrawTrackChart(); dpRenderTrackTable();\n}\nfunction dpDeleteTrackPoint(i){ dpTrackData.splice(i,1); dpDrawTrackChart(); dpRenderTrackTable(); }\nfunction dpRenderTrackTable(){\n  var host=document.getElementById('trackTable'); if(!host) return;\n  if(!dpTrackData.length){ host.innerHTML='<p style=\"font-size:13px;color:#6B6455;\">Henüz kayıt eklenmedi.</p>'; return; }\n  var rows=dpTrackData.map(function(d,i){\n    var bmi=(d.height && d.weight)?(d.weight/Math.pow(d.height/100,2)).toFixed(1):'—';\n    return '<tr><td>'+d.date+'</td><td>'+d.weight+' kg</td><td>'+bmi+'</td>'\n      +'<td><span style=\"cursor:pointer;color:#A5452F;text-decoration:underline;\" onclick=\"dpDeleteTrackPoint('+i+')\">Sil</span></td></tr>';\n  }).join('');\n  host.innerHTML='<table class=\"exchange-table\"><tr><th>Tarih</th><th>Kilo</th><th>BKİ</th><th></th></tr>'+rows+'</table>';\n}\nfunction dpDrawTrackChart(){\n  var canvas=document.getElementById('trackCanvas'); if(!canvas) return;\n  var rect=canvas.getBoundingClientRect();\n  var w=Math.max(280, Math.floor(rect.width)||280), h=260;\n  canvas.width=w; canvas.height=h;\n  var ctx=canvas.getContext('2d');\n  ctx.clearRect(0,0,w,h);\n\n  var data=dpTrackData.filter(function(d){ return d.weight!=null && !isNaN(d.weight); });\n  var pad={l:44,r:16,t:16,b:34}, plotW=w-pad.l-pad.r, plotH=h-pad.t-pad.b;\n\n  ctx.strokeStyle='#D8CFB6'; ctx.lineWidth=1;\n  ctx.beginPath(); ctx.moveTo(pad.l,pad.t); ctx.lineTo(pad.l,h-pad.b); ctx.lineTo(w-pad.r,h-pad.b); ctx.stroke();\n\n  if(!data.length){\n    ctx.fillStyle='#8A8371'; ctx.font='12px Inter, sans-serif';\n    ctx.fillText('Henüz kayıt yok', pad.l+10, pad.t+24);\n    return;\n  }\n\n  var weights=data.map(function(d){return d.weight;});\n  var minW=Math.min.apply(null,weights), maxW=Math.max.apply(null,weights);\n  if(minW===maxW){ minW-=1; maxW+=1; }\n  var margin=(maxW-minW)*0.15; minW-=margin; maxW+=margin;\n\n  function xAt(i){ return data.length>1 ? pad.l+plotW*(i/(data.length-1)) : pad.l+plotW/2; }\n  function yAt(val){ return pad.t+plotH*(1-(val-minW)/(maxW-minW)); }\n\n  ctx.strokeStyle='#EFE8D8'; ctx.fillStyle='#8A8371'; ctx.font='10.5px Inter, sans-serif';\n  for(var g=0; g<=3; g++){\n    var val=minW+(maxW-minW)*g/3, y=yAt(val);\n    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke();\n    ctx.fillText(val.toFixed(1), 4, y+4);\n  }\n\n  ctx.strokeStyle='#1E3F3A'; ctx.lineWidth=2; ctx.beginPath();\n  data.forEach(function(d,i){ var x=xAt(i), y=yAt(d.weight); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });\n  ctx.stroke();\n  ctx.fillStyle='#C08A2E';\n  data.forEach(function(d,i){ var x=xAt(i), y=yAt(d.weight); ctx.beginPath(); ctx.arc(x,y,3.5,0,Math.PI*2); ctx.fill(); });\n\n  ctx.fillStyle='#6B6455'; ctx.font='11px Inter, sans-serif';\n  ctx.textAlign='left'; ctx.fillText(data[0].date, pad.l, h-10);\n  ctx.textAlign='right'; ctx.fillText(data[data.length-1].date, w-pad.r, h-10);\n  ctx.textAlign='left';\n}\nfunction dpExportTrack(){\n  var blob=new Blob([JSON.stringify(dpTrackData,null,2)], {type:'application/json'});\n  var url=URL.createObjectURL(blob);\n  var a=document.createElement('a'); a.href=url; a.download='kilo-takibi.json';\n  document.body.appendChild(a); a.click();\n  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1000);\n}\nfunction dpImportTrack(file){\n  if(!file) return;\n  var reader=new FileReader();\n  reader.onload=function(e){\n    try{\n      var data=JSON.parse(e.target.result);\n      if(Array.isArray(data)){ dpTrackData=data; dpDrawTrackChart(); dpRenderTrackTable(); }\n      else alert('Geçersiz dosya formatı.');\n    }catch(err){ alert('Dosya okunamadı: '+err.message); }\n  };\n  reader.readAsText(file);\n}\nwindow.addEventListener('resize', function(){ if(typeof dpDrawTrackChart==='function') dpDrawTrackChart(); });\ndpDrawTrackChart(); dpRenderTrackTable();\n\n// ================= WHATSAPP'TA PAYLAŞ (ÖZET METİN) =================\n// Not: window.open() çerçeve (iframe) içinden çoğu tarayıcıda sessizce\n// engellenebiliyor. Bunun yerine gerçek bir <a target=\"_blank\"> bağlantısının\n// href'ini tıklama anında güncelleyip tarayıcının doğal bağlantı takibine\n// bırakıyoruz — bu yöntem açılır pencere engelleyicilere takılmaz.\nfunction dpBuildWhatsAppText(){\n  var nameEl=document.getElementById('patientName');\n  var name=(nameEl && nameEl.value.trim()) || 'Danışan';\n  var condTxt='';\n  var condSel=(typeof DP_COND_ID!=='undefined') ? document.getElementById(DP_COND_ID) : null;\n  if(condSel && condSel.selectedIndex>=0) condTxt=condSel.options[condSel.selectedIndex].textContent;\n  var target = (typeof dpTarget==='function') ? Math.round(dpTarget()) : null;\n  var ptar = (typeof dpProteinTarget==='function') ? Math.round(dpProteinTarget()) : null;\n  var title = (typeof REPORT_TITLE!=='undefined') ? REPORT_TITLE : 'Beslenme Programı';\n\n  return '*'+title+'*\\n'\n    + 'Danışan: '+name+'\\n'\n    + (condTxt ? ('Program: '+condTxt+'\\n') : '')\n    + (target ? ('Günlük hedef: ~'+target+' kcal'+(ptar?(' (protein ~'+ptar+' g)'):'')+'\\n') : '')\n    + '\\nTam 7 günlük menü ve tarifler için PDF/HTML dosyasını ayrıca ekleyip gönderiniz.';\n}\nfunction dpPrepWhatsApp(){\n  var text = dpBuildWhatsAppText();\n  var box = document.getElementById('waBox');\n  var ta = document.getElementById('waText');\n  var link = document.getElementById('waDirectLink');\n  var msg = document.getElementById('waCopyMsg');\n  if(!box || !ta || !link) return;\n  ta.value = text;\n  link.href = 'https://wa.me/?text=' + encodeURIComponent(text);\n  box.style.display = 'block';\n  if(msg){ msg.style.display='none'; msg.textContent=''; }\n  box.scrollIntoView({behavior:'smooth', block:'nearest'});\n}\nfunction dpCopyWhatsAppText(){\n  var ta = document.getElementById('waText');\n  var msg = document.getElementById('waCopyMsg');\n  if(!ta) return;\n  function showMsg(t){ if(msg){ msg.textContent=t; msg.style.display='block'; } }\n  ta.focus(); ta.select();\n  var done = false;\n  try{\n    if(navigator.clipboard && navigator.clipboard.writeText){\n      navigator.clipboard.writeText(ta.value).then(function(){\n        showMsg('✓ Metin kopyalandı. WhatsApp\\'ı açıp bir sohbete yapıştırabilirsiniz.');\n      }).catch(function(){\n        try{ document.execCommand('copy'); showMsg('✓ Metin kopyalandı.'); }\n        catch(e2){ showMsg('Otomatik kopyalama olmadı — metin kutusundan elle seçip kopyalayabilirsiniz.'); }\n      });\n      done = true;\n    }\n  }catch(e){}\n  if(!done){\n    try{ document.execCommand('copy'); showMsg('✓ Metin kopyalandı.'); }\n    catch(e2){ showMsg('Otomatik kopyalama olmadı — metin kutusundan elle seçip kopyalayabilirsiniz.'); }\n  }\n}\n\n\n// ================= HASTANE DİYETİSYENİ: MALNÜTRİSYON TARAMA ARAÇLARI =================\n// NRS-2002 / MUST / MNA-SF — standart yayınlanmış tarama araçlarıdır.\n// Bu fonksiyonlar yalnızca RİSK KATEGORİSİ üretir; tanı veya tedavi kararı vermez.\nfunction dpScreenSwitch(){\n  var v = document.getElementById('screenTool').value;\n  document.getElementById('nrsForm').style.display = v==='nrs' ? 'block' : 'none';\n  document.getElementById('mustForm').style.display = v==='must' ? 'block' : 'none';\n  document.getElementById('mnaForm').style.display = v==='mna' ? 'block' : 'none';\n  document.getElementById('findriscForm').style.display = v==='findrisc' ? 'block' : 'none';\n}\n\nfunction dpNrsStage1(){\n  var any = ['nrs_q1','nrs_q2','nrs_q3','nrs_q4'].some(function(id){ return document.getElementById(id).checked; });\n  document.getElementById('nrsStage2').style.display = any ? 'block' : 'none';\n  var result = document.getElementById('nrsResult');\n  if(!any){\n    result.innerHTML = '<div class=\"dp-prep\"><span class=\"risk-flag risk-no\">Ön taramada risk işareti yok.</span> Haftalık olarak yeniden tarama önerilir; büyük bir ameliyat planlanıyorsa önleyici beslenme desteği düşünülebilir.</div>';\n  } else {\n    result.innerHTML = '';\n  }\n}\nfunction dpCalcNrs(){\n  var impair = parseInt(document.getElementById('nrs_impair').value, 10);\n  var severity = parseInt(document.getElementById('nrs_severity').value, 10);\n  var age = parseFloat(document.getElementById('nrs_age').value) || 0;\n  var ageAdj = age >= 70 ? 1 : 0;\n  var total = impair + severity + ageAdj;\n  var risk = total >= 3;\n  document.getElementById('nrsResult').innerHTML =\n    '<div class=\"dp-prep\"><b>NRS-2002 Toplam Skor: '+total+'</b> (Beslenme durumu bozukluğu '+impair+' + Hastalık şiddeti '+severity+' + Yaş düzeltmesi '+ageAdj+')<br>'\n    + '<span class=\"risk-flag '+(risk?'risk-yes':'risk-no')+'\">'+(risk?'Beslenme açısından risk altında.':'Şu an belirgin beslenme riski yok.')+'</span> '\n    + (risk ? 'Beslenme bakım planı başlatılması önerilir.' : 'Haftalık yeniden tarama önerilir.')\n    + '<br><br><i>Bu bir tarama aracıdır, tanı koymaz; klinik değerlendirme ile birlikte kullanılmalıdır.</i></div>';\n}\n\nfunction dpCalcMust(){\n  var bmi = parseInt(document.getElementById('must_bmi').value, 10);\n  var wl = parseInt(document.getElementById('must_wl').value, 10);\n  var acute = parseInt(document.getElementById('must_acute').value, 10);\n  var total = bmi + wl + acute;\n  var label, advice, cls;\n  if(total === 0){ label='Düşük Risk'; advice='Rutin klinik bakım; tarama periyodik olarak tekrarlanabilir.'; cls='risk-no'; }\n  else if(total === 1){ label='Orta Risk'; advice='Gözlem önerilir: 3 gün boyunca besin alımı izlenmeli, gerekirse tekrar değerlendirilmelidir.'; cls='risk-yes'; }\n  else { label='Yüksek Risk'; advice='Tedavi önerilir: diyetisyen/beslenme ekibi yönlendirmesi ile beslenme destek planı oluşturulmalıdır.'; cls='risk-yes'; }\n  document.getElementById('mustResult').innerHTML =\n    '<div class=\"dp-prep\"><b>MUST Toplam Skor: '+total+'</b> — <span class=\"risk-flag '+cls+'\">'+label+'</span><br>'\n    + advice\n    + '<br><br><i>Bu bir tarama aracıdır, tanı koymaz; klinik değerlendirme ile birlikte kullanılmalıdır.</i></div>';\n}\n\nfunction dpCalcMna(){\n  var ids=['mna_a','mna_b','mna_c','mna_d','mna_e','mna_f'];\n  var total=0;\n  ids.forEach(function(id){ total += parseInt(document.getElementById(id).value,10); });\n  var label, cls;\n  if(total>=12){ label='Normal Beslenme Durumu'; cls='risk-no'; }\n  else if(total>=8){ label='Malnütrisyon Riski Altında'; cls='risk-yes'; }\n  else { label='Malnütre'; cls='risk-yes'; }\n  document.getElementById('mnaResult').innerHTML =\n    '<div class=\"dp-prep\"><b>MNA-SF Toplam Skor: '+total+' / 14</b> — <span class=\"risk-flag '+cls+'\">'+label+'</span>'\n    + '<br><br><i>Bu bir tarama aracıdır, tanı koymaz; klinik değerlendirme ile birlikte kullanılmalıdır.</i></div>';\n}\n\nfunction dpCalcFindrisc(){\n  var ids=['fr_age','fr_bmi','fr_waist','fr_activity','fr_veg','fr_bp','fr_glucose','fr_family'];\n  var total=0;\n  ids.forEach(function(id){ total += parseInt(document.getElementById(id).value,10); });\n  var label, pct, cls;\n  if(total<7){ label='Düşük Risk'; pct='~%1'; cls='risk-no'; }\n  else if(total<=11){ label='Hafif Yüksek Risk'; pct='~%4'; cls='risk-yes'; }\n  else if(total<=14){ label='Orta Risk'; pct='~%17'; cls='risk-yes'; }\n  else if(total<=20){ label='Yüksek Risk'; pct='~%33'; cls='risk-yes'; }\n  else { label='Çok Yüksek Risk'; pct='~%50'; cls='risk-yes'; }\n  document.getElementById('findriscResult').innerHTML =\n    '<div class=\"dp-prep\"><b>FINDRISC Toplam Skor: '+total+'</b> — <span class=\"risk-flag '+cls+'\">'+label+'</span><br>'\n    + 'Önümüzdeki 10 yıl içinde Tip 2 Diyabet gelişme olasılığı yaklaşık: <b>'+pct+'</b>'\n    + '<br><br><i>Bu bir tarama aracıdır, tanı koymaz; yüksek skorlarda açlık kan şekeri/HbA1c ile klinik değerlendirme önerilir.</i></div>';\n}\n\n\n// ================= 7 GÜNLÜK ALIŞVERİŞ LİSTESİ =================\nfunction dpWeeklyShoppingList(){\n  var cond = dpCondition();\n  var slots = DP_PLAN[cond];\n  var box = document.getElementById('weeklyShopBox');\n  var host = document.getElementById('weeklyShopList');\n  if(!slots){\n    host.innerHTML = '<p style=\"font-size:13px;color:#6B6455;\">Bu durum için hazır bir 7 günlük plan bulunmuyor.</p>';\n    box.style.display='block';\n    return;\n  }\n  var target = dpTarget(), ptar = dpProteinTarget(), scale = dpScale();\n  // dpBuildDaySlots zaten doğru ölçekleri hesaplıyor; malzeme miktarlarını\n  // oradan tekrar üretmek yerine, her gün için aynı hesaplamayı tekrarlayıp topluyoruz.\n  var agg = {};\n  for(var day=0; day<7; day++){\n    var pRaw={k:0,p:0,c:0,f:0}, yRaw={k:0,p:0,c:0,f:0}, dRaw={k:0,p:0,c:0,f:0};\n    var dayMeals = slots.map(function(slot,si){ return DP_MEALS[dpPickMealId(slot[1], day+si).id]; });\n    dayMeals.forEach(function(meal){\n      meal.it.forEach(function(pair){\n        var F=DP_FOODS[pair[0]], q=pair[1];\n        var g = F.pr? pRaw : (F.ft? yRaw : dRaw);\n        g.k+=F.k*q; g.p+=F.p*q; g.c+=F.c*q; g.f+=F.f*q;\n      });\n    });\n    var ftar = target*DP_FATPCT/9;\n    var sp=1, sy=1, sd=1;\n    for(var it=0; it<12; it++){\n      var totP = pRaw.p*sp + yRaw.p*sy + dRaw.p*sd;\n      if(totP>0) sp = Math.max(0.4, Math.min(2.5, sp*(ptar/totP)));\n      var totF = pRaw.f*sp + yRaw.f*sy + dRaw.f*sd;\n      if(totF>0) sy = Math.max(0.25, Math.min(4.0, sy*(ftar/totF)));\n      sd = dRaw.k>0 ? (target - pRaw.k*sp - yRaw.k*sy)/dRaw.k : 1;\n      sd = Math.max(0.3, Math.min(4.0, sd||1));\n    }\n    sp*=scale; sy*=scale; sd*=scale;\n    dayMeals.forEach(function(meal){\n      meal.it.forEach(function(pair){\n        var F=DP_FOODS[pair[0]];\n        var sv = pair[1]*(F.pr?sp:(F.ft?sy:sd));\n        if(!agg[pair[0]]) agg[pair[0]] = 0;\n        agg[pair[0]] += sv;\n      });\n    });\n  }\n\n  var rows = Object.keys(agg).map(function(fid){\n    var F = DP_FOODS[fid];\n    return {name:F.n, amount: dpAmount(F, agg[fid])};\n  }).sort(function(a,b){ return a.name.localeCompare(b.name,'tr'); });\n\n  host.innerHTML = '<ul style=\"margin:0;padding-left:20px;font-size:13.5px;\">'\n    + rows.map(function(r){ return '<li>'+r.name+' — <b>'+r.amount+'</b></li>'; }).join('')\n    + '</ul><p style=\"font-size:11.5px;color:#6B6455;margin-top:10px;\">Miktarlar 7 günlük toplam gösterir; mevcut porsiyon/paket büyüklüklerine göre yuvarlayarak alışveriş yapabilirsiniz.</p>';\n  box.style.display = 'block';\n  box.scrollIntoView({behavior:'smooth', block:'nearest'});\n}\n\n\n// ================= BARKOD İLE BESİN DEĞERİ SORGULAMA =================\nlet dpScannerActive = null;\n\nfunction dpLoadScannerLib(){\n  return new Promise(function(res, rej){\n    if(window.Html5Qrcode){ res(); return; }\n    var s = document.createElement('script');\n    s.src = 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';\n    s.onload = res; s.onerror = function(){ rej(new Error('script yüklenemedi')); };\n    document.head.appendChild(s);\n  });\n}\n\nasync function dpToggleScanner(){\n  var box = document.getElementById('scannerBox');\n  if(box.style.display === 'block'){ dpStopScanner(); return; }\n  var host = document.getElementById('barcodeResult');\n  if(window.location.protocol === 'file:'){\n    host.innerHTML = '<div class=\"dp-prep\">Bu dosyayı doğrudan (çift tıklayarak) açtığınız için tarayıcı kameraya erişime izin vermiyor — bu bir kod hatası değil, tarayıcıların \"file://\" ile açılan sayfalar için uyguladığı standart bir güvenlik kuralı (kamera yalnızca https:// veya yerel bir sunucu üzerinden çalışan sayfalarda etkinleşir). Barkod numarasını üründen okuyup \"Barkod Numarası\" kutusuna elle yazıp \"Sorgula\"yı kullanabilirsiniz — ama bu da (aşağıda açıklandığı gibi) file:// üzerinden çalışmayabilir.</div>';\n    return;\n  }\n  box.style.display = 'block';\n  try{\n    await dpLoadScannerLib();\n  }catch(e){\n    host.innerHTML = '<div class=\"dp-prep\">Kamera kütüphanesi yüklenemedi (internet bağlantısı gerekiyor). Barkod numarasını elle girip \"Sorgula\"yı kullanabilirsiniz.</div>';\n    box.style.display = 'none';\n    return;\n  }\n  try{\n    dpScannerActive = new window.Html5Qrcode('scannerReader');\n    await dpScannerActive.start(\n      { facingMode: 'environment' },\n      { fps: 10, qrbox: { width: 250, height: 150 } },\n      function(decodedText){\n        document.getElementById('barcodeInput').value = decodedText;\n        dpStopScanner();\n        dpLookupBarcode();\n      },\n      function(){ /* eşleşme yok, taramaya devam — hata değil */ }\n    );\n  }catch(e){\n    host.innerHTML = '<div class=\"dp-prep\">Kameraya erişilemedi (izin verilmedi, tarayıcı desteklemiyor veya güvenli olmayan bir bağlamdasınız — bu dosyayı doğrudan açtıysanız bu beklenen bir durumdur). Barkod numarasını elle girip \"Sorgula\"yı kullanabilirsiniz.</div>';\n    box.style.display = 'none';\n  }\n}\n\nfunction dpStopScanner(){\n  var box = document.getElementById('scannerBox');\n  if(dpScannerActive){\n    try{\n      dpScannerActive.stop().then(function(){\n        try{ dpScannerActive.clear(); }catch(e2){}\n      }).catch(function(){});\n    }catch(e){}\n    dpScannerActive = null;\n  }\n  if(box) box.style.display = 'none';\n}\n\nfunction dpManualEntryFormHtml(){\n  return '<div style=\"background:var(--dp-soft,#EFE8D8);border:1px solid var(--dp-line,#D8CFB6);border-radius:4px;padding:14px 16px;\">'\n    + '<p style=\"font-weight:600;margin:0 0 10px;\">Ürünü Paket Etiketinden Elle Girin</p>'\n    + '<div class=\"grid\" style=\"margin-bottom:10px;\">'\n    + '<div><label for=\"manualName\">Ürün Adı</label><input type=\"text\" id=\"manualName\" placeholder=\"örn. Tam Buğday Ekmeği\"></div>'\n    + '<div><label for=\"manualBrand\">Marka (opsiyonel)</label><input type=\"text\" id=\"manualBrand\"></div>'\n    + '</div>'\n    + '<div class=\"grid\" style=\"margin-bottom:10px;\">'\n    + '<div><label for=\"manualKcal\">Enerji (kcal /100g)</label><input type=\"number\" id=\"manualKcal\"></div>'\n    + '<div><label for=\"manualProtein\">Protein (g /100g)</label><input type=\"number\" id=\"manualProtein\"></div>'\n    + '<div><label for=\"manualCarb\">Karbonhidrat (g /100g)</label><input type=\"number\" id=\"manualCarb\"></div>'\n    + '<div><label for=\"manualSugar\">— Şeker (g /100g)</label><input type=\"number\" id=\"manualSugar\"></div>'\n    + '<div><label for=\"manualFat\">Yağ (g /100g)</label><input type=\"number\" id=\"manualFat\"></div>'\n    + '<div><label for=\"manualSatFat\">— Doymuş Yağ (g /100g)</label><input type=\"number\" id=\"manualSatFat\"></div>'\n    + '<div><label for=\"manualFiber\">Lif (g /100g)</label><input type=\"number\" id=\"manualFiber\"></div>'\n    + '<div><label for=\"manualSalt\">Tuz (g /100g)</label><input type=\"number\" id=\"manualSalt\"></div>'\n    + '</div>'\n    + '<button class=\"btn-primary\" style=\"margin-top:0;\" onclick=\"dpSaveManualEntry()\">Göster</button>'\n    + '</div>';\n}\nfunction dpSaveManualEntry(){\n  var host = document.getElementById('barcodeResult');\n  function v(id){ var el = document.getElementById(id); return el ? el.value : ''; }\n  function fmt(val, unit){ return (val===undefined||val===null||val==='') ? '—' : val+' '+unit; }\n  var name = v('manualName').trim() || 'İsimsiz ürün';\n  var brand = v('manualBrand').trim();\n  host.innerHTML =\n    '<div class=\"dp-prep\" style=\"margin-bottom:12px;\"><b>'+name+'</b>'+(brand?(' — '+brand):'')+'</div>'\n    + '<table class=\"exchange-table\">'\n    + '<tr><th>Besin Değeri (100 g/ml için)</th><th>Miktar</th></tr>'\n    + '<tr><td>Enerji</td><td>'+fmt(v('manualKcal'),'kcal')+'</td></tr>'\n    + '<tr><td>Protein</td><td>'+fmt(v('manualProtein'),'g')+'</td></tr>'\n    + '<tr><td>Karbonhidrat</td><td>'+fmt(v('manualCarb'),'g')+'</td></tr>'\n    + '<tr><td>— Şeker</td><td>'+fmt(v('manualSugar'),'g')+'</td></tr>'\n    + '<tr><td>Yağ</td><td>'+fmt(v('manualFat'),'g')+'</td></tr>'\n    + '<tr><td>— Doymuş Yağ</td><td>'+fmt(v('manualSatFat'),'g')+'</td></tr>'\n    + '<tr><td>Lif</td><td>'+fmt(v('manualFiber'),'g')+'</td></tr>'\n    + '<tr><td>Tuz</td><td>'+fmt(v('manualSalt'),'g')+'</td></tr>'\n    + '</table>'\n    + '<p style=\"font-size:11.5px;color:#6B6455;margin-top:10px;\">Kaynak: elle girildi (ürün etiketinden). Open Food Facts\\'te bulunmadığı için manuel olarak eklendi.</p>';\n}\nasync function dpLookupBarcode(){\n  var raw = document.getElementById('barcodeInput').value || '';\n  var code = raw.trim().replace(/\\s+/g,'');\n  var host = document.getElementById('barcodeResult');\n  if(!code){ alert('Lütfen bir barkod numarası girin.'); return; }\n  var isFile = window.location.protocol === 'file:';\n  host.innerHTML = '<p style=\"font-size:13px;color:#6B6455;\">Sorgulanıyor…</p>';\n  try{\n    var resp = await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json');\n    var data = await resp.json();\n    if(!data || data.status !== 1 || !data.product){\n      host.innerHTML = '<div class=\"dp-prep\" style=\"margin-bottom:14px;\">Bu barkod için ürün bulunamadı. Open Food Facts kullanıcı katkılı bir veritabanıdır; özellikle yerel/bölgesel ürünlerde kapsam sınırlı olabilir — bu, uygulamanın değil, veritabanının bir sınırlamasıdır.</div>'\n        + dpManualEntryFormHtml();\n      return;\n    }\n    var p = data.product;\n    var n = p.nutriments || {};\n    function fmt(v, unit){ return (v===undefined || v===null || v==='') ? '—' : (Math.round(v*10)/10)+' '+unit; }\n    host.innerHTML =\n      '<div class=\"dp-prep\" style=\"margin-bottom:12px;\">'\n      + '<b>'+(p.product_name || p.product_name_tr || 'İsimsiz ürün')+'</b>'\n      + (p.brands ? (' — '+p.brands) : '')\n      + '</div>'\n      + '<table class=\"exchange-table\">'\n      + '<tr><th>Besin Değeri (100 g/ml için)</th><th>Miktar</th></tr>'\n      + '<tr><td>Enerji</td><td>'+fmt(n['energy-kcal_100g'],'kcal')+'</td></tr>'\n      + '<tr><td>Protein</td><td>'+fmt(n.proteins_100g,'g')+'</td></tr>'\n      + '<tr><td>Karbonhidrat</td><td>'+fmt(n.carbohydrates_100g,'g')+'</td></tr>'\n      + '<tr><td>— Şeker</td><td>'+fmt(n.sugars_100g,'g')+'</td></tr>'\n      + '<tr><td>Yağ</td><td>'+fmt(n.fat_100g,'g')+'</td></tr>'\n      + '<tr><td>— Doymuş Yağ</td><td>'+fmt(n['saturated-fat_100g'],'g')+'</td></tr>'\n      + '<tr><td>Lif</td><td>'+fmt(n.fiber_100g,'g')+'</td></tr>'\n      + '<tr><td>Tuz</td><td>'+fmt(n.salt_100g,'g')+'</td></tr>'\n      + '</table>'\n      + '<p style=\"font-size:11.5px;color:#6B6455;margin-top:10px;\">Kaynak: Open Food Facts (kullanıcı katkılı açık veritabanı). Değerler üreticinin beyanına dayanır; her zaman ürün etiketiyle karşılaştırın.</p>';\n  }catch(e){\n    if(isFile){\n      host.innerHTML = '<div class=\"dp-prep\">Sorgu başarısız oldu. Bu dosyayı doğrudan (çift tıklayarak) açtığınız için tarayıcı, güvenlik nedeniyle dış sunuculara (Open Food Facts) yapılan bu tür sorguları engelliyor — bu bir kod hatası değil, \"file://\" ile açılan sayfalar için standart bir tarayıcı kısıtlaması. Çözüm için: barkodu <a href=\"https://world.openfoodfacts.org/\" target=\"_blank\" rel=\"noopener\">world.openfoodfacts.org</a> adresinde doğrudan arayabilir, ya da bu HTML dosyasını bir web sunucusu üzerinden (örn. basit bir yerel sunucu veya barındırma hizmeti ile) açtığınızda bu sorgu genellikle çalışır.</div>';\n    } else {\n      host.innerHTML = '<div class=\"dp-prep\">Sorgu sırasında bir hata oluştu. İnternet bağlantınızı kontrol edin; sorun sürerse tarayıcınızın bu siteye erişimi engellemediğinden (reklam engelleyici, güvenlik duvarı vb.) emin olun.</div>';\n    }\n  }\n}\n\n\n// ================= SU / ÖĞÜN HATIRLATICI =================\nlet dpWaterInterval = null;\nlet dpMealReminders = [];\nlet dpMealCheckInterval = null;\n\nfunction dpRequestNotifyPermission(){\n  if('Notification' in window && Notification.permission === 'default'){\n    Notification.requestPermission();\n  }\n}\nfunction dpNotify(title, body){\n  if('Notification' in window && Notification.permission === 'granted'){\n    try{ new Notification(title, {body: body}); return; }catch(e){}\n  }\n  var banner = document.getElementById('reminderBanner');\n  if(banner){\n    banner.textContent = '🔔 ' + title + ' — ' + body;\n    banner.style.display = 'block';\n    setTimeout(function(){ banner.style.display='none'; }, 8000);\n  }\n}\n\nfunction dpStartWaterReminder(){\n  dpRequestNotifyPermission();\n  dpStopWaterReminder();\n  var mins = parseInt(document.getElementById('waterIntervalSelect').value, 10);\n  dpWaterInterval = setInterval(function(){\n    dpNotify('💧 Su İçme Zamanı', 'Bir bardak su içmeyi unutmayın.');\n  }, mins*60*1000);\n  var status = document.getElementById('waterReminderStatus');\n  if(status) status.textContent = 'Aktif — her '+mins+' dakikada bir hatırlatılacak (bu sekme açık kaldığı sürece).';\n}\nfunction dpStopWaterReminder(){\n  if(dpWaterInterval){ clearInterval(dpWaterInterval); dpWaterInterval=null; }\n  var status = document.getElementById('waterReminderStatus');\n  if(status) status.textContent = 'Kapalı.';\n}\n\nfunction dpAddMealReminder(){\n  var timeEl = document.getElementById('mealTimeInput');\n  var labelEl = document.getElementById('mealLabelInput');\n  var time = timeEl.value;\n  var label = labelEl.value.trim() || 'Öğün';\n  if(!time){ alert('Lütfen bir saat seçin.'); return; }\n  dpMealReminders.push({time:time, label:label, firedNow:false});\n  labelEl.value = '';\n  dpRenderMealReminders();\n}\nfunction dpDeleteMealReminder(i){ dpMealReminders.splice(i,1); dpRenderMealReminders(); }\nfunction dpRenderMealReminders(){\n  var host = document.getElementById('mealReminderList');\n  if(!host) return;\n  if(!dpMealReminders.length){ host.innerHTML = '<p style=\"font-size:13px;color:#6B6455;\">Henüz öğün hatırlatıcısı eklenmedi.</p>'; return; }\n  host.innerHTML = '<ul style=\"margin:0;padding-left:20px;font-size:13.5px;\">' + dpMealReminders.map(function(r,i){\n    return '<li>'+r.time+' — '+r.label+' <span style=\"cursor:pointer;color:#A5452F;text-decoration:underline;margin-left:8px;\" onclick=\"dpDeleteMealReminder('+i+')\">Sil</span></li>';\n  }).join('') + '</ul>';\n}\nfunction dpStartMealReminders(){\n  dpRequestNotifyPermission();\n  if(dpMealCheckInterval) clearInterval(dpMealCheckInterval);\n  dpMealCheckInterval = setInterval(function(){\n    var now = new Date();\n    var hh = String(now.getHours()).padStart(2,'0');\n    var mm = String(now.getMinutes()).padStart(2,'0');\n    var current = hh+':'+mm;\n    dpMealReminders.forEach(function(r){\n      if(r.time === current && !r.firedNow){\n        dpNotify('🍽️ Öğün Zamanı', r.label+' saati geldi.');\n        r.firedNow = true;\n      } else if(r.time !== current){\n        r.firedNow = false;\n      }\n    });\n  }, 20000);\n  var status = document.getElementById('mealReminderStatus');\n  if(status) status.textContent = 'Aktif — eklenen saatlerde hatırlatılacak (bu sekme açık kaldığı sürece).';\n}\nfunction dpStopMealReminders(){\n  if(dpMealCheckInterval){ clearInterval(dpMealCheckInterval); dpMealCheckInterval=null; }\n  var status = document.getElementById('mealReminderStatus');\n  if(status) status.textContent = 'Kapalı.';\n}\ndpRenderMealReminders();\n\n\n// ================= GENİŞLETİLMİŞ TAKİP =================\nconst DP_EXT_METRICS = {\n  waist:{label:'Bel Çevresi', unit:'cm'},\n  bodyfat:{label:'Yağ Oranı', unit:'%'},\n  b12:{label:'Vitamin B12', unit:'pg/mL'},\n  vitd:{label:'25-OH Vitamin D', unit:'ng/mL'},\n  folate:{label:'Folat', unit:'ng/mL'},\n  ferritin:{label:'Ferritin', unit:'ng/mL'},\n  iron:{label:'Demir', unit:'µg/dL'},\n  calcium:{label:'Kalsiyum', unit:'mg/dL'}\n};\nlet dpExtTrackData = {waist:[],bodyfat:[],b12:[],vitd:[],folate:[],ferritin:[],iron:[],calcium:[]};\n\nfunction dpExtCurrentMetric(){ var el=document.getElementById('extMetricSelect'); return el?el.value:'waist'; }\nfunction dpExtUpdateLabel(){\n  var m = DP_EXT_METRICS[dpExtCurrentMetric()];\n  var lbl = document.getElementById('extValueLabel');\n  if(lbl) lbl.textContent = m.label+' ('+m.unit+')';\n  dpExtDrawChart(); dpExtRenderTable();\n}\nfunction dpExtAddPoint(){\n  var dateEl=document.getElementById('extDate'), valEl=document.getElementById('extValue');\n  var date = dateEl.value.trim();\n  var val = parseFloat(valEl.value);\n  if(isNaN(val)){ alert('Lütfen bir değer giriniz.'); return; }\n  var key = dpExtCurrentMetric();\n  dpExtTrackData[key].push({date: date || ('#'+(dpExtTrackData[key].length+1)), value: val});\n  dateEl.value=''; valEl.value='';\n  dpExtDrawChart(); dpExtRenderTable();\n}\nfunction dpExtDeletePoint(i){\n  var key = dpExtCurrentMetric();\n  dpExtTrackData[key].splice(i,1);\n  dpExtDrawChart(); dpExtRenderTable();\n}\nfunction dpExtRenderTable(){\n  var key = dpExtCurrentMetric(), m = DP_EXT_METRICS[key];\n  var host = document.getElementById('extTable'); if(!host) return;\n  var data = dpExtTrackData[key] || [];\n  if(!data.length){ host.innerHTML = '<p style=\"font-size:13px;color:#6B6455;\">Henüz kayıt eklenmedi.</p>'; return; }\n  host.innerHTML = '<table class=\"exchange-table\"><tr><th>Tarih</th><th>'+m.label+'</th><th></th></tr>'\n    + data.map(function(d,i){\n        return '<tr><td>'+d.date+'</td><td>'+d.value+' '+m.unit+'</td>'\n          +'<td><span style=\"cursor:pointer;color:#A5452F;text-decoration:underline;\" onclick=\"dpExtDeletePoint('+i+')\">Sil</span></td></tr>';\n      }).join('') + '</table>';\n}\nfunction dpExtDrawChart(){\n  var canvas = document.getElementById('extCanvas'); if(!canvas) return;\n  var key = dpExtCurrentMetric();\n  var data = (dpExtTrackData[key]||[]).filter(function(d){ return d.value!=null && !isNaN(d.value); });\n  var rect = canvas.getBoundingClientRect();\n  var w = Math.max(280, Math.floor(rect.width)||280), h = 260;\n  canvas.width = w; canvas.height = h;\n  var ctx = canvas.getContext('2d');\n  ctx.clearRect(0,0,w,h);\n  var pad={l:44,r:16,t:16,b:34}, plotW=w-pad.l-pad.r, plotH=h-pad.t-pad.b;\n  ctx.strokeStyle='#D8CFB6'; ctx.lineWidth=1;\n  ctx.beginPath(); ctx.moveTo(pad.l,pad.t); ctx.lineTo(pad.l,h-pad.b); ctx.lineTo(w-pad.r,h-pad.b); ctx.stroke();\n  if(!data.length){\n    ctx.fillStyle='#8A8371'; ctx.font='12px Inter, sans-serif';\n    ctx.fillText('Henüz kayıt yok', pad.l+10, pad.t+24);\n    return;\n  }\n  var vals = data.map(function(d){return d.value;});\n  var minV=Math.min.apply(null,vals), maxV=Math.max.apply(null,vals);\n  if(minV===maxV){ minV-=1; maxV+=1; }\n  var margin=(maxV-minV)*0.15; minV-=margin; maxV+=margin;\n  function xAt(i){ return data.length>1 ? pad.l+plotW*(i/(data.length-1)) : pad.l+plotW/2; }\n  function yAt(v){ return pad.t+plotH*(1-(v-minV)/(maxV-minV)); }\n  ctx.strokeStyle='#EFE8D8'; ctx.fillStyle='#8A8371'; ctx.font='10.5px Inter, sans-serif';\n  for(var g=0; g<=3; g++){\n    var val=minV+(maxV-minV)*g/3, y=yAt(val);\n    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke();\n    ctx.fillText(val.toFixed(1), 4, y+4);\n  }\n  ctx.strokeStyle='#1E3F3A'; ctx.lineWidth=2; ctx.beginPath();\n  data.forEach(function(d,i){ var x=xAt(i), y=yAt(d.value); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });\n  ctx.stroke();\n  ctx.fillStyle='#C08A2E';\n  data.forEach(function(d,i){ var x=xAt(i), y=yAt(d.value); ctx.beginPath(); ctx.arc(x,y,3.5,0,Math.PI*2); ctx.fill(); });\n  ctx.fillStyle='#6B6455'; ctx.font='11px Inter, sans-serif';\n  ctx.textAlign='left'; ctx.fillText(data[0].date, pad.l, h-10);\n  ctx.textAlign='right'; ctx.fillText(data[data.length-1].date, w-pad.r, h-10);\n  ctx.textAlign='left';\n}\nfunction dpExtExport(){\n  var blob = new Blob([JSON.stringify(dpExtTrackData,null,2)], {type:'application/json'});\n  var url = URL.createObjectURL(blob);\n  var a = document.createElement('a'); a.href=url; a.download='genisletilmis-takip.json';\n  document.body.appendChild(a); a.click();\n  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1000);\n}\nfunction dpExtImport(file){\n  if(!file) return;\n  var reader = new FileReader();\n  reader.onload = function(e){\n    try{\n      var data = JSON.parse(e.target.result);\n      Object.keys(DP_EXT_METRICS).forEach(function(k){ if(Array.isArray(data[k])) dpExtTrackData[k]=data[k]; });\n      dpExtDrawChart(); dpExtRenderTable();\n    }catch(err){ alert('Dosya okunamadı: '+err.message); }\n  };\n  reader.readAsText(file);\n}\nwindow.addEventListener('resize', function(){ if(typeof dpExtDrawChart==='function') dpExtDrawChart(); });\ndpExtDrawChart(); dpExtRenderTable();\n\n\n// ================= GÜNLÜK HEDEF / MOTİVASYON TAKİBİ =================\nlet dpGoalHistory = [];\nfunction dpSaveDailyGoal(){\n  var ids = ['goal_water','goal_menu','goal_move','goal_sleep'];\n  var checked = ids.filter(function(id){ var el=document.getElementById(id); return el && el.checked; }).length;\n  var today = new Date().toLocaleDateString('tr-TR');\n  dpGoalHistory.push({date:today, score:checked, total:ids.length});\n  ids.forEach(function(id){ var el=document.getElementById(id); if(el) el.checked=false; });\n  dpRenderGoalHistory();\n}\nfunction dpRenderGoalHistory(){\n  var host = document.getElementById('goalHistory'); if(!host) return;\n  if(!dpGoalHistory.length){ host.innerHTML='<p style=\"font-size:13px;color:#6B6455;\">Henüz kayıt yok.</p>'; return; }\n  var totalScore = dpGoalHistory.reduce(function(s,r){return s+r.score;},0);\n  var totalMax = dpGoalHistory.reduce(function(s,r){return s+r.total;},0);\n  var pct = totalMax ? Math.round(totalScore/totalMax*100) : 0;\n  host.innerHTML = '<p style=\"font-size:13.5px;margin-bottom:10px;\"><b>Genel başarı oranı: '+pct+'%</b> ('+dpGoalHistory.length+' gün kaydedildi)</p>'\n    + '<table class=\"exchange-table\"><tr><th>Tarih</th><th>Puan</th></tr>'\n    + dpGoalHistory.slice().reverse().map(function(r){ return '<tr><td>'+r.date+'</td><td>'+r.score+' / '+r.total+'</td></tr>'; }).join('')\n    + '</table>';\n}\ndpRenderGoalHistory();\n\n\n// ================= KİLO DURAKLAMASI ANALİZİ (yapılandırılmış kontrol listesi) =================\nconst DP_PLATEAU_INFO = {\n  plateau_water:{title:'Yetersiz Su Tüketimi', text:'Düşük sıvı alımı su tutulumunu artırabilir ve tartı üzerinde yanıltıcı bir sabitlik izlenimi yaratabilir; ayrıca metabolik süreçler için yeterli hidrasyon önemlidir.'},\n  plateau_protein:{title:'Yetersiz Protein Alımı', text:'Protein, tokluk hissini ve kas kütlesinin korunmasını destekler; yetersiz alım zamanla enerji dengesini ve vücut kompozisyonunu olumsuz etkileyebilir.'},\n  plateau_sleep:{title:'Yetersiz/Düzensiz Uyku', text:'Uyku yetersizliği açlık-tokluk hormonlarını (grelin/leptin) etkileyerek iştahı ve enerji dengesini bozabilir.'},\n  plateau_stress:{title:'Yüksek Stres Düzeyi', text:'Kronik stres kortizol düzeylerini etkileyerek su tutulumuna ve yeme davranışında değişikliklere yol açabilir.'},\n  plateau_freq:{title:'Sık Tartılma', text:'Günlük kilo dalgalanmaları (su, sindirim, hormon) normaldir; günlük tartı takibi gerçek eğilimi gözden kaçırmaya ve motivasyon kaybına yol açabilir. Haftalık, aynı koşullarda tek bir ölçüm daha güvenilir bir eğilim verir.'},\n  plateau_activity:{title:'Azalan Aktivite Düzeyi', text:'Günlük hareketteki (egzersiz dışı aktivite dahil) küçük azalmalar toplam enerji harcamasını fark edilmeden düşürebilir.'},\n  plateau_hormonal:{title:'Hormonal Dönem', text:'Adet döngüsünün belirli evrelerinde geçici su tutulumu görülebilir; bu genellikle birkaç gün içinde kendiliğinden düzelir.'},\n  plateau_hidden:{title:'Gizli Kalori Kaynakları', text:'Sos, içecek, atıştırmalık gibi küçük ama sık tüketilen kalemler toplamda anlamlı bir kalori katkısı yapabilir ve genellikle tam olarak kaydedilmez.'}\n};\nfunction dpAnalyzePlateau(){\n  var ids = Object.keys(DP_PLATEAU_INFO);\n  var checked = ids.filter(function(id){ var el=document.getElementById(id); return el && el.checked; });\n  var host = document.getElementById('plateauResult');\n  if(!checked.length){\n    host.innerHTML = '<p style=\"font-size:13px;color:#6B6455;\">Değerlendirmek için en az bir maddeyi işaretleyin.</p>';\n    return;\n  }\n  var html = checked.map(function(id){\n    var info = DP_PLATEAU_INFO[id];\n    return '<div class=\"dp-prep\" style=\"margin-bottom:10px;\"><b>'+info.title+':</b> '+info.text+'</div>';\n  }).join('');\n  html += '<p style=\"font-size:11.5px;color:#6B6455;margin-top:6px;\">Bu genel bir farkındalık listesidir; danışanın kişisel durumu diyetisyen tarafından değerlendirilmelidir.</p>';\n  host.innerHTML = html;\n}\n\n\n// ================= GÖRÜŞME NOTU ŞABLONU (SOAP) =================\nfunction dpBuildSoapNote(){\n  var name = (document.getElementById('patientName')||{}).value || 'Danışan';\n  var date = (document.getElementById('patientDate')||{}).value || new Date().toLocaleDateString('tr-TR');\n  var s = (document.getElementById('soap_s')||{}).value || '—';\n  var o = (document.getElementById('soap_o')||{}).value || '—';\n  var a = (document.getElementById('soap_a')||{}).value || '—';\n  var p = (document.getElementById('soap_p')||{}).value || '—';\n\n  var condTxt='', target=null, ptar=null;\n  try{\n    var condSel = (typeof DP_COND_ID!=='undefined') ? document.getElementById(DP_COND_ID) : null;\n    if(condSel && condSel.selectedIndex>=0) condTxt = condSel.options[condSel.selectedIndex].textContent;\n    target = (typeof dpTarget==='function') ? Math.round(dpTarget()) : null;\n    ptar = (typeof dpProteinTarget==='function') ? Math.round(dpProteinTarget()) : null;\n  }catch(e){}\n\n  var text = 'GÖRÜŞME NOTU (SOAP)\\n'\n    + 'Danışan: '+name+'   Tarih: '+date+'\\n'\n    + (condTxt ? ('Program: '+condTxt+(target?(' — Hedef: ~'+target+' kcal'+(ptar?(' / protein ~'+ptar+' g'):'')):'')+'\\n') : '')\n    + '\\nS — Subjektif:\\n'+s\n    + '\\n\\nO — Objektif:\\n'+o\n    + '\\n\\nA — Değerlendirme:\\n'+a\n    + '\\n\\nP — Plan:\\n'+p;\n\n  document.getElementById('soapText').value = text;\n  document.getElementById('soapBox').style.display = 'block';\n  var msg = document.getElementById('soapCopyMsg');\n  if(msg){ msg.style.display='none'; msg.textContent=''; }\n  document.getElementById('soapBox').scrollIntoView({behavior:'smooth', block:'nearest'});\n}\nfunction dpCopySoapNote(){\n  var ta = document.getElementById('soapText');\n  var msg = document.getElementById('soapCopyMsg');\n  function showMsg(t){ if(msg){ msg.textContent=t; msg.style.display='block'; } }\n  ta.focus(); ta.select();\n  try{\n    if(navigator.clipboard && navigator.clipboard.writeText){\n      navigator.clipboard.writeText(ta.value).then(function(){\n        showMsg('✓ Not kopyalandı.');\n      }).catch(function(){\n        try{ document.execCommand('copy'); showMsg('✓ Not kopyalandı.'); }\n        catch(e2){ showMsg('Otomatik kopyalama olmadı — metin kutusundan elle seçip kopyalayabilirsiniz.'); }\n      });\n      return;\n    }\n  }catch(e){}\n  try{ document.execCommand('copy'); showMsg('✓ Not kopyalandı.'); }\n  catch(e2){ showMsg('Otomatik kopyalama olmadı — metin kutusundan elle seçip kopyalayabilirsiniz.'); }\n}\n\n\n// ================= \"NE OLUR EĞER?\" HESAPLAYICI (düz aritmetik, AI değil) =================\nfunction dpWhatifSwitch(){\n  var v = document.getElementById('whatifType').value;\n  document.getElementById('whatifActivity').style.display = v==='activity' ? 'block' : 'none';\n  document.getElementById('whatifCalorie').style.display = v==='calorie' ? 'block' : 'none';\n  document.getElementById('whatifSwap').style.display = v==='swap' ? 'block' : 'none';\n}\nfunction dpCalcWhatif(){\n  var type = document.getElementById('whatifType').value;\n  var days = parseInt(document.getElementById('whatifPeriod').value, 10);\n  var dailyDeficit = 0; // pozitif = günlük kalori açığı (kilo kaybı yönünde), negatif = fazlası (kilo alımı yönünde)\n  var desc = '';\n\n  if(type === 'activity'){\n    var met = parseFloat(document.getElementById('whatifActType').value);\n    var mins = parseFloat(document.getElementById('whatifActMin').value) || 0;\n    var wt = parseFloat(document.getElementById('whatifActWeight').value) || 70;\n    var burned = (met * 3.5 * wt / 200) * mins;\n    dailyDeficit = burned;\n    desc = 'Günde '+mins+' dakika seçilen aktivite ile yaklaşık <b>'+Math.round(burned)+' kcal/gün</b> ekstra harcama (mevcut beslenme aynı kalırsa).';\n  } else if(type === 'calorie'){\n    var delta = parseFloat(document.getElementById('whatifKcalDelta').value) || 0;\n    dailyDeficit = -delta; // azaltma (negatif giriş) -> pozitif açık; artırma (pozitif giriş) -> negatif açık (fazla)\n    desc = 'Günlük <b>'+(delta>=0?'+':'')+Math.round(delta)+' kcal</b> değişiklik.';\n  } else {\n    var sel = document.getElementById('whatifSwapPreset');\n    dailyDeficit = parseFloat(sel.value) || 0;\n    desc = sel.options[sel.selectedIndex].textContent;\n  }\n\n  var totalKcal = dailyDeficit * days;\n  var weightChangeKg = totalKcal / 7700;\n  var periodLabel = {7:'1 hafta', 30:'1 ay', 90:'3 ay', 180:'6 ay'}[days] || (days+' gün');\n  var direction = weightChangeKg >= 0 ? 'kaybı' : 'artışı';\n  var absChange = Math.abs(weightChangeKg).toFixed(2);\n  var absTotalKcal = Math.round(Math.abs(totalKcal));\n\n  document.getElementById('whatifResult').innerHTML =\n    '<div class=\"dp-prep\">'+desc+'<br><br>'\n    + '<b>'+periodLabel+' sonunda toplam:</b> ~'+absTotalKcal.toLocaleString('tr-TR')+' kcal '+(weightChangeKg>=0?'açık':'fazla')+'<br>'\n    + '<b>Yaklaşık vücut ağırlığı '+direction+': ~'+absChange+' kg</b>'\n    + '<br><br><i>Bu yalnızca aritmetik bir projeksiyondur, kişiye özel bir yapay zekâ tahmini değildir; gerçek değişim metabolizma, su dengesi, kas kütlesi ve uyum düzeyine göre önemli ölçüde farklılık gösterebilir.</i></div>';\n}\n\n\n// ================= KANIT ÖZETİ / ARAŞTIRMA NOTLARI (gerçek taramaya dayalı, ama statik) =================\nconst DP_EVIDENCE = {\n  pcos:{title:'PCOS (Polikistik Over Sendromu)',\n    approach:'İnsülin direnci PCOS\\'un merkezinde yer alır; miyoinozitol takviyesi üzerine son yıllarda çok sayıda sistematik derleme/meta-analiz yayımlanmıştır.',\n    recommended:'Düşük glisemik indeksli beslenme ve düzenli fiziksel aktivite temel yaklaşımdır. Miyoinozitol bazı meta-analizlerde açlık glukozu ve HOMA-IR gibi insülin direnci belirteçlerini iyileştirmiş, metformine kıyasla \"aşağı kalmayan\" (non-inferior) bulunmuştur.',\n    limit:'Rafine karbonhidrat ve şeker.',\n    evolving:'Tam görüş birliği yok: 2024\\'te Uluslararası PCOS Kılavuzu\\'nu güncellemek için yapılan bir meta-analiz (30 RCT, n=2230) inozitolün etkinliğini \"belirsiz\" bulurken, başka bir meta-analiz inozitolü metformine yakın etkili bulmuştur.',\n    note:'Kaynak: J Clin Endocrinol Metab 2024 (Monash Üniversitesi, 2023 Uluslararası PCOS Kılavuzu için hazırlanan derleme); Reproductive Biology and Endocrinology 2023.'},\n  t2d:{title:'Tip 2 Diyabet — Düşük Karbonhidrat Diyeti',\n    approach:'Karbonhidrat miktarı ve kalitesi glisemik kontrolde merkezi rol oynar.',\n    recommended:'Düşük-orta karbonhidratlı yaklaşım kısa vadede (özellikle 3. ayda) HbA1c\\'de ortalama %0,29–0,35 azalma ile ilişkilendirilmiştir; açlık kan şekeri ve kilo da bu dönemde belirgin azalır.',\n    limit:'Şekerli içecekler, rafine karbonhidratlar.',\n    evolving:'Kısa vadeli fayda nispeten tutarlı bulunurken, UZUN VADELİ etki tartışmalıdır — 2024\\'teki bir meta-analiz (6 çalışma) uzun vadeli düşük karbonhidratlı diyetin kontrol grubuna kıyasla HbA1c\\'yi anlamlı düşürmediğini, yalnızca trigliseritleri azalttığını bulmuştur.',\n    note:'Kaynak: Diabetes Research and Clinical Practice 2025 (27 RCT, n=2870); Journal of Diabetes Investigation 2024.'},\n  ckd:{title:'Kronik Böbrek Hastalığı — Protein Kısıtlaması',\n    approach:'Protein kısıtlaması, konservatif tedavinin geleneksel bir parçasıdır; ancak güncel literatürde etkinliği tartışılmaktadır.',\n    recommended:'2018 tarihli bir meta-analiz (19 RCT, n=2492), düşük proteinli diyetin böbrek yetmezliği riskini azalttığını (OR=0,59) ve fosfor düzeyini düşürdüğünü bulmuştur.',\n    limit:'Aşırı protein alımı, ilerleyici böbrek hasarına katkıda bulunabilir.',\n    evolving:'2025\\'te bir derleme (Journal of Internal Medicine), sıkı protein kısıtlamasının etkinliğinin sorgulandığını, malnütrisyon ve yaşam kalitesi kaybı riski taşıdığını belirtmiş; bazı yazarlar bunu \"modern çağda güncelliğini yitirmiş bir strateji\" olarak tartışmaktadır — bireyselleştirilmiş yaklaşım öne çıkıyor.',\n    note:'Kaynak: PLOS One 2018; Journal of Internal Medicine 2025; KDIGO 2024 Kılavuzu.'},\n  dyslipidemia:{title:'Dislipidemi — Çözünür Lif ve LDL',\n    approach:'Doymuş yağ azaltımı ve çözünür lif artırımı, LDL kolesterol üzerinde en iyi kanıtlanmış iki beslenme müdahalesidir.',\n    recommended:'2023\\'teki geniş bir doz-yanıt meta-analizi (181 RCT, n=14.505), her 5 g/gün çözünür lif artışının LDL\\'yi ortalama ~5,6 mg/dL, total kolesterolü ~6,1 mg/dL azalttığını göstermiştir.',\n    limit:'Doymuş yağ, trans yağ.',\n    evolving:'Diyetle alınan kolesterolün kan LDL\\'sine etkisinin sanıldığından sınırlı olduğu görüşü güçlenmeye devam ediyor; güncel odak doymuş yağ ve çözünür life kaymış durumda.',\n    note:'Kaynak: PubMed 2023 (doz-yanıt meta-analiz, 181 RCT, n=14.505).'},\n  obesity:{title:'Obezite — Kilo Kaybı ve Uzun Vadeli Sürdürülebilirlik',\n    approach:'Sürdürülebilir bir kalori açığı ve davranış değişikliği, uzun vadeli başarıyı belirleyen en önemli faktörlerdir.',\n    recommended:'Yüksek proteinli/düşük karbonhidratlı yaklaşımlar, kısa vadede yağ kaybını artırıp kas kaybını sınırlayabilir.',\n    limit:'Aşırı kısıtlayıcı, çok düşük kalorili diyetler.',\n    evolving:'Uzun vadeli sürdürülebilirlik ciddi bir zorluk olmaya devam ediyor: bir meta-analiz, düşük kalorili diyet sonrası hastaların yalnızca ~%25\\'inin kilo kaybını uzun vadede koruyabildiğini; başka bir analiz ise kaybedilen kilonun ortalama %80\\'inin 5 yıl içinde geri alındığını bulmuştur.',\n    note:'Kaynak: Nutrients 2022 (davranışsal müdahale meta-analizi); Am J Clin Nutr (uzun vadeli izlem meta-analizi, ABD çalışmaları).'},\n  htn:{title:'Hipertansiyon — DASH Diyeti',\n    approach:'DASH tarzı beslenme deseni (sebze/meyve/tam tahıl ağırlıklı, düşük sodyum), en tutarlı kanıta sahip yaklaşımlardan biridir.',\n    recommended:'Meta-analizler DASH diyetinin sistolik kan basıncını ortalama 3–7 mmHg, diyastoliği ~2,5–3,5 mmHg azalttığını göstermektedir (çalışmalar arası farklılıkla).',\n    limit:'Sodyum, aşırı alkol.',\n    evolving:'Etkinin büyüklüğü çalışmadan çalışmaya değişse de (yüksek heterojenite), DASH diyetinin hem hipertansif hem normotansif yetişkinlerde kan basıncını düşürdüğü tekrarlayan meta-analizlerle tutarlı şekilde gösterilmiştir.',\n    note:'Kaynak: Nutrients 2023; Advances in Nutrition 2020; birden fazla bağımsız meta-analiz.'},\n  celiac:{title:'Çölyak Hastalığı — Glutensiz Diyette Beslenme Yeterliliği',\n    approach:'Tek tedavi ömür boyu sıkı glutensiz diyettir; ancak bu diyetin kendisi bazı besin ögesi risklerini artırabilir.',\n    recommended:'Doğal glutensiz tahıllar (pirinç, kinoa, mısır) ve çeşitlilik önerilir.',\n    limit:'Buğday, arpa, çavdar ve türevleri; gizli gluten kaynaklarına dikkat.',\n    evolving:'2025\\'teki bir meta-analiz, glutensiz diyetteki çölyak hastalarında kontrol grubuna kıyasla özellikle D ve E vitamini eksikliği riskinin arttığını bulmuştur; çocuklarda folat, magnezyum ve çinko alımının da sıklıkla yetersiz olduğu gösterilmiştir.',\n    note:'Kaynak: Journal of Clinical Medicine 2025 (46 gözlemsel çalışma); Nutrients 2019 (çocuklarda sistematik derleme).'},\n  nafld:{title:'Karaciğer Yağlanması (NAFLD/MASLD) — Akdeniz Diyeti',\n    approach:'Vücut ağırlığının %7–10\\'u kadar kilo kaybı ve Akdeniz tarzı beslenme, en güçlü kanıta sahip müdahaleler arasındadır.',\n    recommended:'Akdeniz diyeti karaciğer enzimlerini, karaciğer yağ oranını ve lipid profilini iyileştirebilir.',\n    limit:'Şekerli içecekler (fruktoz), aşırı alkol.',\n    evolving:'Terminoloji 2023\\'te \"NAFLD\"den \"MASLD\"ye güncellendi (EASL-EASD-EASO ortak kılavuzu, 2024). Ancak 2024\\'teki bir meta-analiz, Akdeniz diyeti ile düşük yağlı diyet arasında karaciğer enzimleri/yağı açısından anlamlı fark bulamamış — kısa vadede ikisi de benzer şekilde faydalı olabilir.',\n    note:'Kaynak: PubMed 2024 (Akdeniz diyeti vs düşük yağlı diyet meta-analizi); EASL-EASD-EASO 2024 MASLD Kılavuzu.'},\n  gout:{title:'Gut Hastalığı — Pürin ve Diyet',\n    approach:'Beslenme, serum ürik asit düzeyini düşürmeyi hedefleyen ilaç tedavisiyle birlikte, destekleyici olarak yönetilir.',\n    recommended:'Düşük kalorili, düşük pürinli ve Akdeniz tarzı diyetler serum ürik asit düzeyini anlamlı şekilde azaltabilir; düşük yağlı süt ürünleri koruyucu bulunmuştur.',\n    limit:'Kırmızı et, sakatat, alkol (özellikle bira), yüksek fruktozlu şurup içeren içecekler.',\n    evolving:'Baklagillerin (mercimek, nohut gibi) pürin içeriği yüksek olsa da hiperürisemiyle güçlü bir ilişkisi gösterilememiştir — lif içerikleri koruyucu olabilir; asıl belirleyici risk faktörünün hayvansal pürin kaynakları olduğu yönündeki kanıtlar güçlenmektedir.',\n    note:'Kaynak: Nutrients 2019 (18 çalışmalık sistematik derleme); Journal of Health, Population and Nutrition 2025.'},\n  hypothyroid:{title:'Hipotiroidi — Selenyum Takviyesi Tartışması',\n    approach:'Levotiroksin tedavisi temel yaklaşımdır; selenyum takviyesinin ek faydası literatürde tartışmalıdır.',\n    recommended:'Bazı meta-analizler selenyum takviyesinin, özellikle levotiroksin almayan hastalarda, TPO antikor düzeylerini 3–6 ayda düşürebildiğini bulmuştur (düşük kanıt kesinliği).',\n    limit:'Levotiroksin ile aynı anda yüksek miktarda soya, lif, kalsiyum veya demir alımı.',\n    evolving:'Kanıt tutarsız: bir sistematik derleme \"klinik etkinlik için yeterli belge yok\" sonucuna varırken, 2023–2025 meta-analizleri düşük kesinlikte de olsa antikor düşüşü bulmuştur; rutin selenyum takviyesi önerisi hâlâ tartışmalıdır.',\n    note:'Kaynak: Nutrients 2023 (sistematik derlemelerin genel bakışı); Thyroid 2024 (Hashimoto hastalarında meta-analiz).'},\n  pku:{title:'Fenilketonüri (PKU) — Diyet Yönetimi ve Sonuçlar',\n    approach:'Yaşam boyu fenilalanin (Phe) kısıtlı diyet temel tedavidir; sapropterin ve pegvaliaz gibi ilaç seçenekleri bazı hastalarda diyeti kısmen esnetebilir.',\n    recommended:'Erken ve sürekli diyet yönetimi, bilişsel sonuçları korumada kritik kabul edilir; düzenli kan Phe takibi tedavinin ayrılmaz parçasıdır.',\n    limit:'Doğal protein kaynakları (et, süt, yumurta vb.) sıkı sınırlıdır; bu programın PKU bölümünde belirtildiği gibi kesin miktar/limit yalnızca metabolizma uzmanınca belirlenir.',\n    evolving:'Erken tedavi edilen hastalarda bile büyüme (boy/kilo) sıklıkla etkilenmiş bulunmuştur — bir meta-analiz, ilk 4 yıl ve ergenlik boyunca boy kısalığı ve düşük kilo göstermiştir. Ayrıca ergenlik/erişkinlik döneminde diyet uyumunun belirgin şekilde azalma eğiliminde olduğu tekrarlayan bir bulgudur.',\n    note:'Kaynak: Nutrients 2019 (büyüme meta-analizi); Nutrients 2024 (49 çalışmalık uyum sistematik derlemesi). Bu bölüm ve programın PKU aracı fenilalanin miktarı/limiti önermez.'},\n  athlete:{title:'Sporcu Beslenmesi — Protein Zamanlaması (\"Anabolik Pencere\")',\n    approach:'Toplam günlük protein miktarı, kas kütlesi ve performans için merkezi rol oynar; protein alımının GÜN İÇİNDEKİ ZAMANLAMASININ önemi ise güncel araştırmalarda yeniden değerlendiriliyor.',\n    recommended:'Direnç antrenmanı yapan bireylerde günlük ~1,6–2,2 g/kg protein alımı, yağsız kütle artışıyla ilişkilendirilmiştir; öğünler arasında dengeli dağıtım genel olarak desteklenir.',\n    limit:'—',\n    evolving:'Klasik \"anabolik pencere\" kavramı (antrenman sonrası 30–60 dk içinde mutlaka protein alınması gerektiği fikri) güncel meta-analizlerce sorgulanmaktadır: toplam günlük protein alımı yeterli olduğunda, alım ZAMANLAMASININ kas kütlesi/gücü üzerindeki bağımsız etkisinin sınırlı olduğu gösterilmiştir. Bazı çalışmalar antrenman öncesi protein alımının belirli hareketlerde (örn. bacak presi) ufak bir avantaj sağlayabileceğini bulsa da, bu bulgu tüm hareketlerde tekrarlanmamıştır.',\n    note:'Kaynak: J Int Soc Sports Nutr (Schoenfeld ve ark. meta-analizi); 2025 sistematik derleme (protein zamanlamasının etkisi üzerine).'}\n};\n\nfunction dpRenderEvidence(){\n  var key = document.getElementById('evidenceTopic').value;\n  var e = DP_EVIDENCE[key];\n  var host = document.getElementById('evidenceBox');\n  host.innerHTML =\n    '<div class=\"dp-prep\" style=\"margin-bottom:10px;\"><b>Temel Yaklaşım:</b> '+e.approach+'</div>'\n    + '<div class=\"dp-prep\" style=\"margin-bottom:10px;\"><b>Önerilen / Bulgular:</b> '+e.recommended+'</div>'\n    + (e.limit && e.limit!=='—' ? '<div class=\"dp-prep\" style=\"margin-bottom:10px;\"><b>Kısıtlanması Gereken:</b> '+e.limit+'</div>' : '')\n    + '<div class=\"dp-prep\" style=\"margin-bottom:10px;\"><b>Güncel / Tartışmalı Alan:</b> '+e.evolving+'</div>'\n    + '<div class=\"dp-prep\">'+e.note+'</div>';\n}\ndpRenderEvidence();\n\n\n// ================= BESİN DEĞİŞİM HESAPLAYICI =================\nfunction dpPopulateExchangeSelects(){\n  var ids = Object.keys(DP_FOODS).sort(function(a,b){ return DP_FOODS[a].n.localeCompare(DP_FOODS[b].n,'tr'); });\n  var optionsHtml = ids.map(function(id){ return '<option value=\"'+id+'\">'+DP_FOODS[id].n+'</option>'; }).join('');\n  var fromSel = document.getElementById('exchFromFood');\n  var toSel = document.getElementById('exchToFood');\n  if(fromSel) fromSel.innerHTML = optionsHtml;\n  if(toSel) toSel.innerHTML = optionsHtml;\n}\nfunction dpCalcExchange(){\n  var fromId = document.getElementById('exchFromFood').value;\n  var amount = parseFloat(document.getElementById('exchFromAmount').value);\n  var toId = document.getElementById('exchToFood').value;\n  var from = DP_FOODS[fromId], to = DP_FOODS[toId];\n  if(!from || !to || !amount){ alert('Lütfen geçerli bir miktar girin.'); return; }\n\n  var fromProtein = from.p * amount;\n  var fromKcal = from.k * amount;\n  var equivServings = to.p > 0 ? fromProtein / to.p : 0;\n  var toKcal = to.k * equivServings;\n  var kcalDiff = toKcal - fromKcal;\n\n  var toAmountText = to.p > 0 ? dpAmount(to, equivServings) : '— (bu besinde anlamlı protein yok)';\n\n  document.getElementById('exchResult').innerHTML =\n    '<div class=\"dp-prep\">'\n    + '<b>'+dpAmount(from, amount)+' '+from.n+'</b> ≈ protein açısından <b>'+toAmountText+' '+to.n+'</b>e eşdeğerdir (~'+fromProtein.toFixed(1)+' g protein)<br><br>'\n    + '<b>Kalori:</b> '+from.n+' → ~'+Math.round(fromKcal)+' kcal &nbsp;|&nbsp; '+to.n+' (eşdeğer miktar) → ~'+Math.round(toKcal)+' kcal<br>'\n    + '<b>Fark:</b> ~'+(kcalDiff>=0?'+':'')+Math.round(kcalDiff)+' kcal'\n    + '<br><br><i>Bu hesaplama yalnızca protein miktarını eşitler; karbonhidrat, yağ ve diğer besin ögesi profili farklılık gösterebilir.</i></div>';\n}\ndpPopulateExchangeSelects();\n\n\n// ================= NCPT (PES) BESLENME TANISI ŞABLONU =================\nfunction dpBuildPES(){\n  var problem = document.getElementById('ncptProblem').value;\n  var etiology = document.getElementById('ncptEtiology').value.trim() || '—';\n  var signs = document.getElementById('ncptSigns').value.trim() || '—';\n\n  var text = 'P (Problem): '+problem+'\\n'\n    + 'E (Etiyoloji): '+etiology+'\\n'\n    + 'S (Belirti/Bulgu): '+signs+'\\n\\n'\n    + 'PES İfadesi: '+problem+', '+etiology+' ile ilişkili; '+signs+' ile kanıtlanmaktadır.';\n\n  document.getElementById('pesText').value = text;\n  document.getElementById('pesBox').style.display = 'block';\n  var msg = document.getElementById('pesCopyMsg');\n  if(msg){ msg.style.display='none'; msg.textContent=''; }\n  document.getElementById('pesBox').scrollIntoView({behavior:'smooth', block:'nearest'});\n}\nfunction dpCopyPES(){\n  var ta = document.getElementById('pesText');\n  var msg = document.getElementById('pesCopyMsg');\n  function showMsg(t){ if(msg){ msg.textContent=t; msg.style.display='block'; } }\n  ta.focus(); ta.select();\n  try{\n    if(navigator.clipboard && navigator.clipboard.writeText){\n      navigator.clipboard.writeText(ta.value).
